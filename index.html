<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loohcs高等学院ゲーム大全</title>
<style>
  :root { --bg:#f6f3ea; --fg:#222; --card:#fff; --line:#ddd; --accent:#c0392b; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; }
  header { padding: 32px 16px 8px; text-align:center; }
  h1 { margin:0; font-size: 28px; letter-spacing: .05em; }
  header p { margin: 8px 0 0; color:#666; }
  main { max-width: 960px; margin: 0 auto; padding: 16px; display:grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
  a.card { display:block; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; color:inherit; text-decoration:none; }
  a.card:hover { border-color: var(--accent); }
  .card h2 { margin:0 0 4px; font-size:18px; }
  .card .author { font-size:13px; color:#888; margin:0 0 8px; }
  .card p { margin:0; font-size:14px; line-height:1.5; }
  footer { text-align:center; padding: 32px 16px; font-size:13px; color:#888; }
  footer a { color:inherit; }
  .empty { grid-column: 1 / -1; text-align:center; color:#888; }
</style>
</head>
<body>
<header>
  <h1>Loohcs高等学院ゲーム大全</h1>
  <p>開発ゼミで作ったゲームを集めたページ。カードを押すと遊べる。</p>
</header>
<main id="list"><p class="empty">読み込み中…</p></main>
<footer>
  載せ方は <a href="https://github.com/loohcs-games/loohcs-games.github.io">GitHub のリポジトリ</a> の howto.md にある。
</footer>
<script src="games.js"></script>
<script>
(function () {
  var list = document.getElementById('list');
  var games = (window.GAMES || []).slice();
  list.textContent = '';
  if (games.length === 0) {
    var p = document.createElement('p');
    p.className = 'empty';
    p.textContent = 'まだゲームがない。';
    list.appendChild(p);
    return;
  }
  // 新しく足したものを上に出す（配列の後ろほど新しい）
  games.reverse().forEach(function (g) {
    if (!g || !g.id || !/^[a-z0-9-]+$/i.test(g.id)) return;
    var a = document.createElement('a');
    a.className = 'card';
    a.href = 'games/' + g.id + '/';
    var h = document.createElement('h2');
    h.textContent = g.title || g.id;
    var au = document.createElement('p');
    au.className = 'author';
    au.textContent = g.author ? '作者: ' + g.author : '';
    var d = document.createElement('p');
    d.textContent = g.description || '';
    a.appendChild(h); a.appendChild(au); a.appendChild(d);
    list.appendChild(a);
  });
})();
</script>
</body>
</html>
