<!DOCTYPE html>

<title>Crowd Dash 3D</title>
<style>
  :root{ --blue:#2a7cf6; --red:#e8343c; }
  html,body{margin:0;height:100%;background:#17344d;overflow:hidden;
    font-family:"Arial Rounded MT Bold","Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP","Arial Black",Arial,sans-serif;
    -webkit-user-select:none;user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent;}
  body{display:flex;align-items:center;justify-content:center;}
  #game{position:relative;overflow:hidden;background:#aeeaff;touch-action:none;cursor:grab;}
  #game:active{cursor:grabbing;}
  #game canvas{display:block;width:100%;height:100%;}
  #labels{position:absolute;inset:0;pointer-events:none;overflow:hidden;}
  #hud{position:absolute;inset:0;pointer-events:none;}
  #top{position:absolute;top:calc(12px + env(safe-area-inset-top));left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:8px;}
  #levelPill{background:rgba(255,255,255,.92);color:#1d6fd6;font-weight:900;font-size:20px;padding:6px 20px;border-radius:999px;box-shadow:0 3px 0 rgba(0,0,0,.12);letter-spacing:.5px;}
  #progress{width:56%;height:10px;background:rgba(255,255,255,.55);border-radius:99px;overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.1);}
  #progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,#4fb6ff,#1d6fd6);border-radius:99px;}
  #restartBtn{position:absolute;top:calc(10px + env(safe-area-inset-top));right:10px;width:44px;height:44px;border-radius:50%;border:none;
    background:rgba(255,255,255,.92);color:#1d6fd6;font-size:24px;font-weight:900;pointer-events:auto;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.15);line-height:44px;padding:0;}
  .label{position:absolute;left:0;top:0;padding:3px 10px;border-radius:9px;color:#fff;font-weight:900;font-size:20px;white-space:nowrap;
    will-change:transform;background:var(--c);box-shadow:0 3px 0 rgba(0,0,0,.18);font-family:"Arial Black",Arial,sans-serif;}
  .label::after{content:"";position:absolute;left:50%;bottom:-7px;margin-left:-7px;border:7px solid transparent;border-bottom:0;border-top-color:var(--c);}
  .label.blue{--c:var(--blue);} .label.red{--c:var(--red);}
  .label.boss{font-size:26px;padding:4px 14px;}
  .label .in{display:inline-block;}
  .label.bump .in{animation:bump .22s ease-out;}
  @keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
  .popup{position:absolute;left:0;top:0;font-weight:900;font-size:44px;color:#fff;font-family:"Arial Black",Arial,sans-serif;
    text-shadow:0 4px 0 #1d6fd6,0 0 14px rgba(0,90,220,.55);animation:pop 1s ease-out forwards;white-space:nowrap;}
  .popup.bad{text-shadow:0 4px 0 #b5121b,0 0 14px rgba(220,0,30,.5);}
  @keyframes pop{0%{opacity:0;margin-top:0;scale:.4}15%{opacity:1;scale:1.25}30%{scale:1}100%{opacity:0;margin-top:-110px;scale:1}}

  .ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;pointer-events:none;}
  .ov.hidden{display:none;}
  #startOv{justify-content:flex-end;padding-bottom:16%;background:linear-gradient(to bottom,rgba(0,0,0,0) 45%,rgba(0,60,120,.35));}
  .title{position:absolute;top:18%;left:0;right:0;font-family:"Arial Black",Arial,sans-serif;font-size:54px;line-height:.95;color:#fff;
    text-shadow:0 5px 0 #1d6fd6,0 10px 18px rgba(0,50,120,.35);letter-spacing:1px;}
  .title small{display:block;font-size:20px;letter-spacing:6px;margin-top:10px;text-shadow:0 2px 0 #1d6fd6;}
  .hand{font-size:54px;animation:swipe 1.4s ease-in-out infinite;filter:drop-shadow(0 4px 4px rgba(0,0,0,.25));}
  @keyframes swipe{0%,100%{transform:translateX(-60px) rotate(-10deg)}50%{transform:translateX(60px) rotate(10deg)}}
  .tap{font-size:28px;font-weight:900;color:#fff;text-shadow:0 3px 0 #1d6fd6,0 0 10px rgba(0,60,160,.4);animation:blink 1.1s ease-in-out infinite;}
  @keyframes blink{50%{opacity:.45;transform:scale(.96)}}
  .hint{font-size:14px;color:#fff;font-weight:700;background:rgba(0,40,90,.35);padding:6px 14px;border-radius:999px;}
  .panel{background:rgba(10,40,80,.38);pointer-events:auto;}
  .big{font-family:"Arial Black",Arial,sans-serif;font-size:50px;color:#fff;line-height:1;animation:zoomIn .45s cubic-bezier(.2,1.6,.4,1);}
  .big.win{text-shadow:0 5px 0 #f0a400,0 10px 20px rgba(0,0,0,.25);}
  .big.lose{text-shadow:0 5px 0 #b5121b,0 10px 20px rgba(0,0,0,.25);}
  @keyframes zoomIn{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}
  .sub{color:#fff;font-size:20px;font-weight:900;text-shadow:0 2px 0 rgba(0,0,0,.25);}
  .btn{pointer-events:auto;border:none;border-radius:16px;padding:14px 34px;font-size:22px;font-weight:900;color:#fff;cursor:pointer;
    background:linear-gradient(#4fc35a,#2f9d3c);box-shadow:0 5px 0 #1f7029;font-family:inherit;min-width:210px;}
  .btn:active{transform:translateY(3px);box-shadow:0 2px 0 #1f7029;}
  .btn.blue{background:linear-gradient(#4fa8ff,#2a7cf6);box-shadow:0 5px 0 #1a56b0;}
  .back{pointer-events:auto;color:#fff;font-size:14px;font-weight:700;text-decoration:none;background:rgba(0,40,90,.45);
    padding:7px 16px;border-radius:999px;margin-top:4px;}
  .btn.ghost{background:rgba(255,255,255,.9);color:#1d6fd6;box-shadow:0 5px 0 rgba(0,0,0,.18);font-size:18px;padding:10px 26px;}
</style>

<script type="module">
import * as THREE from 'three';

/* ================= constants ================= */
const ROAD_W = 8, HALF = ROAD_W / 2;
const MAX_P = 400;          // max visible ally units
const MAX_E = 240;          // max visible units per enemy group
const SPACING = 0.25;       // formation spacing factor
const RUN_SPEED = 10;
const START_COUNT = 5;
const BLUE = 0x2e8fff, RED = 0xf0323a, BOSS_RED = 0xd91f2d;
const SKY = 0xaeeaff;
const TICK = 0.05;          // battle tick (s)

const $ = id => document.getElementById(id);
const wrap = $('game'), labelsEl = $('labels');
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

/* ================= renderer / scene ================= */
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
wrap.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(SKY);
scene.fog = new THREE.Fog(SKY, 60, 130);
const camera = new THREE.PerspectiveCamera(58, 9 / 16, 0.1, 260);

let VW = 1, VH = 1;
function resize() {
  const w = innerWidth, h = innerHeight;
  let cw, ch;
  if (w / h < 0.75) { cw = w; ch = h; }               // phone portrait: full screen
  else { ch = h; cw = Math.round(h * 9 / 16); }        // desktop: 9:16 frame
  wrap.style.width = cw + 'px'; wrap.style.height = ch + 'px';
  VW = cw; VH = ch;
  renderer.setSize(cw, ch);
  camera.aspect = cw / ch; camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

const hemi = new THREE.HemisphereLight(0xffffff, 0x8fd3f0, 1.55);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, 2.1);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -18, right: 18, top: 22, bottom: -22, near: 1, far: 70 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.03;
scene.add(sun, sun.target);

/* ================= water (animated, unlit) ================= */
const skyC = new THREE.Color(SKY);
const waterMat = new THREE.ShaderMaterial({
  uniforms: { uTime: { value: 0 }, uCam: { value: new THREE.Vector3() },
    uFog: { value: new THREE.Vector3(0xae / 255, 0xea / 255, 0xff / 255) } },
  vertexShader: `varying vec3 vW;
    void main(){ vec4 w = modelMatrix*vec4(position,1.0); vW=w.xyz; gl_Position=projectionMatrix*viewMatrix*w; }`,
  fragmentShader: `uniform float uTime; uniform vec3 uCam; uniform vec3 uFog; varying vec3 vW;
    void main(){
      vec2 p = vW.xz*0.22;
      float w1 = sin(p.x*1.7 + uTime*1.1 + sin(p.y*1.3 + uTime*0.6)*1.6);
      float w2 = sin(p.y*2.3 - uTime*0.8 + sin(p.x*1.1 - uTime*0.4)*1.3);
      float c = smoothstep(0.72, 1.0, abs(w1*w2));
      vec3 deep = vec3(0.18,0.76,0.93), lite = vec3(0.47,0.90,1.0);
      vec3 col = mix(deep, lite, 0.5+0.25*(w1+w2)) + c*0.22;
      float d = distance(vW.xz, uCam.xz);
      gl_FragColor = vec4(mix(col, uFog, smoothstep(50.0, 125.0, d)), 1.0);
    }`
});
const water = new THREE.Mesh(new THREE.PlaneGeometry(320, 320), waterMat);
water.rotation.x = -Math.PI / 2; water.position.y = -0.8;
scene.add(water);

/* ================= character model (single merged, GPU-animated) ================= */
// limb ids: 0 body/head, 1 left arm, 2 right arm, 3 left leg, 4 right leg
function buildCharGeo() {
  const parts = [
    [new THREE.SphereGeometry(0.17, 14, 10), 0, 0, 0.99],
    [new THREE.CapsuleGeometry(0.135, 0.2, 4, 10), 0, 0, 0.62],
    [new THREE.CapsuleGeometry(0.05, 0.24, 3, 6), 1, -0.2, 0.59],
    [new THREE.CapsuleGeometry(0.05, 0.24, 3, 6), 2, 0.2, 0.59],
    [new THREE.CapsuleGeometry(0.062, 0.27, 3, 6), 3, -0.075, 0.225],
    [new THREE.CapsuleGeometry(0.062, 0.27, 3, 6), 4, 0.075, 0.225],
  ];
  const pos = [], nor = [], limb = [], idx = []; let off = 0;
  for (const [g, l, x, y] of parts) {
    g.translate(x, y, 0);
    const p = g.attributes.position.array, n = g.attributes.normal.array;
    for (let i = 0; i < p.length; i++) { pos.push(p[i]); nor.push(n[i]); }
    const vc = p.length / 3;
    for (let i = 0; i < vc; i++) limb.push(l);
    const ix = g.index.array;
    for (let i = 0; i < ix.length; i++) idx.push(ix[i] + off);
    off += vc; g.dispose();
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));
  geo.setAttribute('limb', new THREE.Float32BufferAttribute(limb, 1));
  geo.setIndex(idx);
  return geo;
}
const BASE_GEO = buildCharGeo();

const CHAR_HEAD = `
attribute float limb;
attribute vec2 aAnim;           // x: phase, y: amplitude
uniform float uTime;
mat3 limbRot(){
  if(limb < 0.5) return mat3(1.0);
  float side = (abs(limb-1.0)<0.1 || abs(limb-4.0)<0.1) ? 1.0 : -1.0;
  float a = sin(uTime + aAnim.x) * aAnim.y * side * 0.95;
  float c = cos(a), s = sin(a);
  return mat3(1.0,0.0,0.0, 0.0,c,s, 0.0,-s,c);
}
float limbPivot(){ return limb < 2.5 ? 0.76 : 0.42; }
`;
const CHAR_BEGIN = `
vec3 transformed = vec3(position);
if(limb > 0.5){ float py = limbPivot(); transformed.y -= py; transformed = limbRot()*transformed; transformed.y += py; }
transformed.y += abs(sin(uTime + aAnim.x)) * 0.07 * aAnim.y;
`;
function patchVS(vs, withNormal) {
  vs = vs.replace('#include <common>', '#include <common>\n' + CHAR_HEAD);
  if (withNormal) vs = vs.replace('#include <beginnormal_vertex>',
    'vec3 objectNormal = limbRot()*vec3(normal);\n#ifdef USE_TANGENT\nvec3 objectTangent = vec3(tangent.xyz);\n#endif');
  return vs.replace('#include <begin_vertex>', CHAR_BEGIN);
}
function makeCharMats(color, uniforms) {
  const mat = new THREE.MeshLambertMaterial({ color });
  mat.onBeforeCompile = sh => { sh.uniforms.uTime = uniforms.uTime; sh.vertexShader = patchVS(sh.vertexShader, true); };
  const depth = new THREE.MeshDepthMaterial({ depthPacking: THREE.RGBADepthPacking });
  depth.onBeforeCompile = sh => { sh.uniforms.uTime = uniforms.uTime; sh.vertexShader = patchVS(sh.vertexShader, false); };
  return { mat, depth };
}

/* A crowd = one InstancedMesh (1 draw call) + unit list */
class Crowd {
  constructor(color, cap) {
    this.cap = cap;
    this.uniforms = { uTime: { value: 0 } };
    this.animT = Math.random() * 10; this.animRate = 5;
    const g = new THREE.BufferGeometry();
    g.setIndex(BASE_GEO.index);
    for (const k of ['position', 'normal', 'limb']) g.setAttribute(k, BASE_GEO.attributes[k]);
    this.anim = new THREE.InstancedBufferAttribute(new Float32Array(cap * 2), 2);
    this.anim.setUsage(THREE.DynamicDrawUsage);
    g.setAttribute('aAnim', this.anim);
    g.boundingSphere = new THREE.Sphere(new THREE.Vector3(), 1e5);
    const { mat, depth } = makeCharMats(color, this.uniforms);
    this.mat = mat;
    this.mesh = new THREE.InstancedMesh(g, mat, cap);
    this.mesh.customDepthMaterial = depth;
    this.mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    this.mesh.castShadow = true; this.mesh.frustumCulled = false; this.mesh.count = 0;
    scene.add(this.mesh);
    this.units = [];
  }
  tick(dt) { this.animT += dt * this.animRate; this.uniforms.uTime.value = this.animT; }
  flush() {
    const a = this.mesh.instanceMatrix.array, an = this.anim.array, us = this.units;
    for (let i = 0; i < us.length; i++) {
      const u = us[i], s = u.s, o = i * 16;
      a[o] = s; a[o+1] = 0; a[o+2] = 0; a[o+3] = 0;
      a[o+4] = 0; a[o+5] = s; a[o+6] = 0; a[o+7] = 0;
      a[o+8] = 0; a[o+9] = 0; a[o+10] = s; a[o+11] = 0;
      a[o+12] = u.x; a[o+13] = u.y; a[o+14] = u.z; a[o+15] = 1;
      an[i*2] = u.ph; an[i*2+1] = u.amp;
    }
    this.mesh.count = us.length;
    this.mesh.instanceMatrix.needsUpdate = true;
    this.anim.needsUpdate = true;
  }
}
function newUnit(x, z, s = 1) {
  return { x, z, y: 0, s, ph: Math.random() * Math.PI * 2, amp: 1,
           jx: rand(-0.05, 0.05), jz: rand(-0.05, 0.05) };
}

/* sunflower formation; dir=-1: crowd faces -z (ally), dir=+1: faces +z (enemy) */
const GA = Math.PI * (3 - Math.sqrt(5));
function formation(n, dir) {
  const maxH = HALF - 0.45;
  const R = SPACING * Math.sqrt(Math.max(n, 1)) + 0.15;
  let sx = 1, sz = 1;
  if (R > maxH) { sx = maxH / R; sz = 1 / sx; }        // road too narrow -> spread backwards
  const shift = -dir * (sz - 1) * R;
  const offs = new Array(n);
  for (let i = 0; i < n; i++) {
    const r = SPACING * Math.sqrt(i + 0.5), a = i * GA;
    offs[i] = [Math.cos(a) * r * sx, Math.sin(a) * r * sz + shift];
  }
  return { offs, front: R, halfW: Math.min(R, maxH), back: R * (2 * sz - 1) };
}

/* remove k front-most units (swap-fill from the back so the formation stays stable) */
function removeFront(crowd, k, dirSign, color) {
  const us = crowd.units, n = us.length;
  if (k <= 0) return;
  if (k >= n) { for (const u of us) deathFx(u, color); us.length = 0; return; }
  const order = us.map((_, i) => i).sort((a, b) => dirSign < 0 ? us[a].z - us[b].z : us[b].z - us[a].z);
  const dead = new Set(order.slice(0, k));
  for (const i of dead) deathFx(us[i], color);
  const newLen = n - k, tail = [];
  for (let i = newLen; i < n; i++) if (!dead.has(i)) tail.push(i);
  let t = 0;
  for (const i of dead) if (i < newLen) us[i] = us[tail[t++]];
  us.length = newLen;
}

/* ================= particles ================= */
class Particles {
  constructor(cap) {
    this.cap = cap; this.list = [];
    this.mesh = new THREE.InstancedMesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshBasicMaterial({ color: 0xffffff }), cap);
    this.mesh.instanceColor = new THREE.InstancedBufferAttribute(new Float32Array(cap * 3), 3);
    this.mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    this.mesh.frustumCulled = false; this.mesh.count = 0;
    scene.add(this.mesh);
    this.d = new THREE.Object3D(); this.c = new THREE.Color();
  }
  spawn(p) {
    if (this.list.length >= this.cap) this.list.shift();
    p.max = p.life; p.rx = p.rx ?? Math.random() * 6; p.ry = p.ry ?? Math.random() * 6; p.rz = 0;
    p.wx = p.wx ?? rand(-8, 8); p.wy = p.wy ?? rand(-8, 8);
    this.list.push(p);
  }
  clear() { this.list.length = 0; this.mesh.count = 0; }
  update(dt) {
    const L = this.list;
    for (let i = L.length - 1; i >= 0; i--) {
      const p = L[i];
      p.life -= dt;
      if (p.life <= 0) { L[i] = L[L.length - 1]; L.pop(); continue; }
      p.vy -= p.g * dt;
      if (p.drag) { const k = Math.exp(-p.drag * dt); p.vx *= k; p.vy *= k; p.vz *= k; }
      if (p.sway) p.vx += Math.sin(p.life * 6 + p.ry) * p.sway * dt;
      p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt;
      if (p.floor && p.y < 0.05) { p.y = 0.05; p.vy *= -0.3; p.vx *= 0.6; p.vz *= 0.6; }
      p.rx += p.wx * dt; p.ry += p.wy * dt;
    }
    const d = this.d, m = this.mesh;
    for (let i = 0; i < L.length; i++) {
      const p = L[i], f = Math.min(1, (p.life / p.max) * 2.5);
      d.position.set(p.x, p.y, p.z); d.rotation.set(p.rx, p.ry, 0);
      d.scale.set(p.sx * f, p.sy * f, p.sz * f); d.updateMatrix();
      m.setMatrixAt(i, d.matrix); this.c.setHex(p.color); m.setColorAt(i, this.c);
    }
    m.count = L.length;
    if (L.length) { m.instanceMatrix.needsUpdate = true; m.instanceColor.needsUpdate = true; }
  }
}
const particles = new Particles(1400);

function deathFx(u, color) {
  for (let i = 0; i < 4; i++) particles.spawn({ x: u.x, y: rand(0.3, 0.9), z: u.z, vx: rand(-2.5, 2.5), vy: rand(2, 5), vz: rand(-2.5, 2.5),
    life: rand(0.35, 0.6), sx: 0.13, sy: 0.13, sz: 0.13, color, g: 14, floor: true });
  particles.spawn({ x: u.x, y: 0.6, z: u.z, vx: 0, vy: 1.2, vz: 0, life: 0.3, sx: 0.32, sy: 0.32, sz: 0.32, color: 0xffffff, g: 0 });
}
function sparkFx(x, y, z, n = 3) {
  for (let i = 0; i < n; i++) particles.spawn({ x: x + rand(-.2, .2), y, z, vx: rand(-4, 4), vy: rand(1, 5), vz: rand(-3, 3),
    life: rand(0.18, 0.35), sx: 0.09, sy: 0.09, sz: 0.09, color: Math.random() < .5 ? 0xfff3a0 : 0xffffff, g: 10 });
}
function gateFx(x, z, good) {
  const cols = good ? [0x7fd0ff, 0xffffff, 0x3aa0ff, 0xc8f0ff] : [0xff7b86, 0xffffff, 0xff3b4b];
  for (let i = 0; i < 40; i++) particles.spawn({ x: x + rand(-1.8, 1.8), y: rand(0.2, 2.5), z: z + rand(-1, 1),
    vx: rand(-2, 2), vy: rand(2, 6), vz: rand(-1, 1), life: rand(0.5, 0.9), sx: 0.12, sy: 0.12, sz: 0.12,
    color: cols[i % cols.length], g: 8, drag: 1 });
}
function confettiFx(cx, cz) {

/* ================= stage generation ================= */
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function applyOp(o, c) {
  switch (o.t) { case 'add': return c + o.v; case 'sub': return Math.max(0, c - o.v);
    case 'mul': return c * o.v; case 'div': return Math.floor(c / o.v); }
}
const opText = o => ({ add: '+', sub: '−', mul: '×', div: '÷' }[o.t]) + o.v;
const isBad = o => o.t === 'sub' || o.t === 'div';

function makePair(rnd, lv, best) {
  const good = [{ t: 'add', v: 10 }, { t: 'add', v: 20 }, { t: 'add', v: 50 }];
  if (best < 1500) good.push({ t: 'mul', v: 2 });
  if (best < 400) good.push({ t: 'mul', v: 3 });
  if (best > 200) good.push({ t: 'add', v: 100 });
  const pick = a => a[Math.floor(rnd() * a.length)];
  const a = pick(good);
  let b;
  if (lv >= 2 && rnd() < Math.min(0.45, 0.12 + lv * 0.05)) {
    const bad = [{ t: 'sub', v: 10 }, { t: 'sub', v: 20 }, { t: 'div', v: 2 }];
    if (best > 80) bad.push({ t: 'sub', v: 50 });
    b = pick(bad);
  } else {
    let tries = 0;
    do { b = pick(good); tries++; } while (applyOp(b, best) === applyOp(a, best) && tries < 30);
  }
  return rnd() < 0.5 ? [a, b] : [b, a];
}
function genStage(lv) {
  const rnd = mulberry32(lv * 7919 + 101);
  const items = []; let z = -26, best = START_COUNT;
  const encounters = Math.min(2 + lv, 7);
  for (let s = 0; s < encounters; s++) {
    const nG = s === 0 ? 2 : (rnd() < 0.55 ? 2 : 1);
    for (let g = 0; g < nG; g++) {
      const pair = makePair(rnd, lv, best);
      items.push({ type: 'gate', z, pair });
      best = Math.max(...pair.map(o => applyOp(o, best)));
      z -= 22;
    }
    z -= 6;
    const frac = Math.min(0.7, 0.3 + lv * 0.04 + rnd() * 0.12);
    const count = Math.max(3, Math.round(best * frac));
    items.push({ type: 'enemy', z, count });
    best -= count; z -= 30;
  }
  const pair = makePair(rnd, lv, best);
  items.push({ type: 'gate', z, pair });
  best = Math.max(...pair.map(o => applyOp(o, best)));
  z -= 32;
  const hp = Math.max(15, Math.round(best * Math.min(0.8, 0.5 + lv * 0.04)));
  return { items, bossZ: z, bossHp: hp, finishZ: z - 16 };
}

    }

}
function setupEnemy(crowd, count, z) {

  for (let i = 0; i < vis; i++) {

function clearStage() {
  stageGroup.traverse(o => {
    if (o.isMesh) {
      o.geometry.dispose();
      (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => { if (m.map) m.map.dispose(); m.dispose(); });
    }

  particles.clear();
  labelsEl.querySelectorAll('.popup').forEach(e => e.remove());
}

function loadStage(lv) {
  level = lv;
  try { localStorage.setItem('crowdDashLevel', String(lv)); } catch (e) {}
  clearStage();
  S = genStage(lv);
  buildCourse(S);
  let ei = 0;
  for (const it of S.items) {
    if (it.type === 'gate') {
      const w = HALF - 0.3;
      gateRows.push({ z: it.z, passed: false, f: 1, chosen: null,
        gates: [buildGate(it.pair[0], -HALF / 2, it.z, w), buildGate(it.pair[1], HALF / 2, it.z, w)] });
    } else if (it.type === 'enemy') {
      enemies.push(setupEnemy(enemyPool[ei++], it.count, it.z));
    }
  }
  Object.assign(boss, { hp: S.bossHp, z: S.bossZ, active: true, dead: false, rot: 0, fallT: 0, hit: 0, shrink: 1 });
  boss.crowd.units = [newUnit(0, S.bossZ)]; boss.crowd.animRate = 3; boss.crowd.mat.emissive.setHex(0);
  setLabel(bossLabel, boss.hp);
  // player
  Object.assign(P, { count: START_COUNT, px: 0, pz: 0, targetX: 0 });
  player.units.length = 0; syncPlayer();
  for (let i = 0; i < player.units.length; i++) {

  }

}

function startRun() {

  $('startOv').classList.add('hidden');
}
function lose() {
  if (state === 'lost' || state === 'won') return;
  state = 'lost'; endT = 0; P.count = 0; syncPlayer(); setLabel(pLabel, 0);
}
function win() {
  state = 'won'; endT = 0;

function passGate(row) {

  gateFx(g.cx, row.z, !isBad(g.op));

  setLabel(pLabel, P.count);
  if (after > before) for (let i = 0; i < 12; i++)
    particles.spawn({ x: P.px + rand(-1.5, 1.5), y: rand(0.5, 1.5), z: P.pz + rand(-1.5, 1.5), vx: rand(-1, 1), vy: rand(3, 6), vz: rand(-1, 1),
      life: 0.6, sx: 0.1, sy: 0.1, sz: 0.1, color: 0xffffff, g: 6 });

const camLook = new THREE.Vector3(), camPos = new THREE.Vector3(), tmpV = new THREE.Vector3();
function camTargets() {
  let zoom = 1 + Math.min(0.55, P.back / 10);
  if (state === 'boss' || (boss.active && !boss.dead && P.pz - boss.z < 18)) zoom = Math.max(zoom, 1.25);
  const cx = P.px * 0.35;
  camPos.set(cx, 10 * zoom, P.pz + 10.5 * zoom);

}
const lookCur = new THREE.Vector3();

/* ================= update ================= */
const bm = new THREE.Matrix4(), bq = new THREE.Quaternion(), be = new THREE.Euler(), bs = new THREE.Vector3(), bp = new THREE.Vector3();

function update(dt) {
  time += dt;
  let moveZ = 0;

  // steering
  if (keys.l) P.targetX -= 9 * dt;
  if (keys.r) P.targetX += 9 * dt;
  const maxX = Math.max(0, HALF - 0.35 - P.halfW);
  P.targetX = clamp(P.targetX, -maxX, maxX);

  if (state === 'run') {
    const nz = P.pz - RUN_SPEED * dt; moveZ = nz - P.pz; P.pz = nz;
    P.px += (P.targetX - P.px) * Math.min(1, dt * 10);
    for (const row of gateRows) if (!row.passed && P.pz <= row.z) passGate(row);
    if (state === 'run') for (const E of enemies)
      if (E.alive && (P.pz - P.front) - (E.cz + E.front) < 0.6) { startBattle(E); break; }
    if (state === 'run' && boss.active && !boss.dead && P.pz - P.front < boss.z + 1.9) startBoss();
    if (state === 'run' && boss.dead && P.pz - P.front <= S.finishZ) win();
  }
  else if (state === 'battle') {
    const E = foe;
    const nz = P.pz + ((E.cz + E.front + P.front * 0.35) - P.pz) * Math.min(1, dt * 2.5);
    moveZ = nz - P.pz; P.pz = nz;
    E.cz += ((P.pz - P.front - E.front * 0.35) - E.cz) * Math.min(1, dt * 1.5);
    P.px += (0 - P.px) * Math.min(1, dt * 2); P.targetX = P.px;
    battleT += dt;
    while (battleT >= TICK && E.count > 0 && P.count > 0) {
      battleT -= TICK;
      const k = Math.min(battleK, P.count, E.count);
      P.count -= k; E.count -= k;
      syncPlayer(); syncEnemy(E);
      const cz = (P.pz - P.front + E.cz + E.front) / 2;
      sparkFx(rand(-P.halfW, P.halfW) * 0.8, rand(0.4, 1), cz, 3);
      shake = 0.08;
    }
    setLabel(pLabel, P.count); setLabel(E.label, E.count);
    if (E.count <= 0) {
      E.alive = false; E.crowd.mesh.visible = false; E.label.style.display = 'none';
      if (P.count > 0) { state = 'run'; foe = null; }
    }
    if (P.count <= 0) lose();
  }
  else if (state === 'boss') {
    const nz = P.pz + ((boss.z + 1.0 + P.front * 0.6) - P.pz) * Math.min(1, dt * 2.5);
    moveZ = nz - P.pz; P.pz = nz;
    P.px += (0 - P.px) * Math.min(1, dt * 2); P.targetX = P.px;
    battleT += dt;
    while (battleT >= TICK && boss.hp > 0 && P.count > 0) {
      battleT -= TICK;
      const k = Math.min(battleK, P.count, boss.hp);
      P.count -= k; boss.hp -= k;
      syncPlayer();
      boss.hit = 0.08; shake = 0.12;
      sparkFx(rand(-1.2, 1.2), rand(0.6, 2.4), boss.z + 0.9, 4);
    }
    setLabel(pLabel, P.count); setLabel(bossLabel, boss.hp);
    if (boss.hp <= 0 && P.count > 0) {
      boss.dead = true; boss.fallT = 0; state = 'bossdown'; endT = 0;
      for (let i = 0; i < 60; i++) particles.spawn({ x: rand(-1.5, 1.5), y: rand(0.5, 4), z: boss.z + rand(-1, 1),
        vx: rand(-5, 5), vy: rand(2, 8), vz: rand(-4, 4), life: rand(0.5, 1), sx: 0.2, sy: 0.2, sz: 0.2,
        color: i % 3 ? BOSS_RED : 0xffffff, g: 14, floor: true });
    } else if (P.count <= 0) lose();
  }
  else if (state === 'bossdown') {
    endT += dt;
    if (endT > 0.9) state = 'run';
  }
  else if (state === 'won' || state === 'lost') {
    endT += dt;
    if (state === 'won' && endT > 0.7 && $('winOv').classList.contains('hidden')) {
      $('winSub').textContent = `生き残り: ${P.count}人`;
      $('winOv').classList.remove('hidden');
    }
    if (state === 'lost' && endT > 0.7 && $('loseOv').classList.contains('hidden')) {
      $('loseSub').textContent = `LEVEL ${level}`;
      $('loseOv').classList.remove('hidden');
    }
  }

  // ---- ally units ----
  const fighting = state === 'battle' || state === 'boss';
  player.animRate = state === 'ready' ? 3 : fighting ? 18 : state === 'won' ? 9 : 13;
  const amp = state === 'ready' ? 0.12 : fighting ? 0.85 : state === 'won' ? 0.6 : state === 'bossdown' ? 0.3 : 1;
  const kx = Math.min(1, dt * 7), kz = Math.min(1, dt * 8), lim = HALF - 0.25;
  const us = player.units;
  for (let i = 0; i < us.length; i++) {
    const u = us[i], o = P.offs[i];
    let tx = P.px + o[0] + u.jx, tz = P.pz + o[1] + u.jz;
    if (fighting) { tz = P.pz + o[1] * 0.75 + Math.sin(time * 17 + u.ph) * 0.06; tx = P.px + o[0] * 0.92; }
    u.z += moveZ;
    u.x += (tx - u.x) * kx; u.z += (tz - u.z) * kz;
    u.x = clamp(u.x, -lim, lim);
    u.s = Math.min(1, u.s + dt * 4);
    u.y = state === 'won' ? Math.abs(Math.sin(time * 8 + u.ph)) * 0.45 : (1 - u.s) * 0.9;
    u.amp = amp;
  }
  player.tick(dt); player.flush();

  // ---- enemy units ----
  for (const E of enemies) {
    if (!E.alive) continue;
    const eu = E.crowd.units, inFight = foe === E && state === 'battle';
    for (let i = 0; i < eu.length; i++) {
      const u = eu[i], o = E.offs[i];
      let tx = E.cx + o[0] + u.jx, tz = E.cz + o[1] + u.jz;
      if (inFight) { tz = E.cz + o[1] * 0.75 + Math.sin(time * 17 + u.ph) * 0.06; tx = E.cx + o[0] * 0.92; }
      u.x += (tx - u.x) * kx; u.z += (tz - u.z) * kz;
    }
    E.crowd.tick(dt); E.crowd.flush();
  }

  // ---- boss ----
  if (boss.active) {
    const bc = boss.crowd, u = bc.units[0];
    boss.hit = Math.max(0, boss.hit - dt);
    if (boss.dead) {
      boss.fallT += dt;
      boss.rot = -(Math.min(1, boss.fallT / 0.7) ** 2) * Math.PI / 2;
      if (boss.fallT > 0.8) boss.shrink = Math.max(0, boss.shrink - dt * 2.5);
      if (boss.shrink <= 0) { boss.active = false; bc.mesh.count = 0; }
    }
    if (boss.active) {
      bc.animRate = state === 'boss' ? 9 : 3;
      const sh = state === 'boss' ? Math.sin(time * 60) * 0.06 : 0;
      be.set(boss.rot, 0, 0); bq.setFromEuler(be);
      bs.setScalar(boss.scale * boss.shrink); bp.set(sh, 0, boss.z);
      bm.compose(bp, bq, bs); bc.mesh.setMatrixAt(0, bm); bc.mesh.count = 1;
      bc.mesh.instanceMatrix.needsUpdate = true;
      bc.anim.array[0] = 0; bc.anim.array[1] = boss.dead ? 0 : state === 'boss' ? 1.1 : 0.25; bc.anim.needsUpdate = true;
      const f = boss.hit > 0 ? 0.45 : 0; bc.mat.emissive.setRGB(f, f * 0.7, f * 0.7);
      bc.tick(dt);
    }
  }

  // ---- gates fade ----
  for (const row of gateRows) {
    if (!row.passed || row.f <= 0) continue;
    row.f = Math.max(0, row.f - dt * 2.2);
    for (const g of row.gates) {
      g.panelMat.opacity = 0.45 * row.f; g.txtMat.opacity = row.f;
      if (g === row.chosen) g.grp.scale.set(1 + (1 - row.f) * 0.25, 1 + (1 - row.f) * 0.25, 1);
      if (row.f <= 0) g.grp.visible = false;
    }
  }

  particles.update(dt);
  waterMat.uniforms.uTime.value = time;

  // ---- camera / light ----
  camTargets();
  const ck = 1 - Math.exp(-dt * 4.5);
  camera.position.lerp(camPos, ck); lookCur.lerp(camLook, ck);
  shake = Math.max(0, shake - dt);
  if (shake > 0) camera.position.x += (Math.random() - 0.5) * shake * 0.6;
  camera.lookAt(lookCur);
  sun.position.set(P.px + 6, 20, P.pz + 9);
  sun.target.position.set(P.px, 0, P.pz - 5);
  water.position.set(camera.position.x, -0.8, P.pz - 50);
  waterMat.uniforms.uCam.value.copy(camera.position);

  // ---- HUD ----
  const showP = P.count > 0 && state !== 'lost';
  placeLabel(pLabel, P.px, 1.55, P.pz - (fighting ? 0 : 0.2), showP);
  for (const E of enemies) if (E.alive) placeLabel(E.label, E.cx, 1.55, E.cz, E.cz > P.pz - 80);
  placeLabel(bossLabel, 0, boss.scale * 1.25 + 0.4, boss.z, boss.active && !boss.dead && boss.z > P.pz - 90);
  const prog = S ? clamp(-P.pz / -S.finishZ, 0, 1) : 0;
  $('progress').firstChild.style.width = (prog * 100).toFixed(1) + '%';
}

/* ================= loop ================= */
const clock = new THREE.Clock();
function loop() {
  requestAnimationFrame(loop);
  const dt = Math.min(clock.getDelta(), 0.05);
  update(dt);
  renderer.render(scene, camera);
}
loadStage(level);
loop();
window.__game = { get state() { return state; }, P, boss, get enemies() { return enemies; }, loadStage };
</script>
