<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#c4ebfa">
<meta name="robots" content="noindex, nofollow">
<title>SWISH!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<style>
/* Layout: one portrait court, letterboxed in the window; HUD and screens float over the canvas. Single bright look. */
:root {
  --sky: #9fdcf5;
  --sky-out: #c4ebfa;
  --ink: #12405c;
  --ball: #f27a22;
  --rim: #e2352b;
  --gold: #ffc93c;
  --white: #ffffff;
  --font-display: "Lilita One", "Arial Rounded MT Bold", "Hiragino Maru Gothic ProN", system-ui, sans-serif;
  --font-body: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Hiragino Sans", system-ui, sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
body {
  background: var(--sky-out);
  color: var(--ink);
  font-family: var(--font-body);
  display: flex;
  box-sizing: border-box;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px;
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
}
#wrap { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; }
#stage {
  --u: 1;
  position: relative;
  overflow: hidden;
  border-radius: calc(var(--u) * 24px);
  box-shadow: 0 18px 50px rgba(18, 64, 92, 0.18);
  touch-action: none;
  cursor: grab;
  max-width: 100%;
}
#stage.aiming { cursor: grabbing; }
canvas { display: block; width: 100%; height: 100%; }

/* HUD */
.hud { position: absolute; inset: 0; pointer-events: none; }
.score {
  position: absolute; left: 0; right: 0; top: calc(var(--u) * 22px);
  text-align: center;
  font-family: var(--font-display);
  font-size: calc(var(--u) * 84px);
  line-height: 1;
  color: var(--white);
  text-shadow: 0 calc(var(--u) * 5px) 0 var(--ink);
  font-variant-numeric: tabular-nums;
}
.score.pop { animation: pop 0.35s cubic-bezier(.2,1.6,.4,1); }
@keyframes pop { from { transform: scale(1.45); } to { transform: scale(1); } }
.combo {
  position: absolute; left: 50%; top: calc(var(--u) * 116px);
  transform: translateX(-50%);
  background: var(--gold);
  color: var(--ink);
  font-family: var(--font-display);
  font-size: calc(var(--u) * 19px);
  letter-spacing: 0.06em;
  padding: calc(var(--u) * 4px) calc(var(--u) * 14px);
  border-radius: 999px;
  box-shadow: 0 calc(var(--u) * 3px) 0 var(--ink);
  white-space: nowrap;
  animation: glow 0.9s ease-in-out infinite alternate;
}
@keyframes glow { from { filter: brightness(1); } to { filter: brightness(1.15); transform: translateX(-50%) scale(1.06); } }
.lives {
  position: absolute; top: calc(var(--u) * 22px); right: calc(var(--u) * 20px);
  display: flex; gap: calc(var(--u) * 6px);
}
.lives i {
  width: calc(var(--u) * 18px); height: calc(var(--u) * 18px);
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #ffad6b, var(--ball) 60%, #c4560f);
  box-shadow: 0 calc(var(--u) * 2px) 0 var(--ink);
  transition: transform .3s, opacity .3s, filter .3s;
}
.lives i.used { opacity: 0.35; filter: grayscale(1); transform: scale(0.7); }
.lives-label {
  position: absolute; top: calc(var(--u) * 46px); right: calc(var(--u) * 20px);
  font-size: calc(var(--u) * 11px); font-weight: 800; letter-spacing: 0.12em; opacity: 0.6;
}

/* Screens */
.screen {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: calc(var(--u) * 14px);
  background: rgba(214, 242, 253, 0.55);
  -webkit-backdrop-filter: blur(3px);
  backdrop-filter: blur(3px);
  animation: fade .35s ease-out;
  text-align: center;
  padding-inline: calc(var(--u) * 24px);
}
@keyframes fade { from { opacity: 0; } }
.logo {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 400;
  font-size: calc(var(--u) * 104px);
  line-height: 0.9;
  color: var(--ball);
  text-shadow: 0 calc(var(--u) * 7px) 0 var(--ink);
  transform: rotate(-5deg);
  animation: bob 2.4s ease-in-out infinite;
}
@keyframes bob { 50% { transform: rotate(-3deg) translateY(calc(var(--u) * -6px)); } }
.tag { margin: 0 0 calc(var(--u) * 18px); font-weight: 800; font-size: calc(var(--u) * 16px); }
.btn {
  font-family: var(--font-display);
  font-size: calc(var(--u) * 34px);
  letter-spacing: 0.06em;
  color: var(--white);
  background: var(--rim);
  border: none;
  border-radius: 999px;
  padding: calc(var(--u) * 12px) calc(var(--u) * 54px);
  box-shadow: 0 calc(var(--u) * 6px) 0 var(--ink);
  cursor: pointer;
  transition: transform .08s, box-shadow .08s;
}
.btn:hover { filter: brightness(1.06); }
.btn:active { transform: translateY(calc(var(--u) * 5px)); box-shadow: 0 calc(var(--u) * 1px) 0 var(--ink); }
.btn:focus-visible { outline: 3px solid var(--ink); outline-offset: 4px; }
.hs { margin: 0; font-family: var(--font-display); font-size: calc(var(--u) * 20px); letter-spacing: 0.08em; }
.hs b { font-weight: 400; color: var(--rim); font-size: 1.25em; }
.go { margin: 0; font-family: var(--font-display); font-size: calc(var(--u) * 46px); color: var(--ink); }
.final {
  margin: 0; font-family: var(--font-display); font-size: calc(var(--u) * 120px); line-height: 1;
  color: var(--white); text-shadow: 0 calc(var(--u) * 7px) 0 var(--ink);
}
.final-label { margin: 0; font-weight: 800; font-size: calc(var(--u) * 13px); letter-spacing: 0.14em; opacity: 0.7; }
.newrec {
  margin: 0; background: var(--gold); padding: calc(var(--u) * 4px) calc(var(--u) * 14px); border-radius: 999px;
  font-family: var(--font-display); font-size: calc(var(--u) * 20px); letter-spacing: 0.06em;
  box-shadow: 0 calc(var(--u) * 3px) 0 var(--ink);
  animation: pop 0.5s cubic-bezier(.2,1.6,.4,1);
}
.spacer { height: calc(var(--u) * 8px); }
@media (prefers-reduced-motion: reduce) {
  .logo, .combo, .score.pop, .newrec { animation: none; }
}
</style>
<style>
*, *::before, *::after { box-sizing: border-box; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; font-size: 14px; }
[hidden] { display: none !important; }
.back {
  font-family: var(--font-body);
  font-weight: 800;
  font-size: calc(var(--u) * 14px);
  color: var(--ink);
  text-decoration: none;
  opacity: 0.75;
  margin-top: calc(var(--u) * 6px);
}
.back:hover, .back:focus-visible { opacity: 1; text-decoration: underline; }
</style>
</head>
<body>

<div id="wrap">
  <div id="stage">
    <canvas id="cv" aria-label="バスケットボールのコート。ボールを上にスワイプするとシュートします。"></canvas>

    <div class="hud" id="hud" hidden>
      <div class="score" id="score">0</div>
      <div class="combo" id="combo" hidden>COMBO ×2</div>
      <div class="lives" id="lives" aria-label="残りミス回数"><i></i><i></i><i></i></div>
      <div class="lives-label">LIFE</div>
    </div>

    <div class="screen" id="title">
      <h1 class="logo">SWISH!</h1>
      <p class="tag">上にスワイプして、離すだけ。</p>
      <button class="btn" id="play">PLAY</button>
      <p class="hs">HIGH SCORE <b id="hsTitle">0</b></p>
      <a class="back" href="../../">← ゲーム一覧にもどる</a>
    </div>

    <div class="screen" id="over" hidden>
      <p class="go">GAME OVER</p>
      <p class="final-label">SCORE</p>
      <p class="final" id="final">0</p>
      <p class="newrec" id="newrec" hidden>NEW RECORD!</p>
      <p class="hs">HIGH SCORE <b id="hsOver">0</b></p>
      <div class="spacer"></div>
      <button class="btn" id="retry">RETRY</button>
      <a class="back" href="../../">← ゲーム一覧にもどる</a>
    </div>
  </div>
</div>

<script>
(() => {
  // ================= world & camera (meters, first-person) =================
  const W = 420, H = 740;                 // logical screen units
  const F = 520, CX = 210, HY = 400, CAMY = 1.55;   // focal length, center, horizon, eye height
  const G = 14;                            // a bit snappier than real gravity
  const R = 0.12;                          // ball radius
  const RR = 0.23;                         // rim radius
  const TUBE = 0.012;                      // rim tube radius
  const RIMH = 3.05;
  const THETA = 65 * Math.PI / 180;        // launch elevation
  const HOME = { x: 0, y: 1.12, z: 0.92 };
  const SUB = 1 / 240;
  const reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  const $ = id => document.getElementById(id);
  const stage = $('stage'), cv = $('cv'), ctx = cv.getContext('2d');
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const easeInOut = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  const easeOutBack = t => { const c = 1.7; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
  const proj = (x, y, z) => { const zz = Math.max(0.2, z); return { x: CX + F * x / zz, y: HY - F * (y - CAMY) / zz, s: F / zz }; };

  // ================= sizing =================
  let scale = 1, dpr = 1;
  function resize() {
    const wrap = $('wrap');
    scale = Math.min(wrap.clientWidth / W, wrap.clientHeight / H);
    dpr = Math.min(2, window.devicePixelRatio || 1);
    stage.style.width = (W * scale) + 'px';
    stage.style.height = (H * scale) + 'px';
    stage.style.setProperty('--u', scale);
    cv.width = Math.round(W * scale * dpr);
    cv.height = Math.round(H * scale * dpr);
  }
  window.addEventListener('resize', resize);

  // ================= storage =================
  let best = 0;
  try { best = +localStorage.getItem('stevenfridley42-tech-4-best') || 0; } catch (e) {}
  const saveBest = () => { try { localStorage.setItem('stevenfridley42-tech-4-best', String(best)); } catch (e) {} };

  // ================= audio (synthesized) =================
  let ac = null, master = null, noiseBuf = null, lastClank = 0, lastThud = 0;
  function initAudio() {
    if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
    try {
      ac = new (window.AudioContext || window.webkitAudioContext)();
      master = ac.createGain(); master.gain.value = 0.75; master.connect(ac.destination);
      noiseBuf = ac.createBuffer(1, Math.floor(ac.sampleRate * 0.6), ac.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { ac = null; }
  }
  function tone(freq, dur, type = 'sine', vol = 0.2, when = 0, glideTo = 0) {
    if (!ac) return;
    const t = ac.currentTime + when;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (glideTo) o.frequency.exponentialRampToValueAtTime(glideTo, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + dur + 0.03);
  }
  function noise(dur, f1, f2, vol = 0.3, q = 1, when = 0) {
    if (!ac) return;
    const t = ac.currentTime + when;
    const s = ac.createBufferSource(); s.buffer = noiseBuf;
    const f = ac.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = q;
    f.frequency.setValueAtTime(f1, t); f.frequency.exponentialRampToValueAtTime(f2, t + dur);
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.025);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(master);
    s.start(t); s.stop(t + dur + 0.05);
  }
  const sfx = {
    shoot(p) { noise(0.22, 500, 1700, 0.05 + p * 0.07, 0.7); },
    rim(v) {
      const now = performance.now(); if (now - lastClank < 70) return; lastClank = now;
      const vol = Math.min(0.24, v / 18); if (vol < 0.025) return;
      tone(540, 0.28, 'triangle', vol); tone(1390, 0.2, 'sine', vol * 0.55); tone(2270, 0.12, 'sine', vol * 0.3);
    },
    thud(v, pitch = 150) {
      const now = performance.now(); if (now - lastThud < 80) return; lastThud = now;
      const vol = Math.min(0.32, v / 16); if (vol < 0.03) return;
      tone(pitch, 0.16, 'sine', vol, 0, pitch * 0.6); noise(0.07, 900, 400, vol * 0.5, 0.8);
    },
    net() { noise(0.34, 4400, 1200, 0.3, 0.9); },
    goal(streak, swish) {
      const base = 659.25 * Math.pow(2, Math.min(streak - 1, 9) / 12);
      tone(base, 0.18, 'triangle', 0.15, 0.05);
      tone(base * 1.5, 0.3, 'triangle', 0.13, 0.12);
      if (swish) { tone(base * 2, 0.38, 'sine', 0.12, 0.2); tone(base * 3, 0.5, 'sine', 0.06, 0.27); }
    },
    miss() { tone(310, 0.28, 'sine', 0.1, 0, 170); },
    over() { tone(392, 0.2, 'triangle', 0.12); tone(311, 0.2, 'triangle', 0.12, 0.18); tone(233, 0.5, 'triangle', 0.12, 0.36); },
    click() { tone(880, 0.09, 'triangle', 0.1); tone(1320, 0.12, 'triangle', 0.08, 0.05); }
  };

  // ================= game state =================
  let mode = 'title';
  let score = 0, streak = 0, misses = 0, newRecord = false;
  const HOOP0 = { x: 0, z: 4.6 };
  const hoop = { x: 0, z: 4.6, baseX: 0, fromX: 0, fromZ: 4.6, toX: 0, toZ: 4.6, tw: 1, moveT: 0, amp: 0, off: 0, vOff: 0 };
  let ball = null;
  const spent = [], parts = [], texts = [];
  let nextBallT = 0, overT = 0, retargetT = 0;
  let shake = 0, flash = 0, slowT = 0, heat = 0, raysA = 0;
  let drag = null;
  const clouds = [
    { x: 60, y: 110, s: 1.0, v: 6 }, { x: 300, y: 60, s: 0.8, v: 4 },
    { x: 380, y: 220, s: 0.6, v: 8 }, { x: 150, y: 300, s: 0.7, v: 5 }
  ];

  const rimY = () => RIMH + hoop.off;
  const boardZ = () => hoop.z + RR + 0.15;

  function newBall() {
    ball = { x: HOME.x, y: HOME.y, z: HOME.z, vx: 0, vy: 0, vz: 0, spin: Math.random() * 6, spinV: 0,
             phase: 'ready', spawn: 0, t: 0, touched: false, scored: false, invalid: false, trail: [], catchT: 0 };
  }

  function retargetHoop() {
    const d = Math.min(1, score / 30);
    const spreadX = 0.15 + d * 0.85, spreadZ = 0.15 + d * 0.9;
    let tx, tz, tries = 0;
    do {
      tx = clamp((Math.random() * 2 - 1) * spreadX, -1.0, 1.0);
      tz = clamp(HOOP0.z + (Math.random() * 2 - 1) * spreadZ, 3.8, 6.0);
    } while (tries++ < 10 && Math.hypot(tx - hoop.baseX, tz - hoop.z) < 0.25);
    hoop.fromX = hoop.baseX; hoop.fromZ = hoop.z; hoop.toX = tx; hoop.toZ = tz; hoop.tw = 0;
  }

  function updateHoop(dt) {
    if (hoop.tw < 1) {
      hoop.tw = Math.min(1, hoop.tw + dt / 0.6);
      const e = easeInOut(hoop.tw);
      hoop.baseX = lerp(hoop.fromX, hoop.toX, e);
      hoop.z = lerp(hoop.fromZ, hoop.toZ, e);
    }
    let target = 0;
    if (mode === 'play' && score >= 10) {
      const k = score - 10;
      target = Math.min(0.8, 0.3 + k * 0.025);
      hoop.moveT += dt * Math.min(1.3, 0.55 + k * 0.035);
    }
    hoop.amp += (target - hoop.amp) * Math.min(1, dt * 1.2);
    const bx = clamp(hoop.baseX, -1.1 + hoop.amp, 1.1 - hoop.amp);
    hoop.x = bx + Math.sin(hoop.moveT) * hoop.amp;
  }

  // ================= net (3D verlet) =================
  const NC = 12, NR = 5, SEG = 0.1;
  const net = [];
  const ringR = r => RR * (1 - r * 0.1);
  function initNet() {
    net.length = 0;
    for (let r = 0; r < NR; r++) {
      const row = [];
      for (let c = 0; c < NC; c++) {
        const a = c / NC * Math.PI * 2;
        const x = hoop.x + Math.cos(a) * ringR(r), y = rimY() - r * SEG, z = hoop.z + Math.sin(a) * ringR(r);
        row.push({ x, y, z, px: x, py: y, pz: z });
      }
      net.push(row);
    }
  }
  function stepNet(dt, b) {
    const ry = rimY();
    for (let c = 0; c < NC; c++) {
      const a = c / NC * Math.PI * 2, p = net[0][c];
      p.x = p.px = hoop.x + Math.cos(a) * RR; p.y = p.py = ry; p.z = p.pz = hoop.z + Math.sin(a) * RR;
    }
    for (let r = 1; r < NR; r++) for (const p of net[r]) {
      const vx = (p.x - p.px) * 0.993, vy = (p.y - p.py) * 0.993, vz = (p.z - p.pz) * 0.993;
      p.px = p.x; p.py = p.y; p.pz = p.z;
      p.x += vx; p.y += vy - 6 * dt * dt; p.z += vz;
    }
    for (let it = 0; it < 4; it++) {
      for (let r = 1; r < NR; r++) {
        const hr = 2 * Math.PI * ringR(r) / NC;
        for (let c = 0; c < NC; c++) {
          link(net[r - 1][c], net[r][c], SEG, r === 1);
          link(net[r][(c + NC - 1) % NC], net[r][c], hr, false);
        }
      }
    }
    if (b) {
      const rr = R + 0.008;
      for (let r = 1; r < NR; r++) for (const p of net[r]) {
        const dx = p.x - b.x, dy = p.y - b.y, dz = p.z - b.z, d = Math.hypot(dx, dy, dz);
        if (d < rr && d > 1e-5) { p.x = b.x + dx / d * rr; p.y = b.y + dy / d * rr; p.z = b.z + dz / d * rr; }
      }
    }
  }
  function link(a, b, len, aPinned) {
    const dx = b.x - a.x, dy = b.y - a.y, dz = b.z - a.z, d = Math.hypot(dx, dy, dz) || 1e-5;
    const diff = (d - len) / d;
    if (aPinned) { b.x -= dx * diff; b.y -= dy * diff; b.z -= dz * diff; }
    else {
      a.x += dx * diff * 0.5; a.y += dy * diff * 0.5; a.z += dz * diff * 0.5;
      b.x -= dx * diff * 0.5; b.y -= dy * diff * 0.5; b.z -= dz * diff * 0.5;
    }
  }
  function punchNet(strength) {
    for (let r = 1; r < NR; r++) for (const p of net[r]) p.py += strength * (r / NR);
  }

  // ================= physics =================
  function collide(b, px, py, pz, rad, rest) {
    const dx = b.x - px, dy = b.y - py, dz = b.z - pz, d2 = dx * dx + dy * dy + dz * dz;
    if (d2 >= rad * rad || d2 < 1e-10) return 0;
    const d = Math.sqrt(d2), nx = dx / d, ny = dy / d, nz = dz / d;
    b.x = px + nx * rad; b.y = py + ny * rad; b.z = pz + nz * rad;
    const vn = b.vx * nx + b.vy * ny + b.vz * nz;
    if (vn < 0) {
      b.vx -= (1 + rest) * vn * nx; b.vy -= (1 + rest) * vn * ny; b.vz -= (1 + rest) * vn * nz;
      b.vx *= 0.97; b.vz *= 0.97;
      b.spinV *= -0.6;
      return -vn;
    }
    return 0.001;
  }

  function step(b, dt, live) {
    const py = b.y;
    b.vy -= G * dt;
    b.x += b.vx * dt; b.y += b.vy * dt; b.z += b.vz * dt;
    b.spin += b.spinV * dt;
    if (b.catchT > 0) {
      b.catchT -= dt;
      const k = Math.pow(0.03, dt);
      b.vx *= k; b.vz *= k;
      b.x += (hoop.x - b.x) * Math.min(1, dt * 10); b.z += (hoop.z - b.z) * Math.min(1, dt * 10);
    }

    const ry = rimY();
    // rim (torus): closest point on the rim circle
    const dx = b.x - hoop.x, dz = b.z - hoop.z, hd = Math.hypot(dx, dz) || 1e-6;
    const v = collide(b, hoop.x + dx / hd * RR, ry, hoop.z + dz / hd * RR, R + TUBE, 0.55);
    if (v && live) { b.touched = true; sfx.rim(v); hoop.vOff -= Math.min(v, 9) * 0.03; }

    // backboard front face
    const bz = boardZ();
    if (b.vz > 0 && b.z + R > bz && b.z < bz + 0.05 && Math.abs(b.x - hoop.x) < 0.9 && b.y > RIMH - 0.15 - R && b.y < RIMH + 0.9 + R) {
      b.z = bz - R; const vv = b.vz; b.vz = -b.vz * 0.6; b.vx *= 0.9;
      if (live) { b.touched = true; sfx.thud(vv, 170); }
    }
    // floor
    if (b.y < R) {
      b.y = R;
      if (b.vy < 0) { const vv = -b.vy; b.vy = vv * 0.62; b.vx *= 0.85; b.vz *= 0.85; sfx.thud(vv * 0.6, 110); }
    }

    if (live && !b.scored && !b.invalid && hd < RR) {
      if (py > ry && b.y <= ry && b.vy < 0) { b.scored = true; onGoal(b); }
      else if (py < ry && b.y >= ry && b.vy > 0) b.invalid = true;   // up through the net never counts
    }
  }

  function stepRim(dt) {
    hoop.vOff += (-340 * hoop.off - 9 * hoop.vOff) * dt;
    hoop.off = clamp(hoop.off + hoop.vOff * dt, -0.035, 0.035);
  }

  // ================= game events =================
  function onGoal(b) {
    streak++;
    const pts = streak >= 3 ? 2 : 1;
    score += pts;
    const swish = !b.touched;
    b.catchT = 0.3;
    if (score > best) { best = score; newRecord = true; saveBest(); }
    sfx.net(); sfx.goal(streak, swish);
    punchNet(swish ? 0.03 : 0.02);
    const p = proj(hoop.x, rimY() - 0.2, hoop.z);
    burst(p.x, p.y, swish ? 30 : 14, swish);
    const top = proj(hoop.x, rimY() + 0.35, hoop.z);
    addText('+' + pts, top.x, top.y, swish ? 40 : 34, '#ffffff', 0.9);
    if (swish) {
      addText('SWISH!', W / 2, 150, 78, '#ffc93c', 1.2, true);
      const rp = proj(hoop.x, rimY(), hoop.z);
      parts.push({ type: 'ring', x: rp.x, y: rp.y, r: RR * rp.s, life: 0.5, max: 0.5 });
      if (!reduceMotion) slowT = 0.24;
      flash = 0.45;
    }
    if (streak === 3) addText('COMBO!', W / 2, 520, 50, '#e2352b', 1.1, true);
    else if (streak > 3) addText(streak + ' COMBO', W / 2, 520, 42, '#e2352b', 1.0, true);
    if (!reduceMotion) shake = Math.max(shake, streak >= 3 ? 7 : 3);
    retargetT = 0.55;
    updateHud(true);
  }

  function onMiss(b) {
    streak = 0; misses++;
    sfx.miss();
    const p = proj(b.x, Math.max(b.y, 1.5), Math.max(b.z, 1.5));
    addText('MISS', clamp(p.x, 70, W - 70), clamp(p.y, 200, 560), 36, '#12405c', 0.8);
    updateHud(false);
    if (misses >= 3) overT = 0.9;
    else nextBallT = 0.35;
  }

  function retire(b) { b.phase = 'spent'; b.life = 1.6; spent.push(b); ball = null; }

  function burst(x, y, n, gold) {
    const cols = gold ? ['#ffc93c', '#fff4c2', '#ffffff', '#f27a22'] : ['#ffffff', '#f27a22', '#ffd28f'];
    for (let i = 0; i < n; i++) {
      const a = -Math.PI / 2 + (Math.random() - 0.5) * Math.PI * 1.7;
      const s = 140 + Math.random() * (gold ? 340 : 230);
      parts.push({ type: 'dot', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.6 + Math.random() * 0.4,
                   max: 1, size: 2.5 + Math.random() * (gold ? 4 : 3), color: cols[i % cols.length] });
    }
  }
  function addText(text, x, y, size, color, life, center) {
    texts.push({ text, x, y, size, color, life, max: life, center });
  }

  // ================= HUD / screens =================
  function updateHud(pop) {
    const s = $('score');
    s.textContent = score;
    if (pop) { s.classList.remove('pop'); void s.offsetWidth; s.classList.add('pop'); }
    [...$('lives').children].forEach((el, i) => el.classList.toggle('used', i >= 3 - misses));
    const c = $('combo');
    c.hidden = streak < 3;
    c.textContent = 'COMBO ×2 · ' + streak + '連続';
  }
  function startGame() {
    initAudio(); sfx.click();
    score = 0; streak = 0; misses = 0; newRecord = false;
    overT = 0; nextBallT = 0; retargetT = 0;
    spent.length = 0; parts.length = 0; texts.length = 0;
    hoop.fromX = hoop.baseX; hoop.fromZ = hoop.z; hoop.toX = HOOP0.x; hoop.toZ = HOOP0.z; hoop.tw = 0; hoop.moveT = 0;
    newBall();
    mode = 'play';
    $('title').hidden = true; $('over').hidden = true; $('hud').hidden = false;
    updateHud(false);
  }
  function gameOver() {
    mode = 'over';
    sfx.over();
    $('final').textContent = score;
    $('hsOver').textContent = best;
    $('newrec').hidden = !newRecord;
    $('hud').hidden = true;
    $('over').hidden = false;
    setTimeout(() => $('retry').focus({ preventScroll: true }), 50);
  }
  $('play').addEventListener('click', startGame);
  $('retry').addEventListener('click', startGame);
  $('hsTitle').textContent = best;

  // ================= input: swipe up from the ball =================
  function toScreen(e) {
    const r = stage.getBoundingClientRect();
    return { x: (e.clientX - r.left) / scale, y: (e.clientY - r.top) / scale };
  }
  // drag -> launch speed + aim angle
  function rawShot() {
    const up = drag.sy - drag.y, dx = drag.x - drag.sx;
    return { up, v: clamp(7.4 + up * 0.0125, 0, 11.6), phi: clamp(dx * 0.0028, -0.5, 0.5) };
  }
  // the exact shot that drops into the rim centre from the ball's current spot
  function idealShot(b) {
    const dx = hoop.x - b.x, dz = hoop.z - b.z, dy = rimY() - b.y;
    const D = Math.hypot(dx, dz), c = Math.cos(THETA);
    const den = 2 * c * c * (D * Math.tan(THETA) - dy);
    if (den <= 0) return null;
    return { v: Math.sqrt(G * D * D / den), phi: Math.atan2(dx, dz) };
  }
  function launchVel(b) {
    const s = rawShot();
    let v = s.v, phi = s.phi;
    // gentle aim help on near-misses only; it fades as the score climbs
    const ideal = idealShot(b);
    if (ideal && Math.abs(v - ideal.v) < 1.0 && Math.abs(phi - ideal.phi) < 0.12) {
      const k = score < 20 ? 0.4 : 0.25;
      v += (ideal.v - v) * k; phi += (ideal.phi - phi) * k;
    }
    const vh = v * Math.cos(THETA);
    return { x: vh * Math.sin(phi), y: v * Math.sin(THETA), z: vh * Math.cos(phi), v, up: s.up };
  }
  stage.addEventListener('pointerdown', e => {
    if (e.target.closest('button')) return;
    if (mode !== 'play' || !ball || ball.phase !== 'ready') return;
    initAudio();
    try { stage.setPointerCapture(e.pointerId); } catch (err) {}
    const p = toScreen(e);
    drag = { sx: p.x, sy: p.y, x: p.x, y: p.y };
    ball.phase = 'aim'; ball.y = HOME.y;
    stage.classList.add('aiming');
  });
  stage.addEventListener('pointermove', e => {
    if (!drag || !ball || ball.phase !== 'aim') return;
    const p = toScreen(e);
    drag.x = p.x; drag.y = p.y;
    // ball follows the finger a little
    ball.x = HOME.x + clamp((drag.x - drag.sx) * 0.0009, -0.12, 0.12);
    ball.y = HOME.y + clamp((drag.sy - drag.y) * 0.0005, -0.05, 0.12);
  });
  function release() {
    if (!drag || !ball || ball.phase !== 'aim') { drag = null; return; }
    stage.classList.remove('aiming');
    const v = launchVel(ball);
    if (v.up < 30) { ball.phase = 'ready'; ball.x = HOME.x; ball.y = HOME.y; drag = null; return; }
    ball.vx = v.x; ball.vy = v.y; ball.vz = v.z; ball.spinV = -9; ball.phase = 'fly'; ball.t = 0;
    sfx.shoot(clamp((v.v - 7) / 5, 0, 1));
    drag = null;
  }
  stage.addEventListener('pointerup', release);
  stage.addEventListener('pointercancel', release);

  // ================= drawing =================
  const FLOORLINE = HY + F * CAMY / 16;   // far edge of the court

  function poly(points, fill, stroke, lw) {
    ctx.beginPath();
    points.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y));
    ctx.closePath();
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
  }
  function line3(pts, color, lw) {
    ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.beginPath();
    pts.forEach((q, i) => { const p = proj(q[0], q[1], q[2]); i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y); });
    ctx.stroke();
  }

  function drawBackground() {
    const g = ctx.createLinearGradient(0, 0, 0, FLOORLINE);
    g.addColorStop(0, '#86d1f2'); g.addColorStop(1, '#d8f2fc');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, FLOORLINE + 1);
    if (heat > 0.01 && !reduceMotion) {
      const rp = proj(hoop.x, rimY(), hoop.z);
      ctx.save(); ctx.translate(rp.x, rp.y); ctx.rotate(raysA);
      ctx.fillStyle = `rgba(255,255,255,${0.25 * heat})`;
      for (let i = 0; i < 12; i++) {
        ctx.rotate(Math.PI * 2 / 12);
        ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-45, -900); ctx.lineTo(45, -900); ctx.closePath(); ctx.fill();
      }
      ctx.restore();
    }
    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    for (const c of clouds) {
      const { x, y, s } = c;
      ctx.beginPath();
      ctx.ellipse(x, y, 46 * s, 16 * s, 0, 0, Math.PI * 2);
      ctx.ellipse(x - 20 * s, y - 8 * s, 22 * s, 18 * s, 0, 0, Math.PI * 2);
      ctx.ellipse(x + 14 * s, y - 13 * s, 26 * s, 22 * s, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    // distant tree line
    ctx.fillStyle = '#6fbf8a';
    ctx.beginPath(); ctx.moveTo(0, FLOORLINE);
    for (let x = 0; x <= W; x += 14) ctx.lineTo(x, FLOORLINE - 16 - 9 * Math.abs(Math.sin(x * 0.07)) - 6 * Math.sin(x * 0.023));
    ctx.lineTo(W, FLOORLINE); ctx.closePath(); ctx.fill();
    // court
    const cg = ctx.createLinearGradient(0, FLOORLINE, 0, H);
    cg.addColorStop(0, '#4f9fd0'); cg.addColorStop(1, '#2f7fb8');
    ctx.fillStyle = cg; ctx.fillRect(0, FLOORLINE, W, H - FLOORLINE);
    // painted key
    const bl = HOOP0.z + 1.3, ft = bl - 5.8;
    const key = [[-2.45, 0, bl], [2.45, 0, bl], [2.45, 0, Math.max(0.5, ft)], [-2.45, 0, Math.max(0.5, ft)]].map(q => proj(...q));
    poly(key, 'rgba(242,122,34,0.22)', null);
    const white = 'rgba(255,255,255,0.85)';
    line3([[-9, 0, bl], [9, 0, bl]], white, 2.5);
    line3([[-2.45, 0, bl], [-2.45, 0, 0.5]], white, 2.5);
    line3([[2.45, 0, bl], [2.45, 0, 0.5]], white, 2.5);
    const arc = [];
    for (let a = -1.2; a <= 1.2; a += 0.05) arc.push([6.75 * Math.sin(a), 0, HOOP0.z - 6.75 * Math.cos(a) + 0.0]);
    line3(arc.filter(q => q[2] > 0.4), white, 2.5);
    const arc2 = [];
    for (let a = 0; a <= Math.PI; a += 0.08) arc2.push([1.8 * Math.cos(a), 0, Math.max(0.45, ft) + 1.8 * Math.sin(a)]);
    line3(arc2, white, 2.5);
  }

  function drawShadow(b) {
    const p = proj(b.x, 0, b.z);
    const h = clamp(1 - b.y / 4, 0.25, 1);
    ctx.fillStyle = `rgba(10,40,70,${0.35 * h})`;
    ctx.beginPath(); ctx.ellipse(p.x, p.y, R * p.s * 1.1 * h, R * p.s * 0.32 * h, 0, 0, Math.PI * 2); ctx.fill();
  }

  function drawStand() {
    const ry = RIMH, bz = boardZ(), hx = hoop.x, pz = bz + 0.9;
    // base + pole
    const w = 0.09;
    poly([proj(hx - 0.5, 0, pz - 0.3), proj(hx + 0.5, 0, pz - 0.3), proj(hx + 0.5, 0, pz + 0.6), proj(hx - 0.5, 0, pz + 0.6)], '#1d5b85', null);
    poly([proj(hx - w, 0, pz), proj(hx + w, 0, pz), proj(hx + w, ry + 0.45, pz), proj(hx - w, ry + 0.45, pz)], '#2b3f4f', null);
    poly([proj(hx - w, 0.05, pz), proj(hx + w, 0.05, pz), proj(hx + w, 1.4, pz), proj(hx - w, 1.4, pz)], '#e2352b', null);
    // arm to board
    poly([proj(hx - 0.05, ry + 0.38, bz + 0.03), proj(hx + 0.05, ry + 0.38, bz + 0.03), proj(hx + 0.05, ry + 0.48, pz), proj(hx - 0.05, ry + 0.48, pz)], '#2b3f4f', null);
    // backboard
    const s = proj(hx, ry, bz).s;
    const bd = [proj(hx - 0.9, ry - 0.15, bz), proj(hx + 0.9, ry - 0.15, bz), proj(hx + 0.9, ry + 0.9, bz), proj(hx - 0.9, ry + 0.9, bz)];
    poly(bd, 'rgba(255,255,255,0.72)', '#12405c', 0.05 * s);
    const sq = [proj(hx - 0.3, ry + 0.02, bz), proj(hx + 0.3, ry + 0.02, bz), proj(hx + 0.3, ry + 0.47, bz), proj(hx - 0.3, ry + 0.47, bz)];
    poly(sq, null, '#e2352b', 0.035 * s);
    // bracket
    const ryy = rimY();
    poly([proj(hx - 0.06, ryy, hoop.z + RR), proj(hx + 0.06, ryy, hoop.z + RR), proj(hx + 0.06, ryy - 0.05, bz), proj(hx - 0.06, ryy - 0.05, bz)], '#c92a22', null);
  }

  function rimPts(from, to) {
    const ry = rimY(), out = [];
    for (let i = 0; i <= 24; i++) {
      const a = from + (to - from) * i / 24;
      out.push(proj(hoop.x + Math.cos(a) * RR, ry, hoop.z + Math.sin(a) * RR));
    }
    return out;
  }
  function strokePts(pts, color, lw) {
    ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.lineCap = 'round';
    ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)); ctx.stroke();
  }
  function drawRim(front) {
    const s = proj(hoop.x, rimY(), hoop.z).s;
    if (!front) strokePts(rimPts(0, Math.PI), '#a3241c', 0.03 * s);              // far half (z > centre)
    else {
      const pts = rimPts(Math.PI, Math.PI * 2);                                     // near half
      strokePts(pts, '#12405c', 0.045 * s);
      strokePts(pts, '#e2352b', 0.03 * s);
    }
  }

  function drawNet() {
    const s = proj(hoop.x, rimY(), hoop.z).s;
    const segs = [];
    for (let r = 0; r < NR - 1; r++) for (let c = 0; c < NC; c++) {
      const p = net[r][c];
      segs.push([p, net[r + 1][(c + 1) % NC]], [p, net[r + 1][(c + NC - 1) % NC]]);
    }
    for (let c = 0; c < NC; c++) segs.push([net[NR - 1][c], net[NR - 1][(c + 1) % NC]]);
    const draw = (color, lw) => {
      ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.beginPath();
      for (const [a, b] of segs) { const pa = proj(a.x, a.y, a.z), pb = proj(b.x, b.y, b.z); ctx.moveTo(pa.x, pa.y); ctx.lineTo(pb.x, pb.y); }
      ctx.stroke();
    };
    draw('rgba(18,64,92,0.3)', 0.016 * s);
    draw('#ffffff', 0.009 * s);
  }

  function drawBall(b, alpha = 1) {
    // trail
    for (let i = 0; i < b.trail.length; i++) {
      const q = b.trail[i], k = i / b.trail.length, p = proj(q.x, q.y, q.z);
      ctx.fillStyle = heat > 0.05
        ? `rgba(255,${Math.round(150 + 80 * k)},60,${0.45 * k * Math.max(0.4, heat)})`
        : `rgba(255,255,255,${0.3 * k})`;
      ctx.beginPath(); ctx.arc(p.x, p.y, R * p.s * (0.35 + 0.55 * k), 0, Math.PI * 2); ctx.fill();
    }
    const p = proj(b.x, b.y, b.z), r = R * p.s;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(p.x, p.y);
    ctx.fillStyle = '#12405c';
    ctx.beginPath(); ctx.arc(0, 0, r + Math.max(1, r * 0.06), 0, Math.PI * 2); ctx.fill();
    const g = ctx.createRadialGradient(-r * 0.35, -r * 0.4, r * 0.1, 0, 0, r);
    g.addColorStop(0, '#ffb070'); g.addColorStop(0.6, '#f27a22'); g.addColorStop(1, '#cf5a0e');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
    // seams: backspin rolls the horizontal seam around the ball
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.clip();
    ctx.strokeStyle = 'rgba(55,22,4,0.85)'; ctx.lineWidth = Math.max(1, r * 0.06);
    ctx.beginPath(); ctx.moveTo(0, -r); ctx.lineTo(0, r); ctx.stroke();
    const ph = b.spin;
    ctx.beginPath(); ctx.ellipse(0, 0, r, Math.abs(Math.cos(ph)) * r + 0.5, 0, 0, Math.PI * 2); ctx.stroke();
    const off = Math.sin(ph) * r * 0.55;
    ctx.beginPath(); ctx.ellipse(-r * 1.15, off, r * 0.85, r * 0.95, 0, -0.9, 0.9); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(r * 1.15, off, r * 0.85, r * 0.95, 0, Math.PI - 0.9, Math.PI + 0.9); ctx.stroke();
    // shine
    ctx.fillStyle = 'rgba(255,255,255,0.22)';
    ctx.beginPath(); ctx.ellipse(-r * 0.35, -r * 0.45, r * 0.35, r * 0.2, -0.5, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  function drawAim(t) {
    if (!ball || mode !== 'play') return;
    if (ball.phase === 'ready') {
      if (score === 0 && misses === 0) {
        const p = (Math.sin(t * 5) + 1) / 2;
        ctx.save();
        ctx.globalAlpha = 0.55 + p * 0.45;
        ctx.fillStyle = '#ffffff';
        ctx.font = '800 16px "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('ボールを上にスワイプしてシュート', W / 2, 470);
        // arrow
        ctx.translate(W / 2, 520 - p * 14);
        ctx.beginPath(); ctx.moveTo(0, -16); ctx.lineTo(14, 2); ctx.lineTo(5, 2); ctx.lineTo(5, 18); ctx.lineTo(-5, 18); ctx.lineTo(-5, 2); ctx.lineTo(-14, 2); ctx.closePath();
        ctx.fill();
        ctx.restore();
      }
      return;
    }
    if (ball.phase !== 'aim' || !drag) return;
    const v = launchVel(ball);
    if (v.up < 30) return;
    let x = ball.x, y = ball.y, z = ball.z, vx = v.x, vy = v.y, vz = v.z;
    const dt = 1 / 60;
    for (let i = 1; i <= 22; i++) {
      vy -= G * dt; x += vx * dt; y += vy * dt; z += vz * dt;
      if (i % 2) continue;
      const p = proj(x, y, z), a = 0.95 - i * 0.035;
      ctx.fillStyle = `rgba(255,255,255,${a})`;
      ctx.beginPath(); ctx.arc(p.x, p.y, Math.max(2, 0.03 * p.s), 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = `rgba(18,64,92,${a * 0.4})`; ctx.lineWidth = 1; ctx.stroke();
    }
    // power ring around the ball
    const bp = proj(ball.x, ball.y, ball.z), pw = clamp((v.v - 7.4) / 4.2, 0, 1);
    ctx.strokeStyle = pw > 0.97 ? '#e2352b' : '#ffffff'; ctx.lineWidth = 6; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(bp.x, bp.y, R * bp.s + 10, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * pw); ctx.stroke();
  }

  function drawParticles() {
    for (const p of parts) {
      const k = Math.max(0, p.life / p.max);
      if (p.type === 'ring') {
        ctx.strokeStyle = `rgba(255,201,60,${k})`; ctx.lineWidth = 5 * k + 1;
        ctx.beginPath(); ctx.ellipse(p.x, p.y, p.r, p.r * 0.3, 0, 0, Math.PI * 2); ctx.stroke();
      } else {
        ctx.globalAlpha = Math.min(1, k * 1.5);
        ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (0.5 + 0.5 * k), 0, Math.PI * 2); ctx.fill();
        ctx.globalAlpha = 1;
      }
    }
  }

  function drawTexts() {
    for (const t of texts) {
      const age = t.max - t.life;
      const s = t.center ? easeOutBack(Math.min(1, age / 0.18)) : 1;
      const rise = t.center ? 0 : age * 60;
      ctx.save();
      ctx.globalAlpha = Math.min(1, t.life / 0.25);
      ctx.translate(t.x, t.y - rise);
      ctx.scale(s, s);
      if (t.center) ctx.rotate(-0.06);
      ctx.font = `400 ${t.size}px "Lilita One", "Arial Rounded MT Bold", sans-serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = '#12405c';
      ctx.fillText(t.text, 0, t.size * 0.09);
      ctx.lineWidth = t.size * 0.14; ctx.lineJoin = 'round'; ctx.strokeStyle = '#12405c';
      ctx.strokeText(t.text, 0, 0);
      ctx.fillStyle = t.color;
      ctx.fillText(t.text, 0, 0);
      ctx.restore();
    }
  }

  // which layer a ball belongs to: in front of the hoop, or behind/inside it
  const inFront = b => b.z < hoop.z - RR - R * 0.5;

  // ================= main loop =================
  let last = performance.now(), acc = 0;
  function frame(now) {
    const rdt = Math.min(0.05, (now - last) / 1000); last = now;
    const tsec = now / 1000;
    let ts = 1;
    if (slowT > 0) { slowT -= rdt; ts = 0.35; }
    const dt = rdt * ts;

    updateHoop(dt);
    if (retargetT > 0) { retargetT -= dt; if (retargetT <= 0) retargetHoop(); }

    acc += dt;
    while (acc >= SUB) {
      acc -= SUB;
      stepRim(SUB);
      if (ball && ball.phase === 'fly') step(ball, SUB, true);
      for (const b of spent) step(b, SUB, false);
      stepNet(SUB, ball && ball.phase === 'fly' ? ball : null);
    }

    if (ball) {
      ball.spawn += dt;
      if (ball.phase === 'ready') {
        // new ball rises into the hand
        const k = easeOutBack(Math.min(1, ball.spawn / 0.35));
        ball.y = HOME.y - (1 - k) * 0.5 + (mode === 'title' ? Math.sin(tsec * 3) * 0.02 : 0);
      }
      if (ball.phase === 'fly') {
        ball.t += dt;
        ball.trail.push({ x: ball.x, y: ball.y, z: ball.z });
        if (ball.trail.length > 9) ball.trail.shift();
        const ry = rimY();
        if (ball.scored && ball.y < ry - 0.75) { retire(ball); nextBallT = 0.12; }
        else if (!ball.scored && ((ball.vy < 0 && ball.y < ry - 0.4) || ball.z < 0.45 || ball.z > 9 || Math.abs(ball.x) > 4 || ball.t > 5)) {
          const b = ball; retire(b); onMiss(b);
        }
      }
    }
    for (let i = spent.length - 1; i >= 0; i--) {
      const b = spent[i];
      b.life -= dt;
      if (b.trail.length) b.trail.shift();
      if (b.life <= 0 || b.z < 0.45) spent.splice(i, 1);
    }
    if (!ball && mode === 'play' && overT <= 0 && nextBallT > 0) {
      nextBallT -= rdt;
      if (nextBallT <= 0) newBall();
    }
    if (overT > 0) { overT -= rdt; if (overT <= 0) gameOver(); }

    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      p.life -= dt;
      if (p.type === 'ring') p.r += 200 * dt;
      else { p.vy += 900 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= Math.pow(0.4, dt); }
      if (p.life <= 0) parts.splice(i, 1);
    }
    for (let i = texts.length - 1; i >= 0; i--) { texts[i].life -= rdt; if (texts[i].life <= 0) texts.splice(i, 1); }
    for (const c of clouds) { c.x += c.v * rdt; if (c.x > W + 80) c.x = -80; }
    const heatTarget = mode === 'play' && streak >= 3 ? Math.min(1, 0.45 + (streak - 3) * 0.12) : 0;
    heat += (heatTarget - heat) * Math.min(1, rdt * 3);
    raysA += rdt * 0.25;
    shake = Math.max(0, shake - rdt * 28);
    flash = Math.max(0, flash - rdt * 2.2);

    // ---- render (back to front) ----
    ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
    ctx.save();
    if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    drawBackground();
    const all = ball ? [...spent, ball] : [...spent];
    for (const b of all) if (b.phase !== 'ready' && b.phase !== 'aim') drawShadow(b);
    drawStand();
    const sorted = all.slice().sort((a, b) => b.z - a.z);
    for (const b of sorted) if (!inFront(b)) drawBall(b, b.phase === 'spent' ? Math.min(1, b.life * 2) : 1);
    drawRim(false);
    drawNet();
    drawRim(true);
    for (const b of sorted) if (inFront(b)) drawBall(b, b.phase === 'spent' ? Math.min(1, b.life * 2) : 1);
    drawAim(tsec);
    drawParticles();
    drawTexts();
    ctx.restore();
    if (flash > 0) { ctx.fillStyle = `rgba(255,255,255,${flash})`; ctx.fillRect(0, 0, W, H); }

    requestAnimationFrame(frame);
  }

  // ================= boot =================
  resize();
  initNet();
  newBall();
  document.addEventListener('keydown', e => {
    if ((e.key === 'Enter' || e.key === ' ') && mode !== 'play' && document.activeElement?.tagName !== 'BUTTON') {
      e.preventDefault(); startGame();
    }
  });
  requestAnimationFrame(frame);
  if (document.fonts) document.fonts.ready.then(resize);
})();
</script>
</body>
</html>
