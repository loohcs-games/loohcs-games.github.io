<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">

<title>グリーンヒルズ ゴルフ 3D</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; background: #9fd3f0; }

  #swing { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  canvas#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .box { background: rgba(10, 40, 70, .62); border-radius: 12px; padding: 8px 14px; backdrop-filter: blur(4px); }
  #info { position: fixed; left: 12px; top: 12px; font-weight: bold; line-height: 1.5; }
  #info .big { font-size: 20px; } #info .remain { font-size: 26px; color: #ffe46b; } #iExtra { color: #7df0ff; }
  #side { position: fixed; right: 12px; top: 12px; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
  #wind { text-align: center; font-weight: bold; min-width: 96px; }
  #windArrow { font-size: 34px; line-height: 1; display: inline-block; color: #7df0ff; }
  #windLabel { font-size: 12px; opacity: .9; }
  #mini { border-radius: 10px; border: 3px solid rgba(255,255,255,.8); width: 110px; height: 220px; }
  #msg { position: fixed; left: 0; right: 0; top: 24%; text-align: center; font-size: clamp(24px, 5vw, 46px); font-weight: 900;
         text-shadow: 0 3px 0 #0a3a5c, 0 0 14px rgba(0,0,0,.5); pointer-events: none; opacity: 0; transition: opacity .25s; }
  #ctrl { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); width: min(580px, 94vw); display: flex; flex-direction: column; gap: 8px; }
  #clubRow, #btnRow { display: flex; align-items: center; justify-content: center; gap: 8px; }
  #clubName { min-width: 190px; text-align: center; font-weight: bold; font-size: 17px; }
  button { font: inherit; font-weight: bold; color: #fff; background: rgba(10, 40, 70, .75); border: 2px solid rgba(255,255,255,.7);
           border-radius: 10px; padding: 6px 14px; cursor: pointer; touch-action: none; }
  button:active { background: #1c7fc4; }
  #shot { background: #e8452c; font-size: 20px; padding: 8px 40px; border-color: #fff; }
  #meterWrap { position: relative; padding-bottom: 16px; }
  #meter { position: relative; height: 26px; border-radius: 13px; background: rgba(10, 40, 70, .8); border: 2px solid #fff; overflow: hidden; }
  #mFill { position: absolute; left: 12%; top: 0; bottom: 0; width: 0; background: linear-gradient(90deg, #49d17a, #ffe14a 60%, #ff5a3c); }
  #mZone { position: absolute; left: 9.5%; width: 5%; top: 0; bottom: 0; background: #fff; }
  #mTick { position: absolute; top: 0; bottom: 0; width: 4px; margin-left: -2px; background: #7df0ff; box-shadow: 0 0 8px #7df0ff; }
  #mCur { position: absolute; top: -2px; bottom: -2px; width: 5px; margin-left: -2px; background: #ff2d2d; border: 1px solid #fff; left: 12%; }
  #mScale span { position: absolute; bottom: 0; font-size: 11px; font-weight: bold; transform: translateX(-50%); text-shadow: 0 1px 2px #000; white-space: nowrap; }
  #mScale .cup { color: #7df0ff; }
  #help { text-align: center; font-size: 14px; font-weight: bold; text-shadow: 0 1px 3px #000, 0 0 6px #000; min-height: 1.4em; }
  #overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(8, 30, 50, .5); z-index: 5; }
  #overlay.hidden { display: none; }
  #panel { background: #fff; color: #17384f; border-radius: 20px; padding: 24px 34px; text-align: center; max-width: 92vw; max-height: 92vh; overflow: auto;
           box-shadow: 0 12px 40px rgba(0,0,0,.4); }
  #panel p.back { margin: 14px 0 0; font-size: 14px; }
  #panel .back a { color: #0a7fd0; font-weight: bold; }
  #panel h2 { margin: 0 0 8px; font-size: clamp(24px, 5vw, 40px); color: #0a7fd0; }
  #panel p { line-height: 1.8; margin: 8px 0 16px; font-size: 15px; }
  #panel button { background: #0a9be0; border: none; font-size: 20px; padding: 10px 34px; }
  table { border-collapse: collapse; margin: 8px auto 12px; } td, th { border: 2px solid #d5e4ee; padding: 4px 10px; } th { background: #eaf4fa; }
  .good { color: #1d8f3c; font-weight: bold; } .bad { color: #c0392b; }
  button, #clubName { white-space: nowrap; }
  @media (max-width: 600px) {
    #info { font-size: 12px; padding: 6px 10px; } #info .big { font-size: 14px; } #info .remain { font-size: 18px; }
    #mini { width: 70px; height: 140px; } #windArrow { font-size: 24px; } #wind { font-size: 12px; min-width: 64px; }
    #clubName { min-width: 0; font-size: 13px; } button { padding: 6px 9px; font-size: 13px; } #shot { font-size: 17px; padding: 8px 26px; }
    #help { font-size: 11px; } #panel { padding: 16px 18px; } #panel p { font-size: 13px; }
  }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="swing"></canvas>
<div id="info" class="box">
  <div class="big"><span id="iHole"></span></div>

</div>

</div>
<div id="msg"></div>
<div id="ctrl">
  <div id="help"></div>
  <div id="clubRow"><button id="clubUp">▲ 長い</button><div id="clubName" class="box"></div><button id="clubDown">▼ 短い</button></div>
  <div id="meterWrap">
    <div id="meter"><div id="mFill"></div><div id="mZone"></div><div id="mTick"></div><div id="mCur"></div></div>

</div>
<div id="overlay"><div id="panel"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const G = 9.81, KD = 0.0045, KL = 0.0018, YD = 1.0936, RK = 0.05;
const AREA = { x0: -150, x1: 150, z0: -560, z1: 40 };
const OB = 0, ROUGH = 1, FAIRWAY = 2, GREEN = 3, BUNKER = 4, TEE = 5, WATER = 6;
const SURF_NAME = ['OB', 'ラフ', 'フェアウェイ', 'グリーン', 'バンカー', 'ティー', 'ラフ'];
// e: bounce, tf: speed kept along the ground on a bounce, mu: rolling friction
const PHYS = [
  { e: .12, tf: .3, mu: .9 }, { e: .15, tf: .35, mu: .7 }, { e: .32, tf: .65, mu: .27 }, { e: .28, tf: .6, mu: .065 },

];
const THEMES = {
  day:    { sky: ['#2a78d2', '#7fbdf0', '#cfeafa'], fog: 0xc6e3f3, sun: 0xfff0d2, sunInt: 1.5, hemi: [0xd6eaff, 0x5a8a45, 0.75], dir: [0.45, 0.75, 0.35],
            hue: [0.26, 0.36], sat: 0.55, grass: [1, 1, 1], water: 0x2c80c8, mount: 0x93b8d4, cloud: 0xffffff },
  autumn: { sky: ['#3f7fc4', '#a9cbe6', '#efe6cf'], fog: 0xe3ddc8, sun: 0xffe0a8, sunInt: 1.45, hemi: [0xf0e6d0, 0x6e6a38, 0.7], dir: [-0.5, 0.6, 0.4],

};
// line: tee -> pin centerline [x, z] in meters / bunkers & ponds: [x, z, rx, rz]

const HOLES = [
  { name: 'シーサイド', theme: 'day', par: 4, line: [[0, 0], [-5, -170], [25, -335]], greenR: 15, fairStart: 35, seed: 1.3, sea: true,
    bunkers: [[-32, -200, 9, 7], [0, -356, 9, 6]], ponds: [[250, -260, 150, 420]] },
  { name: 'アイランドグリーン', theme: 'day', par: 3, line: [[0, 0], [0, -130]], greenR: 14, fairStart: 999, seed: 4.1, island: true,
    bunkers: [], ponds: [[0, -125, 48, 44]] },
  { name: 'もみじ谷', theme: 'autumn', par: 5, line: [[0, 0], [20, -180], [-30, -340], [0, -490]], greenR: 15, fairStart: 35, seed: 7.7,
    bunkers: [[-10, -190, 10, 8], [48, -175, 8, 10], [-28, -492, 7, 7], [24, -478, 7, 8]], ponds: [[45, -300, 18, 24]] },
  { name: '池ごえの近道', theme: 'autumn', par: 4, line: [[0, 0], [10, -170], [-70, -270]], greenR: 14, fairStart: 35, seed: 2.9,
    bunkers: [[30, -185, 9, 10], [-92, -262, 7, 8], [-60, -292, 8, 6]], ponds: [[-40, -175, 24, 30]] },
  { name: '夕暮れの丘', theme: 'sunset', par: 3, line: [[0, 0], [12, -185]], greenR: 15, fairStart: 150, seed: 9.2,
    bunkers: [[-12, -180, 7, 10], [36, -182, 7, 9], [12, -160, 9, 5]], ponds: [[-45, -120, 18, 22]] },
  { name: 'サンセットビーチ', theme: 'sunset', par: 5, line: [[0, 0], [15, -200], [-10, -380], [20, -500]], greenR: 15, fairStart: 35, seed: 5.5, sea: true,
    bunkers: [[45, -215, 10, 9], [-35, -370, 9, 11], [45, -492, 7, 8], [0, -522, 8, 6]], ponds: [[-250, -260, 150, 420], [55, -400, 16, 20]] },
];
const CLUBS = [
  { n: '1W', name: 'ドライバー', carry: 215, loft: 12 }, { n: '3W', name: '3番ウッド', carry: 190, loft: 14 },
  { n: '5I', name: '5番アイアン', carry: 160, loft: 18 }, { n: '7I', name: '7番アイアン', carry: 135, loft: 22 },
  { n: '9I', name: '9番アイアン', carry: 110, loft: 27 }, { n: 'PW', name: 'ピッチング', carry: 85, loft: 33 },
  { n: 'SW', name: 'サンドウェッジ', carry: 55, loft: 42 }, { n: 'PT', name: 'パター', putter: true },
];
const PUTTER = CLUBS.length - 1;
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const ell = (p, x, z) => Math.hypot((x - p[0]) / p[2], (z - p[1]) / p[3]);

// ---------- course model ----------
let hole = null, pin = [0, 0], lastS = 0, lastDl = 0;
function distLine(x, z) {
  let best = 1e9;
  for (const s of hole.segs) {
    const t = clamp(((x - s.ax) * s.dx + (z - s.az) * s.dz) / (s.len * s.len), 0, 1);
    const d = Math.hypot(x - s.ax - s.dx * t, z - s.az - s.dz * t);
    if (d < best) { best = d; lastS = s.s0 + t * s.len; }
  }
  return best;
}
function pointAt(s) {
  s = clamp(s, 0, hole.len);
  for (const g of hole.segs) if (s <= g.s0 + g.len) { const t = (s - g.s0) / g.len; return [g.ax + g.dx * t, g.az + g.dz * t]; }
  return pin;
}
function baseH(x, z) {
  const s = hole.seed;
  return 1.6 * Math.sin(x * 0.021 + s) * Math.cos(z * 0.017 + s * 1.7) + 0.5 * Math.sin(x * 0.05 + z * 0.043 + s * 2.3) + 2.2 * Math.sin(z * 0.008 + s * 0.6);
}
function H(x, z) {
  let h = baseH(x, z);
  const dl = distLine(x, z);
  if (dl > 40) { const t = Math.min((dl - 40) / 45, 1.6); h += t * t * 7; } // wooded hills on both sides
  const dx = x - pin[0], dz = z - pin[1], dp = Math.hypot(dx, dz), R = hole.greenR;
  if (dp < R + 18) {
    const hg = hole.pinH + hole.tx * dx + hole.tz * dz + 0.1 * Math.sin(dx * 0.2 + hole.seed) * Math.cos(dz * 0.17);
    h = lerp(h, hg, smooth(R + 18, R + 2, dp));
  }
  const dt = Math.hypot(x, z);
  if (dt < 16) h = lerp(h, hole.teeH, smooth(16, 7, dt));
  for (const b of hole.bunkers) { const d = ell(b, x, z); if (d < 1.3) h -= 0.5 * smooth(1.3, 0.6, d); }
  for (const p of hole.ponds) {
    const d = ell(p, x, z);
    if (d < 1.35) { let w = smooth(1.35, 0.95, d); if (p.moat) w *= smooth(R * 1.1 + 4, R * 1.1 + 10, dp); h = lerp(h, p.level - 0.9, w); }
  }

}
function grad(x, z) { const e = 0.3; return [(H(x + e, z) - H(x - e, z)) / (2 * e), (H(x, z + e) - H(x, z - e)) / (2 * e)]; }
function surf(x, z) {
  const dp = Math.hypot(x - pin[0], z - pin[1]);
  const gr = hole.greenR * (1 + 0.1 * Math.sin(3 * Math.atan2(z - pin[1], x - pin[0]) + hole.seed));
  lastDl = 0;
  if (dp < gr) return GREEN;
  if (dp < gr + 3) return FAIRWAY;
  for (const p of hole.ponds) { const d = ell(p, x, z); if (d < 1.2) return WATER; if (p.sea && d < 1.42) return BUNKER; }
  for (const b of hole.bunkers) if (ell(b, x, z) < 1) return BUNKER;
  if (Math.abs(x) < 5 && z > -7 && z < 5) return TEE;
  const dl = lastDl = distLine(x, z);
  if (dl < 17 + 4 * Math.sin(z * 0.035 + hole.seed) && Math.hypot(x, z) > hole.fairStart) return FAIRWAY;
  return dl < 62 ? ROUGH : OB;
}
function inWater(x, z, h) { for (const p of hole.ponds) if (ell(p, x, z) < 1.35 && h < p.waterY) return true; return false; }

// ---------- three.js scene ----------
const renderer = new THREE.WebGLRenderer({ canvas: $('gl'), antialias: true });
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xc6e3f3, 220, 1000);
const camera = new THREE.PerspectiveCamera(52, 1, 0.1, 6000);
const hemi = new THREE.HemisphereLight(0xffffff, 0x447733, 0.7); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, 1.4); scene.add(sun, sun.target);
sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); sun.shadow.bias = -0.0003; sun.shadow.normalBias = 0.03;
Object.assign(sun.shadow.camera, { left: -95, right: 95, top: 95, bottom: -95, near: 1, far: 700 }); sun.shadow.camera.updateProjectionMatrix();
const sunDir = new THREE.Vector3(0.4, 0.8, 0.3);

const noiseCanvas = (size, fn) => { const c = document.createElement('canvas'); c.width = c.height = size; const g = c.getContext('2d'), im = g.createImageData(size, size);
  for (let i = 0; i < size * size; i++) { const v = fn(i % size, (i / size) | 0); im.data[i * 4] = im.data[i * 4 + 1] = im.data[i * 4 + 2] = v; im.data[i * 4 + 3] = 255; } g.putImageData(im, 0, 0); return c; };
const repeatTex = c => { const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; return t; };
// close-up grass grain (multiplied into ambient light through the aoMap slot)
const detailTex = (() => { const c = noiseCanvas(256, () => 150 + Math.random() * 105), g = c.getContext('2d');
  for (let i = 0; i < 2600; i++) { g.strokeStyle = Math.random() < 0.5 ? 'rgba(255,255,255,.35)' : 'rgba(60,60,60,.3)'; g.beginPath(); const x = Math.random() * 256, y = Math.random() * 256; g.moveTo(x, y); g.lineTo(x + (Math.random() - 0.5) * 3, y - 3 - Math.random() * 5); g.stroke(); }
  const t = repeatTex(c); t.anisotropy = 8; return t; })();
const waveTex = repeatTex(noiseCanvas(128, (x, y) => 128 + 60 * Math.sin(x * 0.2 + Math.sin(y * 0.15) * 2) + 50 * Math.sin(y * 0.29 + x * 0.1) + Math.random() * 12));

const skyCanvas = document.createElement('canvas'); skyCanvas.width = 8; skyCanvas.height = 512;
const skyTex = new THREE.CanvasTexture(skyCanvas);
const skyDome = new THREE.Mesh(new THREE.SphereGeometry(4500, 24, 16), new THREE.MeshBasicMaterial({ map: skyTex, side: THREE.BackSide, fog: false, toneMapped: false, depthWrite: false }));
scene.add(skyDome);
const glowTex = (() => { const c = document.createElement('canvas'); c.width = c.height = 128; const g = c.getContext('2d'), r = g.createRadialGradient(64, 64, 2, 64, 64, 64);
  r.addColorStop(0, 'rgba(255,255,255,1)'); r.addColorStop(0.15, 'rgba(255,255,255,.8)'); r.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = r; g.fillRect(0, 0, 128, 128); return new THREE.CanvasTexture(c); })();
const sunSprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, fog: false, depthWrite: false, toneMapped: false, transparent: true }));
sunSprite.scale.set(900, 900, 1); scene.add(sunSprite);
const cloudMat = new THREE.SpriteMaterial({ map: glowTex, fog: false, depthWrite: false, toneMapped: false, opacity: 0.85 });
for (let i = 0; i < 30; i++) {
  const a = i * 2.4, r = 900 + (i * 137) % 900, bx = Math.cos(a) * r, bz = Math.sin(a) * r - 250, by = 260 + (i * 53) % 220;
  for (let k = 0; k < 5; k++) { const s = new THREE.Sprite(cloudMat); s.position.set(bx + k * 70 - 140, by + ((k * 37) % 30), bz + ((k * 71) % 60)); s.scale.set(240 + ((k * 61) % 110), 95, 1); scene.add(s); }
}
const mountMat = new THREE.MeshBasicMaterial({ color: 0x93b8d4, fog: false, toneMapped: false, side: THREE.DoubleSide });
{
  const N = 160, v = [], idx = [];
  for (let i = 0; i <= N; i++) { const a = i / N * Math.PI * 2, h = 90 + 150 * Math.abs(Math.sin(i * 0.37) + 0.6 * Math.sin(i * 0.91 + 1)) + 40 * Math.sin(i * 2.3);
    v.push(Math.cos(a) * 2400, -60, Math.sin(a) * 2400, Math.cos(a) * 2400, h, Math.sin(a) * 2400); if (i < N) idx.push(i * 2, i * 2 + 1, i * 2 + 2, i * 2 + 1, i * 2 + 3, i * 2 + 2); }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(v, 3)); g.setIndex(idx);
  const m = new THREE.Mesh(g, mountMat); m.position.z = -260; scene.add(m);
  const ground = new THREE.Mesh(new THREE.CircleGeometry(5000, 32).rotateX(-Math.PI / 2), new THREE.MeshLambertMaterial({ color: 0x2f6b34 }));
  ground.position.set(0, -6, -260); scene.add(ground);
}
function applyTheme(t) {
  const g = skyCanvas.getContext('2d'), gr = g.createLinearGradient(0, 0, 0, 512);
  gr.addColorStop(0, t.sky[0]); gr.addColorStop(0.36, t.sky[1]); gr.addColorStop(0.5, t.sky[2]); gr.addColorStop(1, t.sky[2]);
  g.fillStyle = gr; g.fillRect(0, 0, 8, 512); skyTex.needsUpdate = true;
  scene.fog.color.setHex(t.fog); sun.color.setHex(t.sun); sun.intensity = t.sunInt * 0.62;
  hemi.color.setHex(t.hemi[0]); hemi.groundColor.setHex(t.hemi[1]); hemi.intensity = t.hemi[2] * 0.72;
  sunDir.set(...t.dir).normalize(); sunSprite.material.color.setHex(t.sun);
  mountMat.color.setHex(t.mount); cloudMat.color.setHex(t.cloud);
}

let course = null, miniBase = null, flagGroup = null, flagCloth = null, greenGrid = null, waters = [];
function buildHole(i) {
  hole = HOLES[i]; const L = hole.line, theme = THEMES[hole.theme]; pin = L[L.length - 1];
  applyTheme(theme);
  hole.segs = []; let acc = 0;
  for (let k = 0; k < L.length - 1; k++) {
    const dx = L[k + 1][0] - L[k][0], dz = L[k + 1][1] - L[k][1], len = Math.hypot(dx, dz);
    hole.segs.push({ ax: L[k][0], az: L[k][1], dx, dz, len, s0: acc }); acc += len;
  }
  hole.len = acc; hole.pinH = baseH(pin[0], pin[1]); hole.teeH = baseH(0, 0);
  hole.tx = 0.018 * Math.sin(hole.seed * 3); hole.tz = 0.018 * Math.cos(hole.seed * 5);
  let low = 1e9; for (let s = 0; s <= acc; s += 20) { const p = pointAt(s); low = Math.min(low, baseH(p[0], p[1])); }
  hole.ponds.forEach((p, k) => {
    p.sea = !!hole.sea && k === 0; p.moat = !!hole.island && k === 0;
    p.level = p.sea ? low - 0.6 : p.moat ? hole.pinH - 0.2 : baseH(p[0], p[1]); p.waterY = p.level - 0.3;
  });

  if (course) { scene.remove(course); course.traverse(o => { if (o.geometry) o.geometry.dispose(); if (o.material) { if (o.material.map) o.material.map.dispose(); o.material.dispose(); } }); }
  course = new THREE.Group(); scene.add(course); waters = [];

  m.fillStyle = '#fff'; m.strokeStyle = '#000'; m.lineWidth = 1; m.beginPath(); m.arc(mx(ball.p.x), mz(ball.p.z), 3, 0, 7); m.fill(); m.stroke();
}

// ---------- sound ----------
function noiseBuf(dur, fade) { const n = audio.sampleRate * dur, buf = audio.createBuffer(1, n, audio.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (fade ? 1 - i / n : 1); return buf; }
function initAudio() {
  if (!audio) { try {
    audio = new (window.AudioContext || window.webkitAudioContext)();
    const s = audio.createBufferSource(), f = audio.createBiquadFilter(); windGain = audio.createGain();
    s.buffer = noiseBuf(3, false); s.loop = true; f.type = 'lowpass'; f.frequency.value = 420; windGain.gain.value = 0.01;
    s.connect(f).connect(windGain).connect(audio.destination); s.start();
  } catch (e) {} }
  if (audio && audio.state === 'suspended') audio.resume();
}
function tone(f, dur, type = 'sine', vol = 0.15, to = null, delay = 0) {
  if (!audio) return; const t = audio.currentTime + delay, o = audio.createOscillator(), g = audio.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur); o.connect(g).connect(audio.destination); o.start(t); o.stop(t + dur);
}
function noise(dur, vol, freq, q = 1) {
  if (!audio) return; const s = audio.createBufferSource(), f = audio.createBiquadFilter(), g = audio.createGain();
  s.buffer = noiseBuf(dur, true); f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q; g.gain.value = vol; s.connect(f).connect(g).connect(audio.destination); s.start();
}
const sfx = {
  hit: () => { noise(0.25, 0.5, 1800, 0.6); tone(900, 0.06, 'square', 0.2, 300); },
  putt: () => tone(700, 0.05, 'triangle', 0.2, 400),
  land: () => noise(0.12, 0.25, 220, 1),
  splash: () => noise(0.7, 0.5, 900, 0.5),
  cup: () => { tone(500, 0.08, 'triangle', 0.25, 250); tone(380, 0.1, 'triangle', 0.2, 200, 0.09); [659, 784, 1047].forEach((f, i) => tone(f, 0.25, 'triangle', 0.15, null, 0.3 + i * 0.1)); },
  cheer: () => { for (let i = 0; i < 5; i++) setTimeout(() => noise(0.5, 0.12, 2500 + Math.random() * 1500, 0.4), i * 120); },
};

// ---------- input ----------
addEventListener('keydown', e => {
  keys[e.key] = true;
  if (e.key === ' ' || e.key.startsWith('Arrow')) e.preventDefault();
  if (e.repeat || !$('overlay').classList.contains('hidden')) return;
  if (e.key === ' ') action(); else if (e.key === 'ArrowUp') changeClub(-1); else if (e.key === 'ArrowDown') changeClub(1);
});
addEventListener('keyup', e => { keys[e.key] = false; });
const press = (id, down, up) => { const el = $(id); el.addEventListener('pointerdown', e => { e.preventDefault(); down(); }); if (up) for (const ev of ['pointerup', 'pointerleave', 'pointercancel']) el.addEventListener(ev, up); };
press('shot', action); press('clubUp', () => changeClub(-1)); press('clubDown', () => changeClub(1));
press('aimL', () => held.l = true, () => held.l = false); press('aimR', () => held.r = true, () => held.r = false);
// drag swing: pull down (take-back = max power), then flick up through the starting line to hit
const sw = { on: false, x0: 0, y0: 0, bx: 0, by: 0, bt: 0, back: 0, cur: 0, pts: [] };
const backPx = () => clamp(innerHeight * 0.32, 120, 300);
$('gl').addEventListener('pointerdown', e => {
  initAudio();
  if (state !== 'aim' || !$('overlay').classList.contains('hidden')) return;
  try { $('gl').setPointerCapture(e.pointerId); } catch (err) {}
  const now = performance.now();
  Object.assign(sw, { on: true, id: e.pointerId, x0: e.clientX, y0: e.clientY, bx: e.clientX, by: e.clientY, bt: now, back: 0, cur: 0, pts: [{ x: e.clientX, y: e.clientY, t: now }] });
  state = 'drag';
});
$('gl').addEventListener('pointermove', e => {
  if (!sw.on || state !== 'drag' || e.pointerId !== sw.id) return;
  const now = performance.now(), x = e.clientX, y = e.clientY;
  sw.pts.push({ x, y, t: now }); while (sw.pts.length > 2 && now - sw.pts[0].t > 500) sw.pts.shift();
  if (y > sw.by) { sw.by = y; sw.bx = x; sw.bt = now; }
  sw.back = clamp((sw.by - sw.y0) / backPx(), 0, 1); sw.cur = (y - sw.y0) / backPx();
  if (y <= sw.y0 && sw.back > 0.03) swingImpact(x, y, now);
});
function endDrag(e) {
  if (!sw.on || e.pointerId !== sw.id) return; sw.on = false;
  if (state === 'drag') { state = 'aim'; swing = 0; if (sw.back > 0.03) say('引いたら、上に払って打とう!', 1.6); }
}
$('gl').addEventListener('pointerup', endDrag); $('gl').addEventListener('pointercancel', endDrag);
function swingImpact(x, y, now) {
  sw.on = false;
  if (CLUBS[club].putter) { power = Math.max(sw.back, 0.02); fire(0); return; }
  // speed of the up-stroke over roughly the last 0.1s (ignoring time spent before the bottom of the take-back)
  let p = null;
  for (const q of sw.pts) if (q.t >= sw.bt && now - q.t <= 110) { p = q; break; }
  if (!p) p = sw.pts[Math.max(sw.pts.length - 2, 0)];
  const speed = (p.y - y) / Math.max((now - p.t) / 1000, 0.008), sp = clamp(speed / (innerHeight * 1.9), 0, 1);
  const ang = Math.atan2(x - sw.bx, sw.by - y); // + : swiped toward the right
  const err = Math.sign(ang) * clamp((Math.abs(ang) - 0.06) / 0.4, 0, 1);
  power = Math.max(sw.back * (0.25 + 0.75 * sp), 0.03);
  const pct = Math.round(power * 100);
  fire(err, false, sp < 0.75 ? `もっと速く振ろう!(パワー ${pct}%)` : Math.abs(err) < 0.2 ? `ナイスショット!(パワー ${pct}%)` : err > 0 ? 'スライス…(右に払った)' : 'フック…(左に払った)');
}
function drawSwing(tick, c) {
  const cv = $('swing'), g = cv.getContext('2d');
  if (cv.width !== innerWidth || cv.height !== innerHeight) { cv.width = innerWidth; cv.height = innerHeight; }
  g.clearRect(0, 0, cv.width, cv.height);
  if (state !== 'drag') return;
  const L = backPx(), gx = sw.x0 + 80 < innerWidth - 30 ? sw.x0 + 80 : sw.x0 - 80;
  g.font = 'bold 13px sans-serif'; g.textAlign = 'center'; g.lineCap = 'round';
  g.setLineDash([10, 7]); g.strokeStyle = 'rgba(255,255,255,.95)'; g.lineWidth = 3;
  g.beginPath(); g.moveTo(sw.x0 - 130, sw.y0); g.lineTo(sw.x0 + 130, sw.y0); g.stroke(); g.setLineDash([]);
  g.fillStyle = '#fff'; g.fillText('↑ ここを通過でインパクト', sw.x0, sw.y0 - 10);
  g.fillStyle = 'rgba(10,40,70,.65)'; g.fillRect(gx - 9, sw.y0, 18, L);
  const gr = g.createLinearGradient(0, sw.y0, 0, sw.y0 + L); gr.addColorStop(0, '#49d17a'); gr.addColorStop(0.6, '#ffe14a'); gr.addColorStop(1, '#ff5a3c');
  g.fillStyle = gr; g.fillRect(gx - 9, sw.y0, 18, L * sw.back);
  g.strokeStyle = '#fff'; g.lineWidth = 2; g.strokeRect(gx - 9, sw.y0, 18, L);
  if (tick >= 0) {
    const ty = sw.y0 + L * tick; g.strokeStyle = '#7df0ff'; g.lineWidth = 4;
    g.beginPath(); g.moveTo(gx - 16, ty); g.lineTo(gx + 16, ty); g.stroke();
    g.fillStyle = '#7df0ff'; g.textAlign = 'left'; g.fillText(c.putter ? '◀ カップ' : '◀ ピン', gx + 20, ty + 5);
  }
  g.strokeStyle = 'rgba(255,255,255,.85)'; g.lineWidth = 5; g.beginPath();
  sw.pts.forEach((q, i) => i ? g.lineTo(q.x, q.y) : g.moveTo(q.x, q.y)); g.stroke();
}
function resize() { renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2)); renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();

// ---------- boot ----------
let prev = performance.now();
function loop(now) { const dt = Math.min((now - prev) / 1000, 0.05); prev = now; update(dt); renderer.render(scene, camera); requestAnimationFrame(loop); }
buildHole(0); ball.p.y = H(0, 0); setupShot(); state = 'title'; camPos.set(-6, hole.teeH + 5, 12); requestAnimationFrame(loop);
showPanel(`<h2>⛳ グリーンヒルズ ゴルフ 3D</h2>
  <p>地形と風をよんで、少ない打数でカップインをめざそう!(全6ホール)<br>
  <b>ショット</b>:画面を<b>下に引いて</b>(引く量=最大パワー)、<b>上にシュッと払う</b>!<br>
  速く払うほど強い / まっすぐ払うとストレート / 右に払うとスライス・左に払うとフック<br>
  <b>パット</b>:水色の線が転がる道すじ。←→で線の先をカップに合わせ、「◀カップ」まで引いて上に戻す。<br>
  <b>←→</b> 方向 / <b>↑↓</b> クラブ変更(スペース3回押しの操作も使えます)<br>
  風は右上の矢印の向きに吹いていて、高く上がるほど強く流されます。</p>`, 'ティーオフ ▶', () => startHole(0));
</script>
