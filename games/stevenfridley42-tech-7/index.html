// type M-A-C-H on the title screen, or tap the logo 5 times quickly
function useSecretCommand(active, unlock){
  const buf = useRef(''), taps = useRef([]);
  useEffect(() => {
    if (!active) return undefined;
    const onKey = (e) => {
      if (e.target && e.target.tagName === 'INPUT') return;
      const ch = /^Key[A-Z]$/.test(e.code) ? e.code.slice(3) : /^(Digit|Numpad)[0-9]$/.test(e.code) ? e.code.slice(-1) : '';
      if (!ch) return;
      buf.current = (buf.current + ch).slice(-12);
      if (buf.current.slice(-4) === 'MACH') { buf.current = ''; unlock('mach'); }
      else if (isHyperCode(buf.current.slice(-HYPER_LEN))) { buf.current = ''; unlock('hyper'); }
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [active, unlock]);
  return useCallback(() => {
    const now = performance.now();
    taps.current = taps.current.filter((t) => now - t < 2500).concat(now);
    if (taps.current.length >= 5) { taps.current = []; unlock('mach'); }
  }, [unlock]);
}

function App(){
  const mountRef = useRef(null), gameRef = useRef(null), toastId = useRef(0);
  const [hud, setHud] = useState(null);
  const [screen, setScreen] = useState('title');
  const [result, setResult] = useState(null);
  const [toasts, setToasts] = useState([]);
  const [best, setBest] = useState(loadBest);
  const [isTouch] = useState(() => (window.matchMedia && matchMedia('(pointer: coarse)').matches) || 'ontouchstart' in window);
  const [error, setError] = useState('');
  const [save, setSaveState] = useState(loadSave);
  const saveRef = useRef(save);
  useEffect(() => { storeSave(save); }, [save]);
  // every save change goes through here so rapid game events never read a stale copy
  const setSave = useCallback((fn) => {
    const next = typeof fn === 'function' ? fn(saveRef.current) : fn;
    if (next === saveRef.current) return;
    saveRef.current = next; setSaveState(next);
  }, []);
  const addCoins = useCallback((n) => setSave((s) => Object.assign({}, s, { wallet: s.wallet + n })), [setSave]);

  const pushToast = useCallback((text, kind) => {
    const id = ++toastId.current;
    setToasts((t) => t.slice(-2).concat({ id, text, kind }));
    setTimeout(() => setToasts((t) => t.filter((x) => x.id !== id)), 1800);
  }, []);
  const onStat = useCallback((stat) => {
    const cur = saveRef.current;
    const r = stepMissions(cur.missions, stat);
    if (!r.done.length && r.ms.slots.every((s, k) => s.p === cur.missions.slots[k].p)) return;
    const done = (cur.done || 0) + r.done.length;
    const before = rankOf(cur.done || 0), after = rankOf(done);
    const unlockNow = after >= SECRET_RANK && !cur.secret;
    const promoBonus = after > before ? 100 * after : 0;
    setSave(Object.assign({}, cur, { missions: r.ms, wallet: cur.wallet + r.reward + promoBonus, done, secret: cur.secret || unlockNow }));
    if (unlockNow) setTimeout(() => pushToast('シークレット機 MACH-X が解放された！', 'rank'), 2400 + r.done.length * 700);
    r.done.forEach((m, k) => setTimeout(() => pushToast('ノルマ達成！ +' + m.reward, 'good'), 600 + k * 700));
    if (after > before) setTimeout(() => pushToast('昇進！ ' + RANKS[after].name + '（+' + promoBonus + '）', 'rank'), 900 + r.done.length * 700);
  }, [setSave, pushToast]);

  useEffect(() => {
    let g = null;
    try {
      g = new Game(mountRef.current, {
        onHud: setHud,
        onEvent: pushToast,
        onCoins: addCoins,
        onStat,
        onGameOver: (r) => { setResult(r); setBest(r.best); setScreen('over'); },
        skin: resolveSkin(saveRef.current.equip),
      });
      gameRef.current = g;
    } catch (err) {
      setError('3D表示（WebGL）を開始できませんでした。別のブラウザで開いてみてください。');
    }
    return () => { if (g) g.dispose(); gameRef.current = null; };
  }, [pushToast, addCoins, onStat]);

  const openHangar = useCallback(() => {
    const g = gameRef.current;
    if (g) {
      if (g.state !== 'idle') g.toIdle();
      const narrow = window.innerWidth <= 680;
      g.setShowcase(true, narrow ? { x: 0, y: 0.27 } : { x: 0.17, y: 0 });
    }
    setToasts([]); setResult(null); setScreen('hangar');
  }, []);
  const closeHangar = useCallback(() => { if (gameRef.current) gameRef.current.setShowcase(false); setScreen('title'); }, []);
  const unlockSecret = useCallback((which) => {
    if (which === 'hyper') {
      if (saveRef.current.hyper) { pushToast('X-10000 はもう持っています', 'info'); return; }
      setSave((s) => Object.assign({}, s, { hyper: true }));
      pushToast('極秘機 X-10000 を入手！ ハンガーを見てみよう', 'rank');
      return;
    }
    if (saveRef.current.secret) { pushToast('MACH-X はもう解放されています', 'info'); return; }
    setSave((s) => Object.assign({}, s, { secret: true }));
    pushToast('シークレット機 MACH-X が解放された！', 'rank');
  }, [setSave, pushToast]);
  const [codeOpen, setCodeOpen] = useState(false);
  const submitCode = useCallback((txt) => {
    if (isHyperCode(txt)) { setCodeOpen(false); unlockSecret('hyper'); return true; }
    if (normCode(txt) === 'MACH') { setCodeOpen(false); unlockSecret('mach'); return true; }
    return false;
  }, [unlockSecret]);
  const onLogoTap = useSecretCommand(screen === 'title', unlockSecret);
  const start = useCallback(() => { onStat({ kind: 'run_reset' }); if (gameRef.current) gameRef.current.start(); setScreen('play'); }, [onStat]);
  const retry = useCallback(() => { onStat({ kind: 'run_reset' }); setToasts([]); setResult(null); if (gameRef.current) gameRef.current.restart(); setScreen('play'); }, [onStat]);

  useEffect(() => {
    const onKey = (e) => {
      if (e.repeat || (e.code !== 'Enter' && e.code !== 'Space')) return;
      if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON')) return;
      if (screen === 'title') { e.preventDefault(); start(); }
      else if (screen === 'over') { e.preventDefault(); retry(); }
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [screen, start, retry]);

  return h('div', { className: 'app' },
    h('div', { ref: mountRef, className: 'stage' }),
    hud && screen === 'play' && h(Hud, { hud, game: gameRef, isTouch, onRetry: retry, missions: save.missions, done: save.done || 0 }),
    (screen === 'play' || screen === 'title') && h('div', { className: 'toasts', 'aria-live': 'polite' }, toasts.map((t) => h('div', { key: t.id, className: 'toast ' + (t.kind || '') }, t.text))),
    screen === 'title' && h(Title, { best, wallet: save.wallet, isTouch, onStart: start, onHangar: openHangar, missions: save.missions, done: save.done || 0, onLogoTap, onLogoHold: () => setCodeOpen(true) }),
    screen === 'title' && codeOpen && h(CodeBox, { onSubmit: submitCode, onClose: () => setCodeOpen(false) }),
    screen === 'over' && result && h(GameOver, { result, wallet: save.wallet, onRetry: retry, onHangar: openHangar, missions: save.missions, done: save.done || 0 }),
    screen === 'hangar' && h(Hangar, { save, setSave, game: gameRef, onClose: closeHangar }),
    error && h('div', { className: 'overlay' }, h('div', { className: 'card' }, h('p', { className: 'lead' }, error)))
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App));
})();
</script>
</body>
</html>
