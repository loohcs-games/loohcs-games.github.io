<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<title>もちもちアーチェリー</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#5db8ff;touch-action:none;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
a.back{position:fixed;left:8px;bottom:8px;z-index:5;padding:6px 10px;border-radius:8px;background:rgba(20,30,50,.6);color:#fff;font:13px sans-serif;text-decoration:none}
canvas{display:block;cursor:crosshair;touch-action:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<a class="back" href="../../">← ゲーム一覧にもどる</a>
<script>
(function(){
'use strict';
// ====== 基本設定 ======
var cv=document.getElementById('c'), ctx=cv.getContext('2d');
var W=0,H=0,DPR=1,u=1;
var FONT='"Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif';
var ROUNDS=[{dist:25,zmax:2.2},{dist:40,zmax:2.9}];   // 1ラウンド目は25m、2ラウンド目は40m
var PER=5;                 // 1ラウンドの矢の数
var EYE=1.5, CAMZ=4, G=9.8, V0=70, TR=0.61, RING=0.061, WINDK=0.8, FULL=1.0;
var COLS=['#ff5d8f','#4da3ff','#ffb938','#59d37a','#b077ff'];

// ====== 状態 ======
var state='title';         // title / aim / fly / land / between / result
var round=0, shotInRound=0, shotCount=0;
var results=[[],[]];
var dist=25, wind=0;
var mx=0,my=0;             // 照準（画面の座標）
var drawing=false, drawT=0;
var zoom=1, t=0, last=0;
var arrow=null, simAcc=0, stuck=[], popup=null, particles=[];
var landT=0, lockUntil=0, newRecord=false;
var best=0;
try{ best=parseInt(localStorage.getItem('mochiArcheryBest')||'0',10)||0; }catch(e){}
var cx=0,cy=0,F=1;

function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth; H=window.innerHeight; u=Math.min(W,H)/100;
  cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR);
  cv.style.width=W+'px'; cv.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(!mx&&!my){ mx=W/2; my=H*0.46; }
}
window.addEventListener('resize',resize); resize();

function F0(){ return Math.min(H*2.4,W*4.5); }
function zmax(){ return ROUNDS[round].zmax; }
function total(){ var s=0; for(var i=0;i<results.length;i++)for(var j=0;j<results[i].length;j++)s+=results[i][j]; return s; }
function roundTotal(r){ var s=0; for(var j=0;j<results[r].length;j++)s+=results[r][j]; return s; }

// ====== 音（WebAudio。最初のクリックで有効になる） ======
var AC=null;
function initAudio(){
  if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ AC=null; } }
  if(AC&&AC.state==='suspended'){ try{AC.resume();}catch(e){} }
}
function tone(f,d,type,vol,f2,delay){
  if(!AC)return;
  var o=AC.createOscillator(),g=AC.createGain(),t0=AC.currentTime+(delay||0);
  o.type=type||'sine'; o.frequency.setValueAtTime(f,t0);
  if(f2)o.frequency.exponentialRampToValueAtTime(f2,t0+d);
  g.gain.setValueAtTime(vol||0.2,t0); g.gain.exponentialRampToValueAtTime(0.001,t0+d);
  o.connect(g); g.connect(AC.destination); o.start(t0); o.stop(t0+d+0.02);
}
function noise(d,vol,delay,freq){
  if(!AC)return;
  var n=Math.floor(AC.sampleRate*d),b=AC.createBuffer(1,n,AC.sampleRate),c=b.getChannelData(0);
  for(var i=0;i<n;i++)c[i]=Math.random()*2-1;
  var s=AC.createBufferSource(); s.buffer=b;
  var fl=AC.createBiquadFilter(); fl.type='bandpass'; fl.frequency.value=freq||1200;
  var g=AC.createGain(),t0=AC.currentTime+(delay||0);
  g.gain.setValueAtTime(vol,t0); g.gain.exponentialRampToValueAtTime(0.001,t0+d);
  s.connect(fl); fl.connect(g); g.connect(AC.destination); s.start(t0);
}
function sndShot(){ tone(240,0.28,'triangle',0.35,70); noise(0.35,0.25,0,2600); }
function sndHit(s){
  tone(150,0.16,'sine',0.55,50); noise(0.08,0.3,0,900);
  if(s>=9){ tone(880,0.25,'sine',0.2,null,0.08); tone(1320,0.35,'sine',0.2,null,0.2); }
  else if(s>=7){ tone(660,0.22,'sine',0.15,null,0.08); }
}
function sndMiss(){ noise(0.18,0.25,0,500); tone(100,0.15,'sine',0.3,60); }

// ====== ゲームの進行 ======
function newRound(){
  dist=ROUNDS[round].dist;
  wind=Math.round((Math.random()*6.4-3.2)*10)/10;
  stuck=[]; shotInRound=0; results[round]=[]; popup=null; particles=[];
}
function startGame(){
  results=[[],[]]; round=0; shotCount=0; newRecord=false; newRound();
  state='aim'; zoom=1; drawing=false;
}
function sway(){
  if(!drawing) return {x:0,y:0};
  var amp=0.0018+(drawT<0.6?0.003*(1-drawT/0.6):0)+Math.max(0,drawT-2.0)*0.006; // 引きすぎると手がぷるぷる
  return {x:(Math.sin(t*1.9)+0.6*Math.sin(t*4.3+1.3))*amp, y:(Math.cos(t*1.5+0.5)+0.6*Math.sin(t*3.7))*amp};
}
function fire(){
  var sw=sway(), rx=mx+sw.x*F, ry=my+sw.y*F, D=dist+CAMZ;
  var Px=(rx-cx)/F*D, Py=EYE-(ry-cy)/F*D;           // 照準の先（まとの面での位置）
  var p=Math.min(1,drawT/FULL), sf=0.85+0.15*p;      // ひっぱりが足りないと矢が遅くて落ちる
  var sx0=0.15, sy0=EYE-0.1, t0=dist/V0;
  var vx=(Px-sx0)/t0, vy=(Py-sy0+0.5*G*t0*t0)/t0;
  arrow={px:sx0,py:sy0,pz:0,vx:vx*sf,vy:vy*sf,vz:V0*sf,col:COLS[shotCount%COLS.length],alive:true,trail:[],n:0};
  shotCount++; simAcc=0; drawing=false; drawT=0; state='fly'; sndShot();
}
function simulate(dt){
  var a=arrow; if(!a)return;
  simAcc+=dt*(a.pz>dist-6?0.28:1);          // 当たる直前はスローモーション
  var h=1/240, guard=0;
  while(simAcc>=h&&a.alive&&guard++<400){ simAcc-=h; step(h); }
}
function step(h){
  var a=arrow, ox=a.px,oy=a.py,oz=a.pz;
  a.vx+=wind*WINDK*h; a.vy-=G*h;
  a.px+=a.vx*h; a.py+=a.vy*h; a.pz+=a.vz*h;
  if((++a.n)%6===0){ a.trail.push([a.px,a.py,a.pz]); if(a.trail.length>16)a.trail.shift(); }
  if(a.pz>=dist){
    var k=(dist-oz)/(a.pz-oz); land(ox+(a.px-ox)*k, oy+(a.py-oy)*k, dist, false);
  }else if(a.py<=0){
    var k2=oy/(oy-a.py); land(ox+(a.px-ox)*k2, 0, oz+(a.pz-oz)*k2, true);
  }
}
function band(s){ return s>=9?'#ffd23a':s>=7?'#e0383e':s>=5?'#2a8fd8':s>=3?'#2b2b2b':s>=1?'#f6f6f6':'#9a9a9a'; }
function land(x,y,z,ground){
  var a=arrow; a.alive=false;
  var sp=Math.hypot(a.vx,a.vy,a.vz), s=0, out=false, msg='';
  var d={x:a.vx/sp,y:a.vy/sp,z:a.vz/sp};
  if(ground){
    msg='じめんにささった…';
    stuck.push({x:x,y:0,z:z,d:d,col:a.col});
  }else if(y>0&&y<3.6&&Math.abs(x)<5){
    var r=Math.hypot(x,y-EYE);
    if(r<TR){ s=10-Math.floor(r/RING); if(s<1)s=1; }
    else msg='まとからはずれた';
    stuck.push({x:x,y:y,z:z,d:d,col:a.col});
  }else{ out=true; msg='とびこえた！'; }
  if(s===10)msg='ど真ん中！！'; else if(s===9)msg='すごい！'; else if(s===8)msg='ナイス！';
  else if(s>=6)msg='いいね！'; else if(s>=4)msg='まずまず'; else if(s>=1)msg='ぎりぎり当たった';
  results[round].push(s); shotInRound++;
  popup={s:s,age:0,x:x,y:y,z:z,out:out||ground,msg:msg};
  if(s>0){
    sndHit(s);
    var n=s>=9?34:s>=7?14:5, q=P(x,y,z);
    for(var i=0;i<n;i++){
      var ang=Math.random()*6.283, v=(0.5+Math.random())*u*(s>=9?30:16);
      particles.push({x:q.x,y:q.y,vx:Math.cos(ang)*v,vy:Math.sin(ang)*v-u*8,life:1,c:s>=9?'#ffd23a':band(s)==='#f6f6f6'?'#fff':band(s)});
    }
  }else sndMiss();
  arrow=null; state='land'; landT=1.9;
}
function afterLand(){
  if(shotInRound>=PER){
    lockUntil=performance.now()+700;
    if(round>=ROUNDS.length-1){
      var tt=total(); newRecord=tt>best;
      if(newRecord){ best=tt; try{localStorage.setItem('mochiArcheryBest',String(best));}catch(e){} }
      state='result';
    }else state='between';
  }else{
    wind=Math.max(-3.5,Math.min(3.5,Math.round((wind+(Math.random()-0.5)*1.4)*10)/10)); // 風はすこしずつ変わる
    state='aim';
  }
}

// ====== 入力 ======
function setPos(e){
  var r=cv.getBoundingClientRect();
  mx=e.clientX-r.left; my=e.clientY-r.top;
  if(e.pointerType==='touch'){ my=Math.max(0,my-14*u); }   // 指でかくれないように照準を上にずらす
}
function press(){
  var now=performance.now();
  if(now<lockUntil)return;
  if(state==='title'){ startGame(); lockUntil=now+250; }
  else if(state==='aim'){ drawing=true; drawT=0; tone(300,0.12,'triangle',0.08,420); }
  else if(state==='between'){ round++; newRound(); state='aim'; lockUntil=now+250; }
  else if(state==='result'){ state='title'; lockUntil=now+250; }
}
function release(){
  if(!drawing)return;
  if(state!=='aim'){ drawing=false; return; }
  if(drawT<0.2){ drawing=false; drawT=0; return; }   // すぐはなすとキャンセル
  fire();
}
cv.addEventListener('pointerdown',function(e){
  initAudio(); setPos(e);
  try{ cv.setPointerCapture(e.pointerId); }catch(_){}
  press(); e.preventDefault();
});
cv.addEventListener('pointermove',function(e){ setPos(e); });
cv.addEventListener('pointerup',function(e){ release(); e.preventDefault(); });
cv.addEventListener('pointercancel',function(){ if(drawing&&state==='aim'){ drawing=false; drawT=0; } });
window.addEventListener('keydown',function(e){
  if(e.code==='Space'||e.key===' '){ e.preventDefault(); if(!e.repeat){ initAudio(); press(); } }
});
window.addEventListener('keyup',function(e){
  if(e.code==='Space'||e.key===' '){ e.preventDefault(); release(); }
});
window.addEventListener('contextmenu',function(e){ e.preventDefault(); });

// ====== 更新 ======
function update(dt){
  cx=W/2; cy=H*0.46;
  var zt=1;
  if(state==='aim'&&drawing){ drawT+=dt; zt=zmax(); }
  else if(state==='fly') zt=zmax();
  else if(state==='land') zt=landT>0.7?zmax():1;
  zoom+=(zt-zoom)*Math.min(1,dt*7);
  F=F0()*zoom;
  if(state==='fly') simulate(dt);
  if(state==='land'){ landT-=dt; if(landT<=0) afterLand(); }
  if(popup) popup.age+=dt;
  for(var i=particles.length-1;i>=0;i--){
    var p=particles[i]; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=u*40*dt; p.life-=dt*0.9;
    if(p.life<=0)particles.splice(i,1);
  }
}

// ====== 描画（ぶ台） ======
function P(x,y,z){ var d=z+CAMZ; if(d<0.5)d=0.5; var s=F/d; return {x:cx+x*s,y:cy-(y-EYE)*s,s:s}; }
function rr(x,y,w,h,r){
  ctx.beginPath(); ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h); ctx.lineTo(x+r,y+h);
  ctx.quadraticCurveTo(x,y+h,x,y+h-r); ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y); ctx.closePath();
}
function txt(s,x,y,px,color,align,stroke,maxW){
  px=Math.round(px);
  ctx.font='bold '+px+'px '+FONT;
  if(maxW){ var w=ctx.measureText(s).width; if(w>maxW){ px=Math.max(8,Math.floor(px*maxW/w)); ctx.font='bold '+px+'px '+FONT; } }
  ctx.textAlign=align||'center'; ctx.textBaseline='middle';
  if(stroke){ ctx.lineWidth=px*0.2; ctx.strokeStyle=stroke; ctx.lineJoin='round'; ctx.strokeText(s,x,y); }
  ctx.fillStyle=color; ctx.fillText(s,x,y);
}
var CLOUDS=[{x:0.1,y:0.25,r:7,v:6},{x:0.45,y:0.12,r:9,v:4},{x:0.7,y:0.4,r:6,v:8},{x:0.9,y:0.2,r:8,v:5}];
function hill(col,hgt,freq,phase){
  ctx.fillStyle=col; ctx.beginPath(); ctx.moveTo(0,cy+1);
  for(var x=0;x<=W+16;x+=16){
    ctx.lineTo(x,cy-hgt*H*Math.pow(zoom,0.5)*(0.55+0.45*Math.sin(x*freq+phase)));
  }
  ctx.lineTo(W,cy+1); ctx.closePath(); ctx.fill();
}
function drawArrow(hx,hy,hz,d,col,len){
  var a=P(hx,hy,hz), b=P(hx-d.x*len,hy-d.y*len,hz-d.z*len);
  var w=Math.max(1.5,0.016*a.s);
  ctx.lineCap='round';
  ctx.strokeStyle='#5a3d1c'; ctx.lineWidth=w+1.6; ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
  ctx.strokeStyle='#f3dcab'; ctx.lineWidth=w; ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
  ctx.strokeStyle=col; ctx.lineWidth=w*2.6; ctx.beginPath(); ctx.moveTo(b.x,b.y); ctx.lineTo(b.x+(a.x-b.x)*0.22,b.y+(a.y-b.y)*0.22); ctx.stroke();
  ctx.strokeStyle='#666'; ctx.lineWidth=w*1.2; ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(a.x+(b.x-a.x)*0.06,a.y+(b.y-a.y)*0.06); ctx.stroke();
}
function drawScene(){
  var z=zoom, i, g;
  g=ctx.createLinearGradient(0,0,0,cy); g.addColorStop(0,'#5db8ff'); g.addColorStop(1,'#e2f4ff');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,cy+1);
  ctx.fillStyle='rgba(255,255,255,0.92)';
  for(i=0;i<CLOUDS.length;i++){
    var c=CLOUDS[i], x=((c.x*W+t*c.v)%(W+400))-200, y=cy*c.y, r=c.r*u*Math.pow(z,0.5);
    ctx.beginPath(); ctx.arc(x,y,r,0,6.283); ctx.arc(x+r*0.9,y+r*0.15,r*0.75,0,6.283); ctx.arc(x-r*0.9,y+r*0.2,r*0.7,0,6.283); ctx.fill();
  }
  hill('#b4e0a8',0.09,0.0027,0.8); hill('#8fd08a',0.06,0.0041,2.4);
  ctx.fillStyle='#6fc16a'; ctx.fillRect(0,cy,W,H-cy);
  var ds=[2,3.5,5.5,8,11,15,20,26,33,42,52,64,80,120,200,400];
  ctx.fillStyle='#64b660';
  for(i=0;i<ds.length-1;i+=2){
    var y1=cy+F*EYE/ds[i+1], y2=cy+F*EYE/ds[i];
    if(y2>cy) ctx.fillRect(0,y1,W,y2-y1);
  }
  // 木
  var trees=[[-9,dist+14],[10.5,dist+18],[-17,dist+30],[19,dist+12],[-6.8,dist+9],[7.6,dist+24]];
  for(i=0;i<trees.length;i++){
    var tb=P(trees[i][0],0,trees[i][1]), s=tb.s;
    ctx.fillStyle='#7a5a3a'; ctx.fillRect(tb.x-0.18*s,tb.y-2.4*s,0.36*s,2.4*s);
    ctx.fillStyle='#3fa860'; ctx.beginPath(); ctx.arc(tb.x,tb.y-3.5*s,1.9*s,0,6.283); ctx.fill();
    ctx.fillStyle='#55c076'; ctx.beginPath(); ctx.arc(tb.x-0.5*s,tb.y-3.9*s,1.1*s,0,6.283); ctx.fill();
  }
  // わらのうしろ幕
  var wl=P(-5,3.6,dist+1), wr=P(5,0,dist+1);
  ctx.fillStyle='#dcbc6c'; ctx.fillRect(wl.x,wl.y,wr.x-wl.x,wr.y-wl.y);
  ctx.strokeStyle='rgba(120,85,30,0.35)'; ctx.lineWidth=Math.max(1,0.03*wl.s);
  for(i=1;i<8;i++){ var ly=wl.y+(wr.y-wl.y)*i/8; ctx.beginPath(); ctx.moveTo(wl.x,ly); ctx.lineTo(wr.x,ly); ctx.stroke(); }
  ctx.fillStyle='rgba(0,0,0,0.12)'; ctx.fillRect(wl.x,wr.y-0.25*wl.s,wr.x-wl.x,0.25*wl.s);
  // 吹き流し（風のむきと強さ）
  var pb=P(-2.4,0,dist), pt=P(-2.4,2.7,dist), s2=pb.s;
  ctx.strokeStyle='#f2f2f2'; ctx.lineWidth=Math.max(2,0.06*s2); ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(pb.x,pb.y); ctx.lineTo(pt.x,pt.y); ctx.stroke();
  var wd=wind>=0?1:-1, aw=Math.abs(wind), len=0.3+0.5*aw, droop=Math.max(0.02,0.5-aw*0.13), segs=5;
  var px0=pt.x,py0=pt.y;
  for(i=1;i<=segs;i++){
    var k=i/segs, nx=pt.x+wd*len*k*s2, ny=pt.y+droop*k*k*s2*2.2+Math.sin(t*9+k*5)*0.05*s2*Math.min(1,aw/2)*k;
    ctx.strokeStyle=i%2?'#ff4f6d':'#fff'; ctx.lineWidth=Math.max(2,0.2*s2*(1-k*0.5));
    ctx.beginPath(); ctx.moveTo(px0,py0); ctx.lineTo(nx,ny); ctx.stroke(); px0=nx; py0=ny;
  }
  // 台
  var tc=P(0,EYE,dist), s3=tc.s;
  ctx.strokeStyle='#7a5535'; ctx.lineWidth=Math.max(2,0.08*s3);
  var legs=[[-0.25,EYE-0.5,-1.0,0],[0.25,EYE-0.5,1.0,0],[0,EYE-0.6,0,0]];
  for(i=0;i<legs.length;i++){ var l0=P(legs[i][0],legs[i][1],dist), l1=P(legs[i][2],legs[i][3],dist); ctx.beginPath(); ctx.moveTo(l0.x,l0.y); ctx.lineTo(l1.x,l1.y); ctx.stroke(); }
  // まと
  ctx.fillStyle='#d8b878'; ctx.beginPath(); ctx.arc(tc.x,tc.y,(TR+0.05)*s3,0,6.283); ctx.fill();
  var cols=['#f6f6f6','#f6f6f6','#2b2b2b','#2b2b2b','#2a8fd8','#2a8fd8','#e0383e','#e0383e','#ffd23a','#ffd23a'];
  ctx.strokeStyle='rgba(0,0,0,0.35)'; ctx.lineWidth=1;
  for(i=1;i<=10;i++){
    ctx.fillStyle=cols[i-1]; ctx.beginPath(); ctx.arc(tc.x,tc.y,(11-i)*RING*s3,0,6.283); ctx.fill(); ctx.stroke();
  }
  // 刺さった矢
  for(i=0;i<stuck.length;i++){ var st=stuck[i]; drawArrow(st.x,st.y,st.z,st.d,st.col,0.75); }
  // 飛んでいる矢
  if(arrow){
    var a=arrow, sp=Math.hypot(a.vx,a.vy,a.vz), dd={x:a.vx/sp,y:a.vy/sp,z:a.vz/sp};
    if(a.trail.length>1){
      ctx.strokeStyle='rgba(255,255,255,0.4)'; ctx.lineWidth=2; ctx.beginPath();
      for(i=0;i<a.trail.length;i++){ var tp=P(a.trail[i][0],a.trail[i][1],a.trail[i][2]); if(i)ctx.lineTo(tp.x,tp.y); else ctx.moveTo(tp.x,tp.y); }
      ctx.lineTo(P(a.px,a.py,a.pz).x,P(a.px,a.py,a.pz).y); ctx.stroke();
    }
    drawArrow(a.px,a.py,a.pz,dd,a.col,0.6);
  }
  // 当たった場所の輪っか
  if(popup&&!popup.out&&popup.age<0.8){
    var q=P(popup.x,popup.y,popup.z);
    ctx.strokeStyle='rgba(255,255,255,'+(1-popup.age/0.8).toFixed(2)+')'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(q.x,q.y,(0.06+popup.age*0.6)*q.s,0,6.283); ctx.stroke();
  }
  for(i=0;i<particles.length;i++){ var pa=particles[i]; ctx.globalAlpha=Math.max(0,pa.life); ctx.fillStyle=pa.c; ctx.beginPath(); ctx.arc(pa.x,pa.y,0.9*u,0,6.283); ctx.fill(); }
  ctx.globalAlpha=1;
  if(zoom>1.02){
    var vg=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.35,W/2,H/2,Math.max(W,H)*0.75);
    var amt=Math.min(1,(zoom-1)/(zmax()-1||1))*0.4;
    vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,'+amt.toFixed(2)+')');
    ctx.fillStyle=vg; ctx.fillRect(0,0,W,H);
  }
}

// ====== 描画（HUD・画面） ======
function panel(x,y,w,h){ ctx.fillStyle='rgba(20,30,50,0.55)'; rr(x,y,w,h,2*u); ctx.fill(); }
function drawHUD(){
  var i, r=round;
  // ラウンドと矢
  panel(2*u,2*u,31*u,12.5*u);
  txt('ラウンド '+(r+1)+'/'+ROUNDS.length+'  '+dist+'m',3.5*u,5.3*u,3.4*u,'#fff','left',null,28*u);
  for(i=0;i<PER;i++){
    var cxp=5.2*u+i*5.6*u, cyp=10.3*u, sc=results[r][i];
    ctx.beginPath(); ctx.arc(cxp,cyp,2.4*u,0,6.283);
    if(sc===undefined){ ctx.fillStyle='rgba(255,255,255,0.25)'; ctx.fill(); }
    else{ ctx.fillStyle=band(sc); ctx.fill(); ctx.strokeStyle='#fff'; ctx.lineWidth=1.5; ctx.stroke();
      txt(String(sc),cxp,cyp+0.1*u,2.4*u,(sc>=1&&sc<=2)||sc>=9?'#222':'#fff'); }
  }
  // 合計
  txt('ごうけい',W/2,3.6*u,2.6*u,'#fff','center','rgba(0,0,0,0.5)');
  txt(String(total()),W/2,8.4*u,6*u,'#fff','center','rgba(0,0,0,0.55)');
  // 風
  var ww=27*u, wx=W-ww-2*u;
  panel(wx,2*u,ww,12.5*u);
  txt('かぜ '+Math.abs(wind).toFixed(1)+'m/s',wx+ww/2,5.3*u,3.3*u,'#fff','center',null,ww-3*u);
  var al=1.5*u+Math.abs(wind)*3.2*u, ax=wx+ww/2, ay=10.6*u, dir=wind>=0?1:-1;
  if(Math.abs(wind)<0.15){ txt('ほぼ無風',ax,ay,3*u,'#bfe6ff'); }
  else{
    ctx.strokeStyle='#7fe0ff'; ctx.fillStyle='#7fe0ff'; ctx.lineWidth=0.9*u; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(ax-dir*al,ay); ctx.lineTo(ax+dir*al,ay); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(ax+dir*(al+1.8*u),ay); ctx.lineTo(ax+dir*(al-0.4*u),ay-1.7*u); ctx.lineTo(ax+dir*(al-0.4*u),ay+1.7*u); ctx.closePath(); ctx.fill();
  }
  // 照準
  if(state==='aim'){
    var sw=sway(), rx=mx+sw.x*F, ry=my+sw.y*F, p=Math.min(1,drawT/FULL);
    var col=!drawing?'#fff':p<1?'#ffb938':(drawT>2?'#ff5d5d':'#6dff8a');
    var rad=2.6*u*(drawing?1+(1-p)*0.8:1);
    ctx.strokeStyle='rgba(0,0,0,0.5)'; ctx.lineWidth=0.9*u; ctx.beginPath(); ctx.arc(rx,ry,rad,0,6.283); ctx.stroke();
    ctx.strokeStyle=col; ctx.lineWidth=0.5*u; ctx.beginPath(); ctx.arc(rx,ry,rad,0,6.283); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(rx-rad*1.7,ry); ctx.lineTo(rx-rad*0.4,ry); ctx.moveTo(rx+rad*0.4,ry); ctx.lineTo(rx+rad*1.7,ry);
    ctx.moveTo(rx,ry-rad*1.7); ctx.lineTo(rx,ry-rad*0.4); ctx.moveTo(rx,ry+rad*0.4); ctx.lineTo(rx,ry+rad*1.7); ctx.stroke();
    ctx.fillStyle=col; ctx.beginPath(); ctx.arc(rx,ry,0.45*u,0,6.283); ctx.fill();
    // ちからゲージ
    var bw=Math.min(60*u,W*0.8), bx=(W-bw)/2, by=H-9*u;
    if(drawing){
      ctx.fillStyle='rgba(20,30,50,0.6)'; rr(bx-u,by-u,bw+2*u,4.6*u,2*u); ctx.fill();
      ctx.fillStyle=p<1?'#ffb938':(drawT>2?'#ff5d5d':'#6dff8a'); rr(bx,by,Math.max(2*u,bw*p),2.6*u,1.3*u); ctx.fill();
      txt(p<1?'ぐーっとひっぱる…':(drawT>2?'うでがぷるぷる！はなして！':'いまだ！ねらって はなそう'),W/2,by-3.4*u,3.2*u,'#fff','center','rgba(0,0,0,0.6)',W-6*u);
    }else{
      txt(('ontouchstart' in window)?'ゆびをおしっぱなしでひく → はなして発射':'マウスをおしっぱなしでひく → はなして発射（スペースキーもOK）',W/2,H-5*u,3*u,'#fff','center','rgba(0,0,0,0.6)',W-6*u);
    }
  }
  // 得点ポップアップ
  if(popup&&popup.age<1.9){
    var pa=popup.age, bounce=Math.min(1,pa/0.18), sc=0.6+0.4*bounce, py=cy-Math.min(H*0.22,18*u)-pa*2*u;
    var alpha=pa>1.5?Math.max(0,(1.9-pa)/0.4):1;
    ctx.globalAlpha=alpha;
    if(popup.s>0){ txt(String(popup.s),W/2,py,13*u*sc,band(popup.s)==='#f6f6f6'?'#fff':band(popup.s),'center','rgba(0,0,0,0.7)'); txt('てん',W/2+9*u*sc+(String(popup.s).length>1?3*u:0),py+3*u,3.6*u,'#fff','center','rgba(0,0,0,0.7)'); }
    txt(popup.msg,W/2,py+10*u*sc,5*u,'#fff','center','rgba(0,0,0,0.7)',W-6*u);
    ctx.globalAlpha=1;
  }
}
function dim(a){ ctx.fillStyle='rgba(10,20,40,'+a+')'; ctx.fillRect(0,0,W,H); }
function blink(s,y){ txt(s,W/2,y,3.6*u,'#fff','center','rgba(0,0,0,0.6)',W-6*u); }
function drawTitle(){
  dim(0.45);
  txt('もちもち',W/2,H*0.2,9*u,'#fff','center','#ff5d8f',W-8*u);
  txt('アーチェリー',W/2,H*0.2+11*u,10*u,'#ffe27a','center','#e2574c',W-8*u);
  var lines=['おしっぱなしで 弓をひく（画面がズーム！）','はなすと 矢がとぶ','ゲージが まんたん（緑）のときが ベスト','風でながされるので ふき流しを見て 少しずらそう','10本で 100点まん点！'];
  for(var i=0;i<lines.length;i++) txt(lines[i],W/2,H*0.5+i*5.2*u,3.4*u,'#fff','center','rgba(0,0,0,0.5)',W-6*u);
  if(best>0) txt('ベストスコア '+best+'てん',W/2,H*0.5+lines.length*5.2*u+3*u,3.8*u,'#ffe27a','center','rgba(0,0,0,0.5)');
  if(Math.floor(t*1.6)%2===0) blink('クリック / タップ でスタート',H*0.88);
}
function drawBetween(){
  dim(0.5);
  var pw=Math.min(W*0.9,80*u), ph=48*u, px=(W-pw)/2, py=(H-ph)/2;
  ctx.fillStyle='rgba(255,255,255,0.95)'; rr(px,py,pw,ph,4*u); ctx.fill();
  txt('ラウンド '+(round+1)+' おわり！',W/2,py+8*u,6*u,'#e2574c','center',null,pw-6*u);
  txt(roundTotal(round)+' / '+(PER*10)+' てん',W/2,py+20*u,8*u,'#333','center',null,pw-6*u);
  txt('つぎは '+ROUNDS[round+1].dist+'m！ まとが小さく見えるよ',W/2,py+32*u,3.6*u,'#555','center',null,pw-6*u);
  if(performance.now()>=lockUntil&&Math.floor(t*1.6)%2===0) txt('クリック / タップ でつづける',W/2,py+41*u,3.6*u,'#2a8fd8','center',null,pw-6*u);
}
function rankOf(s){ return s>=92?'弓の神さま':s>=80?'もちもち名人':s>=65?'ベテランの射手':s>=45?'いい線いってる':s>=25?'見習いアーチャー':'もういっかいがんばろう'; }
function drawResult(){
  dim(0.55);
  var tt=total(), pw=Math.min(W*0.92,86*u), ph=66*u, px=(W-pw)/2, py=(H-ph)/2;
  ctx.fillStyle='rgba(255,255,255,0.96)'; rr(px,py,pw,ph,4*u); ctx.fill();
  txt('けっか',W/2,py+7*u,5.5*u,'#e2574c','center',null,pw-6*u);
  for(var i=0;i<ROUNDS.length;i++) txt('ラウンド'+(i+1)+' ('+ROUNDS[i].dist+'m)  '+roundTotal(i)+' てん',W/2,py+15*u+i*5.6*u,3.6*u,'#555','center',null,pw-6*u);
  txt(tt+' / '+(PER*10*ROUNDS.length),W/2,py+33*u,11*u,'#333','center',null,pw-6*u);
  txt(rankOf(tt),W/2,py+46*u,5.2*u,'#e2574c','center',null,pw-6*u);
  txt(newRecord?'🎉 しんきろく！':'ベスト '+best+' てん',W/2,py+54*u,3.8*u,newRecord?'#e29a00':'#777','center',null,pw-6*u);
  if(performance.now()>=lockUntil&&Math.floor(t*1.6)%2===0) txt('クリック / タップ でもういちど',W/2,py+61*u,3.4*u,'#2a8fd8','center',null,pw-6*u);
}
function draw(){
  ctx.clearRect(0,0,W,H);
  drawScene();
  if(state==='title') drawTitle();
  else{
    drawHUD();
    if(state==='between') drawBetween();
    else if(state==='result') drawResult();
  }
}

function frame(now){
  var dt=Math.min(0.05,Math.max(0,(now-last)/1000)); last=now; t+=dt;
  update(dt); draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(function(n){ last=n; frame(n); });
})();
</script>
