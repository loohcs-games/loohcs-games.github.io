<script>
'use strict';
// 惑星こわし ― 惑星が順に出てくるので、魔法でこわす。それだけ。
// ?test 自己テスト / ?auto 自動 / ?stage=1..8 / ?seed= / ?shot=秒（自動で進めて1枚だけ描く）
const Q=new URLSearchParams(location.search);
const TEST=Q.has('test');
const SHOT=Q.has('shot')?(parseFloat(Q.get('shot'))||0):null;
let autoOn=Q.has('auto')||SHOT!==null;
const START_STAGE=Math.max(1,Math.min(8,parseInt(Q.get('stage')||'1')||1));
let seed=(parseInt(Q.get('seed'))||((Math.random()*1e9)|0))>>>0;
function rng(){seed=(seed+0x6D2B79F5)|0;let t=Math.imul(seed^(seed>>>15),1|seed);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}
const R=(a,b)=>a+(b-a)*rng();
const MR=(a,b)=>a+(b-a)*Math.random();
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const easeOut=t=>1-Math.pow(1-clamp(t,0,1),3);
const easeIn=t=>{t=clamp(t,0,1);return t*t};
const easeBack=t=>{t=clamp(t,0,1);const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)};
const fmt=n=>Math.max(0,Math.round(n)).toString().replace(/\B(?=(\d{3})+(?!\d))/g,',');
const TAU=Math.PI*2;
function once(ev,k,c,fn){if(c&&!ev[k]){ev[k]=1;fn()}}

const W=1280,H=720;
const cv=document.getElementById('c'),g=cv.getContext('2d');
cv.width=W;cv.height=H;
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);cv.style.width=(W*s)+'px';cv.style.height=(H*s)+'px'}
addEventListener('resize',fit);fit();
const FONT='"Hiragino Kaku Gothic StdN","Hiragino Sans","Yu Gothic","Meiryo",sans-serif';

// ===== 惑星 =====
const PLANETS=[
 {name:'月',kind:'moon',r:150,quip:'まんまるです',sp:'極光天墜',type:'beam',col:'#8ff',crack:'#ffd27a',sh:['#bbb','#888','#ddd']},
 {name:'水星',kind:'rock',r:135,quip:'太陽に近くて暑い',sp:'星砕きの太刀',type:'slash',col:'#ffe066',crack:'#ff9a3c',sh:['#a98','#765','#cba']},
 {name:'火星',kind:'mars',r:170,quip:'赤いのは錆です',sp:'紅蓮大爆殺',type:'beam',col:'#ff4a2a',crack:'#ffb030',sh:['#c4501a','#7a2a0a','#e08050']},
 {name:'地球',kind:'earth',r:185,quip:'えっ　ここは',sp:'ごめんね地球',type:'meteor',col:'#ff7a1a',crack:'#ff5a20',sh:['#2a6ad0','#3a8a3a','#fff','#9a7a40']},
 {name:'土星',kind:'saturn',r:165,quip:'輪っかは取れません',sp:'輪っか取り外し斬',type:'slash',col:'#ffb0ff',crack:'#ffcf6a',sh:['#e8d39a','#c9a65a','#fff0c0']},
 {name:'木星',kind:'jupiter',r:225,quip:'大きさなら負けない',sp:'超巨大魔法陣砲',type:'beam',col:'#c070ff',crack:'#ff8a3a',sh:['#d9a070','#f0e0c0','#a0603a']},
 {name:'太陽',kind:'sun',r:245,quip:'本当にやるのか',sp:'太陽より熱い何か',type:'beam',col:'#7ad8ff',crack:'#ffffff',sh:['#ffd040','#fff0a0','#ff8000']},
 {name:'ブラックホール',kind:'bh',r:115,quip:'……',sp:'宇宙リセット',type:'bigbang',col:'#ffffff',crack:'#ffffff',sh:['#a6f','#fff','#fa6']},
];
const BASE_HP=40000,BOLT=50,SPELL=480;
const bhMult=k=>k==='special'?1:0.35;

// 値ノイズ（横方向につながる）
let nseed=1;
function hash(i,j){let h=(Math.imul(i,374761393)+Math.imul(j,668265263)+nseed)|0;h=Math.imul(h^(h>>>13),1274126177);h=h^(h>>>16);return(h>>>0)/4294967296}
function vnoise(x,y,per){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);const x0=((xi%per)+per)%per,x1=(x0+1)%per;const a=hash(x0,yi),b=hash(x1,yi),c=hash(x0,yi+1),d=hash(x1,yi+1);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v}
function fbm(x,y,per,oct){let s=0,a=.5,f=1,n=0;for(let o=0;o<oct;o++){s+=a*vnoise(x*f,y*f,per*f);n+=a;a*=.5;f*=2}return s/n}
const mix=(a,b,t)=>a+(b-a)*t;

function makeTexture(d){
 const th=Math.max(16,Math.round(d.r)),tw=th*2;
 const c=document.createElement('canvas');c.width=tw;c.height=th;const t=c.getContext('2d');
 if(d.kind==='bh')return c;
 nseed=(rng()*1e9)|0;
 const img=t.createImageData(tw,th),D=img.data,PER=6;
 for(let y=0;y<th;y++){const v=y/th*PER/2,lat=Math.abs(y/th-.5)*2;
  for(let x=0;x<tw;x++){const u=x/tw*PER;let r=0,gg=0,b=0;
   switch(d.kind){
    case 'moon':{const n=fbm(u,v,PER,4),m=fbm(u*.5,v*.5+7,PER/2,3);let base=115+100*n;if(m>.55)base*=.7;r=base;gg=base;b=base+6;break}
    case 'rock':{const n=fbm(u*1.5,v*1.5,9,4);r=105+95*n;gg=95+85*n;b=85+70*n;break}
    case 'mars':{const n=fbm(u,v,PER,4),m=fbm(u*.5,v*.5+5,PER/2,3);r=175+70*n;gg=70+50*n;b=35+30*n;if(m>.56){r*=.6;gg*=.58;b*=.6}if(lat>.84){const w=clamp((lat-.84)/.05,0,1);r=mix(r,240,w);gg=mix(gg,236,w);b=mix(b,232,w)}break}
    case 'earth':{const h=fbm(u,v,PER,5),cl=fbm(u*2,v*3+11,PER*2,4);if(h>.53){const e=clamp((h-.53)/.2,0,1);r=55+e*130;gg=125+e*35;b=50+e*20}else{const e=h/.53;r=10+25*e;gg=45+70*e;b=115+90*e}
     if(lat>.8){const w=clamp((lat-.8)/.06,0,1);r=mix(r,245,w);gg=mix(gg,250,w);b=mix(b,255,w)}const a=clamp((cl-.52)*3.5,0,.85);r=mix(r,255,a);gg=mix(gg,255,a);b=mix(b,255,a);break}
    case 'saturn':{const bd=Math.sin(v*14+2.5*fbm(u,v*2,PER,3))*.5+.5,n=fbm(u*2,v*2,PER*2,3);r=228-45*bd+12*n;gg=205-55*bd+10*n;b=145-55*bd;break}
    case 'jupiter':{const w=fbm(u,v*2,PER,4),t2=v*9+w*3.4,s=Math.sin(t2)*.5+.5,s2=clamp(Math.sin(t2*2.3+1),0,1);const k=Math.pow(s,1.4);r=mix(238,160,k);gg=mix(224,105,k);b=mix(198,70,k);r=mix(r,220,s2*.5);gg=mix(gg,150,s2*.5);b=mix(b,95,s2*.5);break}
    case 'sun':{const n=fbm(u*2,v*2,PER*2,4);r=255;gg=165+80*n;b=30+110*n*n;break}
   }
   const i=(y*tw+x)*4;D[i]=r;D[i+1]=gg;D[i+2]=b;D[i+3]=255;}}
 t.putImageData(img,0,0);
 const blob=(x,y,rad,fn)=>{for(const dx of[-tw,0,tw])fn(x+dx,y,rad)};
 if(d.kind==='moon'||d.kind==='rock'||d.kind==='mars'){
  const n=d.kind==='rock'?70:d.kind==='moon'?45:14;
  for(let i=0;i<n;i++){const x=R(0,tw),y=R(th*.12,th*.88),rad=Math.pow(rng(),2.2)*th*.09+1.2;
   blob(x,y,rad,(xx,yy,rr)=>{t.fillStyle='rgba(0,0,0,.28)';t.beginPath();t.arc(xx,yy,rr,0,TAU);t.fill();t.strokeStyle='rgba(255,255,255,.2)';t.lineWidth=Math.max(.6,rr*.25);t.beginPath();t.arc(xx+rr*.15,yy+rr*.15,rr,-.3,2.2);t.stroke()})}}
 if(d.kind==='jupiter'){const x=tw*.3,y=th*.66;blob(x,y,0,(xx,yy)=>{t.fillStyle='rgba(190,80,50,.85)';t.beginPath();t.ellipse(xx,yy,th*.12,th*.065,0,0,TAU);t.fill();t.strokeStyle='rgba(250,200,160,.6)';t.lineWidth=2;t.beginPath();t.ellipse(xx,yy,th*.14,th*.08,0,0,TAU);t.stroke()})}
 if(d.kind==='sun'){for(let i=0;i<5;i++){const x=R(0,tw),y=R(th*.3,th*.7),rr=R(2,th*.03);blob(x,y,rr,(xx,yy,r2)=>{t.fillStyle='rgba(120,40,0,.6)';t.beginPath();t.arc(xx,yy,r2,0,TAU);t.fill()})}}
 return c;
}

// ===== 状態 =====
const PC={x:840,y:360},WZ={x:215,y:505};
let state='title',T=0,realT=0,P=null,idx=0,gauge=0,combo=0,comboT=0,spellIdx=0,lastSpell='',shotCD=0,spellCD=0,castT=9,paused=false,muted=false;
let shake=0,flash=0,flashCol='#fff',hitstop=0,slowT=0,slowS=1,dim=0,zoom=0,warp=0,white=0;
let parts=[],rings=[],floats=[],banners=[],bolts=[],projs=[],lights=[],chunks=[],rays=[],slashes=[],flares=[],extras=[],timers=[];
let SP=null,BT=0,BE={},CE={},quip=null,lagHP=0,planetStart=0;
const stats={dmg:0,hits:0,sp:0,maxCombo:0,t:0,order:[],spOn:[],times:[]};
const keys={},pressed={};
const CAP=2600;

const bob=()=>Math.sin(realT*2.2)*7;
const tip=()=>({x:WZ.x+80,y:WZ.y+bob()-128});
const cx=()=>PC.x+(P?P.ox:0),cy=()=>PC.y+(P?P.oy:0),pr=()=>P?P.r*P.scale:0;
function after(t,fn){timers.push({t,fn})}

function makePlanet(i){const d=PLANETS[i],m=Math.pow(4,i);
 return{i,d,r:d.r,hp:BASE_HP*m,max:BASE_HP*m,mult:m,ox:0,oy:0,vx:0,vy:0,flash:0,sq:0,trem:0,rot:R(0,1),scale:.02,cracks:[],tex:makeTexture(d),thr:[.75,.5,.25],dead:false}}

// ===== 入力 =====
const KEYMAP={' ':'Space',z:'KeyZ',Z:'KeyZ',x:'KeyX',X:'KeyX',m:'KeyM',M:'KeyM',Escape:'Escape'};const kc=e=>e.code||KEYMAP[e.key]||e.key;
addEventListener('keydown',e=>{const c=kc(e);if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(c))e.preventDefault();if(!keys[c])pressed[c]=true;keys[c]=true;initAudio()});
addEventListener('keyup',e=>{keys[kc(e)]=false});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false});
function clearPressed(){for(const k in pressed)delete pressed[k]}

// ===== 音（すべて中で合成） =====
let AC=null,master=null,bgmG=null,bgmLP=null,NB=null,lastShotS=0,lastHitS=0,bgmNext=0,bgmStep=0;
function initAudio(){if(AC||TEST||SHOT!==null)return;try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){return}
 const comp=AC.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=6;comp.connect(AC.destination);
 master=AC.createGain();master.gain.value=muted?0:.7;master.connect(comp);
 bgmG=AC.createGain();bgmG.gain.value=.3;bgmG.connect(master);
 bgmLP=AC.createBiquadFilter();bgmLP.type='lowpass';bgmLP.frequency.value=900;bgmLP.connect(bgmG);
 NB=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
 bgmNext=AC.currentTime+.1}
const mtof=m=>440*Math.pow(2,(m-69)/12);
function tone(type,f0,f1,dur,vol,when=0,dest){if(!AC)return;const t=AC.currentTime+when;const o=AC.createOscillator(),gn=AC.createGain();o.type=type;o.frequency.setValueAtTime(f0,t);if(f1)o.frequency.exponentialRampToValueAtTime(f1,t+dur);gn.gain.setValueAtTime(.0001,t);gn.gain.exponentialRampToValueAtTime(Math.max(vol,.0002),t+.006);gn.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(gn);gn.connect(dest||master);o.start(t);o.stop(t+dur+.05)}
function noise(dur,vol,ft,f0,f1,when=0,q=1,dest){if(!AC)return;const t=AC.currentTime+when;const s=AC.createBufferSource();s.buffer=NB;s.loop=true;const f=AC.createBiquadFilter();f.type=ft;f.frequency.setValueAtTime(f0,t);if(f1&&f1!==f0)f.frequency.exponentialRampToValueAtTime(f1,t+dur);f.Q.value=q;const gn=AC.createGain();gn.gain.setValueAtTime(.0001,t);gn.gain.exponentialRampToValueAtTime(Math.max(vol,.0002),t+.008);gn.gain.exponentialRampToValueAtTime(.0001,t+dur);s.connect(f);f.connect(gn);gn.connect(dest||master);s.start(t,Math.random()*1.5);s.stop(t+dur+.05)}
function chord(ms,dur,vol,type='sawtooth',when=0){for(const m of ms)tone(type,mtof(m),0,dur,vol,when)}
function beamSound(dur){const t=AC.currentTime;const gn=AC.createGain();gn.gain.setValueAtTime(.0001,t);gn.gain.exponentialRampToValueAtTime(.32,t+.05);gn.gain.setValueAtTime(.32,t+Math.max(.06,dur-.25));gn.gain.exponentialRampToValueAtTime(.0001,t+dur);
 const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=1600;f.connect(gn);gn.connect(master);
 for(const fr of[55,55.7,82.5,110.8]){const o=AC.createOscillator();o.type='sawtooth';o.frequency.value=fr;o.connect(f);o.start(t);o.stop(t+dur+.05)}
 const s=AC.createBufferSource();s.buffer=NB;s.loop=true;const bp=AC.createBiquadFilter();bp.type='bandpass';bp.frequency.value=900;bp.Q.value=.7;s.connect(bp);bp.connect(gn);s.start(t);s.stop(t+dur+.05);
 const l=AC.createOscillator(),lg=AC.createGain();l.frequency.value=13;lg.gain.value=700;l.connect(lg);lg.connect(f.frequency);l.start(t);l.stop(t+dur+.05)}
function sfx(n,arg){if(!AC||muted)return;const now=AC.currentTime;const MRr=(a,b)=>a+(b-a)*Math.random();
 switch(n){
  case 'shot':if(now-lastShotS<.06)return;lastShotS=now;tone('square',MRr(900,1300),300,.05,.022);break;
  case 'hit':if(now-lastHitS<.04)return;lastHitS=now;noise(.05,.12,'bandpass',2500,900,0,1.5);tone('sine',200,70,.07,.12);break;
  case 'crit':noise(.1,.3,'bandpass',4000,1200);tone('triangle',1400,2800,.12,.12);tone('sine',150,50,.15,.3);break;
  case 'cast':tone('sine',600,1800,.15,.08);noise(.2,.1,'highpass',3000,8000);break;
  case 'fireGo':noise(.5,.25,'lowpass',300,2500);break;
  case 'boomS':tone('sine',140,40,.5,.6);noise(.6,.5,'lowpass',2500,150);break;
  case 'boomM':tone('sine',160,50,.3,.3);noise(.35,.28,'lowpass',2000,200);break;
  case 'thunder':noise(.07,.7,'highpass',2500,2500);noise(1,.45,'lowpass',900,80,.03);tone('sawtooth',80,40,.3,.15);break;
  case 'ice':for(let i=0;i<3;i++)tone('sine',MRr(2000,3500),0,.18,.05,i*.03);noise(.08,.15,'highpass',5000,5000);break;
  case 'meteorGo':tone('sawtooth',1600,300,.5,.035);break;
  case 'kiin':tone('sine',2600,0,.9,.15);tone('sine',3900,0,.7,.06);break;
  case 'whoosh':noise(.35,.4,'bandpass',300,4000,0,.8);break;
  case 'stab':chord([57,61,64,69],.7,.07);tone('sine',110,40,.4,.5);noise(.3,.4,'lowpass',4000,200);break;
  case 'stab2':chord([62,66,69,74],.9,.07);tone('sine',90,30,.5,.6);break;
  case 'dan':tone('square',98,49,.13,.16);noise(.08,.25,'lowpass',2500,300);break;
  case 'charge':tone('sawtooth',100,1600,.95,.05);noise(.95,.15,'bandpass',500,5000,0,3);break;
  case 'beam':beamSound(arg||1.8);break;
  case 'slash':noise(.25,.6,'bandpass',7000,600,0,1.5);tone('sine',1500,150,.2,.12);break;
  case 'fall':tone('sawtooth',1800,150,.85,.06);noise(.85,.3,'bandpass',3000,300,0,1);break;
  case 'rumble':{const s=AC.createBufferSource();s.buffer=NB;s.loop=true;const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.setValueAtTime(100,now);f.frequency.linearRampToValueAtTime(600,now+.9);const gn=AC.createGain();gn.gain.setValueAtTime(.05,now);gn.gain.linearRampToValueAtTime(.7,now+.88);gn.gain.linearRampToValueAtTime(.0001,now+.95);s.connect(f);f.connect(gn);gn.connect(master);s.start(now);s.stop(now+1);tone('sine',50,35,.95,.4);break}
  case 'boom':tone('sine',100,25,2.2,.9);noise(2.6,.85,'lowpass',4000,60);for(let i=0;i<12;i++)noise(.05,.3*Math.random()+.05,'highpass',3000,3000,.1+Math.random()*1.5);chord([33,40,45],1.6,.08,'sawtooth',.05);break;
  case 'crack':noise(.12,.5,'highpass',2000,6000);tone('square',800,200,.1,.06);break;
  case 'intro':tone('sawtooth',200,800,.6,.05);noise(.8,.2,'bandpass',200,2000,0,2);break;
  case 'quip':tone('square',660,0,.06,.05);tone('square',880,0,.06,.05,.07);break;
  case 'nope':tone('square',200,150,.1,.06);break;
  case 'hoop':tone('sine',1200,300,1,.1);break;
  case 'fanfare':[[69,0],[73,.12],[76,.24],[81,.36]].forEach(([m,w])=>tone('square',mtof(m),0,.5,.07,w));chord([69,73,76,81],1.6,.05,'triangle',.5);break;
 }}
const CH=[[45,[57,60,64,69]],[41,[53,57,60,65]],[43,[55,59,62,67]],[40,[52,56,59,64]]];
function bgmTick(){if(!AC||!bgmG)return;const STEP=60/150/2;if(bgmNext<AC.currentTime)bgmNext=AC.currentTime+.05;
 while(bgmNext<AC.currentTime+.15){const s=bgmStep,w=bgmNext-AC.currentTime;const ch=CH[(s>>3)%4];const b=ch[0]+[0,0,12,0,0,12,0,12][s%8];
  tone('sawtooth',mtof(b),0,STEP*.9,.16,w,bgmLP);
  if(s%2===0)tone('sine',150,45,.16,.5,w,bgmG);
  if(s%4===2)noise(.13,.28,'highpass',1500,1500,w,1,bgmG);
  if(s%2===1)noise(.035,.08,'highpass',8000,8000,w,1,bgmG);
  tone('square',mtof(ch[1][[0,1,2,3,2,1,0,2][s%8]]+12),0,STEP*.6,.03,w,bgmG);
  bgmNext+=STEP;bgmStep=(bgmStep+1)%32}}
function bgmDuck(on){if(bgmG)bgmG.gain.setTargetAtTime(on?.07:.3,AC.currentTime,.1)}

// ===== 効果 =====
function burst(x,y,n,cols,spd,life,size,k=0,dir=null,spread=TAU){
 for(let i=0;i<n;i++){const a=dir===null?rng()*TAU:dir+(rng()-.5)*spread,s=spd*(.25+rng()*.75);
  parts.push({k,x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,t:0,life:life*(.5+rng()*.5),s:size*(.6+rng()*.8),c:cols[(rng()*cols.length)|0],rot:rng()*TAU,vr:(rng()-.5)*10})}}
function ono(str,x,y,size,col){floats.push({str,x,y,vy:-60,t:0,life:.95,size,c:col,ono:true,rot:R(-.15,.15)})}
function banner(str,y,size,c1,c2,o={}){if(o.tag)for(const b of banners)if(b.tag===o.tag)b.t=Math.max(b.t,b.dur-.12);
 banners.push({str,y,size,c1,c2,t:-(o.delay||0),dur:o.dur||1.5,skew:o.skew!==false,tag:o.tag,glow:o.glow||c2,x:o.x||W/2})}
function addCrack(lx,ly,len,w){if(!P||P.d.kind==='bh')return;const pts=[[lx,ly]];let a=rng()*TAU,x=lx,y=ly;const n=4+(len/22|0);
 for(let i=0;i<n;i++){a+=R(-.7,.7);x+=Math.cos(a)*len/n;y+=Math.sin(a)*len/n;pts.push([x,y])}
 P.cracks.push({pts,w});if(len>70){const m=pts[(pts.length/2)|0];const b=[[m[0],m[1]]];let bx=m[0],by=m[1],ba=a+R(1,2)*(rng()<.5?-1:1);for(let i=0;i<4;i++){ba+=R(-.5,.5);bx+=Math.cos(ba)*len*.12;by+=Math.sin(ba)*len*.12;b.push([bx,by])}P.cracks.push({pts:b,w:w*.6})}

 for(const b of bolts){b.t+=dt;if(!P){b.dead=1;continue}const tx=cx()+b.rx,ty=cy()+b.ry,dx=tx-b.x,dy=ty-b.y,d=Math.hypot(dx,dy)||1,sp=1600;
  b.vx+=(dx/d*sp-b.vx)*Math.min(1,dt*9);b.vy+=(dy/d*sp-b.vy)*Math.min(1,dt*9);b.tr.push(b.x,b.y);if(b.tr.length>16)b.tr.splice(0,2);b.x+=b.vx*dt;b.y+=b.vy*dt;
  if(d<Math.max(22,sp*dt*1.3)||b.t>1.5){b.dead=1;boltHit(b)}}
 bolts=bolts.filter(b=>!b.dead);
 for(const p of projs){if(p.delay>0){p.delay-=dt;continue}if(!P){p.dead=1;continue}p.t+=dt;const tx=cx()+p.rx,ty=cy()+p.ry,dx=tx-p.x,dy=ty-p.y,d=Math.hypot(dx,dy)||1,st=p.k==='meteor'?3:8;
  p.vx+=(dx/d*p.sp-p.vx)*Math.min(1,dt*st);p.vy+=(dy/d*p.sp-p.vy)*Math.min(1,dt*st);p.x+=p.vx*dt;p.y+=p.vy*dt;
  if(p.k==='fire')burst(p.x,p.y,3,['#ff0','#f80','#f40'],80,.4,9,1);else if(p.k==='meteor')burst(p.x,p.y,2,['#fc6','#f60'],60,.4,7,1);else burst(p.x,p.y,1,['#bef'],40,.25,2,0);
  if(d<Math.max(24,p.sp*dt*1.2)||p.t>2.5){p.dead=1;impact(p)}}
 projs=projs.filter(p=>!p.dead);
 const DR=[Math.exp(-3.2*dt),Math.exp(-2.2*dt),Math.exp(-1.2*dt),Math.exp(-.5*dt)];let j=0;
 for(let i=0;i<parts.length;i++){const p=parts[i];p.t+=dt;if(p.t>=p.life)continue;const f=DR[p.k];p.vx*=f;p.vy*=f;p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;parts[j++]=p}
 parts.length=j;if(parts.length>CAP)parts.splice(0,parts.length-CAP);
 for(const r of rings){r.t+=dt;if(r.t>0){r.r+=r.vr*dt;r.vr*=Math.exp(-2*dt)}}rings=rings.filter(r=>r.t<r.life);
 for(const f of floats){f.t+=dt;f.y+=f.vy*dt;f.vy*=Math.exp(-3*dt)}floats=floats.filter(f=>f.t<f.life);
 for(const l of lights)l.t+=dt;lights=lights.filter(l=>l.t<l.life);
 for(const c of chunks){c.t+=dt;c.x+=c.vx*dt;c.y+=c.vy*dt;c.rot+=c.vr*dt;if(rng()<.15)burst(c.x,c.y,1,[c.glow],40,.6,5,1)}chunks=chunks.filter(c=>c.t<c.life);
 for(const r of rays)r.t+=dt;rays=rays.filter(r=>r.t<r.dur);
 for(const s of slashes)s.t+=dt;slashes=slashes.filter(s=>s.t<s.dur);
 for(const f of flares)f.t+=dt;flares=flares.filter(f=>f.t<f.dur);
 for(const e of extras){e.t+=dt;e.x+=e.vx*dt;e.y+=e.vy*dt;e.rot+=e.vr*dt}extras=extras.filter(e=>e.t<4);
}

function outText(str,x,y,size,fill,stroke='#000',lw,align='center',glw=null){g.font=`900 ${size}px ${FONT}`;g.textAlign=align;g.textBaseline='middle';g.lineJoin='round';if(lw==null)lw=size*.16;
 if(glw){g.save();g.globalAlpha*=.55;g.strokeStyle=glw;g.lineWidth=lw*2.6;g.strokeText(str,x,y);g.restore()}
 if(lw>0){g.strokeStyle=stroke;g.lineWidth=lw;g.strokeText(str,x,y)}g.fillStyle=fill;g.fillText(str,x,y)}
function grad(y,size,c1,c2){const gr=g.createLinearGradient(0,y-size*.5,0,y+size*.5);gr.addColorStop(0,c1);gr.addColorStop(1,c2);return gr}
function glow(x,y,r,col){if(r<=0)return;g.save();g.globalCompositeOperation='lighter';const gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,col);gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.beginPath();g.arc(x,y,r,0,TAU);g.fill();g.restore()}
function rrect(x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}

function drawRings(c,x,y,r,back){c.save();c.translate(x,y);c.rotate(-.32);c.beginPath();if(back)c.rect(-r*3,-r*3,r*6,r*3);else c.rect(-r*3,0,r*6,r*3);c.clip();ringLines(c,r);c.restore()}
function ringLines(c,r,sy=.24){for(let i=0;i<24;i++){const f=1.28+i*.038,gap=i===15||i===16,a=gap?.06:.35+.3*Math.abs(Math.sin(i*1.7));c.strokeStyle=`rgba(${232-i*2},${210-i*3},${160-i*3},${a})`;c.lineWidth=r*.04;c.beginPath();c.ellipse(0,0,r*f,Math.abs(r*f*sy),0,0,TAU);c.stroke()}}
function disk(c,x,y,r,t,back){c.save();c.translate(x,y);c.rotate(-.12);c.beginPath();if(back)c.rect(-r*4,-r*4,r*8,r*4);else c.rect(-r*4,0,r*8,r*4);c.clip();
 for(let i=0;i<18;i++){const f=1.25+i*.07,hot=1-i/18;c.strokeStyle=`rgba(255,${Math.round(120+120*hot)},${Math.round(60+150*hot*hot)},${.15+.5*hot})`;c.lineWidth=r*.07;c.setLineDash([r*(.3+i*.05),r*.25]);c.lineDashOffset=-t*r*(4-i*.15);c.beginPath();c.ellipse(0,0,r*f,r*f*.26,0,0,TAU);c.stroke()}
 c.setLineDash([]);
 if(back){for(let j=0;j<4;j++){c.strokeStyle=`rgba(255,${190-j*20},${120-j*20},${.35-j*.07})`;c.lineWidth=r*.06;c.beginPath();c.arc(0,0,r*(1.16+j*.07),Math.PI,TAU);c.stroke()}}
 c.restore()}
function drawBH(c,x,y,r,p){const t=realT;c.save();c.globalCompositeOperation='lighter';
 const gr=c.createRadialGradient(x,y,r*.9,x,y,r*3);gr.addColorStop(0,'rgba(255,150,60,.35)');gr.addColorStop(1,'rgba(120,40,160,0)');c.fillStyle=gr;c.beginPath();c.arc(x,y,r*3,0,TAU);c.fill();
 disk(c,x,y,r,t,true);c.strokeStyle='rgba(255,220,160,.9)';c.lineWidth=r*.07;c.beginPath();c.arc(x,y,r*1.06,0,TAU);c.stroke();c.lineWidth=r*.3;c.strokeStyle='rgba(255,140,60,.22)';c.stroke();c.restore();
 c.fillStyle='#000';c.beginPath();c.arc(x,y,r,0,TAU);c.fill();

function drawPlanet(c,p,x,y,r,o={}){const k=p.d.kind;if(r<1)return;
 if(k==='bh'){drawBH(c,x,y,r,p);return}
 if(k==='sun'&&!o.noGlow){const fl=1+Math.sin(realT*7)*.03+Math.sin(realT*13)*.02,gr=c.createRadialGradient(x,y,r*.8,x,y,r*2*fl);gr.addColorStop(0,'rgba(255,200,80,.75)');gr.addColorStop(.35,'rgba(255,120,20,.25)');gr.addColorStop(1,'rgba(255,60,0,0)');c.save();c.globalCompositeOperation='lighter';c.fillStyle=gr;c.beginPath();c.arc(x,y,r*2.1,0,TAU);c.fill();c.restore()}
 if(k==='saturn'&&!o.noRings)drawRings(c,x,y,r,true);
 c.save();c.beginPath();c.arc(x,y,r,0,TAU);c.clip();
 const th=p.tex.height,tw=p.tex.width,sw=tw*(2*r/th),off=(((p.rot%1)+1)%1)*sw;
 c.drawImage(p.tex,x-r-off,y-r,sw,2*r);c.drawImage(p.tex,x-r-off+sw,y-r,sw,2*r);
 if(k==='sun'){const gr=c.createRadialGradient(x,y,r*.3,x,y,r);gr.addColorStop(0,'rgba(255,255,220,.35)');gr.addColorStop(.75,'rgba(255,140,0,0)');gr.addColorStop(1,'rgba(200,40,0,.55)');c.fillStyle=gr;c.fillRect(x-r,y-r,2*r,2*r)}
 else{const gr=c.createRadialGradient(x-r*.4,y-r*.4,r*.05,x-r*.1,y-r*.1,r*1.25);gr.addColorStop(0,'rgba(255,255,255,.18)');gr.addColorStop(.45,'rgba(0,0,0,0)');gr.addColorStop(1,'rgba(0,0,10,.88)');c.fillStyle=gr;c.fillRect(x-r,y-r,2*r,2*r)}
 const low=p.max?1-Math.max(0,p.hp)/p.max:0,boost=o.boost||0;
 if(low>.3){c.fillStyle=`rgba(255,40,0,${(low-.3)*.25})`;c.fillRect(x-r,y-r,2*r,2*r)}
 if(p.cracks.length){const s=r/p.r,ia=Math.min(1,.45+low*.6+boost);c.save();c.lineCap='round';c.lineJoin='round';c.globalCompositeOperation='lighter';
  for(const cr of p.cracks){c.beginPath();c.moveTo(x+cr.pts[0][0]*s,y+cr.pts[0][1]*s);for(let i=1;i<cr.pts.length;i++)c.lineTo(x+cr.pts[i][0]*s,y+cr.pts[i][1]*s);
   c.globalAlpha=ia*.35;c.strokeStyle=p.d.crack;c.lineWidth=cr.w*s*(4+boost*6);c.stroke();c.globalAlpha=ia;c.strokeStyle='#fff6d0';c.lineWidth=cr.w*s*(1+boost);c.stroke()}
  c.restore()}
 if(p.flash>0||boost>0){c.globalCompositeOperation='lighter';c.fillStyle=`rgba(255,255,255,${Math.min(.8,p.flash*3+boost*.5)})`;c.fillRect(x-r,y-r,2*r,2*r);c.globalCompositeOperation='source-over'}
 c.restore();
 if(k==='earth'&&!o.noGlow){const gr=c.createRadialGradient(x,y,r*.92,x,y,r*1.15);gr.addColorStop(0,'rgba(110,180,255,.55)');gr.addColorStop(1,'rgba(110,180,255,0)');c.save();c.globalCompositeOperation='lighter';c.fillStyle=gr;c.beginPath();c.arc(x,y,r*1.15,0,TAU);c.fill();c.restore()}
 if(k==='saturn'&&!o.noRings)drawRings(c,x,y,r,false)}

 for(const f of[1,.86,.5]){g.beginPath();g.arc(0,0,Rr*f,0,TAU);g.stroke()}
 for(const off of[0,Math.PI]){g.beginPath();for(let i=0;i<3;i++){const a=off+i*TAU/3-Math.PI/2;g[i?'lineTo':'moveTo'](Math.cos(a)*Rr*.86,Math.sin(a)*Rr*.86)}g.closePath();g.stroke()}
 for(let i=0;i<36;i++){const a=i*TAU/36;g.beginPath();g.moveTo(Math.cos(a)*Rr*.86,Math.sin(a)*Rr*.86);g.lineTo(Math.cos(a)*Rr*(i%3?.9:.97),Math.sin(a)*Rr*(i%3?.9:.97));g.stroke()}
 g.font=`700 ${Math.max(8,Rr*.08)}px serif`;g.textAlign='center';g.textBaseline='middle';const GL='ΑΒΓΔΕΖΗΘΙΚΛΜΝΞΟΠΡΣΤΥΦΧΨΩ';
 for(let i=0;i<24;i++){const a=i*TAU/24;g.save();g.rotate(a);g.fillText(GL[i],0,-Rr*.93);g.restore()}
 g.beginPath();g.arc(0,0,Rr*.12,0,TAU);g.stroke();g.restore()}

function drawParts(){
 for(const p of parts){if(p.k<2)continue;const q=p.t/p.life;

  else{g.globalAlpha=1-q*q;g.fillStyle=p.c;const s=p.s,co=Math.cos(p.rot),si=Math.sin(p.rot);g.beginPath();g.moveTo(p.x+co*s,p.y+si*s);g.lineTo(p.x-si*s*.6-co*s*.5,p.y+co*s*.6-si*s*.5);g.lineTo(p.x+si*s*.5-co*s*.7,p.y-co*s*.5-si*s*.7);g.closePath();g.fill()}}

  if(p.k===0){g.globalAlpha=1-q;g.strokeStyle=p.c;g.lineWidth=p.s*(1-q*.7);g.beginPath();g.moveTo(p.x,p.y);g.lineTo(p.x-p.vx*.03,p.y-p.vy*.03);g.stroke()}
