<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>遍照の道 〜空海伝〜</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Shippori+Mincho:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#2b1d12;--paper:#fbf3dc;--gold:#d9a93a;--red:#b8392b;--teal:#3f7f78}
*{box-sizing:border-box}
button{color:#2b1d12;-webkit-text-fill-color:#2b1d12}
button:disabled{color:#6a5a4a;-webkit-text-fill-color:#6a5a4a}
html,body{margin:0;height:100%;background:#1c1610;color:var(--ink);font-family:"DotGothic16","Hiragino Kaku Gothic ProN",sans-serif;overflow:hidden}
#game{position:relative;width:min(100vw,160vh);aspect-ratio:16/10;margin:0 auto;top:50%;transform:translateY(-50%);background:#000;overflow:hidden;user-select:none}
#view{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
.hidden{display:none!important}
.panel{background:var(--paper);border:3px solid var(--ink);box-shadow:0 0 0 3px var(--gold),0 0 0 6px var(--ink),4px 6px 0 6px rgba(0,0,0,.35);border-radius:4px}
#hud{position:absolute;left:8px;top:8px;right:8px;display:flex;gap:8px;align-items:flex-start;pointer-events:none;font-size:clamp(10px,1.35vw,15px)}
#stat{padding:6px 10px;line-height:1.45;min-width:16em}
#stat .nm{font-size:1.25em;color:var(--red)}
.bar{display:inline-block;width:7em;height:.8em;border:2px solid var(--ink);background:#e9dcc0;vertical-align:middle;position:relative}
.bar i{position:absolute;left:0;top:0;bottom:0;background:#d0473a}
.grid{display:grid;grid-template-columns:auto auto auto;gap:0 12px}
#rcol{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
#minibox{padding:4px;line-height:1}
#mininame{font-size:.8em;text-align:center;margin-bottom:3px;color:#5a4030}
#mini{display:block;width:11em;image-rendering:pixelated;border:2px solid var(--ink)}
#obj{padding:6px 10px;max-width:24em;line-height:1.4}
#obj b{color:var(--red)}
#btns{position:absolute;right:8px;bottom:8px;display:flex;gap:6px}
#btns button,.btn{font-family:inherit;font-size:clamp(10px,1.3vw,14px);background:var(--paper);border:3px solid var(--ink);padding:4px 10px;cursor:pointer;box-shadow:2px 3px 0 rgba(0,0,0,.4)}
#btns button:hover,.btn:hover{background:#ffe9a8}
.btn:disabled{opacity:.45;cursor:default;background:#ddd}
#hint{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);padding:4px 12px;font-size:clamp(10px,1.3vw,14px);pointer-events:none}
#loc{position:absolute;left:50%;top:22%;transform:translateX(-50%);padding:10px 28px;font-size:clamp(14px,2.4vw,28px);pointer-events:none;transition:opacity .8s;text-align:center}
#loc small{display:block;font-size:.5em;color:#7a5a3a}
#toast{position:absolute;left:8px;bottom:8px;display:flex;flex-direction:column;gap:4px;pointer-events:none;font-size:clamp(10px,1.2vw,13px)}
#toast div{padding:3px 10px;animation:fade 4s forwards}
@keyframes fade{0%{opacity:0;transform:translateX(-10px)}8%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}
#dialog{position:absolute;left:4%;right:4%;bottom:3%;min-height:24%;padding:10px 18px 12px 18px;font-size:clamp(12px,1.75vw,20px);line-height:1.6;display:flex;gap:16px;align-items:flex-start;background:#f4f8e4}
#pframe{flex:0 0 auto;width:6.2em;height:6.2em;border:3px solid var(--ink);background:#e8dcb8;box-shadow:inset 0 0 0 2px #c8a860}
#portrait{width:100%;height:100%;image-rendering:pixelated;display:block}
#dbody{flex:1;min-width:0}
#dname{text-align:center;color:#2b1d12;font-size:.95em;letter-spacing:.1em;margin-bottom:2px}
#dtext{white-space:pre-wrap;min-height:3.2em}
#items{display:flex;gap:6px;padding:5px 8px;align-items:center}
.slot{position:relative;display:flex;align-items:center;gap:3px}
.slot canvas{width:1.9em;height:1.9em;image-rendering:pixelated}
.slot span{font-size:.95em;min-width:1em}
.slot.bump{animation:bump .5s}
@keyframes bump{30%{transform:scale(1.35)}100%{transform:none}}
.clock{color:#5a4030}
.goal{margin-top:4px;font-size:.88em}
.goal div{display:flex;gap:6px;align-items:center}
.goal span:first-child{width:5.5em}
.gb{flex:1;height:.6em;border:2px solid var(--ink);background:#e9dcc0;position:relative;min-width:4em}
.gb i{position:absolute;left:0;top:0;bottom:0;background:#4a9a5a}
.goal small{color:#7a5a3a}
.itemfx{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);display:flex;align-items:center;gap:8px;padding:6px 14px;font-size:clamp(11px,1.5vw,17px);opacity:0;transition:opacity .35s, transform .55s ease-in, top .35s;pointer-events:none;z-index:20}
.itemfx.up{opacity:1;top:42%}
.itemfx canvas{width:2.2em;height:2.2em;image-rendering:pixelated}
.mi{width:1.3em;height:1.3em;image-rendering:pixelated;vertical-align:middle;margin-right:6px}
.skillfx{position:absolute;left:50%;top:18%;transform:translate(-50%,-10px);min-width:40%;max-width:70%;padding:10px 22px;text-align:center;opacity:0;transition:opacity .45s,transform .45s;pointer-events:none;z-index:21;background:linear-gradient(180deg,#fffaf0,#f6e8c4)}
.skillfx.show{opacity:1;transform:translate(-50%,0)}
.skillfx .sk1{font-size:clamp(10px,1.2vw,13px);color:#8a6a3a;letter-spacing:.3em}
.skillfx .sk2{font-size:clamp(16px,2.4vw,28px);color:#b8392b;margin:2px 0}
.skillfx .sk3{font-size:clamp(10px,1.25vw,14px);color:#4a3a2a}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .2s}
#sleepfx{position:absolute;inset:0;opacity:0;transition:opacity 1.1s;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:"Shippori Mincho",serif;color:#f4ecd8;pointer-events:none}
#sleepfx.show{opacity:1}
#sleepfx.night{background:radial-gradient(circle at 70% 25%,#3a4670 0 3%,#1a2040 4%,#0a0c1c 70%)}
#sleepfx.morning{background:linear-gradient(180deg,#f6d8a8 0%,#f8e8c8 45%,#e8b880 100%);color:#5a3a1a;transition:opacity 1.1s,background 1s}
#sleepfx.morning #sfxsky{width:3.2em;height:3.2em;border-radius:50%;margin-bottom:.8em;background:radial-gradient(circle,#fffbe8 30%,#f8c878 70%,rgba(248,200,120,0) 72%);animation:rise 1.8s ease-out}
@keyframes rise{from{transform:translateY(1.2em);opacity:0}to{transform:none;opacity:1}}
#sfxtext{font-size:clamp(16px,3vw,36px);letter-spacing:.3em}
#sfxdate{font-size:clamp(13px,2vw,24px);margin-top:.6em;letter-spacing:.15em}
#dnext{position:absolute;right:14px;bottom:6px;animation:blink 1s infinite}
@keyframes blink{50%{opacity:0}}
#dchoices{display:flex;flex-direction:column;gap:4px;margin-top:6px}
#dchoices button{text-align:left;font-family:inherit;font-size:.9em;background:#fff8e6;border:2px solid var(--ink);padding:3px 10px;cursor:pointer}
#dchoices button.sel,#dchoices button:hover{background:#ffd978}
#menu{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);min-width:42%;max-width:80%;max-height:86%;overflow:auto;padding:14px 18px;font-size:clamp(11px,1.5vw,17px)}
#menu h2{margin:0 0 4px;font-size:1.3em;color:var(--red);font-weight:normal}
#menu .desc{margin:0 0 10px;color:#5a4030;font-size:.9em;white-space:pre-wrap}
#menu .items{display:flex;flex-direction:column;gap:5px}
#menu .it{display:flex;justify-content:space-between;gap:16px;text-align:left;font-family:inherit;font-size:1em;background:#fff8e6;border:2px solid var(--ink);padding:5px 10px;cursor:pointer}
#menu .it small{color:#7a5a3a}
#menu .it.sel,#menu .it:hover{background:#ffd978}
#menu .it:disabled{opacity:.45;cursor:default;background:#eee}
#mg{position:absolute;inset:0;background:rgba(20,14,8,.82);display:flex;align-items:center;justify-content:center}
#mgbox{position:relative;width:86%;aspect-ratio:3/2;padding:0}
#mgc{width:100%;height:100%;display:block;touch-action:none}
#mgui{position:absolute;left:0;right:0;bottom:3%;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;font-size:clamp(11px,1.5vw,17px)}
#mgui button{font-family:inherit;font-size:1em;background:var(--paper);border:3px solid var(--ink);padding:5px 12px;cursor:pointer;box-shadow:2px 3px 0 rgba(0,0,0,.4)}
#mgui button:hover{background:#ffe9a8}
#mgui button:disabled{opacity:.4}
#buildbar{position:absolute;left:8px;right:8px;bottom:8px;padding:8px;display:flex;gap:6px;flex-wrap:wrap;font-size:clamp(10px,1.2vw,13px);align-items:center}
#buildbar button{font-family:inherit;font-size:1em;background:#fff8e6;border:2px solid var(--ink);padding:3px 8px;cursor:pointer;line-height:1.2}
#buildbar button.sel{background:#ffd978}
#buildbar button:disabled{opacity:.4}
#title{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 40%,#3a2a4a 0%,#130d18 70%);color:#fbf3dc}
#title canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
#title .tt{position:relative;font-size:clamp(28px,6vw,72px);letter-spacing:.15em;color:#f6d77a;text-shadow:3px 3px 0 #6a2a1a,0 0 20px rgba(255,200,80,.5)}
#title .st{position:relative;font-size:clamp(12px,2vw,22px);margin:6px 0 28px;letter-spacing:.3em}
#title .tb{position:relative;display:flex;flex-direction:column;gap:10px}
#title button{color:#2b1d12;font-weight:bold;font-family:inherit;font-size:clamp(12px,1.8vw,20px);padding:8px 40px;background:var(--paper);border:3px solid var(--ink);box-shadow:0 0 0 3px var(--gold);cursor:pointer}
#title button:hover{background:#ffe9a8}
#title .back{position:absolute;left:12px;top:10px;color:#f4ecd8;font-size:clamp(11px,1.3vw,15px);text-decoration:none;opacity:.85}
#title .back:hover{opacity:1;text-decoration:underline}
#title .help{position:relative;margin-top:24px;font-size:clamp(10px,1.2vw,14px);color:#f4ecd8;text-shadow:0 1px 3px #000;text-align:center;line-height:1.7}
#scene{position:absolute;inset:0;background:#000;opacity:0;transition:opacity .6s;cursor:pointer}
#scene.on{opacity:1}
#scv{position:absolute;inset:0;width:100%;height:100%}
#snarr{position:absolute;left:50%;bottom:4%;transform:translateX(-50%);width:60%;min-height:19%;padding:1.6% 3.5% 2%;font-family:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;font-size:clamp(12px,1.85vw,23px);line-height:1.7;color:#2a2018;letter-spacing:.08em;
  background:linear-gradient(180deg,rgba(252,248,236,.93),rgba(236,228,206,.93));border:2px solid #c8b07a;border-radius:6px;box-shadow:0 0 0 1px rgba(255,255,255,.6) inset,0 6px 24px rgba(0,0,0,.45)}
#sdate{font-weight:700;margin-bottom:.15em}
#stext{white-space:pre-wrap;min-height:3.4em}
#snext{position:absolute;left:50%;bottom:-.9em;transform:translateX(-50%);width:1.2em;height:1.3em;background:#e8c860;clip-path:polygon(0 0,100% 0,100% 55%,50% 100%,0 55%);border:1px solid #8a6a2a;opacity:0}
#snarr.done #snext{opacity:1;animation:bob 1s infinite}
@keyframes bob{50%{transform:translate(-50%,4px)}}
#sskip{position:absolute;right:12px;bottom:8px;color:rgba(255,255,255,.6);font-size:clamp(9px,1.1vw,13px)}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .4s}
</style>
</head>
<body>
<div id="game">
  <canvas id="view" width="480" height="300"></canvas>
  <div id="hud" class="hidden">
    <div id="stat" class="panel"></div>
    <div id="items" class="panel"></div>
    <div id="rcol"><div id="obj" class="panel"></div><div id="minibox" class="panel"><div id="mininame"></div><canvas id="mini"></canvas></div></div>
  </div>
  <div id="hint" class="panel hidden"></div>
  <div id="loc" class="panel hidden"></div>
  <div id="toast"></div>
  <div id="btns" class="hidden">
    <button id="bStatus">状態 (C)</button>
    <button id="bSave">保存</button>
  </div>
  <div id="buildbar" class="panel hidden"></div>
  <div id="dialog" class="panel hidden"><div id="pframe"><canvas id="portrait" width="16" height="16"></canvas></div><div id="dbody"><div id="dname"></div><div id="dtext"></div><div id="dchoices"></div></div><div id="dnext">▼</div></div>
  <div id="fade"></div>
  <div id="sleepfx" class="hidden"><div id="sfxsky"></div><div id="sfxtext"></div><div id="sfxdate"></div></div>
  <div id="menu" class="panel hidden"></div>
  <div id="mg" class="hidden"><div id="mgbox" class="panel"><canvas id="mgc" width="900" height="600"></canvas><div id="mgui"></div></div></div>
  <div id="scene" class="hidden"><canvas id="scv" width="960" height="600"></canvas><div id="snarr"><div id="sdate"></div><div id="stext"></div><div id="snext"></div></div><div id="sskip">Space / クリックで進む</div></div>
  <div id="flash"></div>
  <div id="title">
    <canvas id="tcv" width="240" height="150"></canvas>
    <div class="tt">遍照の道</div>
    <div class="st">〜 空海伝 〜</div>
    <div class="tb">
      <button id="tNew">はじめから</button>
      <button id="tLoad">つづきから</button>
    </div>
    <a class="back" href="../../">← ゲーム一覧にもどる</a>
    <div class="help">移動：矢印キー / WASD　　調べる・話す・決定：Space / Enter / Z<br>閉じる：Esc / X　　状態：C　　（マップをクリックでも移動できます）</div>
  </div>
</div>
<script src="js/art.js"></script>
<script src="js/maps.js"></script>
<script src="js/interiors.js"></script>
<script src="js/minigames.js"></script>
<script src="js/skills.js"></script>
<script src="js/scenes.js"></script>
<script src="js/story.js"></script>
<script src="js/game.js"></script>
</body>
</html>
