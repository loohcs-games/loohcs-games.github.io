<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>白球の夏</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
/* Layout: one column like a night-game scoreboard panel; screens swap inside it. Deliberately single dark theme (ナイター). */
:root{
  --bg:#0c2117; --panel:#123222; --panel2:#18432d; --line:#2e6847; --ink:#06120c;
  --fg:#f1ead6; --dim:#9fb5a3; --lamp:#ffc23d; --lamp-dim:#5a4a1c; --red:#e65a42; --green:#5fd27a; --sky:#79c2e8;
  --font:"DotGothic16","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0}
.back{max-width:780px;margin:0 auto;padding:0 16px 28px;font-size:13px}
.back a{color:var(--dim)}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.65;-webkit-font-smoothing:none}
h1,h2,h3,p{margin:0;font-weight:400;text-wrap:balance}
button,input{font:inherit;color:inherit}
.wrap{max-width:780px;margin:0 auto;padding-block:16px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.btn{background:var(--panel2);border:2px solid var(--line);box-shadow:0 4px 0 var(--ink);padding:10px 14px;color:var(--fg);text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;line-height:1.3}
.btn small{color:var(--dim);font-size:12px}
.btn:hover:not(:disabled){border-color:var(--lamp)}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn:disabled{opacity:.38;cursor:not-allowed}
.btn.primary{background:var(--lamp);border-color:#ffe39a;color:#241a03}
.btn.primary small{color:#5b4510}
.btn.center{align-items:center;text-align:center}
:focus-visible{outline:2px dashed var(--lamp);outline-offset:3px}
.panel{background:var(--panel);border:2px solid var(--line);box-shadow:0 4px 0 var(--ink);padding:12px 14px;min-width:0}
.panel h2{font-size:18px;color:var(--lamp);display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.panel h2 small{color:var(--dim);font-size:12px}
.lbl{font-size:12px;color:var(--dim);letter-spacing:.08em}
.pix{image-rendering:pixelated;image-rendering:crisp-edges}

/* title */
.title{display:flex;flex-direction:column;gap:16px;align-items:stretch}
.title .logo{font-size:clamp(44px,12vw,84px);color:var(--lamp);line-height:1;text-shadow:4px 4px 0 var(--red),8px 8px 0 var(--ink);letter-spacing:.05em}
.title .tag{color:var(--fg);font-size:18px}
.title canvas{width:100%;max-width:100%;aspect-ratio:4/3;border:2px solid var(--line);background:#000}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--dim)}
.form input{background:var(--ink);border:2px solid var(--line);padding:8px 10px;color:var(--fg);min-width:0}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.btn{flex:1 1 160px}
.howto{font-size:14px;color:var(--dim);display:grid;gap:4px}
.howto b{color:var(--fg);font-weight:400}

/* home */
.top{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:6px 14px;border-bottom:2px solid var(--line);padding-bottom:8px}
.date{font-size:26px;color:var(--lamp);line-height:1.2}
.date .yr{display:inline-block;background:var(--red);color:var(--fg);font-size:14px;padding:2px 8px;margin-right:8px;vertical-align:middle}
.countdown{font-size:14px;color:var(--dim)}
.countdown b{color:var(--lamp);font-size:22px;font-weight:400}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.stat{display:grid;grid-template-columns:92px 1fr 56px;gap:8px;align-items:center;font-size:14px}
.stat .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--lamp)}
.stats{display:grid;gap:6px;margin-top:8px}
.bar{height:12px;background:var(--ink);border:1px solid var(--line);position:relative;overflow:hidden}
.bar>i{position:absolute;inset:0 auto 0 0;background:repeating-linear-gradient(90deg,var(--lamp) 0 5px,transparent 5px 7px)}
.bar.hp>i{background:repeating-linear-gradient(90deg,var(--green) 0 5px,transparent 5px 7px)}
.bar.hp.low>i{background:repeating-linear-gradient(90deg,var(--red) 0 5px,transparent 5px 7px)}
.bar.bond>i{background:repeating-linear-gradient(90deg,#ff8fa3 0 5px,transparent 5px 7px)}
.mood{display:flex;gap:4px;align-items:center}
.mood i{width:12px;height:12px;background:var(--ink);border:1px solid var(--line)}
.mood i.on{background:var(--lamp);border-color:var(--lamp)}
.mates{display:grid;gap:8px;margin-top:8px}
.mate{display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:center}
.mate img{width:44px;height:44px;background:var(--ink);border:2px solid var(--line)}
.mate .nm{display:flex;justify-content:space-between;gap:6px;font-size:14px;flex-wrap:wrap}
.mate .nm span{color:var(--dim);font-size:12px}
.mate .sp{color:var(--sky);font-size:11px}
.msg{font-size:15px;min-height:2.6em}
.msg .gain{color:var(--lamp)}
.cmds{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.team-line{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--dim)}
.team-line b{color:var(--fg);font-weight:400}
.btn .mates-on{display:flex;gap:3px;align-items:center;margin-top:4px;flex-wrap:wrap}
.btn .mates-on img{width:22px;height:22px;border:1px solid var(--line);background:var(--ink)}
.btn .lv{color:var(--sky);font-size:11px}
.btn.friend{border-color:#ff8fa3;box-shadow:0 4px 0 var(--ink),0 0 0 1px #ff8fa3 inset}
.ground{position:relative;border:2px solid var(--line);box-shadow:0 4px 0 var(--ink);background:#000;overflow:hidden;user-select:none;-webkit-user-select:none}
.ground canvas{display:block;width:100%;aspect-ratio:16/9}
.ground.playing{cursor:pointer}
.ground.playing .pill{visibility:hidden}
.pill{position:absolute;transform:translate(-50%,-100%);display:flex;align-items:center;gap:3px;background:linear-gradient(#fff6dc,#ffd27a);color:#3a2306;border:2px solid #3a2306;border-radius:999px;padding:2px 9px;font-size:12px;white-space:nowrap;cursor:pointer;box-shadow:0 2px 0 rgba(0,0,0,.45);line-height:1.25}
.pill img{width:15px;height:15px;border:1px solid #3a2306;background:#fff}
.pill .lv{font-size:10px;color:#2a5d8a}
.pill.friend{background:linear-gradient(#ffe6ee,#ff9fb8);animation:glow 1s steps(2) infinite}
@keyframes glow{50%{box-shadow:0 0 0 3px rgba(255,255,255,.7),0 2px 0 rgba(0,0,0,.45)}}
.pill:disabled{filter:grayscale(1);opacity:.55;cursor:not-allowed}
.pill:hover:not(:disabled){background:linear-gradient(#ffffff,#ffe39a)}
.fxtext{position:absolute;right:10px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:flex-end;gap:2px;pointer-events:none}
.fxl{font-size:clamp(14px,3.6vw,20px);color:#fff;text-shadow:2px 2px 0 #000,-1px -1px 0 #000;opacity:0;animation:fxup .5s steps(4) forwards}
.fxl.gain{color:var(--lamp)}.fxl.sp{color:var(--sky)}.fxl.lv{color:#ff9fb8}
@keyframes fxup{0%{opacity:0;transform:translateX(20px)}100%{opacity:1;transform:none}}
.weekban{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);background:var(--ink);color:var(--lamp);border:2px solid var(--lamp);padding:6px 18px;font-size:22px;animation:wb 1.6s forwards;pointer-events:none;white-space:nowrap}
@keyframes wb{0%{opacity:0;transform:translate(-90%,-50%)}15%{opacity:1;transform:translate(-50%,-50%)}75%{opacity:1;transform:translate(-50%,-50%)}100%{opacity:0;transform:translate(-10%,-50%)}}
.pitchsel{display:flex;gap:6px;flex:1 1 100%;flex-wrap:wrap}
.pitchsel .btn{flex:1 1 90px}
.skip{position:absolute;left:6px;right:6px;bottom:6px;background:rgba(6,18,12,.82);border:1px solid var(--line);padding:4px 8px;font-size:12px;pointer-events:none;line-height:1.45}
.skiphead{color:var(--lamp);letter-spacing:.08em}
.skip p{color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.skip p.big{color:var(--lamp)}.skip p.inn{color:var(--sky)}
.cutin{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(6,18,12,.35);cursor:pointer;z-index:2}
.cin{width:100%;background:linear-gradient(90deg,transparent,rgba(190,38,38,.94) 10%,rgba(190,38,38,.94) 90%,transparent);padding:10px 16px;text-align:center;animation:cin .3s steps(4)}
.cint{font-size:clamp(24px,6vw,38px);color:#fff;text-shadow:3px 3px 0 #000;line-height:1.2}
.cins{font-size:13px;color:#ffe9b0}
@keyframes cin{from{transform:translateX(-100%)}to{transform:none}}
.qte{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:3;pointer-events:none}
.qtarget{position:absolute;width:56px;height:56px;border:3px solid #fff;border-radius:50%;box-shadow:0 0 0 2px #000}
.qring{position:absolute;width:56px;height:56px;border:3px solid var(--lamp);border-radius:50%;animation-name:qr;animation-timing-function:linear;animation-fill-mode:forwards}
@keyframes qr{from{transform:scale(3.2)}to{transform:scale(1)}}
.qlabel{position:absolute;top:12%;left:0;right:0;text-align:center;color:#fff;font-size:clamp(15px,4vw,22px);text-shadow:2px 2px 0 #000;padding:0 8px}
.dia i.me{background:var(--red);border-color:#ffb3a6}
.skipnote{font-size:13px;color:var(--dim);padding:8px 0}
.poss{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:8px}
.pos{display:flex;gap:8px;align-items:flex-start;border:2px solid var(--line);padding:6px 8px;cursor:pointer;background:var(--ink)}
.pos:has(input:checked){border-color:var(--lamp);background:var(--panel2)}
.pos input{accent-color:var(--lamp);margin-top:4px}
.pos span{display:flex;flex-direction:column;font-size:15px;line-height:1.3}
.pos small{color:var(--dim);font-size:11px}
.cins2{font-size:13px;color:#fff;margin-top:4px;background:rgba(0,0,0,.4);display:inline-block;padding:1px 10px}
.cheer{display:grid;gap:3px}
.cheerbar>i{background:repeating-linear-gradient(90deg,#ff9f43 0 5px,transparent 5px 7px)}
.cheerbar.full>i{background:repeating-linear-gradient(90deg,#ff5e3a 0 5px,#ffd27a 5px 7px);animation:blink .6s steps(2) infinite}
.grade{display:flex;align-items:center;gap:12px;margin-top:6px}
.grade b{font-size:46px;line-height:1;font-weight:400;text-shadow:3px 3px 0 var(--ink)}
.g-S{color:#ffd700}.g-A{color:#ff9f43}.g-B{color:var(--sky)}.g-C{color:var(--fg)}.g-D{color:var(--dim)}
.hl{margin:6px 0 0;padding-left:1.2em;font-size:13px;color:var(--fg);display:grid;gap:2px}
.readsel{display:flex;gap:6px;align-items:center;flex:1 1 100%;flex-wrap:wrap}
.readsel .btn{flex:1 1 80px;padding:6px 8px}
.cvwrap.shake{animation:shake .4s steps(6)}
@keyframes shake{0%,100%{transform:none}20%{transform:translate(-4px,2px)}40%{transform:translate(4px,-2px)}60%{transform:translate(-3px,-1px)}80%{transform:translate(3px,1px)}}
.cvwrap.flash::after{content:"";position:absolute;inset:0;background:#fff;animation:fl .5s forwards;pointer-events:none}
@keyframes fl{from{opacity:.8}to{opacity:0}}
.boost{display:block;color:#ff9fb8;font-size:13px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{border:1px solid var(--sky);color:var(--sky);font-size:12px;padding:1px 6px}
.sprow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}
.sprow .sp{color:var(--sky)}
.sprow .btn{padding:6px 10px}

/* tournament */
.rounds{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.rd{border:2px solid var(--line);padding:6px 4px;text-align:center;font-size:12px;background:var(--ink);color:var(--dim)}
.rd.win{border-color:var(--green);color:var(--green)}
.rd.now{border-color:var(--lamp);color:var(--lamp);background:var(--panel2)}
.opp{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.opp .name{font-size:24px}
.stars{color:var(--lamp);letter-spacing:2px}
.stage-tag{display:inline-block;padding:2px 10px;background:var(--red);font-size:13px}
.stage-tag.ko{background:#b3832a}

/* match */
.mhead{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
.sbwrap{overflow-x:auto;border:2px solid var(--line);box-shadow:0 4px 0 var(--ink)}
.sb{border-collapse:collapse;font-variant-numeric:tabular-nums;background:#071510;width:100%}
.sb td,.sb th{border:1px solid #1b3f2c;padding:4px 5px;text-align:center;min-width:24px;font-weight:400}
.sb th{color:var(--dim);font-size:12px}
.sb td{color:var(--lamp);font-size:18px}
.sb td.cur{background:#163a28}
.sb td.r{color:var(--fg);background:#0f2a1d}
.sb th.team{text-align:left;white-space:nowrap;color:var(--fg);font-size:14px;max-width:9em;overflow:hidden;text-overflow:ellipsis}
.field{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:12px}
.cvwrap{align-self:start;position:relative;border:2px solid var(--line);box-shadow:0 4px 0 var(--ink);background:#000;cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.cvwrap canvas{display:block;width:100%;aspect-ratio:4/3}
.ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;font-size:clamp(26px,6vw,44px);color:var(--lamp);text-shadow:3px 3px 0 var(--ink),-2px -2px 0 var(--ink);text-align:center;padding:0 8px}
.ov.show{animation:pop 1.1s steps(6) forwards}
@keyframes pop{0%{transform:scale(1.4);opacity:0}15%{transform:scale(1);opacity:1}75%{opacity:1}100%{opacity:0}}
.hint{position:absolute;left:6px;top:6px;font-size:12px;background:rgba(6,18,12,.85);padding:2px 6px;border:1px solid var(--line);pointer-events:none}
.hint:empty{display:none}
.hint{max-width:calc(52% - 10px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.speed{max-width:calc(48% - 10px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.speed{position:absolute;right:6px;top:6px;font-size:13px;color:var(--lamp);background:rgba(6,18,12,.85);padding:2px 6px;border:1px solid var(--line);font-variant-numeric:tabular-nums;pointer-events:none}
.speed:empty{display:none}
.side{display:flex;flex-direction:column;gap:10px;min-width:0}
.bso{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:center;background:#071510;border:2px solid var(--line);padding:8px 10px}
.bso b{font-weight:400;color:var(--dim);font-size:14px}
.lamps{display:flex;gap:6px}
.lamps i{width:14px;height:14px;border-radius:50%;background:#1a2a22;border:1px solid #2c4a3a}
.lamps.b i.on{background:var(--green);box-shadow:0 0 6px var(--green)}
.lamps.s i.on{background:var(--lamp);box-shadow:0 0 6px var(--lamp)}
.lamps.o i.on{background:var(--red);box-shadow:0 0 6px var(--red)}
.diamond{display:flex;gap:12px;align-items:center}
.dia{position:relative;width:64px;height:64px;flex:none}
.dia i{position:absolute;width:16px;height:16px;transform:rotate(45deg);background:#1a2a22;border:2px solid #3b5e4a}
.dia i.on{background:var(--lamp);border-color:#ffe39a}
.dia i:nth-child(1){right:4px;top:24px}.dia i:nth-child(2){left:24px;top:4px}.dia i:nth-child(3){left:4px;top:24px}
.dia i.home{left:24px;top:44px;background:var(--fg);border-color:var(--fg)}
.now{font-size:14px;line-height:1.4}
.now .who{color:var(--lamp);font-size:16px}
.log{background:#071510;border:2px solid var(--line);padding:8px 10px;font-size:13px;height:180px;overflow-y:auto;display:flex;flex-direction:column;gap:3px}
.log p{color:var(--dim)}
.log p.us{color:var(--fg)}
.log p.big{color:var(--lamp)}
.log p.inn{color:var(--sky);border-top:1px dashed #234a35;padding-top:3px;margin-top:2px}
.ctl{display:flex;gap:10px;flex-wrap:wrap}
.ctl .btn{flex:1 1 140px}
.ctl .swing{flex:3 1 220px;font-size:22px;padding:14px}
.plline{font-size:14px;color:var(--dim)}
.plline b{color:var(--lamp);font-weight:400}

/* overlays */
.modal{position:fixed;inset:0;background:rgba(3,10,6,.78);display:flex;align-items:center;justify-content:center;z-index:30;padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
.mbox{max-height:calc(100vh - 32px);overflow-y:auto;background:var(--panel);border:2px solid var(--lamp);box-shadow:0 6px 0 var(--ink);padding:16px;width:min(460px,100%);display:flex;flex-direction:column;gap:10px}
.mbox h3{color:var(--lamp);font-size:18px}
.mbox .opts{display:grid;gap:8px}
.dlg{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;justify-content:center;padding:0 max(12px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));background:linear-gradient(transparent,rgba(3,10,6,.7) 40%);padding-top:60px}
.dbox{width:min(760px,100%);background:#081a11;border:3px solid var(--fg);box-shadow:0 0 0 3px var(--ink),0 6px 0 3px var(--ink);padding:12px 14px;display:grid;grid-template-columns:72px 1fr;gap:12px;cursor:pointer;min-height:120px;position:relative}
.dbox.noport{grid-template-columns:1fr}
.dbox img{width:72px;height:72px;border:2px solid var(--line);background:var(--panel)}
.dname{color:var(--lamp);font-size:15px}
.dtext{font-size:17px;line-height:1.6;min-height:3.2em}
.dnext{position:absolute;right:12px;bottom:6px;color:var(--lamp);animation:blink 1s steps(2) infinite;font-size:12px}
@keyframes blink{50%{opacity:0}}
.toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--lamp);color:#241a03;padding:6px 14px;border:2px solid var(--ink);z-index:50;font-size:15px;max-width:calc(100% - 32px)}

/* ending */
.ending{display:flex;flex-direction:column;gap:14px}
.ending .big{font-size:clamp(36px,9vw,60px);color:var(--lamp);text-shadow:4px 4px 0 var(--red),8px 8px 0 var(--ink);line-height:1.1}
.ending ul{margin:0;padding-left:1.2em;display:grid;gap:4px}

@media (max-width:640px){
  .grid2,.field{grid-template-columns:1fr}
  .form{grid-template-columns:1fr}
  .rounds{grid-template-columns:repeat(3,1fr)}
  .log{height:130px}
}
@media (prefers-reduced-motion:reduce){
  .weekban{display:none}
  .fxl{animation:none;opacity:1}
  .ov.show{animation:none}
  .dnext{animation:none}
}
</style>
</head>
<body>

<div class="wrap" id="app"></div>
<p class="back"><a href="../../">← ゲーム一覧にもどる</a></p>
<div class="dlg" id="dlg" hidden><div class="dbox" id="dbox"><img class="pix" id="dport" alt=""><div><div class="dname" id="dname"></div><div class="dtext" id="dtext"></div></div><div class="dnext">▼ タップ / Enter</div></div></div>
<div class="modal" id="modal" hidden><div class="mbox"><h3 id="mtitle"></h3><p id="msub" class="lbl"></p><div class="opts" id="mopts"></div></div></div>

<script>
/* ============ 基本ユーティリティ ============ */
const $=s=>document.querySelector(s);
const app=$('#app');
const rnd=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(rnd(a,b+1));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let S=null, M=null, busy=false;
const SAVE='hakkyu-natsu-v1';
function save(){try{localStorage.setItem(SAVE,JSON.stringify(S))}catch(e){}}

function spriteCanvas(rows,pal){const c=document.createElement('canvas');c.width=rows[0].length;c.height=rows.length;const x=c.getContext('2d');rows.forEach((r,y)=>[...r].forEach((ch,i)=>{const col=pal[ch]||PAL[ch];if(ch!=='.'&&col){x.fillStyle=col;x.fillRect(i,y,1,1)}}));return c}
const PORT={};
function portrait(id){if(!PORT[id]){const p=PEOPLE[id];const c=spriteCanvas(p.tpl,{...PAL,...p.pal});const big=document.createElement('canvas');big.width=48;big.height=48;const x=big.getContext('2d');x.imageSmoothingEnabled=false;x.fillStyle='#0b2216';x.fillRect(0,0,48,48);x.drawImage(c,0,0,12,12,0,0,48,48);PORT[id]=big.toDataURL()}return PORT[id]}

let sceneActive=false;
function scene(lines){
  return new Promise(res=>{
    const dlg=$('#dlg'),box=$('#dbox'),img=$('#dport'),nm=$('#dname'),tx=$('#dtext');
    let i=0,timer=null,full='';
    sceneActive=true;dlg.hidden=false;
    function show(){
      const [who,text]=lines[i];full=fmt(text);
      if(who==='nar'){box.classList.add('noport');img.hidden=true;nm.textContent=''}
      else{box.classList.remove('noport');img.hidden=false;img.src=portrait(who);nm.textContent=PEOPLE[who].name()}
      tx.textContent='';let k=0;clearInterval(timer);
      const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
      if(reduce){tx.textContent=full;timer=null;return}
      timer=setInterval(()=>{k++;tx.textContent=full.slice(0,k);if(k>=full.length){clearInterval(timer);timer=null}},28);
    }
    function adv(){
      if(timer){clearInterval(timer);timer=null;tx.textContent=full;return}
      i++;if(i>=lines.length){dlg.hidden=true;sceneActive=false;box.onclick=null;document.removeEventListener('keydown',key);res()}else show();
    }
    function key(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();adv()}}
    box.onclick=adv;document.addEventListener('keydown',key);
    show();
  });
}
let modalActive=false;
function choose(title,opts,sub=''){

    $('#modal').hidden=false;setTimeout(()=>box.querySelector('button:not(:disabled)')?.focus(),30);
    function close(){$('#modal').hidden=true;modalActive=false}
  });
}

      <p><b>育成</b>：毎週ひとつ行動を選ぶ。体力が減ったまま練習するとケガをする。</p>
      <p><b>仲間</b>：練習に仲間の顔があれば一緒に練習できて効果アップ。絆60以上なら<b>友情練習</b>。絆が深まるとイベントが起き、仲間が特殊能力に目覚める。</p>
      <p><b>遊びに行く</b>：やる気が上がり、しばらく練習の効果がアップ。美月との絆がMAXになると……。</p>
      <p><b>SP</b>：練習・試合・イベントでたまり、きみの特殊能力（チャンス強打、選球眼など）を覚えられる。</p>

      <p><b>投手を選んだら</b>：守りでは全打者に自分で投げる。球種（1〜4キー）を選び、狙う場所をクリック / タップ。同じ球種が続くと読まれ、緩急とコースの隅で打ち取る。</p>

      <p><b>盛り上がり</b>：出番ごとにミッション。味方の活躍で応援ゲージがたまり、MAXでチャンスを迎えるとチャンステーマ発動。試合後はS〜Dで評価。</p>
      <p><b>出番だけ操作</b>：操作するのはきみ一人。ほかの選手のプレーはスキップされ、きみの打席・守備機会・走塁・投球の場面で止まる。塁に出たら、盗塁や次の塁を狙うかを自分で決める（スタートやスライディングはタイミング入力）。</p>
      <p>地方大会6試合を勝ち抜けば甲子園。3年の夏までに、頂点をつかめ。</p>

}

function gainCalc(k,base){const mult=[0.6,0.8,1,1.15,1.3][S.mood-1]*(S.boost>0?1.25:1);const dim=clamp(1.25-(k==='velo'?(S.st.velo-110)*2:S.st[k])/100,0.3,1.25);return base*mult*dim*rnd(0.85,1.15)*GAIN*(S.camp>0?1.5:1)}
async function doCmd(id){
  if(busy)return;busy=true;
  try{
    const c=cmds().find(x=>x.id===id);const out=[];let fxType=id,fxFriends=[],injScene=false;
    if(id==='hang'){
      const mid=await choose('誰と過ごす？',[...S.mates.map(m=>({label:PEOPLE[m.id].name(),sub:`${MATES.find(d=>d.id===m.id).desc}（絆 ${Math.floor(m.bond)}）`,value:m.id})),{label:'やめる',value:null}]);
      if(!mid){busy=false;return}
      const m=mate(mid);fxFriends=[mid];const g=ri(6,9);m.bond+=g;if(mid!=='mitsuki')m.pow+=0.6;S.hp+=10;S.mood++;S.skp+=2;
      out.push(`${PEOPLE[mid].name()}との絆 +${g}`,'体力 +10','やる気↑');
      if(mid==='mitsuki'&&S.gf){S.love=clamp(S.love+8,0,100);out.push('美月との仲 +8')}
      if(mid==='mitsuki'&&S.confessed&&!S.gf&&m.bond>=100){await scene([['me','美月。……あのときの返事、させてくれ。'],['me','俺も、ずっと好きだった。'],['mitsuki','……遅いよ、ばか。'],['mitsuki','でも、うれしい。']]);S.gf=true;S.love=70;out.push('美月と付き合うことになった！')}
    }else if(id==='play'){
      const r=await goOut();if(!r){busy=false;return}
      fxType=r.fx;fxFriends=r.friends||[];out.push(...r.out);
    }else if(id==='rest'){
      if(S.injured>0){S.injured--;S.hp+=35;out.push('治療に専念した。体力 +35')}
      else{S.skp+=2;S.hp+=40+(hasSp('mitsuki')?10:0);if(Math.random()<.5){S.mood++;out.push('ぐっすり休んだ。体力 +40 / やる気↑')}else out.push('ぐっすり休んだ。体力 +40')}
    }else{
      const risk=S.hp<35?(35-S.hp)/45+0.05:0;
      if(Math.random()<risk){
        S.injured=2;S.hp=Math.max(0,S.hp-5);S.mood--;
        fxType='injury';injScene=true;
        out.push('ケガをしてしまった……（2週間 練習できない）');
      }else{
        const ms=S.assign[id]||[];const fr=ms.filter(x=>mate(x).bond>=60).length;fxFriends=ms;
        const bonus=(1+0.3*ms.length+0.4*fr)*(1+0.1*(cmdLv(id)-1));
        if(fr)out.push('友情練習！');else if(ms.length)out.push(`${ms.map(x=>PEOPLE[x].name().split(' ')[1]).join('・')}と練習`);
        for(const k in c.gain){const v=gainCalc(k,c.gain[k])*bonus;addStat(k,v);out.push(`${LBL[k]} +${v.toFixed(1)}`)}
        S.hp-=Math.round(c.hp*(hasSkill('iron')?0.75:1)*(S.camp>0?1.3:1));
        ms.forEach(x=>{const m=mate(x);m.bond+=3;if(x!=='mitsuki')m.pow+=0.3});
        const sg=2+ms.length*2+fr*2;S.skp+=sg;out.push(`SP +${sg}`);
        const lv0=cmdLv(id);S.uses[id]=(S.uses[id]||0)+1;if(cmdLv(id)>lv0)out.push(`${c.label}が Lv${cmdLv(id)} に上がった！`);
        if(c.team){S.tb+=0.5;S.mates.forEach(m=>{m.bond+=2;if(m.id!=='mitsuki')m.pow+=0.6});out.push('チーム打力↑ 仲間の能力↑ 絆↑')}
        if(S.hp<20&&Math.random()<.5){S.mood--;out.push('疲れでやる気↓')}
      }
    }
    S.mates.forEach(m=>{if(m.id!=='mitsuki')m.pow+=0.25});
    normalize();
    await playFX(fxType,out.map(t=>({t,cls:/SP/.test(t)?'sp':/Lv|友情/.test(t)?'lv':'gain'})),{friends:fxFriends,friendship:id!=='hang'&&fxFriends.some(x=>mate(x).bond>=60)});
    if(injScene)await scene([['nar','練習中、足首に鋭い痛みが走った――'],['mitsuki','すぐ冷やして！ ……無理しすぎだよ。']]);
    // イベント
    let evMsg='';
    const rk=`${S.year}-${S.turn}`;
    const cand=S.mates.find(m=>m.ev<3&&m.bond>=TH[m.ev]);
    const mk=mate('mitsuki');
    if(!S.confessed&&mk.ev>=3&&mk.bond>=100){S.confessed=true;evMsg=await confession()}
    else if(RIVAL_EV[rk]&&!S.seen[rk]){S.seen[rk]=1;evMsg=await runEv(RIVAL_EV[rk])}
    else if(cand){const ev=BOND_EV[cand.id][cand.ev];cand.ev++;evMsg=await runEv(ev)}
    else if(S.gf&&Math.random()<0.12){evMsg=await runEv(pick(GF_EV))}
    else if(Math.random()<0.25){evMsg=await runEv(pick(RAND_EV))}
    if(S.gf){S.love=Math.max(0,S.love-2);if(S.love<25&&!S.loveWarn){S.loveWarn=true;await scene([['mitsuki','……最近、あんまり話せてないね。'],['mitsuki','ううん、大会前だもんね。わかってる。']]);S.mood--;evMsg+=(evMsg?' / ':'')+'美月と少しすれ違っている（デートに誘おう）'}if(S.love>=50)S.loveWarn=false}
    if(S.boost>0)S.boost--;
    normalize();
    S.msg=`<span class="gain">${out.map(esc).join('　')}</span>${evMsg?`<br>${esc(evMsg)}`:''}`;
    if(S.camp>0)S.camp--;
    S.turn++;
    busy=false;
    return weekStart();
  }finally{busy=false}
}

function genOpps(type){
  const y=S.year-1;
  const cfg={pref:{names:PREF_NAMES,base:[24,30,36,42,48,54].map(v=>v+y*8),rival:5},koshien:{names:KO_NAMES,base:[56,61,66,71,76,82]},fall:{names:PREF_NAMES,base:[30,38,46,52,58].map(v=>v+y*8),rival:2,neigh:[3,4]},senbatsu:{names:KO_NAMES,base:[58,63,70,76,82]}}[type];
  const names=shuffle(cfg.names),nb=shuffle(NEIGH_NAMES);
  const o=cfg.base.map((b,i)=>({name:cfg.neigh&&cfg.neigh.includes(i)?nb[i]:names[i],str:b+ri(-3,3)}));
  if(cfg.rival!=null)o[cfg.rival]={name:'帝陵学院',str:cfg.base[cfg.rival]+6,rival:true};
  return o;
}

const PNUM={'投':1,'捕':2,'一':3,'二':4,'三':5,'遊':6,'左':7,'中':8,'右':9};
function ourLineup(){

  let o=[
    {n:'小日向',pos:'中',r:mateR('yota')+(hasSp('yota')?10:0),spd:mateR('yota')+25},
    {n:'佐伯',pos:'二',r:b+1,spd:b},

    {n:'宮下',pos:'一',r:b+3,spd:b-10},
    {n:'久我',pos:'三',r:b,spd:b},
    {n:'森本',pos:'左',r:b-2,spd:b},
    {n:'長尾',pos:'遊',r:b-1,spd:b+4},
    {n:'岡',pos:'右',r:b-4,spd:b},
    {n:'早瀬',pos:'投',r:mateR('aoi')*0.55,spd:35},
  ];
  if(pp==='投'){o=o.filter(x=>x.n!=='岡');o.find(x=>x.n==='早瀬').pos='右'}
  else if(pp==='捕'){o=o.filter(x=>x.n!=='宮下');o.find(x=>x.n==='大門').pos='一'}
  else o=o.filter(x=>x.pos!==pp);
  (S.kohai||[]).forEach(k=>{const t=o.find(x=>['岡','森本','久我','宮下','長尾','佐伯'].includes(x.n));if(t){t.n=k.n;t.r=b+6+k.bonus;t.spd=b+8}});
  o.splice(2,0,{n:S.name,pos:pp,player:true,spd:S.st.speed});
  o.forEach(x=>x.num=PNUM[x.pos]);
  return o;
}

async function runGame(tok){
  await cutin('プレイボール！',`${S.school} 対 ${M.opp.name}`);
  {const P=M.oppP;await cutin(`相手投手 ${P.name}`,`${P.type}　最速${oppTop()}km/h`,`決め球：${PT[P.kime].name}`)}
  for(M.inning=1;;M.inning++){
    M.half=0;await halfInning(tok);if(!alive(tok))return;
    const d=M.score[1]-M.score[0];
    if(d>0&&(M.inning>=9||cold(d))){M.line[1][M.inning-1]='X';break}
    M.half=1;await halfInning(tok);if(!alive(tok))return;
    const d2=M.score[1]-M.score[0];
    if((M.inning>=9&&d2!==0)||cold(Math.abs(d2)))break;
  }
  M.done=true;renderSB();renderState();await endGame(tok);
}
function cold(d){return !M.ko&&((M.inning>=5&&d>=10)||(M.inning>=7&&d>=7))}
async function halfInning(tok){
  M.outs=0;M.count={b:0,s:0};M.pitchBoost=0;M.askedDef=false;
  M.bases=M.inning>=10?[{n:'走者',spd:40},{n:'走者',spd:40},null]:[null,null,null];
  M.line[M.half][M.inning-1]=0;
  renderSB();renderState();
  log(`${M.inning}回${M.half?'裏':'表'}　${M.half?M.opp.name:S.school}の攻撃`,'inn');
  if(M.inning>=10)log('タイブレーク：無死一・二塁から','big');
  M.mamonoHalf=false;
  if(M.half===0&&M.ko&&M.inning>=8&&!M.mamono){const d=M.score[0]-M.score[1];if(d<0&&d>=-3&&Math.random()<0.45){M.mamono=true;M.mamonoHalf=true;log('甲子園の魔物が目を覚ました……','big');await cutin('甲子園の魔物が目を覚ました…！','球場全体が異様な空気に包まれる','この回、味方打線が大きく強化')}}
  const runsBefore=M.score[1];
  if(M.half===1&&posInfo().k==='投')await cutin('マウンドへ',`${M.inning}回裏　${scoreLine()}`,'ミッション：この回を0点に抑えろ');
  await sleep(300);
  while(M.outs<3){
    if(!alive(tok))return;
    if(M.half===0)await ourPA(tok);else await oppPA(tok);
    if(!alive(tok))return;
    M.count={b:0,s:0};renderSB();renderState();
    if(M.half===1&&M.inning>=9&&M.score[1]>M.score[0]){log('サヨナラ……！','big');ov('サヨナラ');await sleep(1200);break}
    await sleep(D());
  }
  if(M.half===1&&posInfo().k==='投'&&M.score[1]===runsBefore&&alive(tok))missionDone(`${M.inning}回を0点に抑えた`);
}
function missionDone(t){M.mis.ok++;S.skp+=8;M.cheer=Math.min(100,M.cheer+5);M.hl.push('★ '+t);log(`ミッション達成：${t}（SP +8）`,'big');ov('ミッション達成！');renderCheer()}
function renderCheer(){const i=$('#cheeri');if(!i)return;M.cheer=Math.min(100,M.cheer);i.style.width=M.cheer+'%';$('#cheerbar').classList.toggle('full',M.cheer>=100);if(M.cheer>=100&&!M.cheerLog){M.cheerLog=true;log('応援ゲージMAX！ 次のチャンスでチャンステーマが鳴り響く','big')}if(M.cheer<100)M.cheerLog=false}
function makeMission(){
  const b=M.bases,diff=M.score[0]-M.score[1];
  if(M.inning>=7&&Math.abs(diff)<=1&&(b[1]||b[2]))return {t:'試合を決める一打を放て',chk:r=>r.runs>0};
  if(b[2]&&M.outs<2)return {t:'外野フライ以上で1点をもぎ取れ',chk:r=>r.runs>0};
  if(b[1]||b[2])return {t:'タイムリーを打て',chk:r=>r.runs>0};
  if(M.outs===0&&!b[0])return {t:'先頭打者として出塁せよ',chk:r=>r.onBase};
  if(b[0])return {t:'チャンスを広げろ（出塁か送りバント）',chk:r=>r.onBase||r.res==='SAC'};
  return {t:'ヒットを打て',chk:r=>r.hit};
}
function gradeGame(win){
  const p=M.pl;let sc=p.h*2+p.hr*3+p.rbi*2+p.sb+p.fine*2+p.pk*0.6+M.mis.ok*2+(win?2:0)-p.err*2;
  if(posInfo().k==='投')sc+=Math.max(0,6-M.score[1])*1.2;
  const g=sc>=19&&win?'S':sc>=12?'A':sc>=7?'B':sc>=3?'C':'D',sp={S:30,A:20,B:10,C:5,D:0}[g];S.skp+=sp;
  const hl=M.hl.length?`<ul class="hl">${M.hl.slice(-6).map(h=>`<li>${esc(h)}</li>`).join('')}</ul>`:'<p class="lbl">ハイライトなし</p>';
  return {g,sp,hl};
}
function ourPitch(){
  if(posInfo().k==='投'){let p=plPitchR()-pitFatigue()*4;if(M.pitchBoost)p+=M.pitchBoost;return p}
  let p=mateR('aoi')-Math.max(0,M.inning-6)*2.5;if(hasSp('aoi')&&M.inning>=7)p+=10;return p+M.pitchBoost;
}
function simPA(bat,pit,def){
  const d=bat-pit;const bb=clamp(0.08+d*0.0008,0.04,0.12);
  const hit=clamp(0.23+d*0.005-(def-50)*0.0015,0.07,0.45);const r=Math.random();
  if(r<bb)return 'BB';
  if(r<bb+hit){const h=Math.random(),hr=clamp(0.04+(bat-40)*0.002,0.01,0.16);if(h<hr)return 'HR';if(h<hr+0.03)return '3B';if(h<hr+0.22)return '2B';return '1B'}
  const o=Math.random();if(o<clamp(0.25+(pit-bat)*0.003,0.1,0.45))return 'K';return o<0.66?'GO':'FO';
}
function resText(res){
  switch(res){
    case 'HR':return pick(['レフトスタンドへ','バックスクリーンへ','ライトスタンドへ'])+'ホームラン！';
    case '3B':return pick(['右中間','左中間'])+'を破るスリーベース';
    case '2B':return pick(['レフト線','ライト線','左中間','右中間'])+'へのツーベース';
    case '1B':return pick(['レフト前','センター前','ライト前','三遊間を破る','一二塁間を抜ける'])+'ヒット';
    case 'IH':return '内野安打！';
    case 'BB':return 'フォアボール';
    case 'SAC':return '送りバント成功';
    case 'K':return pick(['空振り三振','見逃し三振']);
    case 'GO':return pick(['ショート','セカンド','サード','ファースト','ピッチャー'])+'ゴロ';
    case 'FO':return pick(['センター','レフト','ライト','セカンド'])+pick(['フライ','ライナー']);
  }
}
// 走者を進める。po：塁上のきみの判断 {go, ok}
function advance(res,runner,po){
  const b=M.bases;let runs=0,note='';const isP=r=>r&&r.player;
  switch(res){
    case 'HR':runs=b.filter(Boolean).length+1;M.bases=[null,null,null];break;
    case '3B':runs=b.filter(Boolean).length;M.bases=[null,null,runner];break;
    case '2B':{runs=(b[1]?1:0)+(b[2]?1:0);const n=[null,runner,null];
      if(b[0]){if(isP(b[0])&&po){if(po.go){if(po.ok)runs++;else{M.outs++;note='（本塁タッチアウト）'}}else n[2]=b[0]}
        else if(Math.random()<0.25+(b[0].spd||40)*0.004)runs++;else n[2]=b[0]}
      M.bases=n;break}
    case 'FINE':M.outs++;break;
    case '1B':case 'IH':case 'E':{runs=b[2]?1:0;const n=[runner,b[0],null];
      if(b[1]){if(isP(b[1])&&po&&res==='1B'){if(po.go){if(po.ok)runs++;else{M.outs++;note='（本塁タッチアウト）'}}else n[2]=b[1]}
        else if(res==='1B'&&Math.random()<0.35+(b[1].spd||40)*0.005)runs++;else n[2]=b[1]}
      if(isP(b[0])&&po&&po.go&&res==='1B'&&!n[2]){n[1]=null;if(po.ok)n[2]=b[0];else{M.outs++;note='（三塁タッチアウト）'}}
      M.bases=n;break}
    case 'BB':{const n=[runner,b[1],b[2]];if(b[0]){n[1]=b[0];if(b[1]){n[2]=b[1];if(b[2])runs++}else n[2]=b[2]}M.bases=n;break}
    case 'SAC':M.outs++;runs=b[2]?1:0;M.bases=[null,b[0],b[1]];note=b[2]?'（スクイズで1点）':'';break;
    case 'K':M.outs++;break;
    case 'GO':M.outs++;
      if(b[0]&&M.outs<3&&Math.random()<0.3){M.outs++;b[0]=null;note='（ゲッツー）'}
      if(M.outs<3){if(b[2]&&Math.random()<0.5){runs++;b[2]=null}if(b[1]&&!b[2]){b[2]=b[1];b[1]=null}if(b[0]&&!b[1]){b[1]=b[0];b[0]=null}}
      break;
    case 'FO':M.outs++;
      if(M.outs<3&&b[2]){if(isP(b[2])&&po){if(po.go){b[2]=null;if(po.ok){runs++;note='（タッチアップ成功！）'}else{M.outs++;note='（タッチアップ失敗）'}}}
        else if(Math.random()<0.45){runs++;b[2]=null;note='（犠牲フライ）'}}
      break;
  }
  M.score[M.half]+=runs;M.line[M.half][M.inning-1]+=runs;
  return {runs,note};
}

  });
}
function burst(c,e,col){c.strokeStyle=col;c.lineWidth=3;for(let i=0;i<28;i++){const a=i/28*Math.PI*2+e/1500;c.beginPath();c.moveTo(160+Math.cos(a)*70,90+Math.sin(a)*45);c.lineTo(160+Math.cos(a)*260,90+Math.sin(a)*170);c.stroke()}}
function bigText(c,t,x,y,col,size=22){c.font=`${size}px DotGothic16, monospace`;c.textAlign='center';c.fillStyle='rgba(0,0,0,.8)';c.fillText(t,x+2,y+2);c.fillStyle=col;c.fillText(t,x,y)}
function drawFX(c,now){
  const f=FX,e=now-f.t0,K=KIT.home;
  const BG={bat:['#e8741c','#ffd36b'],gym:['#a8231b','#ff7b4f'],run:['#1f6fc4','#8fd3ff'],def:['#167a42','#86e3a8'],team:['#d79a00','#fff0a0'],rest:['#0b1233','#28366e'],play:['#ff7e5f','#feb47b'],pitch:['#1c4fa0','#7fb8ff'],brk:['#5b2a8a','#c39cff'],hang:['#c95a52','#ffcf98'],injury:['#2a0606','#8e1a1a']}[f.type]||['#333','#666'];
  c.save();if(f.type==='injury'&&e<500)c.translate(ri(-3,3),ri(-2,2));
  const g=c.createLinearGradient(0,0,0,GH);g.addColorStop(0,BG[0]);g.addColorStop(1,BG[1]);c.fillStyle=g;c.fillRect(-4,-4,W+8,GH+8);
  const s=6,cx=136,cy=46;
  switch(f.type){
    case 'bat':{burst(c,e,'rgba(255,255,255,.22)');
      const ph=(e%600)/600;c.drawImage(K.stand,cx,cy,8*s,12*s);
      const ang=ph<0.18?-2.3+ph/0.18*3.1:0.8,hx=cx+6*s,hy=cy+5*s;c.strokeStyle='#d9a066';c.lineWidth=7;c.beginPath();c.moveTo(hx,hy);c.lineTo(hx+Math.cos(ang)*60,hy+Math.sin(ang)*60);c.stroke();
      for(let i=0;i<4;i++){if(e-i*600<0)continue;const k=((e-i*600)%2400)/2400,bx=200+k*200,by=100-k*120;c.fillStyle='rgba(255,255,255,.5)';c.fillRect(bx-24,by+3,24,2);c.fillStyle='#fff';c.fillRect(bx,by,8,8);c.fillStyle='#d64a3a';c.fillRect(bx+2,by+3,4,1)}
      if(ph<0.4)bigText(c,'カキーン！',255,40,'#fff');break}
    case 'gym':{burst(c,e,'rgba(255,220,120,.18)');
      for(let i=0;i<26;i++){const k=(e*0.0012+i*0.37)%1;c.fillStyle=i%2?'#ffb347':'#ff5e3a';c.fillRect(100+(i*23)%130,GH-k*GH,4,8)}
      const up=Math.floor(e/380)%2;c.drawImage(up?K.up:K.stand,cx,cy+(up?0:6),8*s,12*s);
      const by=up?cy-8:cy+30;c.fillStyle='#9aa0a6';c.fillRect(cx-40,by,128,5);c.fillStyle='#222';c.fillRect(cx-44,by-14,10,32);c.fillRect(cx+78,by-14,10,32);
      for(let i=0;i<5;i++){const k=((e+i*300)%900)/900;c.fillStyle='#8fd3ff';c.fillRect(cx+24+(i-2)*36*k,cy+10-k*30+k*k*60,4,6)}
      if(up)bigText(c,'ふんっ！',262,50,'#fff');break}
    case 'run':{for(let i=0;i<30;i++){const y=(i*37)%GH,x=W-((e*0.9+i*97)%(W+80));c.fillStyle='rgba(255,255,255,.55)';c.fillRect(x,y,40+(i%3)*20,2)}
      const fr=Math.floor(e/110)%2;c.drawImage(fr?K.run1:K.run2,cx,cy+fr*3,8*s,12*s);
      for(let i=0;i<6;i++){const k=((e+i*160)%960)/960;c.fillStyle=`rgba(230,220,200,${0.7-k*0.7})`;c.beginPath();c.arc(cx-10-k*90,cy+70-k*10,4+k*12,0,Math.PI*2);c.fill()}
      bigText(c,'ダッシュ！',255,40,'#fff');break}
    case 'def':{burst(c,e,'rgba(255,255,255,.18)');
      const k=clamp(e/900,0,1);
      if(e<900){c.drawImage(K.stand,cx,cy,8*s,12*s);c.fillStyle='#fff';c.fillRect(W-k*140,40+k*60,8,8)}
      else{rot(c,K.stand,cx+10,cy+60,-1.35,s);c.fillStyle='#fff';c.fillRect(cx-6,cy+46,8,8);const r=Math.min(1,(e-900)/300);c.fillStyle='#fff6a0';for(let i=0;i<8;i++){const a=i/8*Math.PI*2;c.fillRect(cx-2+Math.cos(a)*r*24,cy+50+Math.sin(a)*r*24,4,4)}bigText(c,'ナイスキャッチ！',232,40,'#fff')}
      break}
    case 'team':{burst(c,e,'rgba(255,255,255,.3)');
      for(let i=0;i<7;i++){const a=i/7*Math.PI*2-Math.PI/2,px=160+Math.cos(a)*70,py=100+Math.sin(a)*30,j=Math.floor(e/260+i)%2;c.drawImage(j?K.up:K.stand,px-12,py-36-j*4,24,36)}
      bigText(c,Math.floor(e/700)%2?'オー！！':'ファイトー！',160,30,'#fff',24);break}
    case 'rest':{c.fillStyle='#fff6c8';c.beginPath();c.arc(270,36,16,0,Math.PI*2);c.fill();c.fillStyle=BG[0];c.beginPath();c.arc(262,30,14,0,Math.PI*2);c.fill();
      for(let i=0;i<30;i++){c.fillStyle=(Math.floor(e/300)+i)%3?'#fff':'#ffe58a';c.fillRect((i*53)%W,(i*29)%100,2,2)}
      c.fillStyle='#e9e4f5';c.fillRect(90,122,140,20);c.fillStyle='#7a8fd0';c.fillRect(124,114,106,16);
      rot(c,K.stand,112,120,-Math.PI/2,4);
      for(let i=0;i<3;i++){const k=((e+i*500)%1500)/1500;bigText(c,'Z',150+k*50+i*6,100-k*60,`rgba(255,255,255,${1-k})`,14+i*4)}
      for(let i=0;i<8;i++){const k=((e+i*250)%2000)/2000;pat(c,['.X.','XXX','.X.'],40+i*32,GH-k*GH,3,'#7dff9a')}
      break}
    case 'hang':{const id=(f.opt.friends||[])[0];
      c.fillStyle='#8a5a34';c.fillRect(90,130,140,8);c.fillRect(96,138,6,20);c.fillRect(218,138,6,20);
      c.drawImage(K.stand,0,0,8,8,104,82,48,48);c.fillStyle='#f2efe6';c.fillRect(104,126,48,6);
      c.drawImage(id==='mitsuki'?KIT.girl.stand:K.stand,0,0,8,8,168,82,48,48);c.fillStyle=id==='mitsuki'?'#3a6db0':'#f2efe6';c.fillRect(168,126,48,6);
      for(let i=0;i<7;i++){const k=((e+i*300)%2100)/2100;pat(c,HEART,120+i*14+Math.sin(k*6+i)*8,120-k*120,3,`rgba(255,110,150,${1-k*0.8})`)}
      if(id){c.fillStyle='#fff';c.fillRect(230,18,52,52);c.drawImage(portC(id),232,20,48,48)}break}
    case 'pitch':{burst(c,e,'rgba(255,255,255,.22)');const ph=(e%800)/800;c.drawImage(ph<0.4?K.up:K.run1,cx-50,cy,8*s,12*s);
      c.fillStyle='#7a4a22';c.beginPath();c.arc(285,96,16,0,Math.PI*2);c.fill();c.fillStyle='#5a3416';c.beginPath();c.arc(285,96,8,0,Math.PI*2);c.fill();
      if(ph>=0.4){const k=(ph-0.4)/0.6,bx=cx+k*(280-cx),by=cy+20+k*(76-cy);c.fillStyle='rgba(255,255,255,.5)';c.fillRect(bx-44,by+2,40,3);c.fillStyle='#fff';c.fillRect(bx-4,by-4,8,8);if(k>0.85)bigText(c,'ズバーン！',240,40,'#fff')}
      break}
    case 'brk':{burst(c,e,'rgba(255,255,255,.18)');c.drawImage(K.stand,cx-60,cy,8*s,12*s);const k=(e%1100)/1100;
      for(let i=0;i<=24;i++){const t=i/24*k,x=cx+t*170,y=cy+20+Math.pow(t,3)*70-Math.sin(t*Math.PI)*16;c.fillStyle=`rgba(255,255,255,${0.15+i/24*0.8})`;c.fillRect(x,y,i===24?8:4,i===24?8:4)}
      if(k>0.8)bigText(c,'キュッ！',262,140,'#fff');break}
    case 'play':{for(let i=0;i<7;i++){const x=20+i*44,h=40+(i*37)%50;c.fillStyle=['#7a4a8a','#5a5aa0','#8a3a6a'][i%3];c.fillRect(x,GH-h-14,36,h);c.fillStyle='#ffd27a';for(let y=GH-h-8;y<GH-20;y+=8){c.fillRect(x+6,y,4,3);c.fillRect(x+24,y,4,3)}}
      for(let i=0;i<3;i++){const j=Math.floor(e/250+i)%2;c.drawImage(j?K.up:K.stand,104+i*40,84-j*6,32,48)}
      for(let i=0;i<8;i++){const k=((e+i*260)%2000)/2000;bigText(c,'♪',40+i*34,GH-20-k*130,`rgba(255,240,150,${1-k})`,18)}
      bigText(c,'遊ぶぞー！',160,30,'#fff',24);break}
    case 'injury':{c.fillStyle=e%200<100?'rgba(255,0,0,.25)':'rgba(0,0,0,0)';c.fillRect(0,0,W,GH);rot(c,K.stand,160,96,0.5,s);bigText(c,'！！',222,60,'#ff5040',30);break}
  }
  const fr=f.type==='hang'?[]:(f.opt.friends||[]);
  if(fr.length){const k=clamp(e/300,0,1);fr.forEach((id,i)=>{const x=-60+k*(70+i*56),y=12;c.fillStyle='#fff';c.fillRect(x-2,y-2,52,52);c.drawImage(portC(id),x,y,48,48)});
    if(f.opt.friendship){c.strokeStyle=e%240<120?'#ff9fb8':'#ffe58a';c.lineWidth=6;c.strokeRect(3,3,W-6,GH-6);bigText(c,'友情練習！',70,GH-12,'#ff9fb8',20)}}
  c.restore();
}

/* ============ エンディング ============ */
function renderEnding(){
  stopLoop();
  const top=S.mates.slice().sort((a,b)=>b.bond-a.bond)[0];
  const LAST={aoi:'……お前と野球ができて、よかった。',go:'最高のチームだったぜ、相棒。',yota:'なあ、大学でもまた一緒にやろうぜ！',mitsuki:'スコアブック、最後のページまで埋まったよ。……ありがとう。'};
  const tier=S.best>=4?{t:'頂点の夏',d:`${S.school}高校、全国制覇。白球を追いかけた3年間は、最高の形で幕を閉じた。`}:S.best>=1?{t:'聖地の土',d:'甲子園の土を踏んだ。小さな袋に詰めた土は、仲間と過ごした夏の証になった。'}:{t:'終わらない夏',d:'甲子園には届かなかった。それでも、あのグラウンドで流した汗は、ずっと消えない。'};
  app.innerHTML=`<section class="ending">
    <div class="lbl">ENDING</div><h1 class="big">${tier.t}</h1><p>${esc(tier.d)}</p>
    <div class="panel"><h2>3年間の記録</h2><ul>${S.results.map(r=>`<li>${r.year}年の夏：${esc(r.text)}</li>`).join('')}</ul></div>
    <div class="panel"><h2>${esc(S.name)}<small>最終能力</small></h2><div class="stats">${statRows()}</div></div>
    <div class="panel mate"><img class="pix" src="${portrait(top.id)}" alt=""><div><div class="lbl">いちばん絆の深い仲間</div><div>${PEOPLE[top.id].name()}「${esc(LAST[top.id])}」</div></div></div>
    ${S.gf?`<div class="panel mate"><img class="pix" src="${portrait('mitsuki')}" alt=""><div><div class="lbl">恋人</div><div>白石 美月「${esc(S.best>=4?'日本一おめでとう。……これからも、ずっと隣でスコアつけさせてね。':S.best>=1?'甲子園、連れてってくれてありがとう。あの土の匂い、一生忘れないよ。':'泣かないで。……ううん、一緒に泣こう。最高の夏だったよ。')}」</div></div></div>`:''}
    <div class="row"><button class="btn primary center" id="bagain">もう一度、春から</button></div>
  </section>`;
  $('#bagain').onclick=()=>{try{localStorage.removeItem(SAVE)}catch(e){}S=null;renderTitle()};
}

/* ============ 起動 ============ */
function start(data){if(data&&data.S){S=data.S;route()}else renderTitle()}
try{window.claude?.hot?.snapshot?.(()=>({S}))}catch(e){}
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>
