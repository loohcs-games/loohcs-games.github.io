<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>まるをおす</title>
<style>
  body { margin:0; background:#222; color:#fff; font-family:sans-serif; overflow:hidden; }
  #score { position:fixed; top:12px; left:12px; font-size:20px; }
  #back { position:fixed; top:12px; right:12px; color:#aaa; font-size:14px; }
  #ball { position:fixed; width:60px; height:60px; border-radius:50%; background:#e74c3c; cursor:pointer; }
</style>
</head>
<body>
<div id="score">0 点</div>
<a id="back" href="../../">一覧にもどる</a>
<div id="ball"></div>
<script>
  var score = 0;
  var ball = document.getElementById('ball');
  function move() {
    ball.style.left = Math.random() * (window.innerWidth - 60) + 'px';
    ball.style.top = 60 + Math.random() * (window.innerHeight - 120) + 'px';
  }
  ball.addEventListener('click', function () {
    score++;
    document.getElementById('score').textContent = score + ' 点';
    move();
  });
  move();
  setInterval(move, 1500);
</script>
</body>
</html>
