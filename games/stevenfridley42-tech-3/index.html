<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#fff8e7">
<meta name="robots" content="noindex, nofollow">
<title>ナスっとドーナツ！🍆🍩</title>
<style>
  html,body{margin:0;height:100%;background:#fff8e7;overflow:hidden;
    font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif;
    touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
    -webkit-tap-highlight-color:transparent}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  #stage{position:relative}
  canvas{display:block;border-radius:22px;box-shadow:0 8px 30px rgba(230,140,170,.25);cursor:pointer}
  .btn{position:absolute;top:12px;width:44px;height:44px;border-radius:50%;border:none;
    background:rgba(255,255,255,.85);box-shadow:0 3px 10px rgba(230,140,170,.3);
    font-size:22px;line-height:44px;padding:0;cursor:pointer;color:#e0669a}
  .btn:active{transform:scale(.9)}
  #mute{right:12px}
  #retry{left:12px;font-weight:bold}
  #back{position:absolute;left:12px;bottom:10px;font-size:13px;color:#c99ab0;text-decoration:none;
    background:rgba(255,255,255,.7);padding:4px 10px;border-radius:12px}
  @media (max-width:500px){canvas{border-radius:0;box-shadow:none}}
</style>
</head>
<body>
<div id="wrap"><div id="stage">
  <canvas id="c"></canvas>
  <button class="btn" id="retry" aria-label="リトライ">↻</button>
  <button class="btn" id="mute" aria-label="ミュート">🔊</button>
  <a id="back" href="../../">← ゲーム一覧にもどる</a>
</div></div>
<script>
const W = 480, H = 800;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const stage = document.getElementById('stage');
function resize(){
  const s = Math.min(innerWidth / W, innerHeight / H);
  const dpr = window.devicePixelRatio || 1;
  stage.style.width = cv.style.width = W * s + 'px';
  stage.style.height = cv.style.height = H * s + 'px';
  cv.width = Math.round(W * s * dpr); cv.height = Math.round(H * s * dpr);
  ctx.setTransform(cv.width / W, 0, 0, cv.height / H, 0, 0);
}
addEventListener('resize', resize); resize();

// ===== 定数 =====
const DY = 250;               // ドーナツの中心(穴の面)の高さ
const R = 112, r = 54;        // 外側・穴の半径
const SY = 0.5;               // 斜めから見た潰れ具合
const TH = 24;                // 厚み
const EGG_Y = 660;            // ナスの待機位置
const EGG_TOP = 40;           // 中心→ヘタ先端
const EGG_BOT = 44;           // 中心→おしり
const EGG_HALF = 19;          // ナスの半分の幅(いちばん太いところ)
const FLY_SPEED = 1500;

// ===== サウンド =====
let muted = false;
try{ muted = localStorage.getItem('nasuMute') === '1'; }catch(e){}
const muteBtn = document.getElementById('mute');
muteBtn.textContent = muted ? '🔇' : '🔊';
let ac;
function audio(){
  if (muted) return null;
  try{ ac = ac || new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === 'suspended') ac.resume(); return ac; }
  catch(e){ return null; }
}
function tone(freqs, dur, type, vol, delay = 0){
  const a = audio(); if (!a) return;
  const t0 = a.currentTime + delay;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freqs[0], t0);
  freqs.slice(1).forEach((f, i) => o.frequency.exponentialRampToValueAtTime(f, t0 + dur * (i + 1) / (freqs.length - 1)));
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol, t0 + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g).connect(a.destination);
  o.start(t0); o.stop(t0 + dur + 0.02);
}
const sfx = {
  pon(perfect){                      // ポン♪
    tone([520, 1040], 0.12, 'sine', 0.25);
    tone([1320, 1320], 0.18, 'sine', 0.12, 0.08);
    if (perfect){ tone([1568, 1568], 0.2, 'sine', 0.1, 0.16); tone([2093, 2093], 0.25, 'sine', 0.08, 0.24); }
  },
  poyon(){                           // ぽよん♪
    tone([330, 190, 300], 0.32, 'sine', 0.28);
    tone([660, 380, 600], 0.32, 'triangle', 0.05);
  },
  shot(){ tone([260, 520], 0.08, 'triangle', 0.08); }
};

// ===== 状態 =====
let state = 'title';
let score = 0, combo = 0, best = 0;
try{ best = +localStorage.getItem('nasuBest') || 0; }catch(e){}
let donut = {x: W / 2, dir: 1, boing: 0, bt: 0};
let eggs = [], egg = null, fx = [], popups = [];
const sprinkles = [];
const SPR = ['#ffffff', '#fff3a3', '#a8e6ff', '#b8f2c4', '#d9b8ff', '#ffd1a8'];
for (let i = 0; i < 30; i++){
  sprinkles.push({a: Math.random() * Math.PI * 2, rr: r + 16 + Math.random() * (R - r - 34),
    c: SPR[i % SPR.length], rot: Math.random() * Math.PI});
}

function speedNow(){ return Math.min(150 + Math.floor(score / 5) * 30, 520); }

function newEgg(){
  egg = {state: 'enter', x: W / 2, y: H + 70, vx: 0, vy: 0, rot: 0, spin: 0, t: 0, sq: 0, face: 'happy'};
  eggs.push(egg);
}
function startGame(){
  state = 'play'; score = 0; combo = 0;
  eggs = []; fx = []; popups = [];
  donut.x = W / 2; donut.dir = Math.random() < .5 ? 1 : -1;
  newEgg();
}

// ===== 入力 =====
function fire(){
  if (state === 'title'){ startGame(); sfx.shot(); return; }
  if (egg && egg.state === 'ready'){
    egg.state = 'fly'; egg.vy = -FLY_SPEED; egg.t = 0; egg.sq = 0.25;
    sfx.shot();
  }
}
cv.addEventListener('pointerdown', e => { e.preventDefault(); fire(); });
addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'Enter'){ e.preventDefault(); if (!e.repeat) fire(); }
});
for (const b of [muteBtn, document.getElementById('retry'), document.getElementById('back')]){
  b.addEventListener('pointerdown', e => e.stopPropagation());
}
muteBtn.addEventListener('click', () => {
  muted = !muted; muteBtn.textContent = muted ? '🔇' : '🔊';
  try{ localStorage.setItem('nasuMute', muted ? '1' : '0'); }catch(e){}
});
document.getElementById('retry').addEventListener('click', e => { e.currentTarget.blur(); startGame(); });

// ===== 描画パーツ =====
function ringPath(x, y, Ro, Ri){
  ctx.beginPath();
  ctx.ellipse(x, y, Ro, Ro * SY, 0, 0, Math.PI * 2);
  ctx.moveTo(x + Ri, y);
  ctx.ellipse(x, y, Ri, Ri * SY, 0, 0, Math.PI * 2);
}
function drawDonut(x, y){
  // 側面(生地)
  for (let i = TH; i > 0; i -= 2){
    ctx.fillStyle = i > TH * .5 ? '#d9954e' : '#e8aa62';
    ringPath(x, y + i, R, r); ctx.fill('evenodd');
  }
  // 上面(生地)
  ctx.fillStyle = '#f6c98a';
  ringPath(x, y, R, r); ctx.fill('evenodd');
  // 穴の中(奥の壁 → 向こう側が見える)
  ctx.save();
  ctx.beginPath(); ctx.ellipse(x, y, r, r * SY, 0, 0, Math.PI * 2); ctx.clip();
  ctx.fillStyle = '#c98443'; ctx.fillRect(x - r, y - r, r * 2, r * 2);
  ctx.fillStyle = '#fff8e7';
  ctx.beginPath(); ctx.ellipse(x, y + TH, r, r * SY, 0, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  // ピンクチョコ(ふちが波打つ)
  ctx.beginPath();
  const N = 60;
  for (let i = 0; i <= N; i++){
    const a = i / N * Math.PI * 2;
    const rr = R - 8 + Math.sin(a * 8) * 5 + (Math.sin(a) > 0 ? Math.max(0, Math.sin(a * 5)) * 6 : 0);
    const px = x + Math.cos(a) * rr, py = y - 3 + Math.sin(a) * rr * SY;
    i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
  }
  ctx.moveTo(x + r + 8, y - 3);
  ctx.ellipse(x, y - 3, r + 8, (r + 8) * SY, 0, 0, Math.PI * 2);
  ctx.fillStyle = '#f58cb8'; ctx.fill('evenodd');
  ringPath(x, y - 5, R - 14, r + 10);
  ctx.fillStyle = '#ffa6cb'; ctx.fill('evenodd');
  // つや
  ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 5; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.ellipse(x, y - 6, R - 30, (R - 30) * SY, 0, Math.PI * 1.08, Math.PI * 1.4); ctx.stroke();
  // スプリンクル
  for (const s of sprinkles){
    const px = x + Math.cos(s.a) * s.rr, py = y - 5 + Math.sin(s.a) * s.rr * SY;
    ctx.save(); ctx.translate(px, py); ctx.rotate(s.rot);
    ctx.fillStyle = s.c;
    ctx.beginPath(); ctx.roundRect ? ctx.roundRect(-5, -1.8, 10, 3.6, 2) : ctx.rect(-5, -1.8, 10, 3.6); ctx.fill();
    ctx.restore();
  }
}
// 手前のふちだけ(ナスがくぐる時に上から重ねる)
function drawDonutFront(x, y){
  ctx.save();
  ctx.beginPath();
  ctx.rect(x - R - 12, y, (R + 12) * 2, TH + 90);
  ctx.ellipse(x, y, r, r * SY, 0, 0, Math.PI * 2);
  ctx.clip('evenodd');
  drawDonut(x, y);
  ctx.restore();
}
function withDonutBoing(fn){
  const b = Math.sin(donut.bt * 22) * donut.boing;
  ctx.save();
  ctx.translate(donut.x, DY + TH);
  ctx.scale(1 + b * .12, 1 - b * .16);
  ctx.translate(-donut.x, -(DY + TH));
  fn();
  ctx.restore();
}

function drawEgg(e){
  ctx.save();
  ctx.translate(e.x, e.y); ctx.rotate(e.rot);
  ctx.scale(1 - e.sq * .5, 1 + e.sq);
  // からだ
  const g = ctx.createLinearGradient(-22, 0, 22, 0);
  g.addColorStop(0, '#8a5cc7'); g.addColorStop(.4, '#b386ec'); g.addColorStop(1, '#7a4cb8');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(0, -34);
  ctx.bezierCurveTo(14, -34, 13, -6, 20, 10);
  ctx.bezierCurveTo(26, 32, 15, 44, 0, 44);
  ctx.bezierCurveTo(-15, 44, -26, 32, -20, 10);
  ctx.bezierCurveTo(-13, -6, -14, -34, 0, -34);
  ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.45)';
  ctx.beginPath(); ctx.ellipse(-9, 4, 3.5, 12, .2, 0, Math.PI * 2); ctx.fill();
  // かお
  ctx.fillStyle = '#3b2552'; ctx.strokeStyle = '#3b2552'; ctx.lineWidth = 2.4; ctx.lineCap = 'round';
  if (e.face === 'oops'){
    ctx.beginPath();
    ctx.moveTo(-10, 12); ctx.lineTo(-5, 15); ctx.lineTo(-10, 18);
    ctx.moveTo(10, 12); ctx.lineTo(5, 15); ctx.lineTo(10, 18);
    ctx.stroke();
  } else {
    ctx.beginPath(); ctx.arc(-7, 15, 2.8, 0, Math.PI * 2); ctx.arc(7, 15, 2.8, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(-6, 14, 1, 0, Math.PI * 2); ctx.arc(8, 14, 1, 0, Math.PI * 2); ctx.fill();
  }
  ctx.beginPath();
  if (e.face === 'oops'){ ctx.arc(0, 25, 3, 0, Math.PI * 2); ctx.stroke(); }
  else { ctx.arc(0, 20, 3.5, .15 * Math.PI, .85 * Math.PI); ctx.stroke(); }
  ctx.fillStyle = 'rgba(255,140,190,.6)';
  ctx.beginPath(); ctx.ellipse(-13, 21, 4, 2.6, 0, 0, Math.PI * 2); ctx.ellipse(13, 21, 4, 2.6, 0, 0, Math.PI * 2); ctx.fill();
  // ヘタ
  ctx.fillStyle = '#7cc47a';
  ctx.beginPath();
  ctx.moveTo(-16, -20);
  ctx.quadraticCurveTo(-8, -42, 0, -40);
  ctx.quadraticCurveTo(8, -42, 16, -20);
  ctx.quadraticCurveTo(10, -28, 6, -18);
  ctx.quadraticCurveTo(0, -28, -6, -18);
  ctx.quadraticCurveTo(-10, -28, -16, -20);
  ctx.fill();
  ctx.strokeStyle = '#6aab5a'; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(0, -39); ctx.quadraticCurveTo(1, -49, 6, -53); ctx.stroke();
  ctx.restore();
}

function heartPath(s){
  ctx.beginPath();
  ctx.moveTo(0, s * .35);
  ctx.bezierCurveTo(-s * .1, s * .25, -s * .55, s * .02, -s * .5, -s * .22);
  ctx.bezierCurveTo(-s * .45, -s * .5, -s * .08, -s * .5, 0, -s * .25);
  ctx.bezierCurveTo(s * .08, -s * .5, s * .45, -s * .5, s * .5, -s * .22);
  ctx.bezierCurveTo(s * .55, s * .02, s * .1, s * .25, 0, s * .35);
  ctx.closePath();
}
function starPath(s){
  ctx.beginPath();
  for (let i = 0; i < 8; i++){
    const a = i / 8 * Math.PI * 2, rr = i % 2 ? s * .22 : s;
    ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
  }
  ctx.closePath();
}

function drawBackground(){
  ctx.fillStyle = '#fff8e7'; ctx.fillRect(0, 0, W, H);
  const dots = ['rgba(255,182,210,.35)', 'rgba(190,225,255,.35)', 'rgba(200,240,200,.35)', 'rgba(220,200,255,.35)'];
  let k = 0;
  for (let yy = 120; yy < H; yy += 70){
    for (let xx = ((yy / 70) % 2) * 35 + 20; xx < W; xx += 70){
      ctx.fillStyle = dots[k++ % dots.length];
      ctx.beginPath(); ctx.arc(xx, yy, 6, 0, Math.PI * 2); ctx.fill();
    }
  }
  // 発射台
  ctx.fillStyle = 'rgba(255,190,215,.45)';
  ctx.beginPath(); ctx.ellipse(W / 2, EGG_Y + 54, 54, 14, 0, 0, Math.PI * 2); ctx.fill();
}

function txt(s, x, y, size, color, align = 'center', outline = '#fff'){
  ctx.font = `bold ${size}px "Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif`;
  ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  if (outline){ ctx.lineWidth = size / 4; ctx.strokeStyle = outline; ctx.strokeText(s, x, y); }
  ctx.fillStyle = color; ctx.fillText(s, x, y);
}

// ===== エフェクト =====
function burst(x, y, perfect){
  const nHeart = perfect ? Math.min(5 + combo, 12) : 3;
  const colors = ['#ff6fa5', '#ff3b5c', '#ffa3c4'];
  for (let i = 0; i < nHeart; i++){
    const spread = nHeart === 3 ? (i - 1) * 0.7 : (Math.random() - .5) * 2.4;
    const a = -Math.PI / 2 + spread;
    const sp = 260 + Math.random() * 120;
    fx.push({k: 'heart', x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      life: 0, max: 1.3 + Math.random() * .4, size: 30 + Math.random() * 14,
      c: colors[i % colors.length], rot: spread * .3, delay: i * 0.05});
  }
  if (perfect){
    for (let i = 0; i < 10 + Math.min(combo, 10); i++){
      fx.push({k: 'star', x: x + (Math.random() - .5) * 280, y: y + (Math.random() - .7) * 160,
        vx: 0, vy: -20, life: 0, max: .7 + Math.random() * .5, size: 8 + Math.random() * 10,
        c: Math.random() < .5 ? '#fff1a0' : '#ffffff', rot: Math.random(), delay: Math.random() * .3});
    }
  }
}
function popup(s, color, size = 40){ popups.push({s, color, size, t: 0}); }

// ===== 更新 =====
function update(dt){
  // ドーナツ
  const sp = state === 'play' ? speedNow() : 110;
  donut.x += donut.dir * sp * dt;
  const minX = R + 14, maxX = W - R - 14;
  if (donut.x < minX){ donut.x = minX; donut.dir = 1; }
  if (donut.x > maxX){ donut.x = maxX; donut.dir = -1; }
  donut.bt += dt; donut.boing = Math.max(0, donut.boing - dt * 2.2);

  for (const e of eggs){
    e.t += dt;
    e.sq *= Math.pow(0.0005, dt);
    if (e.state === 'enter'){
      e.y += (EGG_Y - e.y) * Math.min(1, dt * 14);
      if (Math.abs(e.y - EGG_Y) < 1.5){ e.y = EGG_Y; e.state = 'ready'; e.t = 0; }
    } else if (e.state === 'ready'){
      e.y = EGG_Y + Math.sin(e.t * 5) * 3;
      e.rot = Math.sin(e.t * 3) * .06;
    } else if (e.state === 'fly'){
      e.y += e.vy * dt; e.rot *= .8;
      const tip = e.y - EGG_TOP;
      if (tip <= DY){
        const dx = e.x - donut.x;
        if (Math.abs(dx) <= r - EGG_HALF){
          e.state = 'pass';           // 穴に入った
        } else if (Math.abs(dx) < R + EGG_HALF * .6){
          // ふちに当たる → ぽよん
          e.state = 'bounce'; e.face = 'oops';
          e.y = DY + EGG_TOP;
          e.vy = 380; e.vx = Math.sign(dx || 1) * (120 + Math.random() * 80);
          e.spin = Math.sign(dx || 1) * (5 + Math.random() * 4); e.sq = .35;
          fail('おしい！');
        } else {
          e.state = 'away'; e.face = 'oops';
          fail('ざんねん');
        }
      }
    } else if (e.state === 'pass'){
      e.y += e.vy * dt;
      if (e.y + EGG_BOT <= DY){       // おしりまで穴を通過した瞬間
        e.state = 'away';
        success();
      }
    } else if (e.state === 'away'){
      e.y += e.vy * dt; e.vy *= Math.pow(.6, dt);
      if (e.y < -120) e.dead = true;
    } else if (e.state === 'bounce'){
      e.vy += 1400 * dt; e.x += e.vx * dt; e.y += e.vy * dt; e.rot += e.spin * dt;
      if (e.y > H + 120) e.dead = true;
    }
  }
  // 結果が出たら すぐ次のナス
  if (state === 'play' && egg && (egg.state === 'away' || egg.state === 'bounce')) newEgg();
  eggs = eggs.filter(e => !e.dead);

  for (const p of fx){
    if (p.delay > 0){ p.delay -= dt; continue; }
    p.life += dt;
    if (p.k === 'heart'){
      p.vx *= Math.pow(.05, dt);
      p.vy += (-50 - p.vy) * Math.min(1, dt * 4);   // ふわっと上昇
    }
    p.x += p.vx * dt; p.y += p.vy * dt;
  }
  fx = fx.filter(p => p.life < p.max);
  for (const p of popups) p.t += dt;
  popups = popups.filter(p => p.t < 1);
}

function success(){
  score++; combo++;
  const perfect = combo >= 3;
  donut.boing = perfect ? 1.3 : 1; donut.bt = 0;
  burst(donut.x, DY - 30, perfect);
  if (perfect) popup('パーフェクト！', '#ff4f9a', 44);
  else popup('ナイス！', '#ff6fa5', 44);
  sfx.pon(perfect);
  if (score > best){ best = score; try{ localStorage.setItem('nasuBest', best); }catch(e){} }
}
function fail(msg){
  combo = 0;
  popup(msg, '#9a7bc4', 34);
  sfx.poyon();
}

// ===== 描画 =====
function draw(){
  drawBackground();

  withDonutBoing(() => {
    ctx.fillStyle = 'rgba(230,150,180,.18)';
    ctx.beginPath(); ctx.ellipse(donut.x, DY + TH + 34, R * .9, 12, 0, 0, Math.PI * 2); ctx.fill();
    drawDonut(donut.x, DY);
  });
  for (const e of eggs) drawEgg(e);
  withDonutBoing(() => drawDonutFront(donut.x, DY));

  // ハート・キラキラ
  for (const p of fx){
    if (p.delay > 0) continue;
    const k = p.life / p.max;
    const pop = k < .12 ? (k / .12) * 1.25 : (k < .22 ? 1.25 - (k - .12) / .1 * .25 : 1);
    ctx.save();
    ctx.translate(p.x, p.y);
    if (p.k === 'heart'){
      ctx.globalAlpha = k < .6 ? 1 : Math.max(0, 1 - (k - .6) / .4);
      ctx.rotate(p.rot + Math.sin(p.life * 6) * .12);
      ctx.scale(pop, pop);
      heartPath(p.size); ctx.fillStyle = p.c; ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.6)';
      ctx.beginPath(); ctx.ellipse(-p.size * .25, -p.size * .2, p.size * .08, p.size * .05, -.6, 0, Math.PI * 2); ctx.fill();
    } else {
      ctx.globalAlpha = Math.sin(k * Math.PI);
      ctx.rotate(p.rot + p.life * 2);
      const s = Math.sin(k * Math.PI);
      ctx.scale(s, s);
      starPath(p.size); ctx.fillStyle = p.c; ctx.fill();
      ctx.strokeStyle = 'rgba(255,200,120,.8)'; ctx.lineWidth = 1.5; ctx.stroke();
    }
    ctx.restore();
  }
  // 文字
  for (const p of popups){
    ctx.save();
    ctx.globalAlpha = p.t < .75 ? 1 : 1 - (p.t - .75) / .25;
    const sc = p.t < .12 ? .4 + p.t / .12 * .8 : (p.t < .22 ? 1.2 - (p.t - .12) / .1 * .2 : 1);
    ctx.translate(W / 2, DY + 150 - p.t * 30); ctx.scale(sc, sc);
    txt(p.s, 0, 0, p.size, p.color);
    if (p.s === 'パーフェクト！') txt(`${combo}れんぞく！`, 0, 42, 22, '#ff8fb8');
    ctx.restore();
  }

  // スコア表示
  if (state === 'play'){
    txt(`${score}`, W / 2, 50, 44, '#ff6fa5');
    txt(`ベスト ${best}`, W / 2, 88, 18, '#c99ab0');
  }

  if (state === 'title'){
    ctx.fillStyle = 'rgba(255,248,231,.78)'; ctx.fillRect(0, 0, W, H);
    txt('ナスっとドーナツ！', W / 2, 410, 42, '#a26fe0');
    ctx.font = '46px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('🍆🍩', W / 2, 470);
    txt('ドーナツの穴をねらって', W / 2, 530, 22, '#a07890');
    txt('ナスを飛ばそう！', W / 2, 562, 22, '#a07890');
    if ((performance.now() / 550 | 0) % 2) txt('タップでスタート', W / 2, 760 - 40, 30, '#ff6fa5');
    if (best) txt(`ベスト ${best}`, W / 2, 610, 20, '#c99ab0');
  }
}

let last = performance.now();
function loop(now){
  const dt = Math.min(0.033, (now - last) / 1000);
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
