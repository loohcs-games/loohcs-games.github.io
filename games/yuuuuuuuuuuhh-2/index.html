<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>てっぺん</title>
<style>
  * { box-sizing: border-box; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #cfe3f7; font-family: "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif; touch-action: none; }
  canvas { display: block; }
  #hud { position: fixed; left: 18px; top: 14px; color: #fff; text-shadow: 0 0 4px rgba(0,0,0,.6), 0 2px 8px rgba(0,0,0,.4); pointer-events: none; }
  #height { font-size: 46px; font-weight: 800; line-height: 1; letter-spacing: -1px; }
  #height small { font-size: 20px; margin-left: 3px; }
  #sub { font-size: 13px; margin-top: 6px; opacity: .9; }
  #toast { position: fixed; left: 50%; top: 20%; transform: translateX(-50%); color: #fff; font-size: 28px; font-weight: 800; letter-spacing: 4px; text-shadow: 0 2px 10px rgba(0,0,0,.55); opacity: 0; transition: opacity .6s; pointer-events: none; white-space: nowrap; }
  #speed { position: fixed; inset: 0; pointer-events: none; opacity: 0;
    background: repeating-conic-gradient(from 0deg at 50% 50%, rgba(255,255,255,0) 0deg 5deg, rgba(255,255,255,.22) 5deg 5.6deg);
    -webkit-mask-image: radial-gradient(circle at 50% 50%, transparent 38%, black 80%); mask-image: radial-gradient(circle at 50% 50%, transparent 38%, black 80%); }
  #hint { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); color: #fff; font-size: 13px; text-shadow: 0 1px 4px rgba(0,0,0,.6); pointer-events: none; opacity: .85; }
  .overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(10,20,40,.45); z-index: 10; }
  .card { background: rgba(255,255,255,.96); border-radius: 18px; padding: 26px 28px; max-width: 420px; width: calc(100% - 32px); text-align: center; color: #26303f; box-shadow: 0 10px 30px rgba(0,0,0,.3); }
  .card h1 { margin: 0 0 6px; font-size: 40px; letter-spacing: 6px; }
  .card p { margin: 8px 0; font-size: 14px; line-height: 1.6; }
  .card .keys { font-size: 13px; background: #eef2f7; border-radius: 10px; padding: 10px 12px; text-align: left; line-height: 1.7; }
  .btn { display: block; width: 100%; margin-top: 12px; padding: 14px; font-size: 18px; font-weight: 800; border: 0; border-radius: 12px; background: #2d6cdf; color: #fff; cursor: pointer; font-family: inherit; }
  .btn.sub { background: #dde3ec; color: #26303f; font-size: 15px; padding: 10px; }
  .hidden { display: none !important; }
  #touch { position: fixed; inset: 0; pointer-events: none; }
  #joyBase { position: fixed; width: 110px; height: 110px; margin: -55px 0 0 -55px; border-radius: 50%; background: rgba(255,255,255,.15); border: 2px solid rgba(255,255,255,.4); display: none; }
  #joyKnob { position: absolute; left: 50%; top: 50%; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%; background: rgba(255,255,255,.7); }
  .tbtn { position: fixed; border-radius: 50%; background: rgba(255,255,255,.3); border: 3px solid rgba(255,255,255,.7); color: #fff; font-weight: 800; display: flex; align-items: center; justify-content: center; pointer-events: auto; text-shadow: 0 1px 3px rgba(0,0,0,.5); }
  #jumpBtn { right: 24px; bottom: 30px; width: 90px; height: 90px; font-size: 17px; }
  #dashBtn { right: 126px; bottom: 44px; width: 64px; height: 64px; font-size: 14px; }
  #cp { font-size: 13px; margin-top: 4px; opacity: .95; }
  .sbtn { position: fixed; right: 14px; width: 52px; height: 40px; border-radius: 12px; border: 0; background: rgba(0,0,0,.3); color: #fff; font-size: 14px; font-weight: 800; pointer-events: auto; font-family: inherit; }
  #cp1Btn { top: 62px; } #cp2Btn { top: 108px; }
  #pauseBtn { position: fixed; right: 14px; top: 12px; width: 40px; height: 40px; border-radius: 12px; border: 0; background: rgba(0,0,0,.25); color: #fff; font-size: 18px; pointer-events: auto; }
</style>
</head>
<body>
<div id="hud">
  <div id="height">0<small>m</small></div>
  <div id="sub"></div>
  <div id="cp"></div>
</div>
<div id="speed"></div>
<div id="toast"></div>
<div id="hint" class="hidden">1 2 セーブ地点へもどる ・ ← → カメラ ・ P メニュー</div>

<div id="touch" class="hidden">
  <div id="joyBase"><div id="joyKnob"></div></div>
  <div id="dashBtn" class="tbtn">ダッシュ</div>
  <div id="jumpBtn" class="tbtn">ジャンプ</div>
  <button id="pauseBtn">Ⅱ</button>
  <button id="cp1Btn" class="sbtn">①</button>
  <button id="cp2Btn" class="sbtn">②</button>
</div>

<div id="menu" class="overlay">
  <div class="card">
    <h1>てっぺん</h1>
    <p>街の上空に積み上がったガラクタを、ひたすら上へ。<br>落ちたら、落ちたところから。</p>
    <p id="newNote" class="hidden" style="color:#ffd34d;font-weight:800">コースが新しくなって 300m に！ 240m の先に「宇宙（無重力）」エリアが追加。</p>
    <div class="keys" id="howto"></div>
    <button class="btn" id="startBtn">はじめる</button>
    <button class="btn sub hidden" id="resetBtn">いちばん下からやりなおす</button>
  </div>
</div>

<div id="clear" class="overlay hidden">
  <div class="card">
    <h1>てっぺん</h1>
    <p id="clearText"></p>
    <button class="btn" id="againBtn">もういちど下から</button>
    <button class="btn sub" id="stayBtn">景色をながめる</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
'use strict';

// ===== 定数 =====
const GOAL = 300;
const RAD = 0.35;                 // 体の当たり判定（球3つ）の半径
const OFFS = [0, 0.55, 1.1];      // 足元の球からの高さ
const G = 24;
const JUMP_V = 9.6;
const RUN = 5.6, DASH = 8.6;
const BOUNCE_V = 14.2;
const SAVE_KEY = 'teppen_v3';
const OLD_SAVE_KEY = 'teppen_v2';   // 前のコースの記録（最高記録だけ引きつぐ）
const isTouch = matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window;

const ZONES = [
  { from: 0,   name: '路地裏',       top: 0x5d9ff0, bottom: 0xd3e6f8, fogNear: 60,  fogFar: 420 },
  { from: 35,  name: 'ガラクタの塔', top: 0x4b90ea, bottom: 0xcfe4fa, fogNear: 80,  fogFar: 480 },
  { from: 110, name: '雲海',         top: 0x2f6fd6, bottom: 0xf2f7ff, fogNear: 90,  fogFar: 520 },
  { from: 180, name: '成層圏',       top: 0x020414, bottom: 0x1c2f66, fogNear: 120, fogFar: 700 },
  { from: 240, name: '宇宙（無重力）', top: 0x000000, bottom: 0x0b0d26, fogNear: 160, fogFar: 900 },
];
const zoneAt = h => { let z = 0; for (let i = 0; i < ZONES.length; i++) if (h >= ZONES[i].from) z = i; return z; };

function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rng = mulberry32(777);
const rand = (a, b) => a + (b - a) * rng();
const pick = arr => arr[Math.floor(rng() * arr.length)];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const angDiff = (a, b) => Math.atan2(Math.sin(b - a), Math.cos(b - a));

// ===== 描画の準備 =====
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(ZONES[0].bottom, 60, 420);
const camera = new THREE.PerspectiveCamera(68, 1, 0.1, 2000);

const hemi = new THREE.HemisphereLight(0xdfeeff, 0x6b6156, 0.65);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff3e0, 0.95);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -26, right: 26, top: 26, bottom: -26, near: 1, far: 120 });
sun.shadow.bias = -0.0006;
scene.add(sun, sun.target);
const SUN_DIR = new THREE.Vector3(0.45, 0.75, 0.35).normalize();

function resize() {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize();

// ===== 空 =====
const skyMat = new THREE.ShaderMaterial({
  uniforms: { top: { value: new THREE.Color() }, bottom: { value: new THREE.Color() } },
  vertexShader: 'varying vec3 vP; void main(){ vP = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
  fragmentShader: 'uniform vec3 top; uniform vec3 bottom; varying vec3 vP; void main(){ float h = clamp(vP.y * 1.3 + 0.12, 0.0, 1.0); gl_FragColor = vec4(mix(bottom, top, pow(h, 0.75)), 1.0); }',
  side: THREE.BackSide, depthWrite: false, fog: false,
});
const sky = new THREE.Mesh(new THREE.SphereGeometry(1500, 32, 16), skyMat);
sky.renderOrder = -1;
scene.add(sky);

function canvasTex(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = 4;
  return t;
}
const sunSprite = new THREE.Sprite(new THREE.SpriteMaterial({
  map: canvasTex(128, 128, (g, w) => {
    const gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
    gr.addColorStop(0, 'rgba(255,255,240,1)'); gr.addColorStop(0.18, 'rgba(255,250,220,1)');
    gr.addColorStop(0.3, 'rgba(255,240,200,.35)'); gr.addColorStop(1, 'rgba(255,240,200,0)');
    g.fillStyle = gr; g.fillRect(0, 0, w, w);
  }), fog: false, depthWrite: false, transparent: true }));
sunSprite.scale.set(260, 260, 1);
scene.add(sunSprite);

// ===== テクスチャ =====
function noise(g, w, h, base, amt, n) {
  g.fillStyle = base; g.fillRect(0, 0, w, h);
  for (let i = 0; i < n; i++) {
    const v = Math.floor(rng() * amt);
    g.fillStyle = `rgba(${rng() < .5 ? '0,0,0' : '255,255,255'},${v / 255})`;
    g.fillRect(rng() * w, rng() * h, 2, 2);
  }
}
const TEX = {
  asphalt: canvasTex(256, 256, (g, w, h) => { noise(g, w, h, '#55585d', 40, 5000); }),
  concrete: canvasTex(128, 128, (g, w, h) => { noise(g, w, h, '#b8b6b0', 35, 2500); g.strokeStyle = 'rgba(0,0,0,.15)'; g.strokeRect(0, 0, w, h); }),
  corrugated: canvasTex(128, 128, (g, w, h) => {
    for (let x = 0; x < w; x += 8) { g.fillStyle = '#ffffff'; g.fillRect(x, 0, 4, h); g.fillStyle = '#c9c9c9'; g.fillRect(x + 4, 0, 4, h); }
    g.fillStyle = 'rgba(0,0,0,.15)'; g.fillRect(0, 0, w, 4); g.fillRect(0, h - 4, w, 4);
  }),
  wood: canvasTex(128, 128, (g, w, h) => {
    g.fillStyle = '#d7b07a'; g.fillRect(0, 0, w, h);
    for (let y = 0; y < h; y += 32) { g.fillStyle = 'rgba(80,45,15,.35)'; g.fillRect(0, y, w, 2); }
    for (let i = 0; i < 60; i++) { g.fillStyle = 'rgba(120,70,30,.15)'; g.fillRect(0, rng() * h, w, 1); }
  }),
  steel: canvasTex(64, 64, (g, w, h) => { noise(g, w, h, '#8f979f', 25, 600); }),
  stone: canvasTex(128, 128, (g, w, h) => {
    noise(g, w, h, '#ddd3bf', 30, 2000);
    g.strokeStyle = 'rgba(90,70,40,.25)'; g.lineWidth = 2;
    for (let y = 0; y < h; y += 32) { g.beginPath(); g.moveTo(0, y); g.lineTo(w, y); g.stroke(); for (let x = (y / 32 % 2) * 32; x < w; x += 64) { g.beginPath(); g.moveTo(x, y); g.lineTo(x, y + 32); g.stroke(); } }
  }),
  panel: canvasTex(64, 64, (g, w, h) => {
    g.fillStyle = '#1f3a7a'; g.fillRect(0, 0, w, h);
    g.strokeStyle = '#8fb3ff'; g.lineWidth = 1;
    for (let i = 0; i <= w; i += 16) { g.beginPath(); g.moveTo(i, 0); g.lineTo(i, h); g.stroke(); g.beginPath(); g.moveTo(0, i); g.lineTo(w, i); g.stroke(); }
  }),
  mattress: canvasTex(64, 64, (g, w, h) => {
    g.fillStyle = '#f4f4f0'; g.fillRect(0, 0, w, h);
    g.fillStyle = '#6f9ad8'; for (let x = 0; x < w; x += 16) g.fillRect(x, 0, 6, h);
  }),
  rock: canvasTex(128, 128, (g, w, h) => { noise(g, w, h, '#7a7680', 60, 4000); }),
  brick: canvasTex(128, 128, (g, w, h) => {
    noise(g, w, h, '#9a4a36', 30, 1500);
    g.fillStyle = 'rgba(230,220,200,.55)';
    for (let y = 0; y < h; y += 16) { g.fillRect(0, y, w, 2); for (let x = (y / 16 % 2) * 16; x < w; x += 32) g.fillRect(x, y, 2, 16); }
  }),
};
const facades = [0, 1, 2].map(v => canvasTex(128, 128, (g, w, h) => {
  const walls = ['#b9b2a6', '#8e9aa6', '#c7b49b'];
  noise(g, w, h, walls[v], 18, 800);
  for (let y = 0; y < 4; y++) for (let x = 0; x < 4; x++) {
    const lit = rng() < 0.18;
    g.fillStyle = lit ? '#ffe9a8' : (v === 1 ? '#3b5168' : '#46505a');
    g.fillRect(x * 32 + 7, y * 32 + 8, 18, 18);
    g.fillStyle = 'rgba(255,255,255,.15)'; g.fillRect(x * 32 + 7, y * 32 + 8, 18, 3);
  }
}));

const matCache = {};
function M(key, color, map, extra) {
  return matCache[key] || (matCache[key] = new THREE.MeshLambertMaterial(Object.assign({ color, map: map || null }, extra || {})));
}

// 箱のUVを実寸に合わせる（テクスチャが伸びないように）
function boxGeo(hx, hy, hz, tile) {
  const geo = new THREE.BoxGeometry(hx * 2, hy * 2, hz * 2);
  if (!tile) return geo;
  const uv = geo.attributes.uv;
  const dims = [[hz, hy], [hz, hy], [hx, hz], [hx, hz], [hx, hy], [hx, hy]];
  for (let f = 0; f < 6; f++) for (let k = 0; k < 4; k++) {
    const i = f * 4 + k;
    uv.setXY(i, uv.getX(i) * dims[f][0] * 2 / tile, uv.getY(i) * dims[f][1] * 2 / tile);
  }
  return geo;
}

// ===== 足場 =====
const plats = [];
function addPlat(o) {
  let geo;
  if (o.shape === 'cyl') geo = new THREE.CylinderGeometry(o.r, o.r, o.hy * 2, 28);
  else if (o.shape === 'hcyl') { geo = new THREE.CylinderGeometry(o.r, o.r, o.hz * 2, 24); geo.rotateX(Math.PI / 2); }
  else geo = boxGeo(o.hx, o.hy, o.hz, o.tile);
  const mesh = new THREE.Mesh(geo, o.material);
  mesh.castShadow = o.castShadow !== false;
  mesh.receiveShadow = true;
  const p = Object.assign({ shape: 'box', yaw: 0, kind: 'static' }, o);
  p.base = new THREE.Vector3(o.x, o.y, o.z);
  p.pos = p.base.clone();
  p.delta = new THREE.Vector3();
  p.dyaw = 0;
  p.mesh = mesh;
  p.br = p.shape === 'cyl' ? Math.hypot(p.r, p.hy) : p.shape === 'hcyl' ? Math.hypot(p.r, p.hz) : Math.hypot(p.hx, p.hy, p.hz);
  mesh.position.copy(p.pos);
  mesh.rotation.y = p.yaw;
  scene.add(mesh);
  plats.push(p);
  return p;
}

// 向き ang（xz平面の角度）の方向へ、足場の端までの距離
function extentAlong(p, ang) {
  if (p.shape === 'cyl') return p.r;
  const ux = Math.sin(ang), uz = Math.cos(ang);
  const c = Math.cos(p.yaw), s = Math.sin(p.yaw);
  const lx = ux * c - uz * s, lz = ux * s + uz * c;
  const hx = p.shape === 'hcyl' ? p.r : p.hx;
  return Math.abs(lx) * hx + Math.abs(lz) * p.hz;
}

// ===== 街 =====
function buildCity() {
  addPlat({ x: 0, y: -1, z: 0, hx: 700, hy: 1, hz: 700, castShadow: false, tile: 8,
    material: M('asphalt', 0xffffff, TEX.asphalt) });
  const roof = M('roof', 0x6d6a66);
  for (let gx = -280; gx <= 280; gx += 28) for (let gz = -280; gz <= 280; gz += 28) {
    const x = gx + rand(-4, 4), z = gz + rand(-4, 4);
    if (Math.hypot(x, z) < 50) continue;
    const hx = rand(6, 10), hz = rand(6, 10);
    const far = Math.hypot(x, z);
    let h = rand(8, 28) + (rng() < 0.22 ? rand(20, 60) : 0);
    if (far > 200) h *= 0.7;
    const v = Math.floor(rng() * 3);
    const fm = M('fac' + v, 0xffffff, facades[v]);
    const mesh = new THREE.Mesh(boxGeo(hx, h / 2, hz, 8), [fm, fm, roof, roof, fm, fm]);
    mesh.position.set(x, h / 2, z);
    mesh.receiveShadow = true;
    scene.add(mesh);
    plats.push({ shape: 'box', kind: 'static', x, y: h / 2, z, hx, hy: h / 2, hz, yaw: 0,
      base: mesh.position.clone(), pos: mesh.position.clone(), delta: new THREE.Vector3(), dyaw: 0, mesh, br: Math.hypot(hx, h / 2, hz), city: true });
  }
  // 雲海と、ちぎれ雲
  const cloudGeo = new THREE.SphereGeometry(1, 12, 8);
  const cloudMat = new THREE.MeshLambertMaterial({ color: 0xffffff, emissive: 0x9aa6b8 });
  const N = 520;
  const inst = new THREE.InstancedMesh(cloudGeo, cloudMat, N);
  const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), sc = new THREE.Vector3(), ps = new THREE.Vector3(), up = new THREE.Vector3(0, 1, 0);
  for (let i = 0; i < N; i++) {
    const layer = i < 440;
    const a = rng() * Math.PI * 2;
    const d = layer ? rand(38, 520) : rand(40, 260);
    const y = layer ? rand(96, 104) : rand(45, 175);
    ps.set(Math.cos(a) * d, y, Math.sin(a) * d);
    const s = layer ? rand(10, 26) : rand(4, 10);
    sc.set(s * rand(1, 1.6), s * rand(0.28, 0.42), s);
    q.setFromAxisAngle(up, rng() * 6.28);
    m4.compose(ps, q, sc);
    inst.setMatrixAt(i, m4);
  }
  scene.add(inst);
  // 星
  const SN = 1400, arr = new Float32Array(SN * 3);
  for (let k = 0; k < SN; k++) {
    const u = rng() * 1.1 - 0.1, a = rng() * 6.28, s = Math.sqrt(1 - u * u);
    arr[k * 3] = Math.cos(a) * s * 1200; arr[k * 3 + 1] = u * 1200; arr[k * 3 + 2] = Math.sin(a) * s * 1200;
  }
  const sg = new THREE.BufferGeometry();
  sg.setAttribute('position', new THREE.BufferAttribute(arr, 3));
  stars = new THREE.Points(sg, new THREE.PointsMaterial({ color: 0xffffff, size: 2.2, sizeAttenuation: false, transparent: true, opacity: 0, fog: false, depthWrite: false }));
  scene.add(stars);
}
let stars;

// ===== コース =====
const CONT_COLORS = [0xc4432f, 0x2f6fb5, 0x3f8f4f, 0xe08a2a, 0x8a8f96, 0x7b3fa0];
const CAR_COLORS = [0xd23b3b, 0xf0f0f0, 0x2a5ea8, 0xf2c230, 0x333333];

// 足場の「設計図」。top は乗る面の高さ、oy は top からの中心の高さ
function makeSpec(type, zone, t, h, o = {}) {
  zone = Math.min(zone, 3);   // 宇宙は成層圏と同じ見た目の足場
  const S = { type, h, parts: [], extIn: null, deco: null, gapMul: 1, amp: 0, extIdx: 0 };
  const box = (hx, hy, hz, yaw, surf, material, extra) => Object.assign({ shape: 'box', hx, hy, hz, yaw, oy: surf - hy, material }, extra || {});
  switch (type) {
    case 'crate': { const s = rand(0.55, 0.85); S.parts.push(box(s, s, s, h + rand(-0.4, 0.4), 0, M('crate', 0xc89a5e, TEX.wood), { tile: s * 2 })); break; }
    case 'container': {
      const len = rand(2.4, 3.1), cross = rng() < 0.4, col = pick(CONT_COLORS);
      S.parts.push(box(1.2, 1.25, len, cross ? h + Math.PI / 2 : h, 0, M('cont' + col, col, TEX.corrugated), { tile: 2 })); break;
    }
    case 'car': {
      const col = pick(CAR_COLORS), yaw = h + (rng() < 0.4 ? Math.PI / 2 : 0);
      S.parts.push(box(0.74, 0.28, 0.95, yaw, 0, M('carT' + col, col)));
      S.parts.push(box(0.92, 0.36, 2.1, yaw, -0.56, M('car' + col, col)));
      S.extIdx = 1;
      S.deco = (pl) => {
        const body = pl[1].mesh;
        const wg = new THREE.CylinderGeometry(0.34, 0.34, 0.24, 14); wg.rotateZ(Math.PI / 2);
        for (const sx of [-1, 1]) for (const sz of [-1, 1]) {

const POOLS = [
  { crate: 3, container: 3, car: 2, slab: 2, ac: 1, plank: 1 },
  { container: 3, pipe: 3, plank: 2, girder: 2, crate: 1, car: 1, slab: 1, ac: 1 },
  { pillar: 3, island: 3, plank: 2, slab: 1 },
  { rock: 3, panel: 2, module: 2, girder: 2 },
  { rock: 4, panel: 2, module: 2 },
];
function pickW(pool) {
  let sum = 0; for (const k in pool) sum += pool[k];
  let r = rng() * sum;
  for (const k in pool) { r -= pool[k]; if (r <= 0) return k; }
  return Object.keys(pool)[0];
}

// ===== 無重力ゾーン =====
// 中に入ると重力がほぼなくなって、ふわふわ浮く。スペース長おしで上へ。
// lift > 0 のゾーンは、ゆっくり上に運ばれる（無重力エレベーター）
const glowTex = canvasTex(64, 64, (g) => { const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32); gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.35, 'rgba(255,255,255,.45)'); gr.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = gr; g.fillRect(0, 0, 64, 64); });
const fieldTex = canvasTex(32, 128, (g, w, h) => {
  const gr = g.createLinearGradient(0, 0, 0, h);
  gr.addColorStop(0, 'rgba(255,255,255,0)'); gr.addColorStop(0.15, 'rgba(255,255,255,1)'); gr.addColorStop(0.85, 'rgba(255,255,255,1)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
});
const floats = [];
function addFloat(x, z, r, y0, y1, lift) {
  const hgt = y1 - y0, grp = new THREE.Group();
  grp.position.set(x, (y0 + y1) / 2, z); scene.add(grp);
  const col = lift > 0 ? 0x8a63ff : 0x2fb8ff;
  // 明るい空でも暗い宇宙でも見えるように、ふつうの半透明で色をつける
  const blend = { transparent: true, depthWrite: false, side: THREE.DoubleSide, fog: false };
  const tube = new THREE.Mesh(new THREE.CylinderGeometry(r, r, hgt, 40, 1, true), new THREE.MeshBasicMaterial(Object.assign({ color: col, map: fieldTex, opacity: 0.22 }, blend)));
  grp.add(tube);
  const rings = [];
  const ringM = new THREE.MeshBasicMaterial(Object.assign({ color: col, opacity: 0.5 }, blend));
  const nR = Math.max(3, Math.round(hgt / 2.5));
  for (let i = 0; i < nR; i++) {
    const ring = new THREE.Mesh(new THREE.TorusGeometry(r * 0.98, 0.05, 6, 48), ringM.clone());
    ring.rotation.x = Math.PI / 2; grp.add(ring); rings.push(ring);
  }
  const motes = [];
  for (let i = 0; i < 18; i++) {
    const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color: col, transparent: true, depthWrite: false, fog: false }));
    const a = rng() * Math.PI * 2, d = Math.sqrt(rng()) * r * 0.9;
    sp.position.set(Math.cos(a) * d, rand(-hgt / 2, hgt / 2), Math.sin(a) * d);
    sp.scale.setScalar(rand(0.12, 0.28)); grp.add(sp); motes.push(sp);
  }
  const f = { x, z, r, y0, y1, lift, grp, rings, motes, hgt };
  floats.push(f);
  return f;
}
function updateFloats(t, dt) {
  for (const f of floats) {
    if (Math.abs(f.grp.position.y - camera.position.y) > 160) { f.grp.visible = false; continue; }
    f.grp.visible = true;
    const sp = f.lift > 0 ? 0.9 : 0.25;
    f.rings.forEach((ring, i) => {
      const u = ((t * sp / f.hgt * 2.5 + i / f.rings.length) % 1);
      ring.position.y = (u - 0.5) * f.hgt;
      ring.material.opacity = Math.sin(u * Math.PI) * 0.75;
      const s = f.lift > 0 ? 1 : 0.9 + Math.sin(t * 1.5 + i) * 0.08; ring.scale.set(s, s, 1);
    });
    for (const m of f.motes) {
      m.position.y += (f.lift > 0 ? 1.6 : 0.35) * dt;
      if (m.position.y > f.hgt / 2) m.position.y -= f.hgt;
    }
  }
}
function floatAt(x, y, z) {
  for (const f of floats) if (y > f.y0 && y < f.y1 && (x - f.x) ** 2 + (z - f.z) ** 2 < f.r * f.r) return f;
  return null;
}

// ===== セーブ灯 =====
// 休けいの屋上にだけある。ふれると火がついて、そこがセーブ地点になる
const lanterns = [];
function addLantern(piece) {
  const p = piece.main, lx = 1.9, lz = 1.7;
  const c = Math.cos(p.yaw || 0), s = Math.sin(p.yaw || 0);
  const x = p.pos.x + c * lx + s * lz, z = p.pos.z - s * lx + c * lz, y = p.pos.y + p.hy;
  const g = new THREE.Group(); g.position.set(x, y, z); scene.add(g);
  const post = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.07, 1.2, 8), M('pivot', 0x77808a, TEX.steel)); post.position.y = 0.6; post.castShadow = true; g.add(post);
  const base = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.28, 0.12, 10), M('pivot', 0x77808a, TEX.steel)); base.position.y = 0.06; g.add(base);
  const glassM = new THREE.MeshLambertMaterial({ color: 0x8aa0b8, emissive: 0x0e1a2a });
  const glass = new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.42, 0.34), glassM); glass.position.y = 1.42; g.add(glass);
  const cap = new THREE.Mesh(new THREE.ConeGeometry(0.3, 0.22, 4), M('shoe', 0x2b2b2b)); cap.position.y = 1.74; cap.rotation.y = Math.PI / 4; g.add(cap);
  const glow = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color: 0x7fb2ff, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, opacity: 0.35 }));
  glow.scale.setScalar(1.2); glow.position.y = 1.42; g.add(glow);
  // 下からでも見える光の柱
  const beam = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 24, 8, 1, true),
    new THREE.MeshBasicMaterial({ color: 0x7fb2ff, map: fieldTex, transparent: true, opacity: 0.18, blending: THREE.AdditiveBlending, depthWrite: false, fog: false }));
  beam.position.y = 13.5; g.add(beam);
  const L = { id: lanterns.length, x, y, z, top: y, g, glassM, glow, beam, lit: false, faceYaw: Math.atan2(p.pos.x - x, p.pos.z - z) };
  lanterns.push(L);

}

const path = [];      // 進路の足場（ひとつずつ）
let overlapFallbacks = 0; const fallbackAt = [];
let goalPlat = null, goalRing = null;
const START = new THREE.Vector3(0, RAD + 0.01, 4);
let startYaw = 0;

function buildCourse() {
  // 最初の足場：ゴミ箱
  const dump = addPlat({ x: 0, y: 0.65, z: -1.5, hx: 1.6, hy: 0.65, hz: 1.0, yaw: 0, material: M('dump', 0x2f6b4a, TEX.corrugated), tile: 1 });
  let prev = { main: dump, type: 'dump', x: 0, z: -1.5, top: 1.3, rad: 1.9, yMin: 0, yMax: 1.3, extOut: dump };
  const pieces = [prev];
  let heading = Math.PI;
  const spiral = rng() < 0.5 ? 0.3 : -0.3;
  let lastRest = 0;

  // 前の足場の先に、次の足場をひとつ置く
  function place(type, o = {}) {
    const t = prev.top / GOAL, zone = zoneAt(prev.top);
    const dy = o.dy != null ? o.dy : rand(0.35, lerp(1.0, 1.3, t));
    const wallH = dy + rand(2.2, 4);
    let best = null;
    for (let attempt = 0; attempt < 90; attempt++) {
      // 最初は進む向きの近くで。見つからなければ、どの向きでも探す
      let h = attempt < 25
        ? heading + (o.turn != null ? o.turn : spiral * rand(0, 1.2)) + rand(-1, 1) * (o.jitter != null ? o.jitter : 0.6) * (1 + attempt * 0.1)
        : rng() * Math.PI * 2;
      const dc = Math.hypot(prev.x, prev.z);
      if (dc > 20) h += angDiff(h, Math.atan2(-prev.x, -prev.z)) * clamp((dc - 20) / 8, 0, 0.8);
      const S = makeSpec(type, zone, t, h, { height: wallH, top: prev.top + dy });
      let gap = o.gap != null ? o.gap : rand(lerp(0.6, 1.3, t), lerp(1.5, 2.6, t)) * S.gapMul;
      if (o.gap == null && dy > 1.15) gap = Math.min(gap, 2.2);
      const outExt = extentAlong(prev.extOut, h);
      const inExt = S.extIn != null ? S.extIn : extentAlong(S.extPart, h + Math.PI);
      const d = outExt + gap + inExt;
      const x = prev.x + Math.sin(h) * d, z = prev.z + Math.cos(h) * d;
      const top = prev.top + dy;
      const cand = { x, z, top, rad: S.rad, yMin: top - S.depth, yMax: top + (type === 'roof' ? 2.5 : 0), S, h };
      let ok = true;
      const mx = (prev.x + x) / 2, mz = (prev.z + z) / 2, lowY = Math.min(prev.top, top);
      for (let k = 0; k < pieces.length - 1 && ok; k++) {
        const q = pieces[k];
        const hd = Math.hypot(q.x - x, q.z - z);
        if (hd < q.rad + cand.rad + 0.8 && cand.yMin < q.yMax + 2.6 && cand.yMax + 2.6 > q.yMin) ok = false;
        // ジャンプの通り道の上に、ほかの足場がかぶらないように
        if (Math.hypot(q.x - mx, q.z - mz) < q.rad + (o.clearR || 1.5) && q.yMin < lowY + (o.clear || 4.2) && q.yMax > lowY - (o.clearDown || 0.5)) ok = false;
      }
      if (!ok && attempt < 89) continue;
      if (!ok) { overlapFallbacks++; fallbackAt.push([type, Math.round(prev.top), JSON.stringify(o)]); }
      best = cand;
      break;
    }
    const { S, x, z, top, h } = best;
    const c = Math.cos(h), sn = Math.sin(h);
    const built = S.parts.map(p => {
      const ox = p.ox || 0, oz = p.oz || 0;
      return addPlat(Object.assign({}, p, { x: x + c * ox + sn * oz, y: top + p.oy, z: z - sn * ox + c * oz }));
    });
    if (S.deco) S.deco(built);
    const piece = { main: built[0], type, x, z, top, rad: best.rad, yMin: best.yMin, yMax: best.yMax, extOut: built[S.extIdx], parts: built };
    pieces.push(piece);
    path.push(piece);
    prev = piece;
    heading = h;
    return piece;
  }

  const basic = () => pickW(POOLS[zoneAt(prev.top)]);
  // 2つの足場のすき間に無重力ゾーンを置く（ほかの足場がそこに来ないように、ダミーの場所取りもする）
  function fieldBetween(a, b, gap, y0, y1, lift) {
    const h = Math.atan2(b.x - a.x, b.z - a.z);
    const ea = extentAlong(a.extOut, h);
    const cx = a.x + Math.sin(h) * (ea + gap / 2), cz = a.z + Math.cos(h) * (ea + gap / 2);
    const r = gap / 2 + (lift > 0 ? -0.15 : 0.35);
    addFloat(cx, cz, r, y0, y1, lift);
    pieces.splice(pieces.length - 1, 0, { x: cx, z: cz, rad: r, yMin: y0, yMax: y1, type: 'field' });
  }
  const SEG = {

let dustI = 0;
function puff(x, y, z, n, power) {
  for (let i = 0; i < n; i++) {
    const d = dust[dustI++ % dust.length], a = Math.random() * Math.PI * 2, s = (0.8 + Math.random()) * power;
    d.sp.position.set(x, y + 0.1, z); d.vx = Math.cos(a) * s; d.vz = Math.sin(a) * s; d.vy = 0.4 + Math.random() * 0.6;
    d.life = 1; d.sp.visible = true;

}
function updateDust(dt) {
  for (const d of dust) if (d.life > 0) {
    d.life -= dt * 1.8;
    d.sp.position.x += d.vx * dt; d.sp.position.z += d.vz * dt; d.sp.position.y += d.vy * dt;
    d.vx *= 0.92; d.vz *= 0.92;
    const sc = 0.4 + (1 - d.life) * 0.9; d.sp.scale.set(sc, sc, sc);
    d.sp.material.opacity = Math.max(0, d.life) * 0.7;
    if (d.life <= 0) d.sp.visible = false;
  }
}

function updateLanterns() {

    if (L.lit === lit) continue;
    L.lit = lit;
    L.glassM.emissive.setHex(lit ? 0xff9a2e : 0x0e1a2a);
    L.glassM.color.setHex(lit ? 0xffd27a : 0x8aa0b8);
    L.glow.material.color.setHex(lit ? 0xffb04a : 0x7fb2ff); L.glow.material.opacity = lit ? 0.9 : 0.35; L.glow.scale.setScalar(lit ? 2.2 : 1.2);
    L.beam.material.color.setHex(lit ? 0xffb04a : 0x7fb2ff); L.beam.material.opacity = lit ? 0.32 : 0.18;
  }
}
function lightLantern(L) {
  if (cps.some(c => c && c.id === L.id)) return;
  let i = cps.findIndex(c => !c), swapped = false;
  if (i < 0) {
    const lo = cps[0].y <= cps[1].y ? 0 : 1;
    if (cps[lo].y >= L.top + RAD) return;      // 2つとも、ここより高い
    i = lo; swapped = true;

  // ランタンの少し内側（屋上のまん中より）に立つ
  const sx = L.x + Math.sin(L.faceYaw) * 0.9, sz = L.z + Math.cos(L.faceYaw) * 0.9;
  cps[i] = { id: L.id, x: sx, y: L.top + RAD + 0.01, z: sz, yaw: camYaw, face: faceYaw };
  updateLanterns();

}

function load() {
  try {

      // 前のコース（240m）の記録があれば、クリアしたことだけ引きつぐ
      const o = JSON.parse(localStorage.getItem(OLD_SAVE_KEY));

    P.set(s.x, s.y + 0.05, s.z);

    camYaw = s.camYaw ?? camYaw;
    faceYaw = camYaw + Math.PI; moveYaw = faceYaw;
    if (Array.isArray(s.cps)) { cps = s.cps.slice(0, 2).map(c => c && c.id != null && lanterns[c.id] ? c : null); while (cps.length < 2) cps.push(null); }

let ac = null, windGain = null;
function initAudio() {
  if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
  try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
  const len = ac.sampleRate * 2, buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
  let last = 0;
  for (let i = 0; i < len; i++) { last = (last + (Math.random() * 2 - 1) * 0.02) / 1.02; d[i] = last * 3.5; }
  const src = ac.createBufferSource(); src.buffer = buf; src.loop = true;
  const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 700;
  windGain = ac.createGain(); windGain.gain.value = 0;
  src.connect(lp).connect(windGain).connect(ac.destination);
  src.start();
  startMusic();
}

let musicGain = null, nextBar = 0, barN = 0, muted = false;

    const song = SONGS[zoneAt(P.y)];
    const beat = 60 / song.bpm, bar = beat * 4;
    const ch = song.chords[barN % 4];
    // パッド（やわらかい和音）
    for (const m of ch) { note(m, nextBar, bar, 'triangle', 0.035, bar * 0.35); note(m + 0.07, nextBar, bar, 'sine', 0.03, bar * 0.4); }

    note(ch[0] - 12, nextBar, beat * 1.8, 'sine', 0.09, 0.02);
    note(ch[0] - 12, nextBar + beat * 2, beat * 1.8, 'sine', 0.07, 0.02);

    for (let i = 0; i < 8; i++) {

const nOut = new THREE.Vector3();
function collide(p, px, py, pz) {
  const dx = px - p.pos.x, dy = py - p.pos.y, dz = pz - p.pos.z;
  let nx, ny, nz, depth;
  if (p.shape === 'cyl') {
    const rho = Math.hypot(dx, dz);

    if (rho > p.r) { qx = dx / rho * p.r; qz = dz / rho * p.r; }
    const qy = clamp(dy, -p.hy, p.hy);
    const ex = dx - qx, ey = dy - qy, ez = dz - qz;
    const d2 = ex * ex + ey * ey + ez * ez;
    if (d2 >= RAD * RAD) return 0;
    if (d2 > 1e-8) { const d = Math.sqrt(d2); nx = ex / d; ny = ey / d; nz = ez / d; depth = RAD - d; }
    else {

      else { nx = dx / rho; nz = dz / rho; ny = 0; depth = side + RAD; }

      let qx = lx, qy = dy;
      if (rr > p.r) { qx = lx / rr * p.r; qy = dy / rr * p.r; }
      const ex = lx - qx, ey = dy - qy, ez = lz - cz;
      const d2 = ex * ex + ey * ey + ez * ez;
      if (d2 >= RAD * RAD) return 0;
      if (d2 > 1e-8) { const d = Math.sqrt(d2); ax = ex / d; ay = ey / d; az = ez / d; depth = RAD - d; }
      else {
        const side = p.r - rr, cap = p.hz - Math.abs(lz);

        else if (rr > 1e-6) { ax = lx / rr; ay = dy / rr; az = 0; depth = side + RAD; }
        else { ax = 0; ay = 1; az = 0; depth = p.r + RAD; }

      const cx = clamp(lx, -p.hx, p.hx), cy = clamp(dy, -p.hy, p.hy), cz = clamp(lz, -p.hz, p.hz);
      const ex = lx - cx, ey = dy - cy, ez = lz - cz;

      if (d2 >= RAD * RAD) return 0;
      if (d2 > 1e-8) { const d = Math.sqrt(d2); ax = ex / d; ay = ey / d; az = ez / d; depth = RAD - d; }

        if (qy <= qx && qy <= qz) { ay = Math.sign(dy) || 1; depth = qy + RAD; }
        else if (qx <= qz) { ax = Math.sign(lx) || 1; depth = qx + RAD; }

  const rel = top - (P.y - RAD);

// ===== 1ステップ =====
const tmpV = new THREE.Vector3();
function step(dt) {

      tmpV.set(p.base.x + p.mv.ax * s, p.base.y + p.mv.ay * s, p.base.z + p.mv.az * s);
      p.delta.subVectors(tmpV, p.pos);
      p.pos.copy(tmpV);
      p.mesh.position.copy(p.pos);
    } else if (p.kind === 'spin') {

  } else V.y -= g * dt;
  if (V.y < -45) V.y = -45;
  if (jumpBuf > 0 && coyote > 0) {
    V.y = JUMP_V; coyote = 0; jumpBuf = 0; ground = null; wasGround = false; airTime = 0;
    puff(P.x, P.y - RAD, P.z, 3, 0.5);
    sfx(220, 0.08, 'triangle', 300, 0.06);
  }

  P.addScaledVector(V, dt);

  const preVy = V.y;
  let onGround = null, wallP = null, wallNx = 0, wallNz = 0, ladderP = null;
  for (let iter = 0; iter < 2; iter++) {
    for (let si = 0; si < 3; si++) {
      for (const p of plats) {
        const sy = P.y + OFFS[si];
        const ddx = P.x - p.pos.x, ddy = sy - p.pos.y, ddz = P.z - p.pos.z;
        const lim = p.br + RAD;
        if (ddx * ddx + ddy * ddy + ddz * ddz > lim * lim) continue;
        const depth = collide(p, P.x, sy, P.z);
        if (!depth) continue;
        if (si > 0 && nOut.y > 0.6) continue;     // 体の上の方が床に乗るのは無視（足で判定）
        if (p.ladder && Math.abs(nOut.y) < 0.35 && nOut.x * p.ladder.nx + nOut.z * p.ladder.nz > 0.8 &&
            Math.abs((P.x - p.ladder.cx) * p.ladder.tx + (P.z - p.ladder.cz) * p.ladder.tz) < 0.7) ladderP = p;
        if (Math.abs(nOut.y) < 0.35 && (!wallP || si > 0)) {
          const l = Math.hypot(nOut.x, nOut.z); wallP = p; wallNx = nOut.x / l; wallNz = nOut.z / l;
        }
        P.addScaledVector(nOut, depth);
        const vn = V.dot(nOut);
        if (vn < 0) V.addScaledVector(nOut, -vn);
        if (si === 0 && nOut.y > 0.6) {
          if (p.kind === 'bounce' && preVy < -1) {
            V.y = BOUNCE_V; p.wobble = 1;
            sfx(180, 0.25, 'sine', 420, 0.15);
          } else onGround = p;
        }
      }
    }
  }

  if (onGround) {
    if (!wasGround) {
      const impact = -preVy;
      if (impact > 4) { landDip = clamp(impact / 30, 0.12, 0.35); sfx(90, 0.1, 'sine', 50, clamp(impact / 60, 0.05, 0.25)); puff(P.x, P.y - RAD, P.z, Math.min(10, 3 + impact / 3), 0.6 + impact / 25); }
      if (airStartY - P.y > 8) {
        falls++;
        if (cps.some(c => c && c.y > P.y + 4)) toast(isTouch ? '① ② でセーブ地点にもどれる' : '1 ・ 2 キーでセーブ地点にもどれる');
      }
    }
    ground = onGround; coyote = 0.1; airTime = 0;
    airStartY = P.y;
    wasGround = true;
  } else {
    if (P.y > airStartY) airStartY = P.y;
    ground = null; wasGround = false; airTime += dt;
    // 空中で壁に向かって進んでいたら、ふちにつかまる
    if (wallP && grabCool <= 0 && V.y < 4 && airTime > 0.04) {
      const il = Math.hypot(tx, tz);
      if (il > 0.1 && (tx * -wallNx + tz * -wallNz) / il > 0.3) tryGrab(wallP, wallNx, wallNz);
    }
  }

  // はしごに向かって進んだら、つかまる（地面からでも空中からでも）
  if (ladderP && !climb && grabCool <= 0 && P.y - RAD < ladderP.pos.y + ladderP.hy - 0.5) {
    const il = Math.hypot(tx, tz);
    if (il > 0.1 && (tx * -ladderP.ladder.nx + tz * -ladderP.ladder.nz) / il > 0.5) grabLadder(ladderP);
  }

  checkLanterns();
  if (ground === goalPlat && !cleared) clear();
  if (P.y < -30) { P.copy(START); V.set(0, 0, 0); }
}

// ===== 動き（アニメーション） =====
function setJ(obj, axis, target, k) { obj.rotation[axis] += (target - obj.rotation[axis]) * k; }
function animate(dt) {
  const hv = Math.hypot(V.x, V.z);
  if (climb) faceYaw = Math.atan2(-climb.nx, -climb.nz);
  else if (ladder) faceYaw = Math.atan2(-ladder.nx, -ladder.nz);
  else if (camMode === 'chase') faceYaw += angDiff(faceYaw, moveYaw) * Math.min(1, 20 * dt);
  else if (hv > 0.4) faceYaw += angDiff(faceYaw, Math.atan2(V.x, V.z)) * Math.min(1, (ground ? 14 : 6) * dt);
  hero.root.position.set(P.x, P.y - RAD, P.z);
  hero.root.rotation.y = faceYaw;
  // 曲がるとき、内側に体を傾ける
  const leanT = camMode === 'chase' && ground && !climb ? steer * 0.22 * Math.min(1, hv / RUN) : 0;
  hero.root.rotation.z += (leanT - hero.root.rotation.z) * Math.min(1, 10 * dt);
  const k = Math.min(1, (climb || ladder ? 26 : 16) * dt);
  const H = hero;
  landDip = Math.max(0, landDip - dt * 1.2);
  let hipY = 0.93 - landDip * 0.5;
  const t = { hipL: 0, hipR: 0, knL: 0, knR: 0, shL: 0, shR: 0, shLz: -0.08, shRz: 0.08, elL: -0.15, elR: -0.15, torso: 0, head: 0 };
  if (ladder) {
    // はしご：手と足を交互に
    const s1 = Math.sin(ladderPhase);
    t.shL = -2.5 + s1 * 0.45; t.shR = -2.5 - s1 * 0.45; t.elL = -0.7 - s1 * 0.3; t.elR = -0.7 + s1 * 0.3;
    t.hipL = -0.9 - s1 * 0.5; t.hipR = -0.9 + s1 * 0.5; t.knL = 1.3 + s1 * 0.4; t.knR = 1.3 - s1 * 0.4;
    t.torso = 0.05; t.head = -0.25; t.shLz = -0.1; t.shRz = 0.1;
  } else if (climb && !climb.up) {
    // ぶら下がり：両手を上に
    t.shL = t.shR = -2.9; t.shLz = -0.12; t.shRz = 0.12; t.elL = t.elR = -0.05;
    t.hipL = 0.15; t.hipR = -0.1; t.knL = 0.35; t.knR = 0.2; t.torso = -0.05;
  } else if (climb) {
    // よじ登り：腕で体を押し上げて、片ひざをかける
    const u = climb.t;
    t.shL = t.shR = lerp(-2.9, -0.3, easeInOut(u));
    t.elL = t.elR = -Math.sin(u * Math.PI) * 1.3;
    t.torso = 0.15 + Math.sin(u * Math.PI) * 0.45;
    t.hipL = -1.4 * Math.sin(Math.min(1, u * 1.4) * Math.PI * 0.5); t.knL = 1.8 * (1 - u * 0.6);
    t.hipR = 0.35 * (1 - u); t.knR = 0.5;
    t.head = 0.2;
  } else if (ground || airTime < 0.08) {
    if (hv > 0.5) {
      const amt = Math.min(1, hv / RUN);
      const dash = hv > RUN + 0.5;
      runPhase += dt * hv * (dash ? 1.55 : 1.9);
      const s = Math.sin(runPhase);
      const sw = dash ? 1.0 : 0.85;
      t.hipL = -s * sw * amt; t.hipR = s * sw * amt;
      t.knL = Math.max(0, Math.sin(runPhase - 1.3)) * 1.4 * amt + 0.1;
      t.knR = Math.max(0, Math.sin(runPhase + Math.PI - 1.3)) * 1.4 * amt + 0.1;
      t.shL = s * 0.8 * amt; t.shR = -s * 0.8 * amt;
      t.elL = t.elR = -0.9 * amt - 0.2;
      t.torso = (dash ? 0.28 : 0.15) * amt;
      hipY += Math.abs(Math.cos(runPhase)) * 0.06 * amt - 0.03 * amt;
      const stepN = Math.floor(runPhase / Math.PI);
      if (stepN !== lastStep && ground) { lastStep = stepN; sfx(140 + Math.random() * 40, 0.04, 'triangle', 80, 0.035); }
    } else {
      const b = Math.sin(gameT * 2.2);
      t.torso = b * 0.02; t.head = b * 0.03;
      t.shLz = -0.1 - b * 0.02; t.shRz = 0.1 + b * 0.02;
    }
    if (landDip > 0) { t.knL += landDip * 2.2; t.knR += landDip * 2.2; t.hipL -= landDip * 1.2; t.hipR -= landDip * 1.2; t.torso += landDip; }
  } else if (inFloat) {
    // 無重力：ゆっくり泳ぐように
    const f = gameT * 2.2;
    t.shLz = -1.3 + Math.sin(f) * 0.35; t.shRz = 1.3 - Math.sin(f) * 0.35; t.shL = -0.4 + Math.sin(f + 1) * 0.3; t.shR = -0.4 - Math.sin(f + 1) * 0.3;
    t.elL = t.elR = -0.5; t.hipL = -0.5 + Math.sin(f) * 0.35; t.hipR = -0.2 - Math.sin(f) * 0.35; t.knL = 0.9; t.knR = 0.6;
    t.torso = 0.25; t.head = -0.1;
  } else if (V.y > 1.5) {
    // 上昇：片ひざを上げる
    t.hipL = -1.0; t.knL = 1.3; t.hipR = 0.35; t.knR = 0.5;
    t.shL = 0.5; t.shR = -0.9; t.elL = -0.6; t.elR = -0.5;
    t.shLz = -0.3; t.shRz = 0.3; t.torso = 0.1;
  } else if (airTime < 0.9 || V.y > -14) {
    // 落ちはじめ：手を広げてバランス
    t.hipL = -0.4; t.knL = 0.7; t.hipR = 0.1; t.knR = 0.4;
    t.shLz = -1.2; t.shRz = 1.2; t.shL = -0.2; t.shR = -0.2; t.elL = t.elR = -0.3;
  } else {
    // 長い落下：手足をばたつかせる
    const f = gameT * 13;
    t.hipL = Math.sin(f) * 0.7 - 0.3; t.hipR = -Math.sin(f) * 0.7 - 0.3; t.knL = 0.8 + Math.sin(f + 1) * 0.4; t.knR = 0.8 - Math.sin(f + 1) * 0.4;
    t.shLz = -2.4 + Math.sin(f * 1.3) * 0.4; t.shRz = 2.4 - Math.sin(f * 1.3 + 1) * 0.4; t.shL = -0.3; t.shR = -0.3;
    t.elL = t.elR = -0.5; t.torso = -0.15; t.head = -0.3;
  }
  H.hips.position.y += (hipY - H.hips.position.y) * k;
  setJ(H.hipL, 'x', t.hipL, k); setJ(H.hipR, 'x', t.hipR, k);
  setJ(H.knL, 'x', t.knL, k); setJ(H.knR, 'x', t.knR, k);
  setJ(H.shL, 'x', t.shL, k); setJ(H.shR, 'x', t.shR, k);
  setJ(H.shL, 'z', t.shLz, k); setJ(H.shR, 'z', t.shRz, k);
  setJ(H.elL, 'x', t.elL, k); setJ(H.elR, 'x', t.elR, k);
  setJ(H.torso, 'x', t.torso, k); setJ(H.head, 'x', t.head, k);

  for (const p of plats) if (p.wobble > 0) {
    p.wobble = Math.max(0, p.wobble - dt * 2.5);
    const w = Math.sin(p.wobble * 20) * p.wobble * 0.2;
    p.mesh.scale.set(1 + w, 1 - w, 1 + w);
  }
  if (goalRing) { goalRing.rotation.y += dt; goalRing.rotation.x = Math.sin(gameT) * 0.3; }
  for (const f of movers) f(performance.now() / 1000);
  updateFloats(gameT, dt);
  for (const L of lanterns) if (L.lit) L.glow.scale.setScalar(2.1 + Math.sin(gameT * 6 + L.id) * 0.15);
  updateDust(dt);
}

// ===== 画面 =====
const hHeight = $('height'), hSub = $('sub'), speedEl = $('speed'), hCp = $('cp');
let toastT = 0;
function toast(msg) { const t = $('toast'); t.textContent = msg; t.style.opacity = 1; toastT = 2.5; }
function fmtTime(s) {
  s = Math.floor(s);
  const h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, ss = s % 60;
  return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(ss).padStart(2, '0');
}
function updateHud(dt) {
  speedEl.style.opacity = clamp((-V.y - 14) / 22, 0, 0.9) + (ground && Math.hypot(V.x, V.z) > RUN + 1 ? 0.12 : 0);
  const h = Math.max(0, P.y - RAD);
  best = Math.max(best, h);
  hHeight.innerHTML = Math.floor(h) + '<small>m</small>';
  hSub.textContent = `最高 ${Math.floor(best)}m ・ ${fmtTime(playTime)}`;
  const cpTxt = `セーブ灯 ${cps.map((c, i) => CPN[i] + (c ? Math.floor(c.y - RAD) + 'm' : '—')).join(' ')}`;
  if (hCp.textContent !== cpTxt) hCp.textContent = cpTxt;
  if (toastT > 0 && (toastT -= dt) <= 0) $('toast').style.opacity = 0;
  const z = zoneAt(h);
  if (z !== curZone) { if (z > curZone) toast(ZONES[z].name); curZone = z; }
}

const cA = new THREE.Color(), cB = new THREE.Color();
function updateSky() {
  const h = P.y;
  const z = zoneAt(h), Z = ZONES[z], N = ZONES[z + 1];
  const t = N ? clamp((h - (N.from - 15)) / 15, 0, 1) : 0;
  cA.setHex(Z.top); if (N) cA.lerp(cB.setHex(N.top), t);
  skyMat.uniforms.top.value.copy(cA);
  cA.setHex(Z.bottom); if (N) cA.lerp(cB.setHex(N.bottom), t);
  skyMat.uniforms.bottom.value.copy(cA);
  scene.fog.color.copy(cA);
  scene.fog.near = N ? lerp(Z.fogNear, N.fogNear, t) : Z.fogNear;
  scene.fog.far = N ? lerp(Z.fogFar, N.fogFar, t) : Z.fogFar;
  const space = clamp((h - 165) / 30, 0, 1);
  stars.material.opacity = space;
  hemi.intensity = lerp(0.65, 0.45, space);
  sky.position.copy(camera.position);
  stars.position.copy(camera.position);
  sunSprite.position.copy(camera.position).addScaledVector(SUN_DIR, 900);
  document.body.style.background = '#' + cA.getHexString();
  if (windGain) {
    const w = inFloat ? 0.015 : 0.02 + clamp(h / GOAL, 0, 1) * 0.08 + clamp(-V.y / 40, 0, 1) * 0.35;
    windGain.gain.value += (w - windGain.gain.value) * 0.1;
  }
}

const ray = new THREE.Raycaster(), camDir = new THREE.Vector3(), nearMeshes = [];
let camCur = camDist;
// キーボードだけで遊べるカメラ（C でモード切りかえ）
function autoCamera(dt) {
  const tilt = (keys.ArrowUp ? 1 : 0) - (keys.ArrowDown ? 1 : 0);
  if (tilt) { camPitch = clamp(camPitch - tilt * 1.3 * dt, -0.6, 1.25); pitchManualT = 3; }
  pitchManualT -= dt;
  if (pitchManualT <= 0) {
    // 落ちているときは下を、よじ登るときは少し上を見る
    let pt = 0.35;
    if (!ground && !climb && !ladder && V.y < -7) pt = 0.8;
    if (climb) pt = 0.12;
    if (ladder) pt = -0.15;
    camPitch += (pt - camPitch) * Math.min(1, 1.6 * dt);
  }
  const look = (keys.ArrowLeft || keys.KeyQ ? 1 : 0) - (keys.ArrowRight || keys.KeyE ? 1 : 0);

  if (camMode === 'chase') {
    // いつも背中側。← → を押しているあいだだけ、横を見回す
    lookOff += (look * 1.4 - lookOff) * Math.min(1, 6 * dt);
    const wallC = climb || ladder;
    const want = (wallC ? Math.atan2(wallC.nx, wallC.nz) : moveYaw + Math.PI) + lookOff;
    // 少し遅れてついてくる（カーブで主人公がななめに見える）
    camYaw += angDiff(camYaw, want) * Math.min(1, (wallC ? 6 : 3.8) * dt);
    return;
  }

  if (look) { camYaw += look * 2.4 * dt; camManualT = 1.2; }
  camManualT -= dt;
  const behind = faceYaw + Math.PI;     // 主人公の背中側
  if (snapT > 0) {
    snapT -= dt;
    camYaw += angDiff(camYaw, behind) * Math.min(1, 12 * dt);
    return;
  }
  if (camMode === 'auto' && camManualT <= 0) {
    // 前に進んでいるときだけ、ゆっくり背中側へ回りこむ（横移動だけでは回らない）
    const inp = getInput();
    const hv = Math.hypot(V.x, V.z);
    let rate = 0, want = camYaw;
    if (climb) { want = Math.atan2(climb.nx, climb.nz); rate = 3; }
    else if (inp.y > 0.2 && hv > 1) {
      want = Math.atan2(-V.x, -V.z);
      rate = (ground ? 1.8 : 0.5) * inp.y * Math.min(1, hv / RUN);
    }
    if (rate) camYaw += angDiff(camYaw, want) * Math.min(1, rate * dt);
  }
}

function updateCamera(dt) {
  if (running) autoCamera(dt);
  // 走っているときは少し前を映す
  const la = camMode === 'chase' && !climb && !ladder ? Math.min(1, Math.hypot(V.x, V.z) / RUN) * 1.2 : 0;
  camTarget.lerp(tmpV.set(P.x + Math.sin(moveYaw) * la, P.y - RAD + 1.45, P.z + Math.cos(moveYaw) * la), Math.min(1, 10 * dt));
  const cp = Math.cos(camPitch);
  camDir.set(Math.sin(camYaw) * cp, Math.sin(camPitch), Math.cos(camYaw) * cp);
  nearMeshes.length = 0;
  for (const p of plats) if (p.br < 200 && p.pos.distanceToSquared(camTarget) < (camDist + p.br + 1) ** 2) nearMeshes.push(p.mesh);
  ray.set(camTarget, camDir);
  ray.far = camDist;
  const hit = ray.intersectObjects(nearMeshes, false)[0];
  const want = hit ? Math.max(0.6, hit.distance - 0.25) : camDist;
  camCur = want < camCur ? want : camCur + (want - camCur) * Math.min(1, 3 * dt);
  camera.position.copy(camTarget).addScaledVector(camDir, camCur);
  if (camera.position.y < 0.3) camera.position.y = 0.3;
  camera.lookAt(camTarget);
  // ダッシュ中と落下中は視野を少し広げる
  const fovT = 68 + (ground && Math.hypot(V.x, V.z) > RUN + 0.5 ? 6 : 0) + clamp((-V.y - 8) / 30, 0, 1) * 14;
  if (Math.abs(camera.fov - fovT) > 0.05) { camera.fov += (fovT - camera.fov) * Math.min(1, 4 * dt); camera.updateProjectionMatrix(); }
  sun.position.copy(P).addScaledVector(SUN_DIR, 50);
  sun.target.position.copy(P);
}

$('howto').innerHTML = isTouch
  ? '左側をなぞる：いどう<br>右側をなぞる：カメラ<br>ジャンプ / ダッシュ ボタン<br>壁のふちに向かって跳ぶと、つかまってよじ登る<br>はしごに向かって進むとつかまる（上に倒すと登る）<br>屋上の<b>セーブ灯</b>にふれるとセーブ（2つまで）　① ②：もどる<br>光の柱は<b>無重力</b>。ジャンプ長おしで上へ'
  : 'WASD：いどう　Shift：ダッシュ　スペース：ジャンプ<br>← →：カメラを回す　↑ ↓：上下　R：背中側へ<br>C：カメラのモード切りかえ（じどう / じぶんで回す / いつも背中側）<br>壁のふちに向かって跳ぶと、つかまってよじ登る（S ではなす）<br>マウスでもカメラを動かせます（なくても遊べます）<br>はしごに向かって進むとつかまる（W で上、スペースで跳びおりる）<br><b>屋上のセーブ灯にふれるとセーブ（2つまで）　1 / 2：そこへもどる</b><br>光の柱は<b>無重力</b>：中ではふわふわ浮く。スペース長おしで上へ<br>ホイール：ズーム　M：BGM　P：メニュー';

if (load()) {

  $('resetBtn').classList.remove('hidden');
} else if (oldCleared) $('newNote').classList.remove('hidden');
camTarget.set(P.x, P.y + 1.2, P.z);
curZone = zoneAt(P.y);
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });

// ===== ループ =====
let last = performance.now(), saveT = 0;
function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min(1 / 30, (now - last) / 1000);
  last = now;
  if (running) {
    const n = 4;
    for (let i = 0; i < n; i++) step(dt / n);
    playTime += dt;
    if ((saveT += dt) > 2) { saveT = 0; save(); }
  }
  animate(running ? dt : 0);
  updateHud(dt);
  updateCamera(dt);
  updateSky();
