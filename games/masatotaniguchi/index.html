<meta name="robots" content="noindex, nofollow">
<title>乱世の領主</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Shippori+Mincho+B1:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  --lac:#16110e; --lac2:#221915; --lac3:#30241d; --gold:#d4ad5a; --gold-d:#8a6c30; --on:#efe3c4; --on2:#b6a582;
  --paper:#f2e9d2; --paper2:#e5d7b5; --paper3:#d4c299; --ink:#231a14; --ink2:#5e4f3e;
  --verm:#b3392a; --blue:#2f5d9a; --good:#4f8a3f; --warn:#a8761a;
  --f-m:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif; --f-g:"BIZ UDPGothic","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--lac);color:var(--on);font-family:var(--f-g);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow:hidden;-webkit-tap-highlight-color:transparent}
#app{height:100%}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.btn{background:linear-gradient(var(--paper),var(--paper2));color:var(--ink);border:1px solid var(--gold-d);border-radius:4px;padding:.55em 1.1em;font-family:var(--f-m);font-weight:800;box-shadow:0 2px 0 rgba(0,0,0,.35);min-height:42px}
.btn.seal{background:linear-gradient(#c94a31,#9c2f22);color:#fdf0dc;border-color:#6d1f16}
.btn.small{min-height:36px;padding:.35em .9em;font-size:13.5px}
.btn.big{font-size:18px;padding:.6em 1.6em}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.row.c{justify-content:center}
.face{width:44px;height:53px;flex:none;border:1px solid var(--gold-d);border-radius:3px;background:#333}
.face.big{width:76px;height:91px}.face.sm{width:40px;height:48px}
.kamon{width:26px;height:26px;color:var(--gold);flex:none}

/* タイトル */
.title{height:100%;display:grid;place-items:center;overflow:auto;padding:24px 16px;background:radial-gradient(ellipse at 50% 30%,#3a2a20 0%,var(--lac) 70%)}
.tcard{max-width:520px;text-align:center;border:1px solid var(--gold-d);outline:1px solid rgba(212,173,90,.35);outline-offset:6px;padding:34px 24px;background:rgba(22,17,14,.7)}
.kmon-big .kamon{width:64px;height:64px}
.eyebrow{font-family:var(--f-m);letter-spacing:.25em;color:var(--on2);font-size:13px;margin:10px 0 0}
.title h1{font-family:var(--f-m);font-weight:800;font-size:clamp(44px,12vw,72px);letter-spacing:.12em;margin:.1em 0 .25em;color:var(--paper);text-shadow:0 3px 0 #000}
.lead{font-family:var(--f-m);font-size:16px;line-height:1.9}
.rules{list-style:none;padding:0;margin:16px 0 22px;display:flex;flex-direction:column;gap:6px;font-size:13.5px;color:var(--on2)}
.rules li::before{content:"一、";color:var(--gold)}
.note{font-size:12px;color:var(--on2);margin-top:18px}

/* ゲーム枠 */
.game7{height:100%;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto 1fr auto;position:relative}
.game7>*{min-width:0}
.hud{background:linear-gradient(#2a1f19,#1b1411);border-bottom:1px solid var(--gold-d);padding:6px max(10px,env(safe-area-inset-right)) 6px max(10px,env(safe-area-inset-left));padding-top:max(6px,env(safe-area-inset-top));display:flex;flex-direction:column;gap:5px}
.h1{display:flex;align-items:center;gap:7px}
.house{font-family:var(--f-m);font-size:17px;color:var(--paper);white-space:nowrap}
.rank{align-self:center;font-style:normal;font-size:11.5px;border:1px solid var(--gold-d);color:var(--gold);padding:0 6px;border-radius:2px;white-space:nowrap}
.date{font-family:var(--f-m);font-weight:600;font-size:14px;display:flex;align-items:center;gap:5px;margin-left:auto;white-space:nowrap}
.ssn{font-style:normal;width:22px;height:22px;display:grid;place-items:center;border-radius:50%;font-size:12px;color:#fff}
.s-春{background:#c7698a}.s-夏{background:#3f8a4a}.s-秋{background:#b4652a}.s-冬{background:#5a7591}
.spd{display:flex;gap:2px}
.spd button{min-width:34px;height:32px;background:var(--lac3);border:1px solid #4a3a2e;border-radius:3px;font-size:12px;color:var(--on2)}
.spd button.on{background:var(--gold);color:var(--ink);border-color:var(--gold)}
.h2{display:flex;gap:4px;flex-wrap:nowrap;overflow:hidden}
.chip{display:flex;align-items:baseline;gap:2px;background:rgba(0,0,0,.3);border:1px solid #3d2f25;border-radius:3px;padding:1px 6px}
.chip small{font-size:11px;color:var(--on2)}.chip b{font-size:16px;font-variant-numeric:tabular-nums;color:var(--paper)}
.goal{display:flex;align-items:center;gap:8px;width:100%;background:#3a2219;border:0;border-bottom:1px solid #5a3424;padding:6px 12px;text-align:left;min-height:36px}
.goal .gl{font-size:11px;background:var(--verm);color:#fff;padding:1px 6px;border-radius:2px;flex:none}
.goal b{font-family:var(--f-m);font-size:14px;color:var(--paper);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.goal small{color:var(--gold);font-size:12px;white-space:nowrap}
.gd{margin-left:auto;display:flex;gap:3px;flex:none}.gd i{width:9px;height:9px;border:1px solid var(--gold);border-radius:50%}.gd i.f{background:var(--gold)}
.stage{position:relative;overflow:hidden;min-height:0}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:pan-y;cursor:pointer}
.paused{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);background:rgba(22,17,14,.85);border:1px solid var(--gold-d);color:var(--gold);padding:4px 12px;border-radius:3px;font-size:12.5px;pointer-events:none;display:none}
.buildbar{position:absolute;left:8px;right:8px;top:8px;display:none;flex-wrap:wrap;gap:6px 8px;align-items:center;background:rgba(242,233,210,.97);color:var(--ink);border:1px solid var(--gold-d);border-radius:4px;padding:8px 10px;box-shadow:0 6px 18px rgba(0,0,0,.45);z-index:3}
.buildbar.on{display:flex}.buildbar b{font-family:var(--f-m)}.buildbar .pv{font-size:12.5px;color:var(--ink2);flex:1 1 140px}
.nav{display:flex;background:#1b1411;border-top:1px solid var(--gold-d);padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 0 7px;font-size:12px;color:var(--on2);min-height:54px}
.nav button i{font-style:normal;font-family:var(--f-m);font-weight:800;font-size:17px;width:28px;height:24px;display:grid;place-items:center;border-radius:3px}
.nav button.on{color:var(--paper)}.nav button.on i{background:var(--gold);color:var(--ink)}

/* 横の板 */
.side{position:absolute;left:0;right:0;bottom:calc(54px + env(safe-area-inset-bottom));max-height:62%;overflow:auto;background:var(--paper);color:var(--ink);border-top:2px solid var(--gold-d);border-radius:10px 10px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.5);padding:0 14px 14px;transform:translateY(calc(100% + 80px));visibility:hidden;transition:transform .22s ease,visibility 0s .22s;z-index:5}
.side.open{transform:none;visibility:visible;transition:transform .22s ease}
@media (prefers-reduced-motion:reduce){.side{transition:none}}
.grab{position:sticky;top:0;height:22px;margin:0 -14px 2px;background:var(--paper);display:grid;place-items:center;cursor:pointer;z-index:1}
.grab::after{content:"";width:44px;height:5px;border-radius:3px;background:var(--paper3)}
.side h2{font-family:var(--f-m);font-size:19px;margin:0 0 4px;display:flex;align-items:baseline;gap:8px}.side h2 small{font-size:12px;color:var(--ink2);font-family:var(--f-g)}
.side h3{font-family:var(--f-m);font-size:15px;margin:14px 0 6px;border-bottom:1px solid var(--paper3)}
.hint{font-size:12.5px;color:var(--ink2);margin:4px 0 8px}
.warn{color:var(--verm);font-size:12.5px;font-style:normal}
.big{font-size:15px}.big b{font-size:20px;color:var(--blue)}
.bl{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.bcard{display:flex;gap:10px;text-align:left;align-items:flex-start;background:#fbf6e8;border:1px solid var(--paper3);border-left:4px solid var(--gold-d);border-radius:4px;padding:8px}
.bcard.dim{opacity:.55}.bcard:hover{border-color:var(--verm)}
.bi{width:38px;height:38px;flex:none;display:grid;place-items:center;background:var(--lac2);color:var(--gold);font-family:var(--f-m);font-weight:800;font-size:20px;border-radius:4px}
.bcard span{display:flex;flex-direction:column}.bcard b{font-family:var(--f-m);font-size:15px}.bcard small{font-size:12px;color:var(--verm);font-weight:700}.bcard em{font-style:normal;font-size:12px;color:var(--ink2)}
.pie{display:flex;height:34px;border-radius:3px;overflow:hidden;border:1px solid #6b5a45;margin:6px 0}
.pie span{display:grid;place-items:center;text-align:center;font-size:10.5px;line-height:1.15;color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.6);min-width:0;overflow:hidden;border-right:1px solid rgba(0,0,0,.25)}
.pie.grow span{transition:flex .8s ease}
.pie span.me{outline:2px solid #ffd770;outline-offset:-2px}
.vcard{background:#fbf6e8;border:1px solid var(--paper3);border-radius:5px;padding:8px 10px;margin:8px 0}
.vcard.off{opacity:.7}
.vcard header{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.vcard header b{font-family:var(--f-m);font-size:16px}.vcard header small{margin-left:auto;color:var(--ink2)}
.badge{font-size:11px;padding:0 6px;border-radius:2px;background:#ccc;color:#222}.badge.g{background:var(--good);color:#fff}.badge.r{background:var(--verm);color:#fff}
.vst{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px;color:var(--ink2)}
.bar{display:inline-block;width:60px;height:6px;background:#d9ccad;border-radius:3px;vertical-align:middle;overflow:hidden}.bar u{display:block;height:100%;background:var(--good)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.act{text-align:left;background:#fff;border:1px solid var(--paper3);border-radius:4px;padding:6px 8px;display:flex;flex-direction:column}.act b{font-size:13px}.act small{font-size:11.5px;color:var(--ink2)}.act:disabled{opacity:.45}
.troops{display:flex;flex-direction:column;gap:6px;background:#fbf6e8;border:1px solid var(--paper3);border-radius:5px;padding:8px 10px}.troops div{display:flex;flex-direction:column}.troops small{font-size:12px;color:var(--ink2)}
.rcard{display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--paper3);padding:8px 0}.rcard>div{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}.rcard b{font-family:var(--f-m);font-size:15px}.rcard small{font-size:12px;color:var(--ink2)}
.jsel select{width:100%;font:inherit;font-size:13.5px;padding:6px;border:1px solid var(--gold-d);border-radius:4px;background:#fff;color:var(--ink);min-height:38px}
.away{font-style:normal;color:var(--blue);font-weight:700;font-size:13px}
.dmap{width:100%;max-width:440px;display:block;margin:4px auto 6px;border:1px solid var(--paper3);border-radius:4px}
.dmap .dn{cursor:pointer}.dmap .dn.on circle{stroke:#ffd770;stroke-width:3}
.dmap .dt{fill:#fff;font-family:var(--f-m);font-weight:800;font-size:15px;text-anchor:middle}.dmap .dl{fill:var(--ink);font-size:11px;text-anchor:middle;font-weight:700}
.acard .who{display:flex;gap:10px;align-items:center}.acard .who>div{display:flex;flex-direction:column;gap:2px}.acard b{font-family:var(--f-m);font-size:16px}.acard small{font-size:12.5px;color:var(--ink2)}.want{color:var(--verm)!important}
.seg{background:#fff;border:1px solid var(--paper3);border-radius:4px;padding:4px 10px;display:flex;flex-direction:column;align-items:center;min-height:40px;font-family:var(--f-m);font-weight:700}.seg small{font-size:10.5px;color:var(--ink2);font-family:var(--f-g)}.seg.on{background:var(--lac2);color:var(--gold);border-color:var(--gold)}
.kinds{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.kind{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;background:#fff;border:1px solid var(--paper3);border-left:4px solid var(--verm);border-radius:4px;padding:7px 10px}.kind span{display:flex;flex-direction:column}.kind b{font-family:var(--f-m)}.kind small{font-size:11.5px;color:var(--ink2)}.kind:disabled{opacity:.45}
.lv{font-style:normal;font-family:var(--f-m);font-weight:800;width:34px;height:34px;flex:none;display:grid;place-items:center;border-radius:50%;color:#fff}.lv-高{background:var(--good)}.lv-中{background:var(--warn)}.lv-低{background:var(--verm)}
.quests{list-style:none;padding:0;margin:6px 0;display:flex;flex-direction:column;gap:6px}
.quests li{display:flex;gap:10px;background:#fbf6e8;border:1px solid var(--paper3);border-radius:5px;padding:8px}.quests li>div{display:flex;flex-direction:column}.quests b{font-family:var(--f-m)}.quests small{font-size:12px;color:var(--ink2)}.quests em{font-style:normal;font-size:12.5px;color:var(--blue);font-weight:700}
.quests li.done{opacity:.65}
.chk{width:24px;height:24px;flex:none;border:1.5px solid var(--gold-d);border-radius:3px;display:grid;place-items:center;font-size:12px;color:#fff}.done .chk{background:var(--verm);border-color:var(--verm)}
.chron,.logl{list-style:none;padding:0;margin:0;font-size:13px;display:flex;flex-direction:column;gap:4px}
.chron time,.logl time{font-size:11px;color:var(--ink2);margin-right:6px}
.logl li{border-left:3px solid var(--paper3);padding-left:6px}.logl li.done{border-color:var(--good)}.logl li.ng{border-color:var(--verm)}.logl li.warn{border-color:var(--warn)}
.tag{font-size:10.5px;padding:0 5px;border-radius:2px;margin-right:5px;color:#fff;font-style:normal;white-space:nowrap}.t-h{background:#1f5f7a}.t-f{background:#7a6a50}.t-m{background:#5a4a7a}
.mini{margin-top:10px;border-top:1px solid var(--paper3);padding-top:6px}

/* 重ね窓 */
.veil{position:fixed;inset:0;z-index:20;background:rgba(10,7,6,.55);display:flex;align-items:flex-end;justify-content:center;padding:0}
.dlg{width:min(620px,100%);max-height:88%;overflow:auto;background:var(--paper);color:var(--ink);border-top:3px solid var(--gold);border-radius:12px 12px 0 0;padding:14px 16px max(16px,env(safe-area-inset-bottom));box-shadow:0 -10px 40px rgba(0,0,0,.6);animation:up .25s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@media (prefers-reduced-motion:reduce){.dlg{animation:none}}
.dtop{display:flex;gap:12px;align-items:flex-end}.dtop h3{font-family:var(--f-m);font-size:19px;margin:4px 0 0}.dtop small{font-size:12px;color:var(--ink2)}
.said{font-family:var(--f-m);font-size:16px;line-height:1.85;margin:12px 0;background:#fbf6e8;border:1px solid var(--paper3);border-radius:6px;padding:10px 12px;position:relative}
.hist{font-size:12.5px;background:#e3eef2;border-left:4px solid #1f5f7a;padding:6px 10px;margin:-4px 0 10px;color:#1d3a47}
.chs{display:flex;flex-direction:column;gap:7px}
.ch{text-align:left;background:linear-gradient(#fffaf0,#f3e9d2);border:1px solid var(--gold-d);border-left:5px solid var(--verm);border-radius:5px;padding:9px 12px;display:flex;flex-direction:column;min-height:48px}
.ch b{font-family:var(--f-m);font-size:15.5px}.ch small{font-size:12.5px;color:var(--ink2)}.ch:disabled{opacity:.45;cursor:not-allowed}.ch:hover:not(:disabled){border-color:var(--verm)}
.ht{font-family:var(--f-m);font-size:21px;margin:0 0 8px;display:flex;align-items:baseline;gap:10px}.ht small{font-size:12.5px;color:var(--ink2)}
.hrow{margin:8px 0}.hrow header{display:flex;justify-content:space-between;font-size:13.5px}.hrow b{font-family:var(--f-m);font-size:15px}
.why{margin:2px 0;display:flex;flex-wrap:wrap;gap:4px}.why i{font-style:normal;font-size:11.5px;background:#f3dcd4;color:#7a2a1e;border-radius:2px;padding:0 6px}
.tot{font-family:var(--f-m);font-size:17px;text-align:center;margin:12px 0 4px;padding:10px;background:var(--lac2);color:var(--paper);border-radius:6px}.tot b{color:#ffd770;font-size:22px}
.veil.full{align-items:center}
.battle,.end{border-radius:10px;max-height:96%}
#bf{width:100%;height:auto;aspect-ratio:12/5;display:block;border:1px solid #6b5a45;border-radius:4px;image-rendering:pixelated}
.bnum{display:flex;justify-content:space-between;margin:6px 0;font-family:var(--f-m)}.bnum span{display:flex;align-items:center;gap:6px}.bnum b{font-size:20px}.bnum .me{color:var(--blue)}.bnum .en{color:#2a2522}
.blog{font-size:13.5px;max-height:150px;overflow:auto;background:#fbf6e8;border:1px solid var(--paper3);border-radius:4px;padding:6px 10px;margin-bottom:8px}.blog p{margin:2px 0}
.bres{text-align:center;padding:10px;border-radius:6px;margin:8px 0}.bres.w{background:#e1efd9}.bres.l{background:#f3dcd4}.bres b{font-family:var(--f-m);font-size:22px}.bres p{margin:4px 0}
.dchips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}.dchips span{background:var(--lac2);color:var(--paper);padding:3px 10px;border-radius:3px}
.toast{position:fixed;left:50%;top:calc(126px + env(safe-area-inset-top));transform:translate(-50%,-10px);background:var(--lac2);color:var(--paper);border:1px solid var(--gold);padding:8px 16px;font-family:var(--f-m);font-weight:700;opacity:0;pointer-events:none;transition:.2s;z-index:40;max-width:calc(100% - 32px);border-radius:4px;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}.toast.bad{border-color:var(--verm);background:#4a1a14}

/* v8 */
.nav button{position:relative}
.nb{position:absolute;top:3px;right:calc(50% - 22px);min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--verm);color:#fff;font-size:10.5px;display:none;place-items:center;font-style:normal}
.banner{position:absolute;left:8px;right:8px;top:8px;z-index:4;display:none;background:rgba(242,233,210,.97);color:var(--ink);border:1px solid var(--gold-d);border-left:6px solid var(--blue);border-radius:5px;padding:8px 10px;box-shadow:0 8px 24px rgba(0,0,0,.45)}
.banner.on{display:block}.banner.red{border-left-color:var(--verm)}.banner.gold{border-left-color:var(--gold)}
.banner p{margin:0 0 6px;font-size:14px;line-height:1.5}.banner b{font-family:var(--f-m)}
.basis{list-style:none;padding:0;margin:2px 0 6px;font-size:11.5px;color:var(--ink2);display:flex;flex-direction:column;gap:1px}
.basis i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}.basis span{color:var(--ink)}
.ctl{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin:6px 0}
.ctl label{display:flex;align-items:center;gap:5px;font-size:12.5px}
.ctl select,.rw select,.ra select,.rg select{font:inherit;font-size:13px;padding:5px;border:1px solid var(--gold-d);border-radius:4px;background:#fff;color:var(--ink);min-height:36px}
input[type=range]{accent-color:var(--verm);width:120px}
output{font-weight:700;min-width:2em;display:inline-block;text-align:right}
.badge.b{background:var(--blue);color:#fff}
.rcard.gone{opacity:.5}.job{color:var(--blue)!important;font-weight:700}
.rw{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:4px}
.dl{background:#fbf6e8;border:1px solid var(--paper3);border-radius:5px;padding:8px 10px;margin:8px 0}.dl header{display:flex;justify-content:space-between;align-items:center}.dl header b{font-family:var(--f-m);font-size:15px}
.tgl{background:#fff;border:1px solid var(--paper3);border-radius:16px;padding:4px 12px;min-height:34px;font-size:13px}.tgl.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.ck{gap:4px}

    for(const [nx,ny] of nb4(cx,cy)){ const k=T(g,nx,ny).k; if(!passable(k)&&!(nx===tx&&ny===ty)) continue; const n=ny*W+nx; const nd=dist[c]+(COST[k]||1); if(nd<dist[n]){ if(dist[n]===1e9) open.push(n); dist[n]=nd; prev[n]=c; } } }

function myUnits(g,rids,ashi,levy){ const us=[]; for(const rid of rids){ const R=g.ret[rid]; if(!present(g,rid)) continue; if(hkSize(R)<1) continue; us.push({key:rid,name:(R.lord?'本陣 ':'')+R.n.split(' ')[0]+'勢',rid,...R.hk,mor:(R.lord?80:70+(R.chu-50)/5)+(R.trait==='剛直'?6:0)}); }
  if(ashi>0) us.push({key:'ashi',name:'足軽衆',rid:null,ki:0,yumi:Math.round(ashi*0.3),yari:ashi-Math.round(ashi*0.3),zo:0,mor:62});
  let lv=0; for(const v in levy) lv+=levy[v]; if(lv>0) us.push({key:'levy',name:'地下衆',rid:null,ki:0,yumi:Math.round(lv*0.2),yari:0,zo:lv-Math.round(lv*0.2),mor:52});

function mobilize(g,o){ // o={rids:[],ashi:n,levy:{v:n},food:days,dest:{k:'v',v}|{k:'noda'}|{k:'shugo'}}

  const days=o.food||10; const food=r1(n*0.012*days); if(g.res.rice<food) return `兵糧が足りない（米${food}石いる）。`;
  const goal=goalOf(g,o.dest); if(!goal) return '行き先が分からない。'; const p=path(g,5,8,goal[0],goal[1]); if(!p) return '道がない。';
  g.res.rice=r1(g.res.rice-food); const ur=us.filter(u=>u.rid).map(u=>u.rid); for(const r of ur) g.ret[r].away='army'; g.ashi-=ashi; for(const v in levy) g.vil[v].levy+=levy[v];

  const A={id:g.nextId++,side:'me',rids:ur,units:us,x:5,y:8,px:5,py:8,path:p.slice(1),dest:o.dest,food,state:'march',gen,levy,ashi,since:g.day,n0:n};
  g.armies.push(A); log(g,`陣触れ：兵${n}が${destName(g,o.dest)}へ向かう（兵糧${food}石）。`,'warn'); return null; }
function goalOf(g,d){ if(!d) return null; if(d.k==='v') return VCENTER[d.v]; if(d.k==='home') return [5,8]; if(d.k==='noda') return [2,9]; if(d.k==='shugo') return EDGEX.shugo; if(d.k==='tile') return [d.x,d.y]; return null; }
function destName(g,d){ if(d.k==='v') return g.vil[d.v].n; if(d.k==='noda') return '野田館'; if(d.k==='shugo') return '守護所（京へ）'; if(d.k==='home') return '竹原館'; if(d.k==='region') return REG[d.id].n+'へ遠征'; return 'そこ'; }

function orderArmy(g,id,o){ const A=g.armies.find(a=>a.id===id); if(!A||A.side!=='me') return 'いない。'; if(A.state==='away') return '遠くにいる。';

function nodaArmyAtCastle(g){ let A=g.armies.find(a=>a.side==='noda'&&a.state==='castle'); if(!A){ const us=Object.entries(g.noda.u).filter(([k,u])=>usz(u)>0&&!(k==='koba'&&g.noda.naitsu)).map(([k,u])=>({key:k,name:u.name,rid:null,...u,mor:k==='mas'?82:70,n0:usz(u)})); A={id:g.nextId++,side:'noda',units:us,x:1,y:9.5,px:1,py:9.5,path:[],state:'castle',n0:us.reduce((s,u)=>s+usz(u),0)}; g.armies.push(A); } return A; }
function moveArmy(g,A){ A.px=A.x; A.py=A.y; let budget=(A.levy&&Object.keys(A.levy).length?2.6:3.0)*(A.side==='noda'?1:1);

const FACN={noda:'野田勢',shugo:'守護方の軍勢',tera:'西光院の僧兵',ikki:'土一揆',rival:'国衆の軍勢',world:'敵勢'};

function setJodai(g,id,rid){ const S=g.reg[id]; if(!S||S.owner!=='me') return '竹原家の地ではない。'; if(rid&&!canJodai(g,rid)) return g.ret[rid]&&g.ret[rid].away==='envoy'?'その者は使者に出ている。':g.ret[rid]&&g.ret[rid].away==='jodai'?'その者はほかの地の城代だ。':'その者は置けない。'; if(S.jodai&&g.ret[S.jodai]) g.ret[S.jodai].away=null; S.jodai=null; if(g.vil[id]){ g.vil[id].daikan=null; if(!rid){ for(const r of (g.vil[id].staff||[])) if(g.ret[r]&&g.ret[r].away==='staff') g.ret[r].away=null; g.vil[id].staff=[]; } } if(!rid) return null; const R=g.ret[rid];

function yorikoReply(g,k,S,want){ const R=REG[k]||WN[k]; const nm=R.n||R.house; const f=[]; let u=(S.rel-45)/20; f.push(['仲',(S.rel-45)/20]);

function roleHandle(g,q,k,val){ if(g.role==='shonin') return shoninHandle(g,q,k,val); const R=g.rr, V=g.vil.v2; let t='';
  switch(q.kind+':'+k){

    case 'r_buyaku:no': q.st='done'; g.act.home.rel=cl(g.act.home.rel-8); R.trust=cl(R.trust+4); t='断った。竹原家は不満顔だ。'; break;

    case 'r_jinpu:buy': { if(R.zeni<6) return {err:'銭が足りない。'}; R.zeni-=6; q.st='done'; for(const A of g.armies) if(A.side==='me'&&A.levy&&A.levy.v2){ const lu=A.units.find(u=>u.key==='levy'); if(lu){ lu.zo=Math.max(0,lu.zo-A.levy.v2); } V.levy=Math.max(0,V.levy-A.levy.v2); A.levy.v2=0; } g.act.home.rel=cl(g.act.home.rel+2); t='銭で代えた。村の者は田に残る。'; break; }
    case 'r_jinpu:no': q.st='done'; g.act.home.rel=cl(g.act.home.rel-12); R.trust=cl(R.trust+3); t='断った。竹原家との仲が冷えた。'; break;
    case 'r_raid:yama': { q.st='done'; R.rice=r1(R.rice*0.5); V.m=cl(V.m-3); const A=g.armies.find(a=>a.side==='noda'&&a.tv==='v2'); if(A) A.raidLeft=Math.min(A.raidLeft,2); t='村の者は山へ逃げた。蔵の米の半分を奪われた。'; break; }

    case 'r_raid:mamoru': { q.st='done'; const A=g.armies.find(a=>a.side==='noda'&&a.tv==='v2'&&a.state!=='castle'); const lost=1+Math.floor(rnd(g)*3); V.pop=Math.max(3,V.pop-lost); R.trust=cl(R.trust+8); if(A&&rnd(g)<0.6){ A.raidLeft=0; A.task='home'; A.state='march'; const p=path(g,Math.round(A.x),Math.round(A.y),1,9); A.path=p?p.slice(1):[]; t=`村の者が鋤と竹槍で立ち向かい、${lost}人を失ったが野田勢を追い返した。`; chron(g,'中島村の百姓が野田勢を追い返した。'); } else t=`${lost}人が死んだ。野田勢はなお村にいる。`; break; }
    case 'r_ie:build': { if(R.zeni<8) return {err:'銭が足りない。'}; const c=tilesOf(g,'v2').find(([x,y,t])=>t.k==='.'&&!canBuild(g,x,y,'H')); if(!c) return {err:'建てる所がない。'}; R.zeni-=8; g.res.zeni+=8; const er=build(g,c[0],c[1],'H'); if(er) return {err:er}; g.res.zeni-=8; q.st='done'; t='村の銭で民家の普請を始めた。'; break; }

    case 'r_tmishin:lord': return {nav:['home','toritate']};
    case 'r_tmishin:shugo': return {nav:['shugo','saikyo']};

    case 'r_oryo:none': q.st='done'; R.kaku=cl(R.kaku-4); t='黙って見た。寺の取り分は減ったままだ。'; break;
    case 'r_chukai:do': { if(R.zeni<10) return {err:'銭が足りない。'}; R.zeni-=10; q.st='done'; const p=1/(1+Math.exp(-((R.chi-50)/25+(R.kaku-20)/40+(g.act.tera.rel-50)/40+g.noda.losses*0.3))); if(rnd(g)<p){ g.noda.wa=g.day+720; g.act.noda.rel=cl(g.act.noda.rel+20); g.act.tera.rel=cl(g.act.tera.rel+15); R.chukai=true; R.kaku=cl(R.kaku+20); t='竹原家と野田家は西光院で起請文を交わし、二年の和睦を結んだ。寺の名が上がった。'; chron(g,'西光院の仲介で竹原家と野田家が和睦した。'); } else { R.kaku=cl(R.kaku-5); t='両家とも寺の言葉に耳を貸さなかった。'; } break; }
    case 'r_chukai:no': q.st='done'; t='関わらなかった。'; break;
    default: return {err:'？'}; }
  return {t}; }
function roleExpire(g,q){ const R=g.rr; if(q.kind==='r_mishin'||q.kind==='r_tmishin'){ if(g.role==='myoshu'){ g.act.tera.rel=cl(g.act.tera.rel-15); log(g,'寺への未進を放っておいた。寺は竹原家に取り立てを頼んだ。','ng'); R.trust=cl(R.trust-3); } else { R.kaku=cl(R.kaku-3); } } if(q.kind==='r_oryo'){ R.kaku=cl(R.kaku-4); } if(q.kind==='r_raid'){ R.rice=r1(R.rice*0.6); } }

function roleAct(g,k,v){ if(g.role==='shonin') return shoninAct(g,k,v); const R=g.rr, V=g.vil.v2; const P=riceRate(g);
  if(g.role==='myoshu'){
    if(k==='yoriai'){ if(g.day-R.lastYori<25) return 'ひと月に一度。'; if(R.zeni<1) return '銭が足りない。'; R.zeni-=1; R.lastYori=g.day; V.m=cl(V.m+3); R.trust=cl(R.trust+2); log(g,'寄合を開いた。用水と年貢の話で夜が更けた。'); return null; }
    if(k==='kubaru'){ if(R.rice<10) return '蔵の米が足りない。'; R.rice-=10; V.m=cl(V.m+6); R.trust=cl(R.trust+2); log(g,'蔵の米十石を村の者に配った。'); return null; }
    if(k==='sell'){ if(R.rice<10) return '米が足りない。'; R.rice=r1(R.rice-10); R.zeni=r1(R.zeni+P.sell); return null; }
    if(k==='buy'){ if(R.zeni<P.buy) return '銭が足りない。'; R.zeni=r1(R.zeni-P.buy); R.rice=r1(R.rice+10); return null; }
    if(k==='fix'){ if(g.iseki) return 'もう直っている。'; if(T(g,8,4).b) return '普請の最中だ。'; if(R.zeni<12) return '村の銭が足りない（12貫）。竹原家に頼むこともできる。'; R.zeni-=12; T(g,8,4).b={to:'fix',left:35,total:35}; log(g,'村の者が総出で井堰の普請にかかった（35日）。','done'); V.lost+=0.05; return null; }
    if(k==='mizu'){ const c=tilesOf(g,'v2').find(([x,y,t])=>t.k==='.'&&!canBuild(g,x,y,'W')&&comboPreview(g,x,y,'W').some(s=>/干田\d/.test(s))); if(!c) return '水の要る田が近くにない。'; if(R.zeni<6) return '銭が足りない。'; R.zeni-=6; T(g,c[0],c[1]).b={to:'W',left:15,total:15}; log(g,'村の者が用水を掘り始めた（15日）。'); return null; } }
  if(g.role==='tera'){
    if(k==='hoe'){ if(g.day-R.lastHoe<40) return '法会は間を置いて。'; if(R.zeni<8) return '銭が足りない。'; R.zeni-=8; R.lastHoe=g.day; for(const vv in g.vil) if(g.vil[vv].owned) g.vil[vv].m=cl(g.vil[vv].m+4); const k2=r1(8+R.garan*4); R.zeni=r1(R.zeni+k2); R.kaku=cl(R.kaku+2); log(g,`法会を営んだ。村々から人が集まり、寄進銭${k2}貫。`,'done'); return null; }
    if(k==='garan'){ if(R.zeni<40) return '銭が足りない（40貫）。'; R.zeni-=40; R.garan++; R.kaku=cl(R.kaku+8); chron(g,`西光院が${['本堂','鐘楼','塔'][Math.min(2,R.garan-1)]}を普請した。`); return null; }
    if(k==='hei'){ if(R.zeni<5) return '銭が足りない。'; if(R.hei>=40) return 'これ以上は抱えられない。'; R.zeni-=5; R.hei+=5; log(g,'僧兵を五人抱えた。'); return null; }
    if(k==='sell'){ if(R.rice<10) return '米が足りない。'; R.rice=r1(R.rice-10); R.zeni=r1(R.zeni+P.sell); return null; }
    if(k==='daikan'){ const [vv,who]=v.split(':'); R.daikan[vv]=who; if(who==='noda') g.act.home.rel=cl(g.act.home.rel-10); if(who==='home') g.act.home.rel=cl(g.act.home.rel+4); log(g,`${g.vil[vv].n}の寺分の代官を${who==='home'?'竹原家':who==='noda'?'野田家':who==='jiki'?'寺の直務':'村請'}とした。`); return null; } }
  return '？'; }

function roleNego(g,to,o){ const R=g.rr; const A=g.act[to]; const f=[]; let u=0; const add=(l,v)=>{ if(Math.abs(v)>=0.05){ f.push([l,Math.round(v*10)/10]); u+=v; } };

  if(k==='wait'){ add('待つのは寺の損',-0.6); add('井堰が壊れて半作',!g.iseki?0.8:0); }

  if(k==='seki'){ add('関銭は竹原家の実入り',-1.2); add('市の客が減っている',0.5); add('座の安堵',R.za?0.6:0); }

function roadState(g){ const foes=g.armies.filter(a=>a.side==='noda'&&a.state!=='castle'); if(foes.some(a=>a.faction==='shugo'||a.task==='attack')) return 'closed'; if(foes.length) return 'risky'; if(g.flags.kyoWar&&dateOf(g.day).y<=1477) return 'risky'; return 'open'; }
const ROADN={open:'通れる',risky:'物騒（兵が出ている）',closed:'塞がっている'};
function priceOf(g,item){ const m=dateOf(g.day).m; const rs=roadState(g); const base={rice:{b:0.9,s:0.6},salt:{b:1.6,s:1.1},cloth:{b:3.0,s:2.2}}[item]; let f=1; if(item==='rice') f=m>=10&&m<=12?0.7:m<=3?0.9:m<=7?1.25:1.05; if(rs==='closed') f*=item==='rice'?1.15:1.5; else if(rs==='risky') f*=1.15; return {buy:Math.round(base.b*f*100)/100,sell:Math.round(base.s*f*100)/100}; }
function shoninInit(g){ g.rr={name:'角屋 宗兵衛',chi:62,zeni:60,rice:20,salt:0,cloth:0,shinyo:50,za:false,loans:[],kyo:0,lastNi:-99,carts:1,kura:0}; g.act.home={rel:55}; g.deleg.naisei.on=true; g.deleg.gunji.on=true; g.deleg.gaiko.on=true; g.deleg.saihai='auto'; g.tut=4; addReq(g,{from:'role',role:'shonin',kind:'s_kari',due:g.day+30,data:{amt:30}}); }

function shoninMonthly(g,o){ const R=g.rr; const rs=roadState(g); if(g.flags.kyoWar===undefined) g.flags.kyoWar=true;
  R.zeni=r1(R.zeni+4+R.kura*0.5+(R.za?3:0)); if(R.rice>60+R.kura*60&&o.m===9){ const sp=r1((R.rice-60-R.kura*60)*0.3); R.rice=r1(R.rice-sp); log(g,`蔵に入りきらぬ米${Math.round(sp)}石が傷んだ。`,'warn'); }
  if(g.tiles.some(t=>t.k==='K')&&!R.sekiPaid&&!g.reqs.some(q=>q.role&&q.kind==='s_seki'&&q.st==='open')&&!g.flags.sekiAsked){ g.flags.sekiAsked=true; addReq(g,{from:'role',role:'shonin',kind:'s_seki',due:g.day+30}); }
  if(R.sekiPaid&&g.day>R.sekiPaid) R.sekiPaid=0;

  for(const L of R.loans.slice()){ if(g.day>=L.due){ if(L.who==='home'){ if(g.res.zeni>=L.amt*1.3||rnd(g)<0.5){ g.res.zeni=r1(g.res.zeni-L.amt*1.3); R.zeni=r1(R.zeni+L.amt*1.3); R.shinyo=cl(R.shinyo+3); log(g,`竹原家から借銭${Math.round(L.amt*1.3)}貫が返った。`,'done'); R.loans=R.loans.filter(x=>x!==L); } else { L.due=g.day+90; L.amt=r1(L.amt*1.1); g.act.home.rel=cl(g.act.home.rel-3); log(g,'竹原家は借銭の返済を延ばした。利が増える。','warn'); } } } }
  if(o.y===1480&&o.m===9&&!g.flags.s_tok){ g.flags.s_tok=true; addReq(g,{from:'role',role:'shonin',kind:'s_tokusei',due:g.day+20}); } }
function shoninAct(g,k,v){ const R=g.rr;
  if(k==='buy'||k==='sell'){ const item=v; const P=priceOf(g,item); const q=10; if(k==='buy'){ if(R.zeni<P.buy*q) return '銭が足りない。'; R.zeni=r1(R.zeni-P.buy*q); R[item]=r1(R[item]+q); } else { if(R[item]<q) return `${item==='rice'?'米':item==='salt'?'塩':'布'}が足りない。`; R[item]=r1(R[item]-q); R.zeni=r1(R.zeni+P.sell*q); } return null; }
  if(k==='kyo'){ if(g.day-R.lastNi<20) return '馬借が戻っていない。'; const load=Math.min(R.rice,20*R.carts); if(load<10) return '送る米が足りない（10石から）。'; const rs=roadState(g); if(rs==='closed') return '街道が塞がっている。'; R.lastNi=g.day; R.rice=r1(R.rice-load); const risk=rs==='risky'?0.3:0.08; g.shipments=g.shipments||[]; g.shipments.push({load,back:g.day+10,risk,price:(rs==='risky'?1.6:1.2)*(g.flags.kyoWar?1.3:1)}); log(g,`米${load}石を京へ送った（${ROADN[rs]}・十日）。`,'info'); return null; }
  if(k==='kura'){ if(R.zeni<35) return '銭が足りない（35貫）。'; R.zeni-=35; R.kura++; log(g,'蔵を建てた。'); return null; }
  if(k==='cart'){ if(R.zeni<20) return '銭が足りない（20貫）。'; if(R.carts>=4) return 'これ以上は要らない。'; R.zeni-=20; R.carts++; log(g,'馬借を一組雇い入れた。京へ送れる荷が増える。'); return null; }

function sendNego(g,rid,to,o){ if(RX(to)&&!PLACES[to]) PLACES[to]={n:RX(to).n,d:RX(to).d}; const R=g.ret[rid]; if(!R||!present(g,rid)) return '手が空いていない。'; if(!demandsFor(g,to).some(d=>d.k===o.k)) return 'いまは頼めない。'; if(o.k==='kessho'&&!(g.reg[o.v]&&g.reg[o.v].owner==='me')) return 'どの地か選べ。'; if(o.k==='ando'&&!g.vil[o.v]) return 'どの村か選べ。';

function voices(g,topic,q){ const T=VO[topic]; if(!T) return []; const out=[]; for(const [k,R] of Object.entries(g.ret)){ if(R.lord||R.gone||R.away) continue; if(q&&q.from==='ret:'+k) continue; const v=T[R.trait]; if(v&&!out.some(o=>o.trait===R.trait)) out.push({rid:k,n:R.n,trait:R.trait,stance:v[0],t:v[1]}); } return out.slice(0,3); }
function reactVoices(g,topic,k){ for(const v of voices(g,topic)){ const R=g.ret[v.rid]; if(v.stance===k) R.chu=cl(R.chu+2); } }
function addReq(g,q){ const id=g.nextId++; const R={id,st:'open',day:g.day,data:{},...q}; g.reqs.push(R); autoReq(g,R); if(R.st==='open') karoReq(g,R); return R; }
const tansenAmt=g=>Math.max(15,Math.round(kokudaka(g)*0.04/5)*5);
const ROUTINE=['gunchu','mishin','tansen','genmen','jige','debt','ronin','inoue','onsho','shuppon'];
function karoReq(g,q){ if(!g.deleg.karo||!g.deleg.karo.on||!ROUTINE.includes(q.kind)) return; const who=['hirata','nonomura','engaku','yasuke'].find(r=>present(g,r))||Object.keys(g.ret).find(r=>!g.ret[r].lord&&present(g,r)); if(!who) return; const nm=g.ret[who].n; let k=null,val=0,sel=null;
  if(q.kind==='gunchu') k='submit';
  if(q.kind==='mishin'&&g.res.rice>=50){ k='payr'; val=20; }
  if(q.kind==='tansen'&&g.res.zeni>=tansenAmt(g)*2){ k='pay'; val=tansenAmt(g); }
  if(q.kind==='genmen'&&g.res.rice>=40){ k='relief'; val=10; }
  if(q.kind==='jige') k='jige';
  if(q.kind==='debt'&&g.debt&&g.res.zeni>=g.debt.amt+10) k='repay';
  if(q.kind==='ronin'&&g.res.zeni>=RONIN[q.data.id].cost+30&&g.res.rice>=80) k='hire';
  if(q.kind==='inoue'&&present(g,'hirata')) k='probe';
  if((q.kind==='onsho'||q.kind==='shuppon')&&g.res.zeni>=25){ k='zeni'; val=10; }
  if(!k) return; const r=handleReq(g,q.id,k,val,sel); if(r&&r.t) log(g,`${nm}（家老の裁量）：${r.t}`,'done',who); }
function closeReq(g,from,kind,done){ for(const q of g.reqs) if(q.st==='open'&&q.kind===kind&&(!from||q.from===from)) q.st=done?'done':'failed'; }
function reqView(g,q){ if(q.role) return roleView(g,q); const D=REQ[q.kind]; const V=g.vil[q.from]; let who=D.who(g), name=''; let text=D.text(g);
  if(q.kind==='ronin'){ const P=RONIN[q.data.id]; return {...q,who:q.data.id,name:P.n+'（'+P.r+'）',title:D.title,text:`${P.d}　武${P.bu} 政${P.sei} 知${P.chi}・性格「${P.trait}」・被官${P.hk.ki+P.hk.yumi+P.hk.yari+P.hk.zo}人。支度金 銭${P.cost}貫、扶持は月に米0.7石。`,acts:D.acts(g),voices:voices(g,'ronin',q)}; }

  if(q.kind==='shoshi'){ return {...q,who:'hirata',name:'家老',title:'将軍の跡目',text:`先の将軍が世を去り、${g.ret.yoritane.n}が跡を継いだ。諸大名のなかには、新しい将軍を軽んじる者もいる。威光はいま${Math.round(g.bk.iko)}。`,acts:REQ.shoshi.acts(g),voices:[],council:true}; }
  if(q.kind==='seibatsu'){ const R=REG[q.data.id]; return {...q,who:'onodera',name:'守護代 小野寺備前守',title:'討伐命令',text:`${R.n}が段銭を納めず、守護方の下知に背いておる。竹原家は${R.n}を討て。討ち取れば、その地は闕所として竹原家に宛行う。`,acts:REQ.seibatsu.acts(g),voices:voices(g,'seibatsu',q),council:true}; }
  if(q.kind==='sengo'){ const R=REG[q.data.id]; return {...q,who:'hirata',name:'家老 平田源七',title:`${regName(g,q.data.id)}の仕置`,text:`館は落としましたが、年貢の権利・被官・寺社領はそのままです。旧臣をどうするか、寺社と名主の権利をどうするか、ここで決めねばなりません。取り分を多くすれば不穏が増え、少なくすれば治まりは早いが実入りは細い。`,acts:REQ.sengo.acts(g),voices:voices(g,'sengo',q),council:true}; }
  if(q.kind==='katoku'){ const H=g.ret[q.data.hk]; const low=Object.entries(g.ret).filter(([k,r])=>!r.lord&&!r.gone&&r.chu<45).map(([k,r])=>r.n.split(' ').pop()); return {...q,who:'hirata',name:'家老 平田源七',title:'家督争い',text:`嫡男${H.n}はまだ${g.fam.heir.age}歳。${low.join('・')}らは「幼主では家が持たぬ」と一門を担ごうとしております。家中が割れれば、隣の国衆が付け込みましょう。`,acts:REQ.katoku.acts(g),voices:[],council:true}; }
  if(q.kind==='kasei'){ const V=REG[q.data.v], F=REG[q.data.foe]; return {...q,who:'hirata',name:'家老 平田源七',title:'寄子からの加勢の求め',text:`寄子の${V.n}が${F.n}に攻められ、加勢を求めてきました。本領を守ると約した以上、出さねば約束を破ることになります。${F.n}は${seenTxt(g,q.data.foe)}。`,acts:REQ.kasei.acts(g),voices:[],council:true}; }
  if(q.kind==='chusai'){ const A=REG[q.data.a], B=REG[q.data.b]; return {...q,who:'hirata',name:'家老 平田源七',title:'国衆の争いの仲裁',text:`${A.n}と${B.n}が境目で争っております。両家と仲の悪くない竹原家が仲裁に立てば、恩を売れましょう。失敗すれば両家の面目を潰します。`,acts:REQ.chusai.acts(g),voices:[]}; }
  if(q.kind==='wseme'){ const N=WN[q.data.by]; return {...q,who:'hirata',name:'家老 平田源七',title:'国境の急報',text:`${N.house}の兵およそ${Math.round(q.data.n/50)*50}が${WN[q.data.at].n}へ攻め入りました！ 国々の軍勢はいま${Math.round(wMob(g))}、${WN[q.data.at].n}を預けた者は${g.w[q.data.at].gov?g.ret[g.w[q.data.at].gov].n:'おりませぬ'}。`,acts:REQ.wseme.acts(g),voices:[],council:true}; }

  if(q.kind==='kousho'){ const N=WN[q.data.id]; return {...q,who:'hirata',name:'家老 平田源七',title:'降将の召し抱え',text:`${N.house}の一族の者が、竹原家に仕えたいと申し出ております。国を預ける者が増えれば、治めやすくなりましょう。ただ、もとの主家を慕う心が残っておるやもしれませぬ。`,acts:REQ.kousho.acts(g),voices:[]}; }

  if(q.kind==='gunchu'){ return {...q,who:'hirata',name:'家老 平田源七',title:'軍忠状',text:`${q.data.where}の戦で敵${q.data.kills}を討ち取った。手柄を書き上げた軍忠状を守護方へ差し出し、証判（確認の花押）をもらえば、のちの安堵や恩賞の裏付けとなる。`,acts:REQ.gunchu.acts(g),voices:[]}; }
  if(q.kind==='heir'){ return {...q,who:g.fam.heir.key||'yorimasa',name:'竹原家',title:D.title,text:`嫡男${g.fam.heir.n}が十四歳を迎え、元服して「${g.fam.heir.adult||'竹原 頼政'}」と名乗る。被官を付けて一手の大将とする。`,acts:D.acts(g),voices:[]}; }
  if(g.vil[q.from]){ who=who||V.head; name=`${V.n} 名主 ${V.hn}`; } else if(q.from.startsWith('ret:')){ const rid=q.from.slice(4); who=rid; name=g.ret[rid].n; if(q.kind==='onsho') text=`先の戦で首級${q.data.h}を挙げました。恩賞を賜りたく存じます。`; if(q.kind==='shuppon') text=`${g.ret[rid].n}が「働きに見合う恩がない」と不満を漏らしているそうです。このままでは家を出るかもしれません。`; }
  else name={onodera:'守護代 小野寺備前守',soen:'西光院 使僧 宗円',kadoya:'角屋 宗兵衛',noda:'野田家',taro:'中島村 名主 太郎左衛門',mata:'上野村 名主 又右衛門'}[who]||'';
  if(q.kind==='ikki'){ who=V.head; name=`${V.n} 名主 ${V.hn}`; }
  return {...q,who,name,title:D.title,text,acts:D.acts(g),voices:voices(g,q.kind,q),council:!!D.council}; }
function handleReq(g,id,k,val,sel){ { const q0=g.reqs.find(x=>x.id===id); if(q0&&q0.role){ if(q0.st!=='open') return {err:'もう済んだ。'}; return roleHandle(g,q0,k,val); } } { const q0=g.reqs.find(x=>x.id===id); if(q0&&q0.kind==='hatto'&&k.startsWith('h_')){ const hk=k.slice(2); const H=HATTO[hk]; if(!H||g.bk.hatto.includes(hk)) return {err:'？'}; g.bk.hatto.push(hk); g.bk.iko=cl(g.bk.iko+H.iko); g.bk.lastH=g.day; q0.st='done';
    if(hk==='kenchi') for(const S of Object.values(g.w)) if(S.owner==='me'){ S.koku=Math.round(S.koku*1.1); S.unrest=cl(S.unrest+20); }
    if(hk==='rakuichi'){ g.act.tera.rel=cl(g.act.tera.rel-15); g.act.chotei.rel=cl(g.act.chotei.rel-5); }
    if(hk==='sobuji') for(const S of Object.values(g.w)) if(S.owner==='vassal') S.rel=cl(S.rel-10);
    if(hk==='nanban'){ g.act.tera.rel=cl(g.act.tera.rel-10); g.flags.teppo=true; }
    if(hk==='sankin') for(const S of Object.values(g.w)) if(S.owner==='vassal') S.rel=cl(S.rel-8);
    const t=`法度「${H.n}」を定めた。`; chron(g,t); return {t}; } } const q=g.reqs.find(x=>x.id===id&&x.st==='open'); if(!q) return {err:'もう済んだ。'}; let t='';
  switch(q.kind+':'+k){
    case 'gunyaku:daisen': { if(g.res.zeni<val) return {err:'銭が足りない。'}; g.res.zeni-=val; const ok=val>=20||rnd(g)<val/25; g.act.shugo.rel=cl(g.act.shugo.rel+(ok?6:-6)); q.st=ok?'done':'failed'; t=ok?`銭${val}貫で軍役に代えた。`:`銭${val}貫では足りぬと守護方は不快げだ。`; break; }
    case 'tansen:pay': { if(g.res.zeni<val) return {err:'銭が足りない。'}; g.res.zeni-=val; const ta=tansenAmt(g); g.act.shugo.rel=cl(g.act.shugo.rel+(val>=ta?5:-(ta-val)/2)); q.st='done'; t=`段銭${val}貫を納めた。`; break; }
    case 'mishin:payr': { if(g.res.rice<val) return {err:'米が足りない。'}; g.res.rice-=val; q.data.paid=(q.data.paid||0)+val; g.act.tera.rel=cl(g.act.tera.rel+val*0.6); t=`西光院へ米${val}石を納めた。`; if(q.data.paid>=20) q.st='done'; break; }
    case 'genmen:relief': { if(g.res.rice<val) return {err:'米が足りない。'}; g.res.rice-=val; const V=g.vil[q.from]; V.m=cl(V.m+val*1.2); q.st='done'; t=`${V.n}に米${val}石を下げ渡した。`; break; }
    case 'jige:jige': { const r=vilAct(g,q.from,'jige'); t=r.t; q.st='done'; break; }
    case 'jige:refuse': q.st='done'; g.vil[q.from].m=cl(g.vil[q.from].m-5); t='地下請を許さなかった。'; break;
    case 'inoue:probe': { const H=g.ret.hirata; if(!present(g,'hirata')) return {err:'平田が出かけている。'}; const found=rnd(g)<0.4+H.chi/150; q.data.found=found; if(found){ t='平田の調べで、井上の着服は確かだと分かった。'; q.kind='inoue2'; } else { t='平田は証拠をつかめなかった。'; q.st='done'; } break; }

    case 'onsho:grant': case 'shuppon:grant': { g.flags.onshoDone=true; const rid=q.data.rid||q.from.slice(4); const er=grant(g,rid,sel,val/100); if(er) return {err:er}; q.st='done'; t=`${g.ret[rid].n}に宛行状を与えた。`; break; }
    case 'onsho:zeni': case 'shuppon:zeni': { g.flags.onshoDone=true; const rid=q.data.rid||q.from.slice(4); const er=reward(g,rid,val); if(er) return {err:er}; q.st='done'; t=`${g.ret[rid].n}に銭${val}貫を与えた。`; break; }

    case 'ikki:tokusei': { for(const v in g.vil){ const V=g.vil[v]; if(!V.owned) continue; if((V.pie.me||0)>=0.05){ V.pie.me=r2(V.pie.me-.05); V.pie.hyakusho=r2(V.pie.hyakusho+.05); } V.m=cl(V.m+15); } if(g.debt){ g.debt=null; g.act.kadoya.rel=cl(g.act.kadoya.rel-20); } for(const A of g.armies) if(A.faction==='ikki') g.armies=g.armies.filter(a=>a!==A); q.st='done'; t='徳政を認めた。一揆は解けた。'; chron(g,'竹原家が一揆の求めに応じ徳政を認めた。'); break; }
    case 'jodai:assign': { const er2=setJodai(g,q.data.id,sel); if(er2) return {err:er2}; const R=g.ret[sel]; R.chu=cl(R.chu+5); q.st='done'; t=`${R.n}を${regName(g,q.data.id)}の城代に置いた。`; chron(g,t); break; }
    case 'jodai:none': q.st='done'; t='城代を置かなかった。'; break;
    case 'hatto:later': q.st='done'; t='法度は定めなかった。'; break;
    case 'shoshi:pay': if(g.res.zeni<2000) return {err:'銭が足りない。'}; g.res.zeni-=2000; g.bk.iko=cl(g.bk.iko+12); q.st='done'; t='諸大名は新しい将軍に礼をとった。'; chron(g,t); break;
    case 'shoshi:force': { q.st='done'; const cand=Object.keys(g.w).filter(k=>g.w[k].owner==='vassal'); if(cand.length&&rnd(g)<0.7){ const k=cand[Math.floor(rnd(g)*cand.length)]; wLose(g,k,Math.round(WN[k].koku/35)); g.alerts.push({k:'hanran',id:k}); t=`${WN[k].house}が新しい将軍に従わず、兵を挙げた。討てば威光が上がる。`; g.w[k].rebel=true; } else { g.bk.iko=cl(g.bk.iko+6); t='異を唱える者は出なかった。'; } chron(g,t); break; }

    case 'seibatsu:no': q.st='done'; g.act.shugo.rel=cl(g.act.shugo.rel-10); t='辞退した。守護方は不興だ。'; break;
    case 'sengo:ando': case 'sengo:oibarai': case 'sengo:tera': case 'sengo:chokkatsu': { q.st='done'; t=sengo(g,q.data.id,k); if(k!=='ando') addReq(g,{from:'home',kind:'jodai',due:g.day+30,data:{id:q.data.id}}); break; }
    case 'katoku:heir': { q.st='done'; const K=g.flags.katoku; finishSucc(g,K.hk); for(const [k,R] of Object.entries(g.ret)) if(!R.lord&&!R.gone&&R.chu<45&&rnd(g)<0.5){ R.gone='出奔（家督争い）'; log(g,`${R.n}が一門を担いで出奔した。`,'ng'); } t=`幼い${g.ret.yoritane.n}を当主に立て、平田源七が後見した。`; chron(g,t); break; }

function tileAt(e){ const r=cv.getBoundingClientRect(); const fx=(e.clientX-r.left-ox)/sc/TS, fy=(e.clientY-r.top-oy)/sc/TS; return [fx,fy]; }
function onMap(e){ const [fx,fy]=tileAt(e); for(const b of bubbles){ if(Math.hypot(b.x-fx,b.y-fy)<0.55){ focusReq=b.q; tab='you'; side(); setTimeout(()=>{ const el=document.getElementById('rq-'+b.q); if(el) el.scrollIntoView({block:'center'}); },50); return; } }
  const p=[Math.floor(fx),Math.floor(fy)]; if(p[0]<0||p[1]<0||p[0]>=E.W||p[1]>=PHH) return;
  if(buildK){ const er=EC.canBuild(p[0],p[1],buildK); if(er){ toast(er,1); return; } if(selT&&selT[0]===p[0]&&selT[1]===p[1]){ place(); return; } selT=p; bbar(); return; }
  selT=p; tab='tile'; side(); }
function place(){ const er=EC.build(selT[0],selT[1],buildK); if(er){ toast(er,1); return; } SND.hammer(); floats.push({x:selT[0],y:selT[1],label:'普請はじめ',t:0}); toast(`普請をはじめた（${E.daysOf(G,buildK)}日）`); buildK=null; selT=null; bbar(); save(); if(speed===0) speed=1; }
function navReq(q,k){ const to={suit:'tera',gunyaku:'shugo',tansen:'shugo',mishin:'tera',yama:'shugo',nodawa:'noda'};
  if(k==='goto'){ setPage(0); selT=[8,4]; tab='tile'; if(panX!==null){ panX=-1e9; layout(); } return; }
  if(k==='army'){ MOB=mobDefault(); MOB.dest=q.kind==='gunyaku'?{k:'shugo'}:q.kind==='yama'?{k:'v',v:'v1'}:null; if(q.kind==='gunyaku'){ MOB.rids=['kimura'].filter(r=>E.present(G,r)); MOB.ashi=Math.min(G.ashi,4); } tab='gun'; return; }
  if(k==='nego'){ dipSel=to[q.kind]||'shugo'; NG.k={suit:'wakai',gunyaku:'menjo',tansen:'menjo',mishin:'wait',yama:'yama'}[q.kind]||'none'; tab='dip'; return; }
  if(k==='nego2'){ dipSel='shugo'; NG.k='none'; tab='dip'; return; }
  if(k==='nego3'){ dipSel='noda'; NG.k=q.kind==='yama'?'yama':'wa'; tab='dip'; return; }
  if(k==='vil'){ tab='vil'; return; } }
document.addEventListener('pointerdown',e=>{ ptrDown=true; if(e.target.id==='cv'&&panX!==null) drag={x:e.clientX,p:panX,moved:false}; });
document.addEventListener('pointermove',e=>{ if(!drag) return; const dx=e.clientX-drag.x; if(Math.abs(dx)>6) drag.moved=true; if(drag.moved){ panX=drag.p+dx; layout(); } });
document.addEventListener('pointerup',()=>{ ptrDown=false; if(drag&&drag.moved) noClick=Date.now(); drag=null; if(pendSide){ pendSide=false; setTimeout(softSide,0); } });
document.addEventListener('input',e=>{ const el=e.target; if(el.type==='range'){ const o=el.parentElement.querySelector('output'); if(o) o.textContent=el.value; }
  const a=el.dataset.a; if(!a||!G) return; const v=+el.value;
  if(a==='ng-zeni'){ NG.zeni=v; updMeter(); } if(a==='ng-rice'){ NG.rice=v; updMeter(); }
  if(a==='rng-zeni'){ RNGof(el.dataset.k).zeni=v; updMeter(); } if(a==='rng-rice'){ RNGof(el.dataset.k).rice=v; updMeter(); }
  if(a==='mob-ashi'){ MOB.ashi=v; } if(a==='wash'){ WM.ashi=v; } if(a==='wmob'){ WM.mob=v; } if(a==='mob-levy'){ MOB.levy[el.dataset.v]=v; }
  if(a==='dl-bud'){ E.setDeleg(G,el.dataset.v,{budget:v}); } if(a==='dl-ashi'){ E.setDeleg(G,'naisei',{ashi:v}); }
  if(a==='vdev-bud'){ E.vilAct(G,el.dataset.v,'dev',{budget:v}); } });
function updMeter(){ const st=$('#side').scrollTop; side(); $('#side').scrollTop=st; }
document.addEventListener('change',e=>{ const el=e.target; const a=el.dataset.a; if(!a||!G) return; let er=null;
  if(a==='daikan'){ const r=E.vilAct(G,el.dataset.v,'daikan',el.value||null); er=r.err; if(!er) toast(r.t); }
  if(a==='pol'){ const r=E.vilAct(G,el.dataset.v,'pol',el.value); toast(r.t); }

  if(a==='dl-levy'){ E.setDeleg(G,'gunji',{levy:el.checked}); }

  if(a==='job'){ const [k,v]=el.value.split(':'); const r=E.assign(G,el.dataset.v,k||'yasumi',v); if(r){ toast(r,1); } else SND.coin(); ov(); hudKey=''; return; }
  if(a==='dl-ashi'||a==='rng-zeni'||a==='rng-rice'||a==='wash'||a==='wmob'||a==='mob-ashi'||a==='mob-levy'||a==='ng-zeni'||a==='ng-rice'||a==='dl-bud'||a==='vdev-bud'){ side(); save(); return; }
  if(er) toast(er,1); postAct(); side(); save(); });
document.addEventListener('click',e=>{ const b=e.target.closest('[data-a]'); if(!b){ if(e.target.id==='cv'&&Date.now()-noClick>250) onMap(e);  return; } const a=b.dataset.a, v=b.dataset.v; let er=null;
  if(b.tagName==='SELECT'||b.tagName==='INPUT') return;
  switch(a){
    case 'skip': { if(OV||G.battle||G.over) return; let n=0; const nreq=G.reqs.filter(q=>q.st==='open').length; const st=JSON.stringify(G.armies.map(a=>a.state)); while(n<120){ const r=E.tick(G); n++; after(r); if(busy()||banner&&banner.stop) break; if(r.built||r.envoyBack||(r.alerts&&r.alerts.length)||r.harvest||r.battle) break; if(G.reqs.filter(q=>q.st==='open').length>nreq) break; if(JSON.stringify(G.armies.map(a=>a.state))!==st) break; } toast(`${n}日進めた`); hudKey=''; syncPeople(); return; }
    case 'mute': mute=!mute; try{ localStorage.setItem('ranse-mute',mute?'1':'0'); }catch(e){} if(!mute){ ac(); SND.coin(); } break;
    case 'new': ac(); G=E.newGame((Date.now()%2147483647)>>>0||7,v||'kuni'); speed=1; tab=null; peeps=[]; MOB=null; newsSeen=0; banner=null; shownC={}; gkey=''; shell(); syncPeople(); OV={k:'opening'}; ov(); SND.drum(3); save(); return;
    case 'openx': { if(!isKuni()){ OV=null; ov(); G.alerts.splice(0); tab=G.role==='myoshu'?'mura':G.role==='shonin'?'ichi':'tera'; side(); speed=1; showBanner({html:G.role==='shonin'?'<b>市の欄</b>で相場を見よう。竹原家が銭を借りたいと言ってきている。':G.role==='myoshu'?'<b>村の欄</b>で、この村の年貢が誰のものかを見てみよう。寺への未進の用件が来ている。':'<b>寺の欄</b>で、寺分の年貢を誰に取り立てさせるかを決めよう。中島村の未進の用件が来ている。',auto:9000}); return; } OV=null; ov(); const al=G.alerts.splice(0); after({alerts:al}); return; }
    case 'clater': OV=null; ov(); return;
    case 'creq': { const id=+v, k=b.dataset.k; const q=G.reqs.find(x=>x.id===id); if(!q) break; if(['goto','army','nego','nego2','nego3','vil'].includes(k)){ OV=null; ov(); navReq(q,k); side(); return; } const inp=document.querySelector(`[data-amt="${id}-${k}"]`); const sl=document.querySelector(`[data-sel="${id}-${k}"]`); const r=E.handleReq(G,id,k,inp?+inp.value:0,sl?sl.value:null); if(r.err){ er=r.err; break; } if(r.nav){ RNGS[r.nav[0]]={k:r.nav[1],zeni:0,rice:0,to:r.nav[0]}; tab=G.role==='myoshu'?'mura':'tera'; OV=null; ov(); side(); toast('使者の支度へ'); return; } if(r.t) toast(r.t); OV=null; ov(); SND.koto([294,392,440]); save(); break; }
    case 'vdev-on': { const V=G.vil[v]; const r=E.vilAct(G,v,'dev',{on:!V.dev.on}); toast(r.t); break; }
    case 'cont': { ac(); const s=load(); if(!s){ toast('続きがない',1); return; } G=s; shownC={}; for(const q of G.reqs) shownC[q.id]=1; gkey=''; speed=0; OV=null; tab=null; peeps=[]; MOB=null; newsSeen=G.news.length; banner=null; shell(); syncPeople(); return; }
    case 'title': G=null; OV=null; title(); return;
    case 'introx': OV=null; ov(); return;
    case 'spd': speed=+v; hudKey=''; break;
    case 'teate': E.setTeate(G,v); toast('家臣への手当を「'+E.TEATE[v].n+'」にした'); break;
    case 'spend': er=E.spend(G,v); if(!er){ SND.coin(); toast('銭を使った'); hudKey=''; } break;

    case 'rng-k': RNGof(b.dataset.k).k=v; break;
    case 'rsend': { const RNG=RNGof(v); er=E.roleSend(G,v,{...RNG}); if(!er){ toast('出向いた'); RNG.zeni=0; RNG.rice=0; if(speed===0) speed=1; } break; }
    case 'chor': { const [rk,k]=b.dataset.k.split(':'); er=E.choryaku(G,v,rk,k); if(!er){ toast('内々に人を遣わした'); if(speed===0) speed=1; } break; }

    case 'dl-duty': { const k=b.dataset.k; E.setDeleg(G,'naisei',{[k]:G.deleg.naisei[k]===false}); break; }

    case 'nozomix': OV=null; ov(); return;

    case 'ropen': OPEN=OPEN===v?null:v; break;
    case 'rzeni': { const amt=+document.querySelector(`[data-amt="rw-${v}"]`).value; er=E.reward(G,v,amt); if(!er){ toast(`${G.ret[v].n}に銭${amt}貫を与えた`); OPEN=null; } break; }
    case 'rgrant': { const amt=+document.querySelector(`[data-amt="rg-${v}"]`).value; const vv=document.querySelector(`[data-sel="rg-${v}"]`).value; er=E.grant(G,v,vv,amt/100); if(!er){ toast(`${G.ret[v].n}に宛行状を与えた`); OPEN=null; } break; }
    case 'dl-on': { const k=v; const on=!G.deleg[k].on; E.setDeleg(G,k,{on}); toast(on?(k==='karo'?'細かな用件は家老に任せた':`${G.ret[G.deleg[k].rid].n}に任せた`):'任せるのをやめた'); break; }
    case 'saihai': G.deleg.saihai=G.deleg.saihai==='auto'?'self':'auto'; break;
    case 'hire': er=E.hire(G,10); if(!er) toast('足軽を十人雇った'); break;
    case 'fire': E.fire(G,10); break;
    case 'mob-rid': { const i=MOB.rids.indexOf(v); if(i>=0) MOB.rids.splice(i,1); else MOB.rids.push(v); break; }
    case 'mob-food': MOB.food=+v; break;
    case 'mob-dest': MOB.dest=G.vil[v]?{k:'v',v}:E.REG[v]?{k:'region',id:v}:{k:v}; break;
    case 'march': er=MOB.dest&&MOB.dest.k==='region'?E.regionCampaign(G,MOB.dest.id,{...MOB}):E.mobilize(G,{...MOB}); if(!er){ SND.conch(); splash('出陣','',''); toast('出陣！'); if(G.lastReplies&&G.lastReplies.length){ showBanner({html:`<b>寄子からの返書</b><br>${G.lastReplies.map(esc).join('<br>')}`,auto:9000}); G.lastReplies=null; } MOB=null; tab=null; if(speed===0) speed=1; showBanner(null); } break;
    case 'army': er=E.orderArmy(G,+v,{k:b.dataset.k}); if(!er&&b.dataset.k==='assault'){ tab=null; } break;
    case 'armygo': er=E.orderArmy(G,+v,{k:'goto',dest:{k:'v',v:b.dataset.k}}); break;
    case 'raidgo': { setPage(0); MOB=mobDefault(); MOB.dest={k:'v',v}; MOB.food=5; tab='gun'; showBanner(null); break; }
    case 'raiddl': { E.setDeleg(G,'gunji',{on:true}); const A=G.armies.find(a=>a.side==='noda'&&a.task==='raid'&&a.tv===v); if(A) E.gunjiRespond(G,A); showBanner(null); speed=1; break; }
    case 'jodai': { const kk=b.dataset.k||null; er=E.setJodai(G,v,kk); if(!er) toast(kk?'城代を置いた':'城代を呼び戻した'); break; }
    case 'regatk': MOB=mobDefault(); MOB.dest={k:'region',id:v}; MOB.food=10; tab='gun'; break;
    case 'dsel': if(v==='noda'&&G.noda.state!=='free'){ break; } if(E.REG[v]) tab='dip'; if(!E.WN[v]) tierSel=1; dipSel=v; NG={k:v==='kobayashi'?'naitsu':'none',zeni:0,rice:0,oath:false,hostage:null,marry:false,v:NG.v}; break;
    case 'ng-k': NG.k=v; if(v==='kessho') NG.v=Object.keys(G.reg).find(id=>G.reg[id].owner==='me'&&!G.reg[id].ando); if(v==='ando') NG.v=Object.keys(G.vil).find(x=>G.vil[x].owned&&!G.vil[x].ando); break;
    case 'ng-oath': NG.oath=!NG.oath; break;
    case 'ng-host': NG.hostage=NG.hostage===v?null:v; break;
    case 'ng-marry': NG.marry=!NG.marry; break;
    case 'sender': sender=v; break;
    case 'sendng': { const o={...NG}; if(!(dipSel==='noda'||dipSel==='kobayashi')){ o.oath=false; o.marry=false; if(!(E.REG[dipSel]&&o.k==='yoriko')) o.hostage=null; } er=E.sendNego(G,sender,dipSel,o); if(!er){ toast('使者を遣わした'); NG.zeni=0; NG.rice=0; if(speed===0) speed=1; } break; }
    case 'req': { const id=+v, k=b.dataset.k; const q=G.reqs.find(x=>x.id===id); if(!q) break; if(['goto','army','nego','nego2','nego3','vil'].includes(k)){ navReq(q,k); break; } const inp=document.querySelector(`[data-amt="${id}-${k}"]`); const sel=document.querySelector(`[data-sel="${id}-${k}"]`); const r=E.handleReq(G,id,k,inp?+inp.value:0,sel?sel.value:null); if(r.err) er=r.err; else if(r.nav){ RNGS[r.nav[0]]={k:r.nav[1],zeni:0,rice:0,to:r.nav[0]}; tab=G.role==='myoshu'?'mura':G.role==='shonin'?'ichi':'tera'; toast('使者の支度へ'); } else if(r.t) toast(r.t); break; }
    case 'hclose': OV=null; ov(); save(); break;
    case 'bauto': if(G.battle&&!G.battle.over){ G.battle.auto=true; if(!OV.autoRun){ OV.autoRun=true; bautoRun(); } } return;
    case 'bcard': bplay(v); return;
    case 'bretreat': bplay('retreat'); return;
    case 'bclose': E.closeBattle(G); OV=null; ov(); save(); hudKey=''; break;
  }
  if(er) toast(er,1); hudKey=''; postAct(); if(G&&(!OV||OV.k==='intro')) side(); if(G) bbar(); });
function postAct(){ if(!G||G.over) return; E.checkQuests(G); const al=G.alerts.splice(0); if(al.length) after({alerts:al}); }
document.addEventListener('keydown',e=>{ if(!G||OV) return; if(e.key===' '&&e.target===document.body){ e.preventDefault(); speed=speed?0:1; hudKey=''; } if(e.key==='Escape'){ tab=null; buildK=null; selT=null; side(); bbar(); } });
window.addEventListener('resize',()=>{ if(G){ layout(); side(); } });

window.__ranse={get G(){return G},set G(v){G=v},E,get OV(){return OV},set speed(v){speed=v},sel:(x,y)=>{ selT=[x,y]; tab='tile'; side(); },get banner(){return banner}};
