    popup(f.x, f.y - 16, f.kind === 'strike' ? '攻撃機撃墜！' : '戦闘機撃墜！', '#ffb347', 1.2);
    if (!offscreen(f.x)) slowMo(30);
  } else if (f.side === 'p') popup(f.x, f.y - 16, f.kind === 'strike' ? '自軍の攻撃機が撃墜された' : '自軍の戦闘機が撃墜された', '#ff9a8a');
}

function updateFighters(dt) {
  for (let i = fighters.length - 1; i >= 0; i--) {
    const f = fighters[i];
    if (f.falling) {
      f.vy += 0.09 * dt; f.vx *= 0.995; f.h += f.spin * dt; f.x += f.vx * dt; f.y += f.vy * dt;
      if (parts.length < CAP) {
        parts.push(smoke(f.x, f.y, 0, -0.2, rand(4, 8), 'rgb(40,36,40)', 0.7, 0.007));
        parts.push({ k: 1, x: f.x, y: f.y, vx: 0, vy: -0.4, size: 5, life: 1, decay: 0.08 });
      }
      if (f.y >= groundAt(f.x)) { fighters.splice(i, 1); explode(f.x, groundAt(f.x), 48, f.side === 'p' ? 'e' : 'p'); }
      continue;
    }
    f.life -= dt; f.gunCd -= dt; f.rocketCd -= dt;
    const J = JET[f.side][f.kind];
    // our jets pop flares when an enemy interceptor closes in; most of them chase the flare instead
    if (f.side === 'p') for (const m of missiles) {
      if (m.dead || m.type !== 'intercept' || m.side !== 'e' || m.target !== f || m.flared || Math.hypot(m.x - f.x, m.y - f.y) > 140) continue;
      m.flared = true;
      for (let k = 0; k < 8; k++) parts.push({ k: 2, x: f.x, y: f.y, vx: -f.vx * 0.3 + rand(-2, 2), vy: rand(1, 3), life: 1, decay: 0.025 });
      if (Math.random() < 0.65) { m.decoyed = true; m.target = null; m.tx = f.x - f.vx * 8 + rand(-40, 40); m.ty = f.y + 60; }
    }
    let gx, gy, gunAt = null;
    // 1. dogfight any enemy jet in range
    // jets look for each other across a wide stretch of sky, so fights start up high
    // attack jets only fight back when a foe is right on them; their job is the ground
    let foe = null, fd = f.kind === 'strike' ? 260 : 1100;
    for (const o of fighters) if (o.side !== f.side && !o.dead) { const d = Math.hypot(o.x - f.x, o.y - f.y); if (d < fd) { fd = d; foe = o; } }
    if (f.life <= 0) { gx = f.side === 'p' ? -400 : WW + 400; gy = f.alt; }
    else if (foe) {
      const lead = fd / 17; gx = foe.x + foe.vx * lead; gy = foe.y + foe.vy * lead; gunAt = foe;
      // while closing from far off, hold altitude instead of diving after a low target
      if (fd > 450) gy = Math.min(gy, f.alt + H * 0.1);
    }
    else {
      // 2. our jets gun down incoming warheads
      let mis = null, md = 480;
      if (f.side === 'p' && f.kind === 'fighter') for (const m of missiles) if (!m.dead && m.side === 'e' && m.type !== 'intercept') { const d = Math.hypot(m.x - f.x, m.y - f.y); if (d < md) { md = d; mis = m; } }
      if (mis) { const lead = md / 17; gx = mis.x + mis.vx * lead; gy = mis.y + mis.vy * lead; gunAt = mis; }
      else if (f.climb > 0) { f.climb -= dt; gx = f.x + Math.cos(f.h) * 300; gy = f.alt; }
      else {
        // 3. attack run: dive at a target, loose two rockets, pull up
        if (!f.goal) f.goal = jetGroundTarget(f);
        if (f.goal) {
          gx = f.goal.x; gy = f.goal.y;
          const d = Math.hypot(gx - f.x, gy - f.y), off = Math.abs(angDiff(Math.atan2(gy - f.y, gx - f.x), f.h));
          if (d < 300 && off < 0.35 && f.rocketCd <= 0) { fireRockets(f, gx, gy); f.rocketCd = J.rocketCd; f.climb = 80; f.goal = null; }
        } else { gx = f.x + Math.cos(f.h) * 300; gy = f.alt; }
      }
    }
    const floor = groundAt(f.x) - 70;
    gy = clamp(gy, -H * 0.4, floor);
    // turn rate grows with airspeed; the bank angle follows how hard it is turning
    const rate = J.turn * clamp(f.spd / J.speed, 0.7, 1.25) * dt;
    const steer = clamp(angDiff(Math.atan2(gy - f.y, gx - f.x), f.h), -rate, rate);
    f.h += steer;
    f.bank = lerp(f.bank, rate ? steer / rate : 0, 0.12);
    if (f.y > floor) f.h += clamp(angDiff(-Math.PI / 2, f.h), -0.12 * dt, 0.12 * dt);          // pull up
    if (f.life > 0 && f.x < 60 && Math.cos(f.h) < 0) f.h += clamp(angDiff(0, f.h), -0.1 * dt, 0.1 * dt);
    if (f.life > 0 && f.x > WW - 60 && Math.cos(f.h) > 0) f.h += clamp(angDiff(Math.PI, f.h), -0.1 * dt, 0.1 * dt);
    // energy: diving gains speed, climbing bleeds it; afterburner kicks in for climbs and dogfights
    const pitch = Math.sin(f.h);                    // + is nose down
    f.ab = lerp(f.ab, (pitch < -0.25 || foe) ? 1 : 0, 0.08);
    const want = J.speed * (1 + 0.35 * pitch) * (1 + 0.18 * f.ab);
    f.spd = lerp(f.spd, want, 0.03 * dt);
    f.vx = Math.cos(f.h) * f.spd; f.vy = Math.sin(f.h) * f.spd;
    f.x += f.vx * dt; f.y += f.vy * dt;
    if (f.life <= 0 && (f.x < -300 || f.x > WW + 300)) { fighters.splice(i, 1); continue; }
    if (gunAt && f.gunCd <= 0) {
      const d = Math.hypot(gunAt.x - f.x, gunAt.y - f.y), off = Math.abs(angDiff(Math.atan2(gunAt.y - f.y, gunAt.x - f.x), f.h));
      if (d < J.range && off < 0.22) {
        f.gunCd = J.gunCd; f.muzzle = 2;
        const a = f.h + rand(-0.03, 0.03);
        bullets.push({ x: f.x + Math.cos(f.h) * 26, y: f.y + Math.sin(f.h) * 26, vx: Math.cos(a) * 17 + f.vx * 0.3, vy: Math.sin(a) * 17 + f.vy * 0.3, life: J.range / 13, side: f.side });
        sfxGun(f.x, f.y);
      }
    }
    if ((f.roarT -= dt) <= 0) { f.roarT = 70; if (!offscreen(f.x)) sfxJet(f.x, f.y); }
    if (parts.length < CAP) {
      const cx = Math.cos(f.h), sy = Math.sin(f.h);
      // high up the exhaust freezes into long white contrails; lower down only a faint haze
      if (f.y < H * 0.16) parts.push(smoke(f.x - cx * 18, f.y - sy * 18, 0, 0, 1, 'rgb(215,222,235)', 0.3, 0.004));
      else if (frame % 2 === 0) parts.push(smoke(f.x - cx * 16, f.y - sy * 16, 0, 0, 1.2, 'rgb(170,175,190)', 0.16, 0.012));
      // hard turns pull vapour off the wingtips
      if (Math.abs(f.bank) > 0.7 && f.spd > J.speed * 0.9) for (const s of [-1, 1]) parts.push(smoke(f.x - cx * 6 - sy * 7 * s, f.y - sy * 6 + cx * 7 * s, 0, 0, 0.6, 'rgb(230,235,245)', 0.35, 0.04));
    }
    if (f.muzzle > 0) f.muzzle -= dt;
  }
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
    let hit = false;
    for (const o of fighters) if (!o.dead && o.side !== b.side && Math.hypot(o.x - b.x, o.y - b.y) < 11) { hit = true; jetHit(o, 1, b.side); break; }
    if (!hit) for (const m of missiles) {
      if (m.dead || m.side === b.side || m.type === 'intercept' || Math.hypot(m.x - b.x, m.y - b.y) > 9) continue;
      hit = true; m.dead = true;
      blasts.push({ x: m.x, y: m.y, r: 16, life: 0.8 });
      if (b.side === 'p') shotDown(m.x, m.y);
      break;
    }
    if (hit || b.life <= 0 || b.y >= groundAt(b.x)) bullets.splice(i, 1);
  }
}

function update(dt) {
  frame++;
  if (camV) setCam(camX + camV / Z * dt);
  if (keysPan) setCam(camX + keysPan * 14 / Z * dt);
  for (let i = queue.length - 1; i >= 0; i--) {
    if (frame >= queue[i].at) { const q = queue[i]; queue.splice(i, 1); launch(q.x, q.y, q.type, q.L, q.side); }
  }
  const D = DIFF[game.diff];
  if (!game.over) {
    game.next -= dt;
    if (game.next <= 0) {
      enemyAttack();
      game.rate = Math.max(D.min, game.rate * 0.985);
      game.next = game.rate * rand(0.6, 1.4);
    }
    for (const m of missiles) {
      if (m.dead || m.type === 'intercept') continue;
      if (m.side === 'p' && !m.te && m.x > WW * 0.5 && m.vy > -2 && Math.random() < D.intercept * dt * 6) {
        m.te = true;
        const L = aliveLaunchers('e').sort((a, b) => Math.abs(a.x - m.x) - Math.abs(b.x - m.x))[0];
        if (L && Math.random() < 0.55 + D.intercept * 15) launch(m.x, m.y, 'intercept', L, 'e', m);
      }
      if (autoAA && m.side === 'e' && !m.tp && m.x < WW * 0.55 && m.vy > -1 && Math.random() < 0.09 * dt) {
        m.tp = true;
        launch(m.x, m.y, 'intercept', null, 'p', m);
      }
    }
    // jets: enemy squadrons arrive on a timer; both air defences also shoot at jets over their city
    enemyJetT -= dt;
    if (enemyJetT <= 0) {
      const n = { easy: 1, normal: 2, hard: 3 }[game.diff];
      for (let k = 0; k < n; k++) spawnJet('e', highAlt());
      if (game.diff !== 'easy') spawnJet('e', highAlt(), 'strike');      // squadrons bring an attack jet along
      if (game.diff === 'hard') spawnJet('e', highAlt(), 'strike');
      popup(camX + VW() * 0.8, toWorld(0, H * 0.3)[1], '敵の戦闘機が接近中', '#ff9a8a', 1.1);
      enemyJetT = 60 * rand(28, 42) * { easy: 1.4, normal: 1, hard: 0.7 }[game.diff];
    }
    // the enemy answers our jets: when we have more in the air, it scrambles to match
    if (frame % 90 === 0 && aliveLaunchers('e').length) {
      const lag = jetCount('p') - jetCount('e') + { easy: -1, normal: 0, hard: 1 }[game.diff];
      if (lag > 0 && jetCount('e') < MAX_JETS) {
        for (let k = 0; k < Math.min(3, lag); k++) spawnJet('e', highAlt());
        if (frame - lastEnemyScramble > 300) popup(camX + VW() * 0.8, toWorld(0, H * 0.3)[1], '敵が戦闘機を緊急発進', '#ff9a8a', 1.1);
        lastEnemyScramble = frame;
      }
    }
    for (const f of fighters) {
      if (f.dead) continue;
      if (f.side === 'p' && f.x > WW * 0.5 && f.te < frame && Math.random() < D.intercept * dt * 1.5) {
        f.te = frame + 120;
        const L = aliveLaunchers('e').sort((a, b) => Math.abs(a.x - f.x) - Math.abs(b.x - f.x))[0];
        if (L) launch(f.x, f.y, 'intercept', L, 'e', f);
      }
      if (autoAA && f.side === 'e' && f.x < WW * 0.5 && f.tp < frame && Math.random() < 0.03 * dt) {
        f.tp = frame + 120;
        launch(f.x, f.y, 'intercept', null, 'p', f);
      }
    }
    if (frame % 20 === 0) checkEnd();
  }
  if (scrambleCd > 0) scrambleCd -= dt;
  updateFighters(dt);
  if (auto && !game.over && frame % 7 === 0) {
    const tx = rand(WW * GAP1, WW * 0.99);
    const ty = rand(H * 0.4, groundAt(tx) + 10);
    fire(tx, ty, pick(aliveLaunchers('p').concat([null])));
  }
  if (holding && frame - lastHoldShot >= (weapon === 'salvo' ? 22 : weapon === 'big' ? 14 : weapon === 'intercept' ? 10 : 6)) {
    lastHoldShot = frame;
    const [wx, wy] = toWorld(holdX, holdY);
    fire(wx + rand(-10, 10), wy + rand(-10, 10));
  }

  for (let i = missiles.length - 1; i >= 0; i--) {
    const m = missiles[i];
    if (m.dead) { missiles.splice(i, 1); continue; }
    const S = SPEC[m.type];
    m.t += dt;
    if (m.type === 'intercept') {
      if ((!m.target || m.target.dead) && !m.decoyed) m.target = nearestHostile(m.x, m.y, m.side, 300);
      if (m.target) {
        // aim where the target will be when we get there (two refinement passes)
        const sp = Math.max(m.speed, 9);
        let t = Math.hypot(m.target.x - m.x, m.target.y - m.y) / sp;
        for (let k = 0; k < 2; k++) t = Math.hypot(m.target.x + m.target.vx * t - m.x, m.target.y + m.target.vy * t - m.y) / sp;
        t = Math.min(t, 60);
        m.tx = m.target.x + m.target.vx * t; m.ty = m.target.y + m.target.vy * t;
      }
    }
    if (m.type === 'homing' && m.lock) {
      let p = lockPoint(m.lock);
      if (!p) { m.lock = homingLock(m.x, m.y); p = m.lock && lockPoint(m.lock); }   // target gone: pick the next one
      if (p) { m.tx = p[0]; m.ty = p[1]; }
      m.target = m.lock && m.lock.kind === 'missile' ? m.lock.ref : null;
    }
    m.speed = Math.min(S.max, m.speed + 0.28 * dt);
    let gx = m.tx, gy = m.ty;
    if (m.ax !== undefined) {
      gx = m.ax; gy = m.ay;
      if (Math.hypot(m.ax - m.x, m.ay - m.y) < 140 || Math.sign(m.tx - m.x) !== Math.sign(m.ax - m.x)) m.ax = undefined;
    }
    const dx = gx - m.x, dy = gy - m.y, d = Math.hypot(dx, dy) || 1;
    if (m.t > S.boost) {
      const cap = m.type === 'intercept' ? 0.55 : m.type === 'straight' ? 0.5 : m.type === 'homing' ? 0.3 : m.ax !== undefined ? 0.08 : 0.24;
      const ramp = m.type === 'intercept' ? 0.04 : m.type === 'homing' ? 0.02 : 0.005;
      const turn = (m.type === 'straight' ? cap : Math.min(cap, 0.035 + (m.t - S.boost) * ramp)) * dt;
      m.vx += (dx / d * m.speed - m.vx) * turn;
      m.vy += (dy / d * m.speed - m.vy) * turn;
    } else m.vy -= 0.12 * dt;
    m.x += m.vx * dt; m.y += m.vy * dt;
    if (parts.length < CAP) {
      // contrails linger and drift with the wind
      parts.push(smoke(m.x - m.vx * 0.6, m.y - m.vy * 0.6, rand(-0.12, 0.12), rand(-0.12, 0.04), 1.4 * S.trail + rand(1),
        m.side === 'e' ? 'rgb(150,132,134)' : 'rgb(168,172,186)', 0.24, m.type === 'intercept' ? rand(0.012, 0.018) : rand(0.0055, 0.0085)));
    }
    const dT = Math.hypot(m.tx - m.x, m.ty - m.y);
    if (m.type === 'cluster' && m.ax === undefined && dT < 170 && m.t > S.boost) {
      for (let k = 0; k < 9; k++) {
        missiles.push({ x: m.x, y: m.y, vx: m.vx * 0.5 + rand(-3, 3), vy: m.vy * 0.5 + rand(-3, 1), tx: m.tx + rand(-150, 150), ty: m.ty + rand(-40, 40), type: 'bomblet', side: m.side, speed: 5, t: 0, dead: false });
      }
      for (let k = 0; k < 14; k++) parts.push({ k: 2, x: m.x, y: m.y, vx: rand(-4, 4), vy: rand(-4, 4), life: 1, decay: 0.05 });
      sfxSplit(m.x);
      missiles.splice(i, 1); continue;
    }
    // three-way warhead: halfway to the target it fans out into three
    if (m.type === 'split' && m.ax === undefined && m.t > S.boost && dT < m.d0 * 0.5) {
      for (const off of [-110, 0, 110]) {
        missiles.push({ x: m.x, y: m.y, vx: m.vx + off * 0.02, vy: m.vy, tx: m.tx + off, ty: m.ty, type: 'splitlet', side: m.side, speed: m.speed, t: 0, dead: false });
      }
      for (let k = 0; k < 10; k++) parts.push({ k: 2, x: m.x, y: m.y, vx: rand(-3, 3), vy: rand(-3, 3), life: 1, decay: 0.05 });
      sfxSplit(m.x);
      missiles.splice(i, 1); continue;
    }
    // proximity fuse: interceptors go off as they pass close, they don't need a direct hit
    const near = m.target && !m.target.dead && Math.hypot(m.target.x - m.x, m.target.y - m.y) < (m.type === 'intercept' ? 28 : 16);
    const hitGround = m.t > 8 && m.y >= groundAt(m.x);
    if (near || (m.ax === undefined && dT < m.speed * 1.3) || hitGround || m.t > 900 || m.x < -200 || m.x > WW + 200) {
      m.dead = true;
      explode(m.x, hitGround ? Math.min(m.y, groundAt(m.x) + 2) : m.y, S.r * rand(0.9, 1.1), m.side);
    }
  }

  for (let i = fires.length - 1; i >= 0; i--) {
    const f = fires[i];
    f.life -= dt;
    if (f.life <= 0) { fires.splice(i, 1); continue; }
    const pw = f.power * Math.min(1, (f.life / f.max) * 2.5);
    if (parts.length < CAP && Math.random() < 0.9 * pw) parts.push({ k: 1, x: f.x + rand(f.w), y: f.y + rand(-2, 2), vx: rand(-0.25, 0.25), vy: -rand(0.5, 1.4), size: rand(3, 6) * (0.6 + pw * 0.6), life: 1, decay: rand(0.035, 0.06) });
    // thick black plume that rises high and leans downwind
    if (parts.length < CAP && Math.random() < 0.26 * pw) parts.push(smoke(f.x + rand(f.w), f.y - 6, rand(0.15, 0.55), -rand(0.7, 1.4), rand(7, 13) * (0.7 + f.w / 60), 'rgb(34,31,34)', 0.7, rand(0.0032, 0.0048)));
  }

  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.life -= p.decay * dt;
    if (p.life <= 0) { parts[i] = parts[parts.length - 1]; parts.pop(); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.k === 0) { p.vx = p.vx * 0.985 + 0.004 * dt; p.vy = p.vy * 0.985 - 0.006 * dt; }
    else if (p.k === 1) { p.vx *= 0.93; p.vy = p.vy * 0.93 - 0.03 * dt; }
    else { p.vy += 0.22 * dt; p.vx *= 0.99; }
  }

  for (let i = debris.length - 1; i >= 0; i--) {
    const d = debris[i];
    d.vy += 0.25 * dt; d.x += d.vx * dt; d.y += d.vy * dt; d.rot += d.vr * dt;
    const gy = groundAt(d.x);
    if (d.y > gy) { d.y = gy; d.vy *= -0.25; d.vx *= 0.55; d.vr *= 0.5; d.life -= 0.02 * dt; }
    else {
      d.life -= 0.0025 * dt;
      if (d.hot && d.life > 0.6 && frame % 2 === 0 && parts.length < CAP) parts.push(smoke(d.x, d.y, 0, -0.1, 2, 'rgb(60,56,58)', 0.4, 0.02));
    }
    if (d.life <= 0) { debris[i] = debris[debris.length - 1]; debris.pop(); }
  }

  for (let i = collapses.length - 1; i >= 0; i--) {
    const c = collapses[i];
    c.t += dt; c.v += 0.06 * dt; c.sink += c.v * dt;
    if (frame % 3 === 0 && parts.length < CAP) for (let k = 0; k < 3; k++) parts.push(smoke(c.x + rand(c.w), c.base - rand(4), rand(-2, 2), -rand(0.2, 0.9), rand(8, 18), 'rgb(92,86,82)', 0.6, rand(0.004, 0.008)));
    if (c.sink > c.h) collapses.splice(i, 1);
  }

  for (const c of cars) {
    if (!c.alive) continue;
    c.x += c.dir * c.v * dt;
    const ax = c.x + c.dir * 6;
    if (groundAt(ax) - ground0[clamp((ax / COL) | 0, 0, ground0.length - 1)] > 6) c.v = Math.max(0, c.v - 0.05 * dt);
    if (c.x < -30 || c.x > WW + 30) Object.assign(c, newCar());
  }
  if (frame % 120 === 0) for (const c of cars) if (!c.alive && Math.random() < 0.3) Object.assign(c, newCar());

  for (let i = pops.length - 1; i >= 0; i--) { const p = pops[i]; p.life -= 0.011 * dt; p.y -= 0.35 * dt; if (p.life <= 0) pops.splice(i, 1); }
  for (let i = blasts.length - 1; i >= 0; i--) { blasts[i].life -= 0.07 * dt; if (blasts[i].life <= 0) blasts.splice(i, 1); }
  for (let i = rings.length - 1; i >= 0; i--) {
    const r = rings[i]; r.r += (r.max - r.r) * 0.16 * dt; r.life -= 0.045 * dt;
    if (r.life <= 0) rings.splice(i, 1);
  }
  for (const L of launchers) { L.blink += dt; if (L.hitT > 0) L.hitT -= dt; }
  shake *= Math.pow(0.85, dt);
  flash *= Math.pow(0.86, dt);
}

/* ---------- render ---------- */
function render() {
  if (dirtyB >= dirtyA) drawWorld();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalCompositeOperation = 'source-over';
  ctx.drawImage(sky, 0, 0);
  const vw = VW(), k = DPR * Z;
  const sk = reduceMotion ? 0 : shake;
  const ox = rand(-sk, sk) * DPR, oy = rand(-sk, sk) * DPR;
  const by = PIV * (1 - Z) * DPR + oy;
  // distant skyline, scrolled slower for depth
  const fx = camX * PARALLAX, fw = Math.min(vw, WW - fx);
  ctx.setTransform(k, 0, 0, k, -fx * k + ox, by);
  ctx.drawImage(far, fx * WS, 0, fw * WS, H * WS, fx, 0, fw, H);
  const bx = -camX * k + ox;
  ctx.setTransform(k, 0, 0, k, bx, by);
  const v0 = camX - 120, v1 = camX + vw + 120;
  const vis = x => x > v0 && x < v1;
  // searchlight beams behind the buildings
  ctx.globalCompositeOperation = 'lighter';
  for (const s of searchlights) {
    if (!s.alive || !vis(s.x)) continue;
    const gy = groundAt(s.x) - 2;
    const a = -Math.PI / 2 + Math.sin(frame * s.sp + s.ph) * s.amp + (s.side === 'p' ? 0.15 : -0.15);
    const len = H * 0.95, spread = 0.035;
    const ex1 = s.x + Math.cos(a - spread) * len, ey1 = gy + Math.sin(a - spread) * len;
    const ex2 = s.x + Math.cos(a + spread) * len, ey2 = gy + Math.sin(a + spread) * len;
    const g = ctx.createLinearGradient(s.x, gy, (ex1 + ex2) / 2, (ey1 + ey2) / 2);
    g.addColorStop(0, 'rgba(210,225,255,0.16)'); g.addColorStop(1, 'rgba(210,225,255,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.moveTo(s.x - 1.5, gy); ctx.lineTo(ex1, ey1); ctx.lineTo(ex2, ey2); ctx.lineTo(s.x + 1.5, gy); ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
  const sw = Math.min(vw, WW - camX);
  ctx.drawImage(world, camX * WS, 0, sw * WS, H * WS, camX, 0, sw, H);
  if (Z < 1) { ctx.fillStyle = '#06070b'; ctx.fillRect(camX - 10, H - 1, vw + 20, H / Z); }   // earth below the map edge

  for (const c of collapses) {
    if (!vis(c.x)) continue;
    ctx.save();
    ctx.beginPath(); ctx.rect(c.x - 20, 0, c.w + 40, c.base); ctx.clip();
    ctx.translate(c.x + c.w / 2, c.base);
    ctx.rotate(c.tilt * Math.min(1, c.t / 40));
    ctx.drawImage(c.img, -c.w / 2 + rand(-1, 1), -c.h + c.sink, c.w, c.h);
    ctx.restore();
  }

  if ((frame % 90) < 45) {
    ctx.globalCompositeOperation = 'lighter';
    for (const b of buildings) {
      if (!b.alive || b.h < b.h0 - 0.5 || b.h0 < H * 0.22 || !vis(b.x)) continue;
      const top = groundAt(b.x + b.w / 2) + 2 - b.h;
      const ly = b.roof === 'antenna' ? top - 26 : b.roof === 'spire' ? top - b.h * 0.18 - 10 : b.roof === 'crown' ? top - 14 : top - 2;
      ctx.fillStyle = 'rgba(255,40,30,0.9)'; ctx.fillRect(b.x + b.w / 2 - 1, ly - 1, 2, 2);
      ctx.fillStyle = 'rgba(255,40,30,0.15)'; ctx.beginPath(); ctx.arc(b.x + b.w / 2, ly, 6, 0, TAU); ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';
  }

  for (const L of launchers) {
    if (!vis(L.x)) continue;
    const gy = groundAt(L.x);
    const tint = L.side === 'p' ? '94,200,255' : '255,91,91';
    if (!L.alive) {
      ctx.fillStyle = '#14161c';
      ctx.beginPath(); ctx.moveTo(L.x - 20, gy + 2); ctx.lineTo(L.x - 9, gy - 6); ctx.lineTo(L.x + 3, gy - 3); ctx.lineTo(L.x + 12, gy - 7); ctx.lineTo(L.x + 20, gy + 2); ctx.fill();
      continue;
    }
    const jit = L.hitT > 0 ? rand(-1, 1) : 0;
    ctx.fillStyle = '#262c3a';
    ctx.beginPath(); ctx.moveTo(L.x - 18 + jit, gy + 2); ctx.lineTo(L.x - 12 + jit, gy - 8); ctx.lineTo(L.x + 12 + jit, gy - 8); ctx.lineTo(L.x + 18 + jit, gy + 2); ctx.fill();
    ctx.save(); ctx.translate(L.x + jit, gy - 10);
    ctx.rotate(clamp(L.aim, -Math.PI + 0.35, -0.35) + Math.PI / 2);
    ctx.fillStyle = '#353e52'; ctx.fillRect(-5, -20, 10, 22);
    ctx.fillStyle = `rgba(${tint},0.8)`; ctx.fillRect(-5, -20, 10, 3);
    ctx.restore();
    ctx.fillStyle = (L.blink % 60) < 30 ? `rgb(${tint})` : `rgba(${tint},0.25)`;
    ctx.fillRect(L.x - 1.5, gy - 6, 3, 3);
    const k = L.hp / L.max;
    ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(L.x - 14, gy - 40, 28, 3);
    ctx.fillStyle = k > 0.5 ? `rgb(${tint})` : k > 0.25 ? '#ffb347' : '#ff5a36';
    ctx.fillRect(L.x - 14, gy - 40, 28 * k, 3);
  }

  for (const c of cars) {
    if (!c.alive || !vis(c.x)) continue;
    const gy = groundAt(c.x) - 2;
    ctx.fillStyle = '#1b1e26'; ctx.fillRect(c.x - 5, gy - 3, 10, 3);
    ctx.globalCompositeOperation = 'lighter';
    const fx2 = c.x + c.dir * 5, rx = c.x - c.dir * 5;
    ctx.fillStyle = 'rgba(255,245,215,0.9)'; ctx.fillRect(fx2 - 0.75, gy - 2, 1.5, 1.2);
    const beam = ctx.createLinearGradient(fx2, 0, fx2 + c.dir * 26, 0);
    beam.addColorStop(0, 'rgba(255,240,200,0.28)'); beam.addColorStop(1, 'rgba(255,240,200,0)');
    ctx.fillStyle = beam; ctx.fillRect(Math.min(fx2, fx2 + c.dir * 26), gy - 3, 26, 4);
    ctx.fillStyle = 'rgba(255,40,30,0.85)'; ctx.fillRect(rx - 0.75, gy - 2, 1.5, 1.2);
    ctx.globalCompositeOperation = 'source-over';
  }

  for (const d of debris) {
    if (!vis(d.x)) continue;
    const c = Math.cos(d.rot), s = Math.sin(d.rot);
    ctx.setTransform(c * k, s * k, -s * k, c * k, bx + d.x * k, by + d.y * k);
    ctx.globalAlpha = Math.min(1, d.life * 3);
    ctx.fillStyle = d.hot && d.life > 0.6 ? '#ff8a3d' : d.glass && d.life > 0.5 ? 'rgba(170,200,240,0.8)' : d.c;
    ctx.fillRect(-d.w / 2, -d.h / 2, d.w, d.h);
  }
  ctx.globalAlpha = 1;
  ctx.setTransform(k, 0, 0, k, bx, by);

  for (const p of parts) {
    if (p.k !== 0 || !vis(p.x)) continue;
    const age = 1 - p.life;
    ctx.globalAlpha = Math.min(1, age * 6) * p.life * p.a;
    ctx.fillStyle = p.c;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (1 + age * 2.4), 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;
  // missile airframes: a pale body with fins, drawn before the additive exhaust
  for (const m of missiles) {
    if (!vis(m.x) || m.type === 'bomblet') continue;
    const sp = Math.hypot(m.vx, m.vy) || 1, ux = m.vx / sp, uy = m.vy / sp;
    const bl = m.type === 'big' ? 13 : m.type === 'intercept' ? 6 : 9, bw = m.type === 'big' ? 3 : m.type === 'intercept' ? 1.4 : 2.2;
    ctx.strokeStyle = m.side === 'e' ? '#b9b2b4' : '#cfd5df'; ctx.lineWidth = bw; ctx.lineCap = 'butt';
    ctx.beginPath(); ctx.moveTo(m.x + ux * 2, m.y + uy * 2); ctx.lineTo(m.x - ux * bl, m.y - uy * bl); ctx.stroke();
    ctx.fillStyle = m.side === 'e' ? '#8e8789' : '#9aa3b2';
    const tx = m.x - ux * bl, ty = m.y - uy * bl, nx = -uy * bw * 1.4, ny = ux * bw * 1.4;
    ctx.beginPath(); ctx.moveTo(tx + nx, ty + ny); ctx.lineTo(tx - nx, ty - ny); ctx.lineTo(tx + ux * 3, ty + uy * 3); ctx.fill();
  }
  // jets: pointed nose, bubble canopy, intake, swept wings that change shape as the jet rolls,
  // stabilators, a raked tail fin and the engine nozzle. Flipped so they never fly upside down.
  for (const f of fighters) {
    if (!vis(f.x)) continue;
    const flip = Math.cos(f.h) < 0 && !f.falling;
    const roll = clamp(f.bank * (flip ? -1 : 1), -1, 1);   // + rolls the belly toward the viewer
    // attack jets: bigger and bulkier, drab camouflage, broad straighter wings with rocket pods
    const strike = f.kind === 'strike';
    const pal = strike
      ? (f.side === 'p' ? ['#a3ad9c', '#7a8573', '#4d5649'] : ['#aa9e90', '#806f63', '#53473e'])
      : (f.side === 'p' ? ['#c3ccd8', '#98a3b4', '#5d6879'] : ['#b5adb1', '#8e8589', '#5a5155']);
    const [light, mid, dark] = pal;
    const wTip = strike ? -2 : -6, wTip2 = strike ? -9 : -10, wSpan = strike ? 10.5 : 8.5;
    ctx.save(); ctx.translate(f.x, f.y); ctx.rotate(f.h);
    if (flip) ctx.scale(1, -1);
    ctx.scale(strike ? 1.55 : 1.3, strike ? 1.75 : 1.3);
    // far wing, seen past the fuselage when rolled away
    const farK = clamp(0.25 - roll * 0.6, 0, 0.85);
    if (farK > 0.05) { ctx.fillStyle = dark; ctx.beginPath(); ctx.moveTo(3, -0.5); ctx.lineTo(wTip - 1, -0.5 - wSpan * farK); ctx.lineTo(wTip2, -0.5 - wSpan * farK); ctx.lineTo(-5, -0.5); ctx.fill(); }
    // far stabilator
    ctx.fillStyle = dark; ctx.beginPath(); ctx.moveTo(-10, 0); ctx.lineTo(-15, -2.5 * (0.4 + farK)); ctx.lineTo(-16.5, -2.5 * (0.4 + farK)); ctx.lineTo(-14, 0); ctx.fill();
    // fuselage
    const g = ctx.createLinearGradient(0, -3, 0, 3);
    g.addColorStop(0, light); g.addColorStop(1, mid);
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(20, 0.3);
    ctx.quadraticCurveTo(13, -2.2, 5, -2.8);
    ctx.lineTo(-11, -2.4); ctx.lineTo(-15, -1.5); ctx.lineTo(-15, 1.7); ctx.lineTo(-11, 2.5); ctx.lineTo(3, 2.7);
    ctx.quadraticCurveTo(13, 2.3, 20, 0.3);
    ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.fillRect(-11, 1.2, 14, 1.3);          // belly shadow
    ctx.fillStyle = dark; ctx.fillRect(1, 0.6, 5, 1.8);                           // intake
    ctx.fillStyle = '#2a2d33'; ctx.fillRect(-17, -1.3, 2.2, 2.8);                  // nozzle
    // canopy with a glint
    ctx.fillStyle = 'rgba(110,190,240,0.85)';
    ctx.beginPath(); ctx.ellipse(8.5, -2.6, 4.2, 1.7, -0.08, Math.PI, 0); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.6)'; ctx.fillRect(7, -3.8, 2, 0.6);
    // tail fin with the side's colour band
    ctx.fillStyle = mid;
    ctx.beginPath(); ctx.moveTo(-6, -2.4); ctx.lineTo(-12.5, -10.5); ctx.lineTo(-15.5, -10.5); ctx.lineTo(-14, -2.2); ctx.fill();
    ctx.fillStyle = f.side === 'p' ? '#5ec8ff' : '#ff5b5b'; ctx.fillRect(-14.6, -9.4, 2.4, 1.6);
    // near wing: broad when the belly faces us, a thin edge when level
    const nearK = clamp(0.35 + roll * 0.65, 0.12, 1);
    ctx.fillStyle = mid;
    ctx.beginPath(); ctx.moveTo(strike ? 6 : 5, 1.2); ctx.lineTo(wTip, 1.2 + wSpan * nearK); ctx.lineTo(wTip2, 1.2 + wSpan * nearK); ctx.lineTo(-6, 1.2); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,0.18)'; ctx.fillRect(wTip2 + 1, 1.2 + wSpan * nearK - 1, 3, 1);
    // loaded rocket pods hang under the wing until the run is fired
    if (strike && f.rocketCd < 40) { ctx.fillStyle = '#2f332d'; ctx.fillRect(-7, 1.2 + wSpan * nearK * 0.45, 7, 1.5); ctx.fillRect(-6, 1.2 + wSpan * nearK * 0.8, 6, 1.4); }
    // near stabilator
    ctx.fillStyle = mid; ctx.beginPath(); ctx.moveTo(-10, 1.5); ctx.lineTo(-15, 1.5 + 3 * nearK); ctx.lineTo(-16.5, 1.5 + 3 * nearK); ctx.lineTo(-14, 1.5); ctx.fill();
    ctx.restore();
  }

  ctx.globalCompositeOperation = 'lighter';
  for (const f of fighters) {
    if (!vis(f.x) || f.falling) continue;
    const cx = Math.cos(f.h), sy = Math.sin(f.h);
    const sc = f.kind === 'strike' ? 1.55 : 1.3;          // same scale the airframe was drawn at
    const ex = f.x - cx * 17 * sc, ey = f.y - sy * 17 * sc;
    // afterburner: a short blue-white cone with shock diamonds, longer when lit
    const flame = 5 + f.ab * (12 + Math.random() * 6);
    const fg = ctx.createLinearGradient(ex, ey, ex - cx * flame, ey - sy * flame);
    fg.addColorStop(0, 'rgba(255,245,220,0.95)'); fg.addColorStop(0.35, f.ab > 0.5 ? 'rgba(150,190,255,0.7)' : 'rgba(255,170,80,0.6)'); fg.addColorStop(1, 'rgba(255,110,40,0)');
    ctx.strokeStyle = fg; ctx.lineWidth = 3.2; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(ex, ey); ctx.lineTo(ex - cx * flame, ey - sy * flame); ctx.stroke();
    if (f.ab > 0.5) { ctx.fillStyle = 'rgba(255,255,255,0.55)'; for (let k = 1; k <= 3; k++) ctx.fillRect(ex - cx * k * 4 - 0.8, ey - sy * k * 4 - 0.8, 1.6, 1.6); }
    const g = ctx.createRadialGradient(ex, ey, 0, ex, ey, 6 + f.ab * 6);
    g.addColorStop(0, 'rgba(255,210,150,0.55)'); g.addColorStop(1, 'rgba(255,120,40,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(ex, ey, 6 + f.ab * 6, 0, TAU); ctx.fill();
    // gun flash at the nose
    if (f.muzzle > 0) { ctx.fillStyle = 'rgba(255,230,160,0.9)'; ctx.beginPath(); ctx.arc(f.x + cx * 20 * sc, f.y + sy * 20 * sc, 3, 0, TAU); ctx.fill(); }
    // wingtip strobes: red/green nav lights, side colour beacon
    const wy = cx < 0 ? -1 : 1;
    if ((frame + (f.side === 'p' ? 0 : 20)) % 50 < 6) {
      ctx.fillStyle = '#ff4a3a'; ctx.fillRect(f.x - cx * 9 - sy * 10 * wy - 1, f.y - sy * 9 + cx * 10 * wy - 1, 2, 2);
      ctx.fillStyle = f.side === 'p' ? '#5ec8ff' : '#ff5b5b'; ctx.fillRect(f.x - 1, f.y - 1, 2, 2);
    }
  }
  for (const b of bullets) {
    if (!vis(b.x)) continue;
    ctx.strokeStyle = b.side === 'p' ? 'rgba(190,235,255,0.9)' : 'rgba(255,210,150,0.9)'; ctx.lineWidth = 1.3;
    ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(b.x - b.vx * 0.5, b.y - b.vy * 0.5); ctx.stroke();
  }
  for (const f of fires) {
    if (!vis(f.x)) continue;
    const k = Math.min(1, (f.life / f.max) * 2.5) * f.power * (0.8 + Math.random() * 0.25);
    const cx = f.x + f.w / 2, rr = 26 + f.w * 0.9;
    const g = ctx.createRadialGradient(cx, f.y, 0, cx, f.y, rr);
    g.addColorStop(0, `rgba(255,120,40,${0.22 * k})`); g.addColorStop(1, 'rgba(255,90,30,0)');
    ctx.fillStyle = g; ctx.fillRect(cx - rr, f.y - rr, rr * 2, rr * 2);
  }
  for (const m of missiles) {
    if (!vis(m.x)) continue;
    const sp = Math.hypot(m.vx, m.vy) || 1, ux = m.vx / sp, uy = m.vy / sp;
    const len = m.type === 'big' ? 14 : m.type === 'bomblet' || m.type === 'intercept' ? 5 : 9;
    const fl = len * (1.2 + Math.random() * 0.8);
    const g = ctx.createLinearGradient(m.x, m.y, m.x - ux * fl * 2, m.y - uy * fl * 2);
    if (m.type === 'intercept') {
      const c = m.side === 'p' ? '120,220,255' : '255,120,160';
      g.addColorStop(0, 'rgba(255,255,255,0.95)'); g.addColorStop(0.4, `rgba(${c},0.75)`); g.addColorStop(1, `rgba(${c},0)`);
    } else if (m.side === 'e') {
      g.addColorStop(0, 'rgba(255,225,215,0.95)'); g.addColorStop(0.4, 'rgba(255,70,60,0.75)'); g.addColorStop(1, 'rgba(200,20,40,0)');
    } else {
      g.addColorStop(0, 'rgba(255,240,200,0.95)'); g.addColorStop(0.4, 'rgba(255,150,50,0.7)'); g.addColorStop(1, 'rgba(255,60,20,0)');
    }
    ctx.strokeStyle = g; ctx.lineWidth = m.type === 'big' ? 5 : m.type === 'bomblet' || m.type === 'intercept' ? 2 : 3.5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(m.x, m.y); ctx.lineTo(m.x - ux * fl * 2, m.y - uy * fl * 2); ctx.stroke();
    ctx.fillStyle = m.side === 'e' ? 'rgba(255,90,80,0.2)' : 'rgba(255,190,110,0.18)';
    ctx.beginPath(); ctx.arc(m.x, m.y, len * 1.6, 0, TAU); ctx.fill();
  }
  for (const p of parts) {
    if (p.k === 0 || !vis(p.x)) continue;
    if (p.k === 1) {
      const l = p.life;
      ctx.fillStyle = `hsla(${12 + l * 38},100%,${45 + l * 35}%,${l * 0.55})`;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (0.35 + l * 0.65), 0, TAU); ctx.fill();
    } else {
      ctx.strokeStyle = `rgba(255,${180 + p.life * 70 | 0},120,${p.life})`; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.vx * 1.8, p.y - p.vy * 1.8); ctx.stroke();
    }
  }
  for (const b of blasts) {
    if (!vis(b.x)) continue;
    const rr = b.r * (1.5 - b.life * 0.6), a = b.life;
    const g = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, rr);
    g.addColorStop(0, `rgba(255,250,230,${a})`); g.addColorStop(0.3, `rgba(255,180,80,${a * 0.75})`); g.addColorStop(1, 'rgba(255,70,20,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(b.x, b.y, rr, 0, TAU); ctx.fill();
  }
  for (const r of rings) {
    if (!vis(r.x)) continue;
    ctx.strokeStyle = `rgba(255,230,200,${r.life * 0.45})`; ctx.lineWidth = 1 + r.life * 4;
    ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, TAU); ctx.stroke();
  }
  // off-screen warheads show as arrows on the screen edge
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  // jets flying above the top of the view show as small chevrons under the readout
  for (const f of fighters) {
    if (f.dead || offscreen(f.x) || toScreenY(f.y) > 70) continue;
    const sx = (f.x - camX) * Z;
    ctx.fillStyle = f.side === 'e' ? 'rgba(255,91,91,0.85)' : 'rgba(94,200,255,0.85)';
    ctx.beginPath(); ctx.moveTo(sx, 84); ctx.lineTo(sx - 5, 92); ctx.lineTo(sx + 5, 92); ctx.fill();
  }
  for (const m of missiles.concat(fighters.filter(f => !f.dead))) {
    const off = offscreen(m.x);
    if (!off || m.type === 'intercept' || off > vw * 2.5) continue;
    const left = m.x < camX, ex = left ? 56 : W - 56, ey = clamp(toScreenY(m.y), 90, H - 150);
    const a = clamp(1 - off / (vw * 2.5), 0.25, 1);
    ctx.fillStyle = m.side === 'e' ? `rgba(255,91,91,${a})` : `rgba(255,179,71,${a * 0.7})`;
    ctx.beginPath();
    if (left) { ctx.moveTo(ex - 7, ey); ctx.lineTo(ex + 3, ey - 6); ctx.lineTo(ex + 3, ey + 6); }
    else { ctx.moveTo(ex + 7, ey); ctx.lineTo(ex - 3, ey - 6); ctx.lineTo(ex - 3, ey + 6); }
    ctx.fill();
  }
  // floating score text, kept a fixed size on screen at any zoom
  ctx.globalCompositeOperation = 'source-over';
  ctx.textAlign = 'center';
  for (const p of pops) {
    if (offscreen(p.x)) continue;
    const sx = (p.x - camX) * Z, sy = toScreenY(p.y);
    const grow = 1 + Math.max(0, p.life - 0.85) * 2;           // small pop on appear
    ctx.font = `700 ${Math.round(14 * p.size * grow)}px "Zen Kaku Gothic New", "Hiragino Sans", sans-serif`;
    ctx.globalAlpha = Math.min(1, p.life * 2.2);
    ctx.lineWidth = 3.5; ctx.strokeStyle = 'rgba(6,9,16,0.85)'; ctx.strokeText(p.text, sx, sy);
    ctx.fillStyle = p.col; ctx.fillText(p.text, sx, sy);
  }
  ctx.globalAlpha = 1;
  // slow motion: a soft dark frame around the edges
  if (slow > 0) {
    const k = Math.min(1, slow / 15);
    const vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.max(W, H) * 0.75);
    vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, `rgba(0,0,0,${0.45 * k})`);
    ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  }
  if (flash > 0.01) {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = `rgba(255,150,80,${flash * 0.12})`; ctx.fillRect(0, 0, cv.width, cv.height);
  }
  ctx.globalCompositeOperation = 'source-over';
}

function drawMini() {
  const mw = mini.width, mh = mini.height, s = mw / WW, ys = mh / H;
  const c = mctx;
  c.setTransform(1, 0, 0, 1, 0, 0);
  c.clearRect(0, 0, mw, mh);
  const base = (y) => Math.min(mh - 1, (y - H * 0.45) * ys * 1.8);
  // ground
  c.fillStyle = 'rgba(120,130,150,0.25)';
  for (let x = 0; x < mw; x += 2) c.fillRect(x, base(groundAt(x / s)), 2, mh);
  for (const b of buildings) {
    if (!b.alive) continue;
    const gy = groundAt(b.x + b.w / 2);
    const top = base(gy - b.h), bot = base(gy);
    c.fillStyle = b.side === 'p' ? 'rgba(94,200,255,0.55)' : 'rgba(255,91,91,0.55)';
    c.fillRect(b.x * s, top, Math.max(1, b.w * s), Math.max(1, bot - top));
  }
  for (const L of launchers) {
    c.fillStyle = L.alive ? (L.side === 'p' ? '#5ec8ff' : '#ff5b5b') : 'rgba(255,255,255,0.25)';
    c.fillRect(L.x * s - 2 * DPR, base(groundAt(L.x)) - 3 * DPR, 4 * DPR, 3 * DPR);
  }
  for (const m of missiles) {
    c.fillStyle = m.side === 'e' ? '#ff7a6a' : '#ffd08a';
    c.fillRect(m.x * s - DPR, Math.max(0, base(m.y)) - DPR, 2 * DPR, 2 * DPR);
  }
  for (const f of fighters) {
    if (f.dead) continue;
    c.fillStyle = f.side === 'e' ? '#ff5b5b' : '#5ec8ff';
    c.fillRect(f.x * s - 1.5 * DPR, Math.max(0, base(f.y)) - 1.5 * DPR, 3 * DPR, 3 * DPR);
  }
  c.strokeStyle = 'rgba(255,255,255,0.75)'; c.lineWidth = DPR;
  c.strokeRect(camX * s + DPR / 2, DPR / 2, Math.min(mw, VW() * s) - DPR, mh - DPR);
}

/* ---------- loop & HUD ---------- */
const $ = id => document.getElementById(id);
const overEl = $('over'), overT = $('overT'), overP = $('overP');
let last = performance.now();
function hud() {
  const p = pctOf('p'), e = pctOf('e');
  $('pctP').textContent = Math.round(p * 100) + '%';
  $('pctE').textContent = Math.round(e * 100) + '%';
  $('barP').style.width = (p * 100) + '%';
  $('barE').style.width = (e * 100) + '%';
  $('lnP').textContent = `発射台 ${aliveLaunchers('p').length}/3`;
  $('lnE').textContent = `発射台 ${aliveLaunchers('e').length}/3`;
  $('sDown').textContent = game.down;
  const jb = $('jetBtn');
  const nj = jetCount('p');
  const nf = fighters.filter(f => f.side === 'p' && !f.dead && f.kind === 'fighter').length, ns = nj - nf;
  jb.firstChild.textContent = nf ? `戦闘機発進 ${nf}機` : '戦闘機発進';
  const sb = $('strikeBtn');
  sb.firstChild.textContent = ns ? `攻撃機発進 ${ns}機` : '攻撃機発進';
  jb.classList.toggle('wait', nj >= MAX_JETS); sb.classList.toggle('wait', nj >= MAX_JETS);
}
function loop(now) {
  const dt = Math.min(2.5, (now - last) / 16.667); last = now;
  // slow motion runs the world at 30% speed for a moment; the countdown uses real time
  const scale = slow > 0 ? 0.3 : 1;
  if (slow > 0) slow -= dt;
  update(dt * scale); render();
  if (frame % 3 === 0) drawMini();
  if (frame % 10 === 0) hud();
  requestAnimationFrame(loop);
}

function wakeAudio() { if (soundOn) initAudio(); }

let holding = false, holdX = 0, holdY = 0, lastHoldShot = 0, holdId = null, keysPan = 0;
// one finger fires, two fingers pinch to zoom and drag to pan
const touches = new Map();
let pinch = null;
cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  wakeAudio();
  touches.set(e.pointerId, { x: e.clientX, y: e.clientY });
  try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  if (touches.size === 2) {
    holding = false; holdId = null;
    const [a, b] = [...touches.values()];
    const mx = (a.x + b.x) / 2;
    pinch = { d: Math.hypot(a.x - b.x, a.y - b.y) || 1, z: Z, wx: camX + mx / Z };
    return;
  }
  if (touches.size > 2) return;
  holding = true; holdId = e.pointerId; holdX = e.clientX; holdY = e.clientY; lastHoldShot = frame;
  const [wx, wy] = toWorld(holdX, holdY);
  fire(wx, wy);
});
cv.addEventListener('pointermove', e => {
  if (touches.has(e.pointerId)) touches.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pinch && touches.size >= 2) {
    const [a, b] = [...touches.values()];
    const mx = (a.x + b.x) / 2;
    Z = clamp(pinch.z * Math.hypot(a.x - b.x, a.y - b.y) / pinch.d, ZMIN, 1.6);
    setCam(pinch.wx - mx / Z);
    return;
  }
  if (holding && e.pointerId === holdId) { holdX = e.clientX; holdY = e.clientY; }
});
const stop = e => {
  touches.delete(e.pointerId);
  if (touches.size < 2) pinch = null;
  if (e.pointerId === holdId) { holding = false; holdId = null; }
};
cv.addEventListener('pointerup', stop);
cv.addEventListener('pointercancel', stop);
cv.addEventListener('wheel', e => {
  e.preventDefault();
  if (e.ctrlKey || e.metaKey) setZoom(Z * Math.exp(-e.deltaY * 0.01), e.clientX);   // trackpad pinch arrives as ctrl+wheel
  else setCam(camX + (Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY) / Z);
}, { passive: false });
let zoomBack = null;
function zoomFit() {
  if (Z > ZMIN + 0.01) { zoomBack = { z: Z, x: camX }; Z = ZMIN; setCam(0); }
  else if (zoomBack) { Z = zoomBack.z; setCam(zoomBack.x); zoomBack = null; }
  else { setZoom(0.6); }
}
$('zoomIn').addEventListener('click', () => setZoom(Z * 1.35));
$('zoomOut').addEventListener('click', () => setZoom(Z / 1.35));
$('zoomFit').addEventListener('click', zoomFit);

// minimap: tap or drag to move the view
let miniDrag = false;
const miniJump = e => { const r = mini.getBoundingClientRect(); setCam((e.clientX - r.left) / r.width * WW - VW() / 2); };
mini.addEventListener('pointerdown', e => { miniDrag = true; try { mini.setPointerCapture(e.pointerId); } catch (_) {} miniJump(e); });
mini.addEventListener('pointermove', e => { if (miniDrag) miniJump(e); });
mini.addEventListener('pointerup', () => { miniDrag = false; });
mini.addEventListener('pointercancel', () => { miniDrag = false; });
for (const [id, dir] of [['panL', -1], ['panR', 1]]) {
  const b = $(id);
  b.addEventListener('pointerdown', e => { e.preventDefault(); camV = dir * 16; try { b.setPointerCapture(e.pointerId); } catch (_) {} });
  const end = () => { camV = 0; };
  b.addEventListener('pointerup', end); b.addEventListener('pointercancel', end); b.addEventListener('lostpointercapture', end);
}

const wBtns = [...document.querySelectorAll('[data-w]')];
function setWeapon(w) { weapon = w; wBtns.forEach(b => b.setAttribute('aria-pressed', b.dataset.w === w)); }
wBtns.forEach(b => b.addEventListener('click', () => { wakeAudio(); setWeapon(b.dataset.w); }));
const autoBtn = $('autoBtn'), aaBtn = $('aaBtn'), soundBtn = $('soundBtn'), diffBtn = $('diffBtn');
function toggleAuto() { wakeAudio(); auto = !auto; autoBtn.setAttribute('aria-pressed', auto); }
function toggleAA() { wakeAudio(); autoAA = !autoAA; aaBtn.setAttribute('aria-pressed', autoAA); }
function toggleSound() {
  soundOn = !soundOn;
  if (soundOn) initAudio();
  else if (ac) ac.suspend();
  soundBtn.setAttribute('aria-pressed', soundOn);
  soundBtn.firstChild.textContent = soundOn ? '音 オン' : '音 オフ';
}
function cycleDiff() {
  wakeAudio();
  const order = ['easy', 'normal', 'hard'];
  game.diff = order[(order.indexOf(game.diff) + 1) % 3];
  const D = DIFF[game.diff];
  game.rate = clamp(game.rate, D.min, D.rate);
  diffBtn.textContent = `難易度 ${D.label}`;
}
function restart() { wakeAudio(); genWorld(); setCam(WW * 0.4 - VW() * 0.6); hud(); }
autoBtn.addEventListener('click', toggleAuto);
$('jetBtn').addEventListener('click', scramble);
$('strikeBtn').addEventListener('click', scrambleStrike);
aaBtn.addEventListener('click', toggleAA);
soundBtn.addEventListener('click', toggleSound);
diffBtn.addEventListener('click', cycleDiff);
$('resetBtn').addEventListener('click', restart);
$('againBtn').addEventListener('click', restart);
addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === 'ArrowLeft') { keysPan = -1; e.preventDefault(); return; }
  if (e.key === 'ArrowRight') { keysPan = 1; e.preventDefault(); return; }
  const k = e.key.toLowerCase();
  const map = { '1': 'std', '2': 'cluster', '3': 'salvo', '4': 'big', '5': 'intercept', '6': 'straight', '7': 'homing', '8': 'split' };
  if (k !== 's') wakeAudio();
  if (map[k]) setWeapon(map[k]);
  else if (k === 'a') toggleAuto();
  else if (k === 'd') toggleAA();
  else if (k === 'f') scramble();
  else if (k === 'g') scrambleStrike();
  else if (k === 's') toggleSound();
  else if (k === 'r') restart();
  else if (k === 'z') zoomFit();
  else if (k === '-' || k === '_') setZoom(Z / 1.35);
  else if (k === '=' || k === '+') setZoom(Z * 1.35);
});
addEventListener('keyup', e => { if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') keysPan = 0; });
addEventListener('blur', () => { keysPan = 0; camV = 0; });
addEventListener('resize', resize);

resize();
hud();
requestAnimationFrame(loop);
})();
</script>

</body></html>
