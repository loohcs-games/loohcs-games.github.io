<style>
/* Layout: full-bleed night battlefield several screens wide, ally city left / enemy city right; force readout up top, console with minimap docked at the bottom. Single dark look by choice. */
:root {
  --bg: #060910;
  --panel: rgba(10, 14, 24, 0.84);
  --line: rgba(150, 170, 210, 0.18);
  --fg: #dfe6f2;
  --muted: #8591aa;
  --accent: #ffb347;
  --hot: #ff5a36;
  --ally: #5ec8ff;
  --enemy: #ff5b5b;
  --font-ui: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  --font-num: "Oxanium", "SF Mono", ui-monospace, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-ui); overflow: hidden; }
#cv { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }

.top {
  position: fixed; top: 0; left: 0; right: 0;
  padding-top: calc(env(safe-area-inset-top, 0px) + 12px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: start; gap: 10px 18px;
  pointer-events: none;
}
.force { display: grid; gap: 4px; min-width: 0; }
.force.e { text-align: right; justify-items: end; }
.force .name { font-size: 12px; font-weight: 700; letter-spacing: 0.1em; display: flex; gap: 8px; align-items: baseline; }
.force.p .name { color: var(--ally); }
.force.e .name { color: var(--enemy); flex-direction: row-reverse; }
.force .name b { font: 700 18px/1 var(--font-num); font-variant-numeric: tabular-nums; color: var(--fg); }
.bar { width: min(260px, 100%); height: 6px; border-radius: 3px; background: rgba(255,255,255,0.08); overflow: hidden; }
.bar i { display: block; height: 100%; width: 100%; border-radius: 3px; transition: width .3s; }
.force.p .bar i { background: var(--ally); }
.force.e .bar i { background: var(--enemy); margin-left: auto; }
.force small { font-size: 11px; color: var(--muted); }
.mid { text-align: center; display: grid; gap: 2px; }
.mid h1 { margin: 0; font-size: 13px; font-weight: 700; letter-spacing: 0.04em; text-wrap: balance; }
.mid p { margin: 0; font-size: 11px; color: var(--muted); max-width: 32ch; }
.mid .down { font: 700 13px var(--font-num); color: var(--accent); font-variant-numeric: tabular-nums; }

.console {
  position: fixed; left: 0; right: 0; bottom: 0;
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; justify-content: center; pointer-events: none;
}
.deck {
  pointer-events: auto;
  display: grid; gap: 8px; width: min(980px, 100%);
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
  padding: 8px 10px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
}
#mini { display: block; width: 100%; height: 38px; border-radius: 6px; cursor: pointer; touch-action: none; background: rgba(0,0,0,0.35); }
.row { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px 14px; }
.group { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; justify-content: center; }
.label { font-size: 10px; letter-spacing: 0.14em; color: var(--muted); margin-right: 4px; }
button {
  font: 700 13px/1 var(--font-ui); color: var(--fg);
  background: transparent; border: 1px solid var(--line); border-radius: 8px;
  padding: 8px 11px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
  transition: background .15s, border-color .15s, color .15s;
}
button:hover { background: rgba(255,255,255,0.06); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button kbd { font: 500 10px var(--font-num); color: var(--muted); }
button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #1a1006; }
button[aria-pressed="true"] kbd { color: #5a3a10; }
#autoBtn[aria-pressed="true"] { background: var(--hot); border-color: var(--hot); color: #fff; }
#autoBtn[aria-pressed="true"] kbd { color: #ffd9cf; }
#aaBtn[aria-pressed="true"] { background: var(--ally); border-color: var(--ally); color: #04131d; }
#aaBtn[aria-pressed="true"] kbd { color: #0d3a52; }
#soundBtn[aria-pressed="true"] { background: rgba(255,179,71,0.14); border-color: var(--accent); color: var(--accent); }
#soundBtn[aria-pressed="true"] kbd { color: var(--accent); }
button.wait { opacity: 0.5; }
.sep { width: 1px; align-self: stretch; background: var(--line); }

.pan {
  position: fixed; top: 42%; z-index: 2;
  width: 40px; height: 64px; justify-content: center; padding: 0;
  background: var(--panel); font-size: 18px; touch-action: none;
}
#panL { left: max(10px, env(safe-area-inset-left, 0px)); }
#panR { right: max(10px, env(safe-area-inset-right, 0px)); }

.over {
  position: fixed; inset: 0; display: grid; place-items: center; z-index: 3;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: rgba(4, 6, 12, 0.55);
}
.over .card {
  background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
  padding: 22px 26px; display: grid; gap: 10px; justify-items: center; text-align: center; max-width: 360px;
}
.over h2 { margin: 0; font: 700 40px/1 var(--font-ui); letter-spacing: 0.15em; }
.over h2.win { color: var(--ally); }
.over h2.lose { color: var(--enemy); }
.over p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.6; }
.over button { margin-top: 6px; background: var(--accent); border-color: var(--accent); color: #1a1006; font-size: 14px; padding: 10px 18px; }

@media (max-width: 640px) {
  .top { grid-template-columns: 1fr 1fr; }
  .mid { grid-column: 1 / -1; grid-row: 2; }
  .mid p { display: none; }
  .sep { display: none; }
  button { padding: 8px 9px; font-size: 12px; }
  button kbd { display: none; }
  .pan { width: 34px; height: 54px; }
}
</style>

<script>
(() => {
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const mini = document.getElementById('mini'), mctx = mini.getContext('2d');
const sky = document.createElement('canvas'), sctx = sky.getContext('2d');     // screen-sized: gradient, stars, moon
const far = document.createElement('canvas'), fctx = far.getContext('2d');     // world-wide distant skyline (parallax)
const world = document.createElement('canvas'), wctx = world.getContext('2d'); // world-wide buildings + ground
const TAU = Math.PI * 2, COL = 3;
const GAP0 = 0.45, GAP1 = 0.55;            // no-man's land between the two cities
const PARALLAX = 0.7;
const CAP = 6500;                          // particle budget
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const rand = (a = 1, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const pick = arr => arr[(Math.random() * arr.length) | 0];

let W = 0, H = 0, DPR = 1, WW = 0, WS = 1, camX = 0, camV = 0;
let Z = 1, ZMIN = 0.3, PIV = 0;            // zoom, smallest zoom (whole map), screen row that stays fixed while zooming
let searchlights = [];
let ground = [], ground0 = [], buildings = [], launchers = [], lamps = [], cars = [];
let missiles = [], parts = [], debris = [], blasts = [], rings = [], queue = [], fires = [], collapses = [];
let pops = [];                              // floating score text
let slow = 0, combo = { n: 0, t: -999 };    // slow-motion frames left; shoot-down chain
let shake = 0, flash = 0, frame = 0;
let dirtyA = Infinity, dirtyB = -Infinity;
let weapon = 'std', auto = false, autoAA = false;

const DIFF = {
  // the enemy fires more often, aims tighter, intercepts more and sends bigger volleys than before
  easy:   { label: 'やさしい', rate: 96, min: 52, intercept: 0.0056, acc: 63, big: 0.05, extra: 0.25 },
  normal: { label: 'ふつう',   rate: 60, min: 24, intercept: 0.0126, acc: 38, big: 0.1,  extra: 0.45 },
  hard:   { label: '激戦',     rate: 34, min: 11, intercept: 0.025,  acc: 21, big: 0.16, extra: 0.7 },
};
const game = { diff: 'normal', over: false, rate: 75, next: 200, down: 0 };

function hash(a, b, c) {
  let h = Math.imul(a | 0, 374761393) ^ Math.imul(b | 0, 668265263) ^ Math.imul(c | 0, 1274126177);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
const groundAt = x => ground[clamp((x / COL) | 0, 0, ground.length - 1)];
const sideOf = x => x < WW / 2 ? 'p' : 'e';
const markDirty = (a, b) => { dirtyA = Math.min(dirtyA, a); dirtyB = Math.max(dirtyB, b); };
const markAll = () => markDirty(-100, WW + 100);
const VW = () => W / Z;                    // visible world width
const setCam = x => { camX = clamp(x, 0, Math.max(0, WW - VW())); };
// how far off-screen a point is, 0 when visible
const offscreen = x => Math.max(0, camX - x, x - (camX + VW()));
const toWorld = (sx, sy) => [camX + sx / Z, PIV + (sy - PIV) / Z];
const toScreenY = wy => PIV + (wy - PIV) * Z;
// zoom around a screen point so whatever is under it stays put
function setZoom(z, sx = W / 2) {
  const wx = camX + sx / Z;
  Z = clamp(z, ZMIN, 1.6);
  setCam(wx - sx / Z);
}

/* ---------- world generation ---------- */
function resize() {
  const r = cv.getBoundingClientRect();
  const nw = Math.round(r.width), nh = Math.round(r.height);
  DPR = Math.min(2, window.devicePixelRatio || 1);
  const regen = nw !== W || Math.abs(nh - H) > 120;
  W = nw; H = nh;
  PIV = H * 0.86;
  cv.width = W * DPR; cv.height = H * DPR;
  sky.width = W * DPR; sky.height = H * DPR;
  if (regen || !ground.length) {
    WW = Math.round(Math.max(2400, W * 2.8));
    // keep the two world-wide layers inside mobile canvas memory limits
    WS = Math.min(DPR, Math.sqrt(9e6 / (WW * H)));
    for (const c of [far, world]) { c.width = Math.ceil(WW * WS); c.height = Math.ceil(H * WS); }
    ZMIN = W / WW;
    genWorld();
    Z = Math.max(ZMIN, W < 700 ? 0.5 : 0.6);
    setCam(WW * 0.4 - VW() * 0.6);
  }
  ZMIN = W / WW; Z = clamp(Z, ZMIN, 1.6); setCam(camX);
  const mr = mini.getBoundingClientRect();
  mini.width = Math.max(1, mr.width * DPR); mini.height = Math.max(1, mr.height * DPR);
  drawSky(); drawFar();
  markAll();
}

const KINDS = {
  // armor = share of the blast's reach a building actually loses (lower is sturdier)
  tower:     { fh: 5, ww: 3, gx: 2, hue: [205, 225], sat: [12, 22], l: [11, 17], lit: [0.35, 0.7], cool: 0.7, armor: 0.13 },
  office:    { fh: 6, ww: 4, gx: 1, hue: [200, 220], sat: [10, 20], l: [10, 15], lit: [0.3, 0.65], cool: 0.8, armor: 0.17 },
  apartment: { fh: 7, ww: 3, gx: 3, hue: [20, 40],   sat: [6, 14],  l: [11, 16], lit: [0.35, 0.6], cool: 0.15, armor: 0.21 },
  shop:      { fh: 8, ww: 5, gx: 3, hue: [15, 45],   sat: [8, 16],  l: [12, 17], lit: [0.4, 0.7], cool: 0.25, armor: 0.29 },
};

function genWorld() {
  const n = Math.ceil(WW / COL) + 1;
  const base = H * 0.82;
  const ph = [rand(TAU), rand(TAU), rand(TAU)];
  ground = Array.from({ length: n }, (_, i) => {
    const x = i * COL;
    const gapHill = Math.max(0, 1 - Math.abs(x / WW - 0.5) / 0.06);   // low ridge in the middle
    return base + Math.sin(x / 420 + ph[0]) * H * 0.01 + Math.sin(x / 150 + ph[1]) * H * 0.003 + Math.sin(x / 900 + ph[2]) * H * 0.012 - gapHill * H * 0.03;
  });
  ground0 = ground.slice();
  launchers = [[0.03, 'p'], [0.2, 'p'], [0.39, 'p'], [0.61, 'e'], [0.8, 'e'], [0.97, 'e']].map(([f, side]) => ({
    x: WW * f, side, aim: -Math.PI / 2, blink: rand(60), hp: side === 'e' ? 320 : 200, max: side === 'e' ? 320 : 200, alive: true, hitT: 0
  }));
  buildings = [];
  let x = 2, id = 1;
  while (x < WW - 8) {
    if (x > WW * GAP0 - 10 && x < WW * GAP1) { x = WW * GAP1; continue; }
    const side = sideOf(x);
    // each city has a downtown core and a quieter suburb toward the edges
    const centers = side === 'p' ? [0.12, 0.3] : [0.7, 0.88];
    const c = Math.min(1, Math.min(...centers.map(cc => Math.abs(x / WW - cc))) / 0.1);
    const downtown = Math.max(0, 1 - c * 1.1);
    let kind, w, h;
    const r = Math.random();
    if (r < downtown * 0.6) { kind = Math.random() < 0.5 ? 'tower' : 'office'; w = rand(24, 48); h = rand(0.18, 0.48) * H * (0.6 + downtown * 0.5); }
    else if (r < 0.78) { kind = Math.random() < 0.6 ? 'apartment' : 'office'; w = rand(20, 42); h = rand(48, H * 0.22); }
    else { kind = 'shop'; w = rand(16, 32); h = rand(20, 44); }
    h = Math.min(h, H * 0.52);
    if (x + w > WW * GAP0 && side === 'p') { x = WW * GAP1; continue; }
    if (!launchers.some(L => Math.abs(x + w / 2 - L.x) < 34)) {
      const K = KINDS[kind];
      buildings.push({
        id: id++, x, w, h, h0: h, alive: true, kind, side,
        hue: rand(...K.hue), sat: rand(...K.sat), light: rand(...K.l),
        lit: rand(...K.lit), cool: Math.random() < K.cool,
        roof: pickRoof(kind, h, w), rub: null, scorch: 0
      });
    }
    x += w + (kind === 'shop' ? rand(1, 4) : rand(2, 8));
  }
  lamps = [];
  for (let lx = 20; lx < WW; lx += rand(48, 70)) lamps.push({ x: lx, alive: true });
  cars = [];
  for (let i = 0; i < WW / 55; i++) cars.push(newCar(rand(WW)));
  // searchlights sweep the sky over both cities
  searchlights = [0.08, 0.17, 0.27, 0.36, 0.64, 0.73, 0.83, 0.92].map(f => ({
    x: WW * f + rand(-30, 30), ph: rand(TAU), sp: rand(0.006, 0.012), amp: rand(0.25, 0.5), alive: true, side: sideOf(WW * f)
  }));
  missiles = []; parts = []; debris = []; blasts = []; rings = []; queue = []; fires = []; collapses = [];
  pops = []; slow = 0; combo = { n: 0, t: -999 };
  fighters = []; bullets = []; enemyJetT = 60 * 40; scrambleCd = 0;
  game.over = false; game.rate = DIFF[game.diff].rate; game.next = 200; game.down = 0;
  overEl.hidden = true;
  markAll();
}
function pickRoof(kind, h, w) {
  const r = Math.random();
  if (kind === 'tower') return r < 0.35 ? 'spire' : r < 0.7 ? 'crown' : 'antenna';
  if (kind === 'office') return r < 0.4 ? 'antenna' : r < 0.7 ? 'units' : 'flat';
  if (kind === 'apartment') return r < 0.5 ? 'tank' : 'units';
  return w < 26 && r < 0.5 ? 'pitched' : 'sign';
}
function newCar(x) {
  const dir = Math.random() < 0.5 ? 1 : -1;
  return { x: x ?? (dir > 0 ? -20 : WW + 20), dir, v: rand(0.6, 1.4), alive: true };
}

function drawSky() {
  const c = sctx;
  c.setTransform(DPR, 0, 0, DPR, 0, 0);
  const g = c.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#02040a');
  g.addColorStop(0.5, '#0a1120');
  g.addColorStop(0.78, '#1d1c2e');
  g.addColorStop(1, '#2b2030');
  c.fillStyle = g; c.fillRect(0, 0, W, H);
  const starN = (W * H) / 3800;
  for (let i = 0; i < starN; i++) {
    const sx = hash(i, 7, 1) * W, sy = hash(i, 3, 2) * H * 0.6;
    c.fillStyle = `rgba(220,230,255,${(0.1 + hash(i, 1, 9) * 0.55) * (1 - sy / (H * 0.7))})`;
    const s = hash(i, 5, 5) < 0.06 ? 1.6 : 1;
    c.fillRect(sx, sy, s, s);
  }
  const mx = W * 0.7, my = H * 0.15;
  const mg = c.createRadialGradient(mx, my, 10, mx, my, 140);
  mg.addColorStop(0, 'rgba(200,215,255,0.16)'); mg.addColorStop(1, 'rgba(200,215,255,0)');
  c.fillStyle = mg; c.fillRect(mx - 140, my - 140, 280, 280);
  c.fillStyle = '#dde4f2'; c.beginPath(); c.arc(mx, my, 19, 0, TAU); c.fill();
  c.fillStyle = 'rgba(150,160,185,0.35)';
  [[-6, -4, 4], [5, 6, 3], [7, -7, 2], [-3, 8, 2.5]].forEach(([dx, dy, r]) => { c.beginPath(); c.arc(mx + dx, my + dy, r, 0, TAU); c.fill(); });
  // thin cloud banks, lit faintly from the city below
  for (let i = 0; i < 9; i++) {
    const cx = hash(i, 41, 1) * W * 1.2 - W * 0.1, cy = H * (0.1 + hash(i, 41, 2) * 0.32);
    const rx = 120 + hash(i, 41, 3) * 260, ry = 10 + hash(i, 41, 4) * 18;
    c.save(); c.translate(cx, cy); c.scale(1, ry / rx);
    const cg = c.createRadialGradient(0, 0, 0, 0, 0, rx);
    cg.addColorStop(0, 'rgba(28,30,46,0.55)'); cg.addColorStop(0.6, 'rgba(24,26,40,0.3)'); cg.addColorStop(1, 'rgba(24,26,40,0)');
    c.fillStyle = cg; c.beginPath(); c.arc(0, 0, rx, 0, TAU); c.fill();
    const lg = c.createRadialGradient(0, rx * 0.5, 0, 0, rx * 0.5, rx * 0.8);
    lg.addColorStop(0, 'rgba(255,150,100,0.06)'); lg.addColorStop(1, 'rgba(255,150,100,0)');
    c.fillStyle = lg; c.beginPath(); c.arc(0, 0, rx, 0, TAU); c.fill();
    c.restore();
  }
}
function drawFar() {
  const c = fctx;
  c.setTransform(WS, 0, 0, WS, 0, 0);
  c.clearRect(0, 0, WW, H);
  // far layer scrolls slower, so map its x back to the world's halves
  const fw = W + (WW - W) * PARALLAX;
  const g0 = fw * GAP0, g1 = fw * GAP1;
  for (const [x0, x1, col] of [[0, g0, '90,170,255'], [g1, WW, '255,110,80']]) {
    const hz = c.createLinearGradient(0, H * 0.5, 0, H * 0.84);
    hz.addColorStop(0, `rgba(${col},0)`); hz.addColorStop(1, `rgba(${col},0.12)`);
    c.fillStyle = hz; c.fillRect(x0, H * 0.5, x1 - x0, H * 0.35);
  }
  skyline(c, WW, g0, g1, H * 0.79, H * 0.2, '#111726', 0.10, 11);
  skyline(c, WW, g0, g1, H * 0.81, H * 0.13, '#151b2b', 0.18, 23);
  const fog = c.createLinearGradient(0, H * 0.7, 0, H * 0.84);
  fog.addColorStop(0, 'rgba(40,36,52,0)'); fog.addColorStop(1, 'rgba(40,36,52,0.55)');
  c.fillStyle = fog; c.fillRect(0, H * 0.7, WW, H * 0.15);
}
function skyline(c, fw, g0, g1, baseY, maxH, color, winA, seed) {
  let x = 0, i = 0;
  while (x < fw) {
    const w = 10 + hash(i, seed, 1) * 30;
    if (x > g0 && x < g1) { x += w; i++; continue; }
    const h = 12 + Math.pow(hash(i, seed, 2), 1.5) * maxH * (0.4 + 0.6 * Math.abs(Math.sin(x / 260 + seed)));
    c.fillStyle = color; c.fillRect(x, baseY - h, w, h + 40);
    if (hash(i, seed, 3) < 0.25) c.fillRect(x + w / 2 - 0.5, baseY - h - 10, 1, 10);
    for (let yy = baseY - h + 4; yy < baseY; yy += 4) for (let xx = x + 2; xx < x + w - 2; xx += 3) {
      if (hash(xx | 0, yy | 0, seed) < 0.22) { c.fillStyle = `rgba(255,205,140,${winA})`; c.fillRect(xx, yy, 1.4, 1.4); }
    }
    x += w + hash(i, seed, 4) * 3; i++;
  }
}

/* ---------- building painter (shared by the world layer and collapse sprites) ---------- */
function paintBuilding(c, b, ox, base) {
  const K = KINDS[b.kind];
  const x = ox, top = base - b.h, w = b.w;
  const body = c.createLinearGradient(x, 0, x + w, 0);
  const lit = b.side === 'p' ? [-3, 0, 5] : [5, 0, -3];
  body.addColorStop(0, `hsl(${b.hue},${b.sat}%,${b.light + lit[0]}%)`);
  body.addColorStop(0.5, `hsl(${b.hue},${b.sat}%,${b.light + lit[1]}%)`);
  body.addColorStop(1, `hsl(${b.hue},${b.sat}%,${b.light + lit[2]}%)`);
  c.fillStyle = body; c.fillRect(x, top, w, b.h);
  if (b.kind === 'tower' || b.kind === 'office') {
    c.fillStyle = 'rgba(0,0,0,0.18)';
    for (let px = x + 6; px < x + w - 3; px += 9) c.fillRect(px, top, 1, b.h);
  }
  const cols = Math.max(1, Math.floor((w - 4) / (K.ww + K.gx)));
  const padX = (w - cols * (K.ww + K.gx) + K.gx) / 2;
  const groundFloor = b.kind === 'tower' ? 10 : 9;
  if (b.h > groundFloor + 4) {
    const shopLit = hash(b.id, 77, 1) < 0.75 && b.lit > 0.12;
    c.fillStyle = shopLit ? (b.cool ? 'rgba(190,225,255,0.55)' : 'rgba(255,205,140,0.6)') : 'rgba(30,34,46,1)';
    c.fillRect(x + 2, base - groundFloor + 2, w - 4, groundFloor - 4);
    c.fillStyle = 'rgba(0,0,0,0.5)'; c.fillRect(x + 1, base - groundFloor, w - 2, 1.5);
  }
  for (let r = 0; ; r++) {
    const wy = base - groundFloor - (r + 1) * K.fh;
    if (wy < top + 3) break;
    const floorDark = hash(b.id, r, 500) < 0.12;
    for (let k = 0; k < cols; k++) {
      const wx = x + padX + k * (K.ww + K.gx);
      const v = hash(b.id, r, k);
      if (!floorDark && v < b.lit) {
        const t = hash(k, b.id, r + 31);
        if (b.cool) c.fillStyle = t < 0.1 ? 'rgba(255,215,150,0.8)' : `rgba(${185 + t * 40 | 0},${215 + t * 30 | 0},255,${0.45 + t * 0.4})`;
        else c.fillStyle = t < 0.08 ? 'rgba(140,180,255,0.6)' : `rgba(255,${180 + t * 50 | 0},${100 + t * 40 | 0},${0.45 + t * 0.45})`;
      } else c.fillStyle = 'rgba(110,130,170,0.07)';
      c.fillRect(wx, wy, K.ww, K.fh - 2.5);
    }
    if (b.kind === 'apartment') { c.fillStyle = 'rgba(0,0,0,0.28)'; c.fillRect(x + 1, wy + K.fh - 2.5, w - 2, 1); }
  }
  const intact = b.h >= b.h0 - 0.5;
  if (intact) {
    c.fillStyle = `hsl(${b.hue},${b.sat}%,${b.light - 4}%)`;
    c.fillRect(x - 1, top - 2, w + 2, 2);
    const cx = x + w / 2;
    switch (b.roof) {
      case 'spire': c.beginPath(); c.moveTo(cx - w * 0.22, top - 2); c.lineTo(cx, top - b.h * 0.18 - 10); c.lineTo(cx + w * 0.22, top - 2); c.fill(); break;
      case 'crown': c.fillRect(x + w * 0.12, top - 8, w * 0.76, 6); c.fillRect(x + w * 0.28, top - 14, w * 0.44, 6);
        c.fillStyle = 'rgba(190,225,255,0.35)'; c.fillRect(x + w * 0.14, top - 7, w * 0.72, 1); break;
      case 'antenna': c.fillRect(cx - 0.75, top - 26, 1.5, 24); c.fillRect(cx - 4, top - 6, 8, 4); break;
      case 'units': for (let i = 0; i < 3; i++) if (w > 20 || i < 2) c.fillRect(x + 3 + i * (w / 3.2), top - 5, w / 5, 3); break;
      case 'tank': c.fillRect(x + w * 0.62, top - 10, 7, 6); c.fillRect(x + w * 0.62 + 1, top - 4, 1, 2); c.fillRect(x + w * 0.62 + 5, top - 4, 1, 2); break;
      case 'pitched': c.beginPath(); c.moveTo(x - 2, top); c.lineTo(cx, top - w * 0.35); c.lineTo(x + w + 2, top); c.fill(); break;
      case 'sign': {
        const hue = [350, 190, 45, 290][b.id % 4];
        c.fillStyle = `hsla(${hue},90%,62%,0.85)`; c.fillRect(x + 3, top - 8, w - 6, 5);
        c.fillStyle = 'rgba(0,0,0,0.5)'; for (let i = x + 5; i < x + w - 5; i += 3) c.fillRect(i, top - 7, 1, 3);
      }
    }
  } else {
    c.fillStyle = '#07080c';
    for (let i = 0; i < w; i += 2) c.fillRect(x + i, top, 2, 1 + hash(b.id, i, b.h | 0) * 7);
    c.fillStyle = 'rgba(255,120,40,0.35)';
    for (let i = 0; i < w; i += 5) if (hash(b.id, i, 7) < 0.3) c.fillRect(x + i, top + 2, 2, 2);
  }
  if (b.scorch > 0) { c.fillStyle = `rgba(0,0,0,${Math.min(0.55, b.scorch)})`; c.fillRect(x, top, w, b.h); }
}

// repaints only the strip of the world that changed since the last frame
function drawWorld() {
  const a = Math.max(0, Math.floor(dirtyA - 40)), b = Math.min(WW, Math.ceil(dirtyB + 40));
  dirtyA = Infinity; dirtyB = -Infinity;
  if (b <= a) return;
  const c = wctx;
  c.setTransform(WS, 0, 0, WS, 0, 0);
  c.save();
  c.beginPath(); c.rect(a, 0, b - a, H); c.clip();
  c.clearRect(a, 0, b - a, H);
  for (const bd of buildings) {
    if (bd.x + bd.w + 10 < a || bd.x - 10 > b) continue;
    const base = groundAt(bd.x + bd.w / 2) + 2;
    if (bd.alive) paintBuilding(c, bd, bd.x, base);
    else if (bd.rub) {
      c.fillStyle = '#171a22';
      c.beginPath(); c.moveTo(bd.x - 5, base);
      bd.rub.forEach((hh, i) => c.lineTo(bd.x - 5 + (i / (bd.rub.length - 1)) * (bd.w + 10), base - hh));
      c.lineTo(bd.x + bd.w + 5, base); c.fill();
      c.fillStyle = 'rgba(255,255,255,0.05)';
      bd.rub.forEach((hh, i) => { if (i % 2) c.fillRect(bd.x - 5 + (i / (bd.rub.length - 1)) * (bd.w + 10), base - hh, 2, 1); });
    }
  }
  const i0 = Math.max(0, ((a / COL) | 0) - 1), i1 = Math.min(ground.length - 1, Math.ceil(b / COL) + 1);
  const g = c.createLinearGradient(0, H * 0.78, 0, H);
  g.addColorStop(0, '#12161f'); g.addColorStop(1, '#06070b');
  c.fillStyle = g;
  c.beginPath(); c.moveTo(i0 * COL, H);
  for (let i = i0; i <= i1; i++) c.lineTo(i * COL, ground[i]);
  c.lineTo(i1 * COL, H); c.closePath(); c.fill();
  for (let i = i0; i < i1; i++) {
    const x = i * COL, gy = ground[i];
    const damaged = gy - ground0[i] > 3;
    const field = x > WW * GAP0 && x < WW * GAP1;
    c.fillStyle = damaged ? '#0c0d11' : field ? '#1a1d22' : '#22262f';
    c.fillRect(x, gy, COL, 5);
    if (!damaged && !field && i % 8 < 3) { c.fillStyle = 'rgba(230,220,180,0.35)'; c.fillRect(x, gy + 2.2, COL, 0.8); }
    if (damaged) { c.fillStyle = 'rgba(255,110,40,0.10)'; c.fillRect(x, gy, COL, 2); }
  }
  for (let x = WW * GAP0 + 10; x < WW * GAP1 - 6; x += 14) {
    if (x < a - 20 || x > b + 20) continue;
    const gy = groundAt(x);
    c.fillStyle = '#2a2f3a'; c.fillRect(x, gy - 7, 1.2, 7);
    c.fillStyle = 'rgba(120,130,150,0.25)'; c.fillRect(x, gy - 6, 14, 0.6); c.fillRect(x, gy - 3.5, 14, 0.6);
  }
  for (const L of lamps) {
    if (!L.alive || (L.x > WW * GAP0 && L.x < WW * GAP1) || L.x < a - 30 || L.x > b + 30) continue;
    const gy = groundAt(L.x);
    c.fillStyle = '#3a404d'; c.fillRect(L.x, gy - 15, 1, 15); c.fillRect(L.x, gy - 15, 4, 1);
    c.globalCompositeOperation = 'lighter';
    const lg = c.createRadialGradient(L.x + 3, gy - 14, 0, L.x + 3, gy - 14, 22);
    lg.addColorStop(0, 'rgba(255,200,120,0.55)'); lg.addColorStop(0.15, 'rgba(255,180,100,0.18)'); lg.addColorStop(1, 'rgba(255,170,90,0)');
    c.fillStyle = lg; c.fillRect(L.x - 20, gy - 36, 46, 40);
    c.globalCompositeOperation = 'source-over';
  }
  c.restore();
}

/* ---------- weapons ---------- */
const SPEC = {
  std:       { r: 46, max: 12, boost: 14, trail: 1 },
  big:       { r: 115, max: 9, boost: 22, trail: 2.2 },
  cluster:   { r: 40, max: 11, boost: 14, trail: 1.2 },
  bomblet:   { r: 26, max: 9, boost: 0, trail: 0.5 },
  intercept: { r: 32, max: 20, boost: 3, trail: 0.5 },
  straight:  { r: 38, max: 16, boost: 0, trail: 0.7 },   // fast, no arc: goes exactly where you tap
  homing:    { r: 42, max: 12, boost: 8, trail: 0.9 },   // locks on to the nearest enemy and chases it
  split:     { r: 40, max: 11, boost: 14, trail: 1.2 },  // breaks into three halfway there
  splitlet:  { r: 40, max: 12, boost: 0, trail: 0.8 },
  rocket:    { r: 26, max: 15, boost: 0, trail: 0.5 },   // fired by jets on attack runs
};

// what a homing warhead locks on to: an enemy missile near the tap, else the nearest enemy launcher or building
function homingLock(x, y) {
  const m = nearestHostile(x, y, 'p', 220);
  if (m) return { kind: 'missile', ref: m };
  let best = null, bd = Infinity;
  for (const L of launchers) {
    if (!L.alive || L.side !== 'e') continue;
    const d = Math.hypot(L.x - x, groundAt(L.x) - y);
    if (d < bd) { bd = d; best = { kind: 'launcher', ref: L }; }
  }
  for (const b of buildings) {
    if (!b.alive || b.side !== 'e') continue;
    const d = Math.hypot(b.x + b.w / 2 - x, groundAt(b.x) - b.h / 2 - y);
    if (d < bd) { bd = d; best = { kind: 'building', ref: b }; }
  }
  return best;
}
function lockPoint(lock) {
  const o = lock.ref;
  if (lock.kind === 'missile') return o.dead ? null : [o.x + o.vx * 6, o.y + o.vy * 6];
  if (lock.kind === 'launcher') return o.alive ? [o.x, groundAt(o.x) - 10] : null;
  return o.alive ? [o.x + o.w / 2, groundAt(o.x + o.w / 2) - o.h * 0.6] : null;
}
const aliveLaunchers = side => launchers.filter(L => L.alive && L.side === side);

function launch(tx, ty, type, L, side = 'p', target = null) {
  if (!L || !L.alive) {
    const pool = aliveLaunchers(side);
    if (!pool.length) return null;
    L = pool.reduce((a, b) => Math.abs(b.x - tx) < Math.abs(a.x - tx) ? b : a);
  }
  const ly = groundAt(L.x) - 14;
  L.aim = Math.atan2(ty - ly, tx - L.x);
  const dir = Math.sign(tx - L.x) || 1;
  const m = { x: L.x, y: ly, vx: dir * rand(0.6, 2.2), vy: -rand(5, 7), tx, ty, type, side, target, speed: type === 'intercept' ? 7 : 4, t: 0, dead: false };
  const dist = Math.abs(tx - L.x);
  m.d0 = Math.hypot(tx - L.x, ty - ly);
  if (type === 'straight' || type === 'intercept') {
    // leaves the tube already pointed at the target
    const a = Math.atan2(ty - ly, tx - L.x), v = type === 'straight' ? 14 : 10;
    m.vx = Math.cos(a) * v; m.vy = Math.sin(a) * v; m.speed = v;
  }
  if (type === 'homing') m.lock = homingLock(tx, ty);
  // long shots climb to an apex first, so they arc over the city instead of skimming rooftops
  if (!['intercept', 'straight', 'homing'].includes(type) && dist > 450) {
    m.ax = (L.x + tx) / 2;
    m.ay = Math.max(H * 0.08, Math.min(ly, ty) - Math.min(H * 0.55, dist * 0.3));
  }
  missiles.push(m);
  for (let i = 0; i < (type === 'intercept' ? 5 : 12); i++) parts.push(smoke(L.x + rand(-6, 6), ly + 10, rand(-1.8, 1.8), rand(-0.6, 0.2), rand(5, 11), 'rgb(150,148,155)', 0.45, 0.011));
  if (type === 'intercept') sfxIntercept(L.x);
  else sfxLaunch(type === 'big', L.x, side === 'e' ? 0.55 : 1);
  if (side === 'e' && type !== 'intercept') sfxWarn();
  return m;
}

function nearestHostile(x, y, side, maxD = Infinity) {
  let best = null, bd = maxD;
  for (const m of missiles) {
    if (m.dead || m.side === side || m.type === 'intercept') continue;
    const d = Math.hypot(m.x - x, m.y - y);
    if (d < bd) { bd = d; best = m; }
  }
  for (const f of fighters) {
    if (f.dead || f.side === side) continue;
    const d = Math.hypot(f.x - x, f.y - y);
    if (d < bd) { bd = d; best = f; }
  }
  return best;
}

function fire(tx, ty, L) {
  if (weapon === 'salvo') {
    for (let k = 0; k < 5; k++) queue.push({ at: frame + k * 5, x: tx + (k - 2) * 70 + rand(-15, 15), y: ty + rand(-20, 20), type: 'std', L, side: 'p' });
  } else if (weapon === 'intercept') {
    const t = nearestHostile(tx, ty, 'p', 320);
    launch(tx, ty, 'intercept', L, 'p', t);
  } else launch(tx, ty, weapon, L, 'p');
}

function smoke(x, y, vx, vy, size, c, a, decay) {
  return { k: 0, x, y, vx, vy, size, c, a, life: 1, decay };
}

function explode(x, y, r, side) {
  blasts.push({ x, y, r, life: 1 });
  rings.push({ x, y, r: 4, max: r * 2.4, life: 1 });
  const nf = Math.min(110, r * 1.4 | 0);
  for (let i = 0; i < nf; i++) {
    const a = rand(TAU), s = rand(0.4, 1) * r * 0.075;
    parts.push({ k: 1, x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 0.4, size: rand(0.12, 0.3) * r, life: 1, decay: rand(0.018, 0.04) });
  }
  const ns = Math.min(60, r * 0.55 | 0);
  for (let i = 0; i < ns; i++) {
    const a = rand(TAU), s = rand(0.2, 1) * r * 0.025;
    parts.push(smoke(x + Math.cos(a) * r * 0.3, y + Math.sin(a) * r * 0.3, Math.cos(a) * s, Math.sin(a) * s - rand(0.3, 0.8), rand(0.15, 0.3) * r, 'rgb(46,44,52)', 0.75, rand(0.005, 0.01)));
  }
  const nk = Math.min(50, r * 0.45 | 0);
  for (let i = 0; i < nk; i++) {
    const a = rand(TAU), s = rand(3, 10) * (r / 60 + 0.5);
    parts.push({ k: 2, x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 2, life: 1, decay: rand(0.015, 0.035) });
  }
  const gy = groundAt(x);
  if (gy - y < r * 0.8) {
    // dust wave rolling out along the ground
    for (let i = 0; i < 22; i++) {
      const dir = Math.random() < 0.5 ? -1 : 1;
      parts.push(smoke(x + dir * rand(r * 0.2), gy - rand(3), dir * rand(1.5, 5) * (r / 50), -rand(0.05, 0.35), rand(6, 14), 'rgb(96,86,78)', 0.5, rand(0.006, 0.011)));
    }
    carve(x, y, r * 0.5);
    // big warheads raise a mushroom of smoke
    if (r > 80) {
      for (let i = 0; i < 26; i++) {
        const k = i / 26;
        parts.push(smoke(x + rand(-8, 8), y - k * r * 0.4, rand(-0.25, 0.25), -rand(1.2, 2.4) * (0.6 + k), rand(10, 18), 'rgb(70,62,62)', 0.65, rand(0.0035, 0.005)));
      }
      for (let i = 0; i < 18; i++) {
        const a = rand(TAU);
        parts.push(smoke(x + Math.cos(a) * 20, y - r * 0.5, Math.cos(a) * rand(0.6, 1.6), -rand(1.6, 2.2) + Math.sin(a) * 0.4, rand(16, 28), 'rgb(80,70,68)', 0.6, rand(0.003, 0.0045)));
      }
    }
  }
  for (const s of searchlights) if (s.alive && Math.abs(s.x - x) < r * 0.8 && gy - y < r) s.alive = false;
  for (const m of missiles) {
    if (m.dead || Math.hypot(m.x - x, m.y - y) > r * 0.95) continue;
    m.dead = true;
    if (m.side !== side && side === 'p') shotDown(m.x, m.y);
    for (let k = 0; k < 10; k++) parts.push({ k: 2, x: m.x, y: m.y, vx: rand(-5, 5), vy: rand(-5, 3), life: 1, decay: rand(0.03, 0.05) });
    blasts.push({ x: m.x, y: m.y, r: 18, life: 0.8 });
  }
  for (const f of fighters) if (!f.dead && f.side !== side && Math.hypot(f.x - x, f.y - y) < r + 10) jetHit(f, 3, side);
  const fell = hitBuildings(x, y, r * 0.9);
  hitLaunchers(x, y, r, side);
  hitStreet(x, y, r);
  const onScreen = !offscreen(x);
  if (side === 'p' && fell >= 2) {
    popup(x, y - 34, `${fell}棟同時倒壊！`, '#ffb347', 1.25);
    if (onScreen) slowMo(45);
  } else if (side === 'p' && r > 100 && fell >= 1 && onScreen) slowMo(35);
  // gentle shake, and only for blasts you can see
  const near = clamp(1 - offscreen(x) / VW(), 0, 1);
  shake = Math.min(4, shake + r * 0.025 * near * Math.min(1, Z * 1.5));
  flash = Math.min(0.6, flash + r / 320 * near);
  sfxBoom(r, x, y);
}

function popup(x, y, text, col = '#cfeeff', size = 1) { pops.push({ x, y, text, col, size, life: 1 }); }
function slowMo(frames) { if (!reduceMotion) slow = Math.max(slow, frames); }
// shoot-downs within 2.5 seconds of each other build a chain
function shotDown(x, y) {
  game.down++;
  combo.n = frame - combo.t < 150 ? combo.n + 1 : 1;
  combo.t = frame;
  if (combo.n >= 3) popup(x, y - 14, `撃墜 ${combo.n}連鎖！`, '#ffb347', 1 + Math.min(0.5, combo.n * 0.06));
  else popup(x, y - 14, combo.n === 2 ? '撃墜 ×2' : '撃墜！', '#cfeeff');
  if (combo.n === 5 && !offscreen(x)) slowMo(30);
}

function carve(x, y, r) {
  const i0 = Math.max(0, ((x - r) / COL) | 0), i1 = Math.min(ground.length - 1, Math.ceil((x + r) / COL));
  for (let i = i0; i <= i1; i++) {
    const dx = i * COL - x;
    if (Math.abs(dx) >= r) continue;
    const bottom = y + Math.sqrt(r * r - dx * dx);
    if (bottom > ground[i]) { ground[i] = Math.min(H - 6, ground[i] + (bottom - ground[i]) * 0.6); }
  }
  markDirty(x - r - 60, x + r + 60);   // buildings standing on the crater move too
}

function hitLaunchers(x, y, r, side) {
  for (const L of launchers) {
    if (!L.alive) continue;
    const d = Math.hypot(L.x - x, groundAt(L.x) - 10 - y);
    const R = r * 1.15;
    if (d > R) continue;
    L.hp -= 85 * (1 - d / R) + 10;
    L.hitT = 20;
    if (L.hp <= 0) {
      L.alive = false; L.hp = 0;
      const gy = groundAt(L.x);
      addFire(L.x - 12, gy - 4, 24, 1600, 1);
      blasts.push({ x: L.x, y: gy - 10, r: 70, life: 1 });
      for (let i = 0; i < 24; i++) debris.push({ x: L.x, y: gy - 10, vx: rand(-6, 6), vy: -rand(3, 10), w: rand(2, 6), h: rand(2, 4), rot: rand(TAU), vr: rand(-0.4, 0.4), c: '#353e52', life: 1, hot: Math.random() < 0.5 });

      sfxBoom(90, L.x, gy);

      else popup(L.x, gy - 50, '自軍の発射台が破壊された', '#ff9a8a', 1.1);
    }
  }
}

function hitStreet(x, y, r) {
  for (const L of lamps) if (L.alive && Math.hypot(L.x - x, groundAt(L.x) - 8 - y) < r * 0.8) { L.alive = false; markDirty(L.x - 30, L.x + 30); }
  for (const c of cars) if (c.alive && Math.hypot(c.x - x, groundAt(c.x) - y) < r) {
    c.alive = false;
    addFire(c.x - 4, groundAt(c.x) - 2, 8, rand(300, 600), 0.6);
    for (let i = 0; i < 5; i++) debris.push({ x: c.x, y: groundAt(c.x) - 3, vx: rand(-4, 4), vy: -rand(3, 7), w: rand(2, 4), h: rand(1, 3), rot: rand(TAU), vr: rand(-0.4, 0.4), c: '#2a2e38', life: 1, hot: true });

}

function addFire(x, y, w, life, power) {
  if (fires.length > 70) fires.shift();
  fires.push({ x, y, w, life, max: life, power });
}

// returns how many buildings this blast brought down
function hitBuildings(x, y, r) {
  let fell = 0;
  for (const b of buildings) {
    if (!b.alive) continue;
    const bc = b.x + b.w / 2;
    if (Math.abs(bc - x) > r * 2.2 + b.w) continue;
    const base = groundAt(bc) + 2;
    const dist = Math.hypot(bc - x, base - b.h / 2 - y);
    if (dist < r * 2.2) { b.lit *= 0.9; b.scorch += 0.05 * (1 - dist / (r * 2.2)); markDirty(b.x, b.x + b.w); }
    const nx = clamp(x, b.x, b.x + b.w);
    const dx = x - nx;
    if (Math.abs(dx) >= r) continue;
    const half = Math.sqrt(r * r - dx * dx);
    const top = base - b.h;
    if (y + half < top || y - half > base) continue;
    const cut = Math.min(base, y + half) - top;
    if (cut <= 0) continue;
    const removed = Math.max(2, cut * KINDS[b.kind].armor * (1 - Math.abs(dx) / r * 0.6));
    const n = Math.min(22, 3 + (removed * b.w) / 80 | 0);
    for (let i = 0; i < n; i++) {
      const px = b.x + rand(b.w), py = rand(top, top + removed + 6);
      const a = Math.atan2(py - y, px - x), s = rand(1.5, 6);
      if (debris.length < 900) debris.push({
        x: px, y: py, vx: Math.cos(a) * s, vy: Math.sin(a) * s - rand(1, 4),
        w: rand(2, 5), h: rand(2, 4), rot: rand(TAU), vr: rand(-0.3, 0.3),
        c: `hsl(${b.hue},${b.sat}%,${b.light + 4}%)`, life: 1, hot: Math.random() < 0.3,
        glass: Math.random() < 0.3
      });
    }
    b.h -= removed;
    markDirty(b.x - 10, b.x + b.w + 10);
    if (b.h < 8 || b.h < b.h0 * 0.1) { destroy(b, base); fell++; }
    else if (Math.random() < 0.6) addFire(b.x + 2, base - b.h + 3, b.w - 4, rand(500, 1100), Math.min(1, b.w / 30));
  }
  return fell;
}

function destroy(b, base) {
  b.alive = false;
  if (b.h > 14 && collapses.length < 10) {
    const pad = 30, sp = document.createElement('canvas');
    sp.width = (b.w + 4) * DPR; sp.height = (b.h + pad) * DPR;
    const sc = sp.getContext('2d'); sc.setTransform(DPR, 0, 0, DPR, 0, 0);
    paintBuilding(sc, b, 2, b.h + pad);
    collapses.push({ img: sp, x: b.x - 2, base, h: b.h + pad, w: b.w + 4, sink: 0, v: 0, tilt: rand(-0.04, 0.04), t: 0 });
  }
  sfxCollapse(Math.max(b.h, 30), b.x, base);
  const pts = 7 + (b.w / 5 | 0);
  b.rub = Array.from({ length: pts }, (_, i) => (i === 0 || i === pts - 1) ? 0 : rand(3, 6 + Math.min(22, b.h0 * 0.1)) * Math.sin(i / (pts - 1) * Math.PI) + 2);
  b.h = 0;
  addFire(b.x, base - 6, b.w, rand(700, 1400), 1);
  for (let i = 0; i < 18; i++) parts.push(smoke(b.x + rand(b.w), base - rand(6, Math.min(60, b.h0 * 0.4)), rand(-1.2, 1.2), -rand(0.1, 0.5), rand(10, 26), 'rgb(84,78,76)', 0.55, rand(0.003, 0.007)));

}

/* ---------- enemy command ---------- */
function enemyTarget() {
  const D = DIFF[game.diff];
  const r = Math.random();
  let tx, ty;
  const targets = buildings.filter(b => b.alive && b.side === 'p');
  const myL = aliveLaunchers('p');
  if (r < 0.66 && targets.length) {

}
function enemyAttack() {
  const pool = aliveLaunchers('e');

  const D = DIFF[game.diff];
  // several launchers may fire in the same volley, each at its own corner of our city
  const shots = 1 + (Math.random() < D.extra ? 1 : 0) + (Math.random() < D.extra * 0.4 ? 1 : 0);
  for (let s = 0; s < shots; s++) {

}

function pctOf(side) {
  let now = 0, full = 0;
  for (const b of buildings) if (b.side === side) { full += b.h0 * b.w; now += (b.alive ? b.h : 0) * b.w; }
  return full ? now / full : 0;
}

function checkEnd() {
  if (game.over) return;

  const pl = aliveLaunchers('p').length, el = aliveLaunchers('e').length;

function initAudio() {

  if (!AC) return;

  const sr = ac.sampleRate;
  noiseBuf = ac.createBuffer(1, sr * 3, sr);
  const d = noiseBuf.getChannelData(0);
  let lastV = 0;
  for (let i = 0; i < d.length; i++) { const wv = Math.random() * 2 - 1; lastV = lastV * 0.6 + wv * 0.4; d[i] = lastV * 1.6; }

  const vg = ac.createGain(); vg.gain.value = 0.55;
  verb.connect(vg); vg.connect(master);
  if (ac.state === 'suspended') ac.resume();
}
function route(node, pan, send, dur) {
  voices++;
  setTimeout(() => voices--, (dur + 0.2) * 1000);
  let out = node;
  if (ac.createStereoPanner) { const p = ac.createStereoPanner(); p.pan.value = clamp(pan, -1, 1); node.connect(p); out = p; }
  out.connect(master);
  if (send) { const s = ac.createGain(); s.gain.value = send; out.connect(s); s.connect(verb); }
}
function nz(t0, type, f0, f1, q, vol, att, dur, pan, send) {

  const f = ac.createBiquadFilter(); f.type = type; f.Q.value = q;
  f.frequency.setValueAtTime(f0, t0); f.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t0 + dur);

  g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(Math.max(0.0002, vol), t0 + att);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);

}
function tone(t0, wave, f0, f1, vol, dur, pan, send) {
  const o = ac.createOscillator(); o.type = wave;
  o.frequency.setValueAtTime(f0, t0); o.frequency.exponentialRampToValueAtTime(f1, t0 + dur);
  const g = ac.createGain();
  g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(Math.max(0.0002, vol), t0 + 0.006);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); route(g, pan, send, dur);

}
// pan and loudness follow where the sound is relative to the camera
// zoomed out = listening from farther away
const panOf = x => clamp((x - camX) / VW() * 2 - 1, -1, 1) * 0.85;
const volOf = x => clamp(1 - offscreen(x) / (VW() * 1.4), 0.18, 1) * (0.55 + 0.45 * Math.min(1, Z / 0.7));
const audible = () => soundOn && ac && ac.state === 'running';
// sound is slower than light: far-off blasts flash first and rumble a moment later
function later(x, y, fn) {
  if (!audible()) return;
  const d = Math.hypot(x - (camX + VW() / 2), (y ?? PIV) - PIV) + (1 / Z - 1) * 250;
  const ms = Math.min(2.5, d * 0.35 / 343) * 1000;
  if (ms < 25) fn(); else setTimeout(() => { if (audible()) fn(); }, ms);
}

function sfxLaunch(big, x, vol = 1) {
  if (!audible() || voices > 60) return;
  const t = ac.currentTime;
  if (t - lastLaunch < 0.03) return;
  lastLaunch = t;
  const p = panOf(x); vol *= volOf(x);
  nz(t, 'lowpass', 500, 90, 0.7, (big ? 0.55 : 0.32) * vol, 0.01, big ? 0.9 : 0.5, p, 0.2);
  nz(t, 'bandpass', 500, big ? 1600 : 2800, 1.1, (big ? 0.28 : 0.16) * vol, 0.05, big ? 1.4 : 0.9, p, 0.3);
  nz(t + 0.02, 'highpass', 4000, 2500, 0.5, 0.06 * vol, 0.02, 0.35, p, 0.1);

function sfxBoom(r, x, y) { later(x, y, () => boomNow(r, x)); }

  nz(t, 'lowpass', (1600 + r * 10) * (1 - far * 0.7), 60, 0.9, Math.min(0.9, 0.35 * s + 0.2) * v, 0.008, 0.9 + s * 0.9, p, 0.6 + far * 0.3);
